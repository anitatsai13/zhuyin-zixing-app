<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字音字形學習 App</title>
<style>
  :root{--ink:#2b2622;--ink-soft:#6b6258;--paper:#f6f1e7;--paper-2:#fffdf8;--accent:#9a3b2e;--accent-soft:#c97c52;--gold:#b8893b;--green:#4a7c4e;--red:#b5443a;--line:#e3d9c6;--blue:#3f6f8f;--shadow:0 6px 22px rgba(60,45,30,.12)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:radial-gradient(circle at 20% 0%,#fbf6ec,transparent 60%),radial-gradient(circle at 90% 100%,#f1e8d6,transparent 55%),var(--paper);color:var(--ink);min-height:100vh}
  .wrap{max-width:680px;margin:0 auto;padding:18px 16px 90px}
  header{text-align:center;padding:8px 0 4px}
  header h1{margin:0;font-size:26px;letter-spacing:4px;font-weight:800;font-family:"DFKai-SB","Kaiti TC","BiauKai",serif;color:var(--ink)}
  header .sub{color:var(--ink-soft);font-size:13px;margin-top:4px;letter-spacing:1px}

  .ds-seg{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
  .ds-seg button{flex:1;min-width:96px;border:0;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:9px 8px;font-size:14px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;transition:.15s}
  .ds-seg button.on{background:var(--ink);color:#fff;box-shadow:none}
  .ds-seg small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:2px}

  .tabs{display:flex;gap:5px;margin:0 0 16px;background:var(--paper-2);padding:5px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
  .tab{flex:1;border:0;background:transparent;padding:10px 2px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:.18s;font-family:inherit}
  .tab.active{background:var(--accent);color:#fff;box-shadow:var(--shadow)}

  .seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .seg button{flex:1;min-width:60px;border:0;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:8px 6px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;transition:.15s}
  .seg button.on{background:var(--gold);color:#fff;box-shadow:none}
  .seg.lrow{margin-top:-4px}
  .seg.lrow button{flex:0 1 auto;font-size:12px;font-weight:600;padding:6px 11px;color:var(--ink-soft)}
  .seg.lrow button.on{background:var(--accent,#9a3b2e);color:#fff}
  .ifilt{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .ifilt select{flex:1;min-width:130px;font-size:14px;font-weight:700;padding:9px 11px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--paper-2);color:var(--ink);font-family:inherit;cursor:pointer}

  .progress{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-soft);margin-bottom:10px}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;margin:0 12px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent-soft));width:0;transition:width .3s}

  .card{background:var(--paper-2);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);padding:24px 20px;min-height:360px;display:flex;flex-direction:column;cursor:pointer;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:14px;pointer-events:none;opacity:.6}
  .badge{position:absolute;top:16px;right:16px;font-size:12px;padding:3px 11px;border-radius:99px;font-weight:700;z-index:2}
  .badge.成語{background:#f3e2dd;color:var(--accent)} .badge.詞語{background:#e2ecf2;color:var(--blue)} .badge.單字{background:#eef0db;color:var(--gold)}
  .face-front{display:flex;flex-direction:column;flex:1;justify-content:center}
  .card .word{font-family:"DFKai-SB","Kaiti TC",serif;font-weight:700;text-align:center;color:var(--ink);line-height:1.25;word-break:break-all}
  .card .hint{text-align:center;color:var(--accent-soft);font-size:13px;margin-top:auto;letter-spacing:1px;padding-top:10px}

  .rubyword{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:10px;padding-top:6px}
  .ruby{display:inline-flex;align-items:stretch}
  .ruby .rb{font-family:"DFKai-SB","Kaiti TC",serif;font-weight:700;color:var(--ink);line-height:1;display:flex;align-items:center}
  .zn{position:relative;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;margin-left:3px;padding-right:.7em}
  .zsym{color:var(--accent);font-weight:600;line-height:1.02}
  .zt{position:absolute;color:var(--accent);font-weight:700;line-height:1}
  .zt-r{right:0;top:50%;transform:translateY(-50%)}
  .zt-t{left:50%;top:-2px;transform:translateX(-50%)}
  .ruby .zsym{font-size:15px} .ruby .zt{font-size:14px}
  .pinyin{text-align:center;color:var(--ink-soft);font-size:14px;margin-top:8px;font-style:italic}

  .meaning-center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:14px 4px}
  .sense{font-size:16px;line-height:1.85;max-width:92%}
  .sense .n{display:inline-block;background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-size:12px;margin-right:6px;font-weight:700}
  .eg{color:var(--green);font-size:14px;margin-top:4px} .eg b{color:var(--green);font-weight:700}
  .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .pill{font-size:12px;padding:3px 10px;border-radius:99px;background:#f0e7d4;color:var(--ink-soft)}
  .pill.poly{background:#efe2c2;color:var(--gold)} .pill.sim{background:#e2ecf2;color:var(--blue)} .pill.opp{background:#f3e2dd;color:var(--accent)}

  .nav{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:0;border-radius:13px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
  .btn-ghost{background:var(--paper-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)} .btn-ghost:active{transform:scale(.97)}
  .btn-main{background:var(--accent);color:#fff;box-shadow:var(--shadow)} .btn-main:active{transform:scale(.97)}

  .legend{font-size:12px;color:var(--ink-soft);margin-bottom:10px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
  .legend i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
  .dot{width:12px;height:12px;border-radius:4px;display:inline-block} .dot.l{box-shadow:inset 0 0 0 2px var(--accent-soft);background:#fff} .dot.e{background:#eee;opacity:.7}
  .grp{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:13px 6px 13px 14px;margin-bottom:14px}
  .grp-h{font-size:13px;color:var(--ink-soft);font-weight:700;margin-bottom:6px;letter-spacing:1px}
  .grp-h b{color:var(--gold);font-family:"DFKai-SB","Kaiti TC",serif;font-size:17px}
  .sim-cols{display:flex;gap:0;overflow-x:auto;padding:6px 0 4px}
  .sim-col{flex:0 0 auto;min-width:74px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 12px;border-left:1px dashed var(--line)}
  .sim-col:first-child{border-left:0} .sim-col.ext{opacity:.7}
  .sim-head .rb{font-size:44px} .sim-col.inL .sim-head .rb{color:var(--accent)}
  .sim-head .zsym{font-size:15px} .sim-head .zt{font-size:14px}
  .sim-colon{color:#c3b8a2;font-size:16px;line-height:.5;margin:-2px 0}
  .sim-word{display:flex;flex-direction:column;align-items:center;gap:5px}
  .sim-word .ruby .rb{font-size:28px;font-weight:600}
  .sim-word .zsym{font-size:11px;color:var(--accent-soft)} .sim-word .zt{font-size:10px;color:var(--accent-soft)} .sim-word .zn{padding-right:.66em}
  .sim-sep{color:var(--ink-soft);font-size:12px;line-height:.6}
  .blank{display:inline-block;min-width:1em;padding:2px 10px;margin:0 3px;background:#f3e2dd;color:var(--accent);border-radius:8px;font-weight:700}

  .q-prompt{background:var(--paper-2);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);padding:24px 18px;text-align:center;margin-bottom:16px}
  .q-type{font-size:12px;color:#fff;letter-spacing:2px;font-weight:700;padding:3px 12px;border-radius:99px;display:inline-block;margin-bottom:10px}
  .q-type.sound{background:var(--blue)} .q-type.form{background:var(--accent-soft)} .q-type.mean{background:var(--gold)}
  .q-big{font-family:"DFKai-SB","Kaiti TC",serif;font-weight:700;margin:6px 0 4px;color:var(--ink);line-height:1.3;word-break:break-all}
  .q-small{color:var(--ink-soft);font-size:14px;line-height:1.7}
  .options{display:grid;gap:10px}
  .opt{border:0;text-align:left;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--line);border-radius:13px;padding:15px 16px;font-size:17px;cursor:pointer;font-family:inherit;color:var(--ink);transition:.15s;display:flex;align-items:center;gap:12px;letter-spacing:1px}
  .opt .k{width:26px;height:26px;border-radius:8px;background:#efe6d2;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
  .opt:active{transform:scale(.99)}
  .opt.correct{background:#e7f1e3;box-shadow:inset 0 0 0 2px var(--green);color:var(--green)} .opt.correct .k{background:var(--green);color:#fff}
  .opt.wrong{background:#f6e3e1;box-shadow:inset 0 0 0 2px var(--red);color:var(--red)} .opt.wrong .k{background:var(--red);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{text-align:center;margin-top:14px;min-height:24px;font-weight:700;font-size:15px}
  .feedback.ok{color:var(--green)} .feedback.no{color:var(--red)}
  .fb-def{font-weight:400;color:var(--ink-soft);font-size:13px;margin-top:6px;line-height:1.6}
  .score{display:flex;gap:10px;margin-bottom:12px}
  .score div{flex:1;background:var(--paper-2);border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}
  .score b{display:block;font-size:22px;color:var(--accent)} .score span{font-size:12px;color:var(--ink-soft)}
  .result{text-align:center;background:var(--paper-2);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:34px 20px}
  .result .big{font-size:54px;font-weight:800;color:var(--accent)} .result p{color:var(--ink-soft);margin:8px 0 20px}

  .theme{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
  .theme h3{margin:0 0 10px;font-size:15px;color:var(--accent);font-weight:800;letter-spacing:1px}
  .lesson-tag{display:inline-block;font-size:11px;background:#efe6d2;color:var(--gold);padding:2px 8px;border-radius:99px;margin-right:8px;font-weight:700;vertical-align:middle}
  .idiom{padding:8px 0;border-top:1px dashed var(--line);display:flex;gap:10px;align-items:baseline}
  .idiom:first-of-type{border-top:0}
  .idiom b{font-family:"DFKai-SB","Kaiti TC",serif;font-size:19px;font-weight:700;color:var(--ink);flex-shrink:0;min-width:5em}
  .idiom span{font-size:14px;color:var(--ink-soft);line-height:1.6}
  .authbar{display:flex;justify-content:space-between;align-items:center;background:#e9f1e6;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;color:var(--green)}
  .authbar b{color:var(--green)}
  .authcard{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
  .authrow{display:flex;gap:8px;margin-bottom:8px}
  .authrow input{flex:1;min-width:0;border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  .authrow .btn{padding:11px}
  .authmsg{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:6px;line-height:1.7}
  .wbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
  .wbar span{font-size:13px;color:var(--ink-soft)}
  .wnote{font-size:12px;color:var(--red);margin-bottom:12px;text-align:center}
  .wrong-item{padding:10px 0;border-top:1px dashed var(--line)}
  .wrong-item:first-of-type{border-top:0}
  .wi-head{font-family:"DFKai-SB","Kaiti TC",serif;font-size:20px;font-weight:700;color:var(--ink)}
  .wi-yin{font-size:13px;color:var(--accent);margin-left:8px;font-weight:400}
  .wi-prompt{font-size:13px;color:var(--ink-soft);margin:3px 0;line-height:1.6}
  .wi-ans{font-size:14px;margin-top:4px}
  .wi-ans .ok{color:var(--green);font-weight:700;margin-right:14px} .wi-ans .no{color:var(--red);font-weight:700}
  footer{text-align:center;color:var(--ink-soft);font-size:11px;margin-top:24px;opacity:.7}
</style>
</head>

容黎明時，晨風吹來，月猶未落的景象。"}, {"w": "鏡花水月", "def": "鏡中的花，水裡的月。比喻空幻不實在。"}]}, {"title": "與「夜晚」有關的成語", "items": [{"w": "夜長夢多", "def": "比喻時間拖長了，可能發生不利的變化。"}, {"w": "夜幕低垂", "def": "天色昏暗，指天黑。"}, {"w": "夜闌人靜", "def": "深夜人聲寂靜。闌，音ㄌㄢˊ。"}, {"w": "晝伏夜出", "def": "白天時潛伏休息，晚上才出來活動。"}, {"w": "通宵達旦", "def": "一整夜到天亮。"}, {"w": "萬家燈火", "def": "形容繁榮市鎮的夜景。"}]}, {"title": "成語充電站", "items": [{"w": "星羅棋布", "def": "形容布列繁密，如星星、棋子般的廣泛分布。"}, {"w": "眾星拱月", "def": "比喻許多人共同簇擁一個人。"}, {"w": "物換星移", "def": "形容時序景物的變遷，世事的更替。"}]}]}, {"lesson": "1上 第二課 生之歌選", "themes": [{"title": "與「珍珠」有關的成語", "items": [{"w": "珠光寶氣", "def": "珍珠寶石光亮耀眼。形容服飾華麗。"}, {"w": "珠圓玉潤", "def": "像珠子一般渾圓，像玉石一般溫潤。後用以比喻文詞圓熟或歌聲圓潤。"}, {"w": "珠聯璧合", "def": "日月如併合的璧玉，星辰如成串的珍珠。比喻人才或美好的事物相匹配或同時薈集。常用作祝賀新婚的頌辭。"}, {"w": "人老珠黃", "def": "比喻年老色衰，如同珍珠年久變黃而不值錢，多用於女性。亦泛指人老而不中用。"}, {"w": "字字珠璣", "def": "形容句子或文章中遣詞用字非常優美。珠璣，比喻優美的文章或詞句。璣，音ㄐㄧ。"}, {"w": "剖腹藏珠", "def": "剖開肚子以藏匿珍珠。形容人愛財傷身的輕重顛倒行為。剖，音ㄆㄡˇ。"}, {"w": "魚目混珠", "def": "以魚眼睛混充珍珠。比喻以假亂真。混，音ㄏㄨㄣˋ。"}, {"w": "掌上明珠", "def": "捧在手掌上的一顆珍貴明珠。比喻極受寵愛珍視的人。多指愛女。"}, {"w": "買櫝還珠", "def": "楚國一位珠寶商人到鄭國賣珠寶，一人出高價買去，但他只看中精美的匣子，遂將珍珠還給珠寶商。後比喻捨本逐末，取捨失當。櫝，音ㄉㄨˊ，木製的盒子。"}, {"w": "滄海遺珠", "def": "比喻被埋沒的人才或珍貴的事物。"}]}, {"title": "與「手」有關的成語", "items": [{"w": "手不釋卷", "def": "手中總是拿著書卷。比喻勤奮好學。"}, {"w": "手足無措", "def": "手腳無處安放。形容舉止慌亂，沒有主意，不知如何是好。"}, {"w": "手到擒來", "def": "一出手就將敵人捉住。比喻撮取物件之迅速或行事輕而易舉，毫不費力。"}, {"w": "手舞足蹈", "def": "手、腳舞動跳躍。形容非常高興喜悅。"}, {"w": "白手起家", "def": "沒有任何依恃而獨立興起家業。"}, {"w": "妙手回春", "def": "指醫師的醫術高明，能把垂危的病人治癒。"}, {"w": "放手一搏", "def": "不顧一切作最大的努力。搏，音ㄅㄛˊ。"}, {"w": "炙手可熱", "def": "手一靠近就覺得很熱。比喻地位尊貴，勢焰熾盛。炙，音ㄓˋ。"}, {"w": "信手拈來", "def": "順手拿來。比喻寫文章時取材運筆極為自然。拈，音ㄋㄧㄢˊ。"}, {"w": "拱手讓人", "def": "平白讓給別人。"}, {"w": "胼手胝足", "def": "手掌腳底的皮膚磨出了繭。形容極為辛勞。胼，音ㄆㄧㄢˊ。胝，音ㄓ。"}, {"w": "燙手山芋", "def": "比喻棘手且各方皆不願接辦的事。"}, {"w": "額手稱慶", "def": "舉手齊額，表示慶幸。"}, {"w": "眼高手低", "def": "比喻要求標準高，而實際執行能力卻很低。"}, {"w": "得心應手", "def": "心怎麼想，手便能怎麼做。比喻做事很順利。應，音ㄧㄥˋ。"}, {"w": "鹿死誰手", "def": "比喻共爭帝位或一物，不知誰能取得最後的勝利。鹿，古代狩獵的主要目標，比喻政權。"}, {"w": "棋逢敵手", "def": "比喻雙方實力相當，難分高下。"}]}, {"title": "成語充電站", "items": [{"w": "心堅石穿", "def": "比喻人意志堅決，任何艱難都能克服。"}, {"w": "披荊斬棘", "def": "比喻克服種種困難。荊、棘，二種多刺的草木。"}, {"w": "苦盡甘來", "def": "艱難困苦的境遇已經結束，而將逐步進入佳境。"}, {"w": "百折不撓", "def": "意志剛強，雖受盡挫折，仍能堅持不變，奮鬥到底。"}]}]}, {"lesson": "1上 第三課 吃冰的滋味", "themes": [{"title": "與「冰」有關的成語", "items": [{"w": "冰山一角", "def": "嚴重的問題呈現在表面的一小部分。"}, {"w": "冰肌玉骨", "def": "形容美人體膚潔白晶瑩。或形容花朵秀雅耐寒。"}, {"w": "玉潔冰清", "def": "如玉和冰一般純淨潔白。比喻人格高尚品行高潔。"}, {"w": "冷若冰霜", "def": "形容態度極為冷淡。"}, {"w": "如履薄冰", "def": "好像走在薄冰上。比喻處事極為謹慎小心。履，音ㄌㄩˇ。薄，音ㄅㄛˊ。"}]}, {"title": "與「名聲」有關的成語", "items": [{"w": "沒沒無聞", "def": "沒有名氣。沒，音ㄇㄛˋ。"}, {"w": "家喻戶曉", "def": "家家戶戶都知道。形容事情、名聲傳布極廣。"}, {"w": "遐邇聞名", "def": "不論遠近，莫不知其名聲。指名氣很大。遐，音ㄒㄧㄚˊ，遠。邇，音ㄦˇ，近。"}, {"w": "遠近馳名", "def": "名聲流傳極廣，遠近的人都知道。"}]}, {"title": "與「言行、言語」相關的成語", "items": [{"w": "一言九鼎", "def": "形容說話很有份量。後亦用來形容說話很有信用。鼎，音ㄉㄧㄥˇ。"}, {"w": "說一不二", "def": "說話算數，堅定不移。"}, {"w": "言而無信", "def": "說話不講信用。"}, {"w": "食言而肥", "def": "春秋 魯大夫孟武伯常失信於魯哀公。在一次宴會中，孟武伯問哀公的寵臣郭重為何如此肥胖，哀公藉機諷刺說：「是食言多矣，能無肥乎？」後用以比喻言而無信，說話不守信用。"}, {"w": "輕諾寡信", "def": "隨便答應他人的請求，往往難以實踐諾言。"}, {"w": "出爾反爾", "def": "你怎麼對待別人，別人也會怎麼待你。比喻人的言行前後反覆，自相矛盾。"}, {"w": "人微言輕", "def": "因為地位低微，言論主張不受重視。多用於自謙之詞。"}]}, {"title": "與「人多」有關的成語", "items": [{"w": "人山人海", "def": "形容許許多多的人聚集在一起。"}, {"w": "水泄不通", "def": "連水都無法流通。比喻防備極嚴密。亦用以形容擁擠不堪。"}, {"w": "門庭若市", "def": "門庭間來往的人很多，像市集一般熱鬧。比喻上門來的人很多。"}, {"w": "門可羅雀", "def": "漢朝 翟公官居廷尉時賓客盈門，失官後門前冷落，可張網捕雀。後用來形容做官的人從擁有權勢到離開政治中心後門庭冷落、賓客稀少的景況。"}]}, {"title": "其他補充成語", "items": [{"w": "卑鄙無恥", "def": "形容人品格極差無比。"}, {"w": "按部就班", "def": "原指巡查所轄的部屬，歸入所屬的班列。指做事依照一定的層次、條理。"}, {"w": "高風亮節", "def": "高尚的品格，堅貞的氣節。"}, {"w": "街頭巷尾", "def": "泛指街巷的每個地方。"}]}]}, {"lesson": "1上 第四課 差不多先生傳", "themes": [{"title": "與「馬虎、隨便」有關的成語", "items": [{"w": "馬馬虎虎", "def": "勉強將就，敷衍了事。"}, {"w": "漫不經心", "def": "隨隨便便，不加留意。漫，散漫、隨便。"}, {"w": "苟且偷安", "def": "得過且過，只圖眼前安逸，不顧將來。"}, {"w": "因循苟且", "def": "延續舊習，敷衍草率，不思改革。"}, {"w": "草草了事", "def": "匆忙隨便的解決事情。"}, {"w": "丟三落四", "def": "形容人因為馬虎或健忘，不是忘了這個，就是忘了那個。落，音ㄌㄚˋ，遺漏、忘記。"}, {"w": "粗心大意", "def": "做事草率，不細心。"}, {"w": "敷衍塞責", "def": "做事不認真，只是表面應付一下。衍，音ㄧㄢˇ。"}, {"w": "渾水摸魚", "def": "在渾濁的水中撈魚。比喻趁混亂時攫取利益或指工作不認真。"}]}, {"title": "與「謹慎、專心」有關的成語", "items": [{"w": "小心翼翼", "def": "形容舉止十分謹慎，不敢懈怠疏忽。"}, {"w": "如履薄冰", "def": "好像走在薄冰上。比喻處事極為謹慎小心。履，音ㄌㄩˇ。薄，音ㄅㄛˊ。"}, {"w": "專心致志", "def": "專一心思，集中精神。"}, {"w": "聚精會神", "def": "本指集合眾人的智慧。後比喻一個人集中精神，專心一意。"}]}, {"title": "與「堅持、放棄」有關的成語", "items": [{"w": "鍥而不舍", "def": "不斷刻下去而不停止。比喻努力不懈，堅持到底。鍥，音ㄑㄧㄝˋ，鏤刻。舍，音ㄕㄜˇ，捨棄、停止。"}, {"w": "半途而廢", "def": "事情沒做成功就停止。比喻做事情有始無終。"}, {"w": "前功盡棄", "def": "將以往辛苦建立的功勞，全部廢棄。"}]}, {"title": "與「精明、糊塗」有關的成語", "items": [{"w": "精明幹練", "def": "機靈敏捷，能幹練達。"}, {"w": "渾渾噩噩", "def": "形容渾樸無知，也用來形容糊裡糊塗，茫無目的。渾，音ㄏㄨㄣˊ。噩，音ㄜˋ。"}, {"w": "糊裡糊塗", "def": "形容人行事極為迷糊或不明道理。"}]}, {"title": "其他補充成語", "items": [{"w": "愚公移山", "def": "比喻努力不懈，不畏艱難，自能成事。"}, {"w": "望梅止渴", "def": "比喻用空想來安慰自己。"}, {"w": "三心二意", "def": "形容猶豫不決、意志不堅。"}, {"w": "心猿意馬", "def": "形容心意不定，不能自持。"}, {"w": "發憤圖強", "def": "下定決心，努力謀求強盛。"}, {"w": "高瞻遠矚", "def": "見識遠大。"}, {"w": "半斤八兩", "def": "半斤和八兩輕重相當。比喻彼此不相上下。"}, {"w": "九死一生", "def": "比喻極危險的境遇。"}, {"w": "圖謀不軌", "def": "謀劃不法叛逆的事。"}]}, {"title": "成語充電站", "items": [{"w": "潦草塞責", "def": "粗率不用心而敷衍了事。"}, {"w": "粗枝大葉", "def": "比喻疏略，做事不細密。"}, {"w": "魯莽滅裂", "def": "形容做事粗魯莽撞、草率隨便。"}, {"w": "敷衍了事", "def": "形容辦事不認真或對人不熱情，表面應付了事。"}]}]}, {"lesson": "1上 第五課 論語選", "themes": [{"title": "出自《論語》的成語", "items": [{"w": "任重道遠", "def": "負擔繁重，路途遙遠。比喻長期肩負重大的任務。"}, {"w": "成人之美", "def": "成全別人的好事。"}, {"w": "行不由徑", "def": "走路不走捷徑。比喻行事光明正大，不投機取巧。"}, {"w": "見賢思齊", "def": "看到賢能的人，便想效法他。"}, {"w": "言不及義", "def": "只說些無聊話，沒有談到正經的道理。"}, {"w": "里仁為美", "def": "選擇住處應挑有仁風的地方。後指敦親睦鄰。"}, {"w": "近悅遠來", "def": "德澤廣被，使境內的人心悅誠服，遠方境外的人也都紛紛前來歸附。"}, {"w": "待價而沽", "def": "比喻人等待機會，為世所用。沽，音ㄍㄨ。"}, {"w": "後生可畏", "def": "年輕人每每能超越先輩，令人敬畏。"}, {"w": "剛毅木訥", "def": "個性剛強堅毅、質樸且不善於言詞。訥，音ㄋㄜˋ。"}, {"w": "溫故知新", "def": "指溫習舊業，可增進新知。亦指複習學過的知識，而獲得新的知識、體會。"}, {"w": "舉一反三", "def": "指列舉一例而能曉喻其他各事。"}]}, {"title": "與「學習」有關的成語", "items": [{"w": "旁徵博引", "def": "多方引證，以資徵信。"}, {"w": "循序漸進", "def": "按照一定的次序與步驟逐漸推進。"}, {"w": "開卷有益", "def": "打開書本閱讀，即能得到好處。"}, {"w": "潛移默化", "def": "人的思想、性格或習慣受到影響，不知不覺中起了變化。"}, {"w": "學富五車", "def": "讀過的書可以裝滿五大車。形容人書讀很多，學識廣博。"}, {"w": "學無常師", "def": "指善於學習的人，知道該向不同專長的人請教不同的學問。"}, {"w": "融會貫通", "def": "將各種相關的知識或事物加以融合、貫穿，進而獲得全面通徹的領會。"}]}, {"title": "其他補充成語", "items": [{"w": "師心自用", "def": "剛愎任性，自以為是。師，效法、採用。"}, {"w": "推己及人", "def": "將心比心，設身處地替別人著想。"}]}, {"title": "成語充電站", "items": [{"w": "巧言令色", "def": "話說得很動聽，臉色裝得很和善，可是一點也不誠懇。"}, {"w": "怨天尤人", "def": "懷恨上天，責怪他人。"}, {"w": "以德報怨", "def": "不記仇恨，反以恩德回報他人。"}, {"w": "當仁不讓", "def": "泛指遇到應該做的事，主動承擔起來，而不推讓。"}, {"w": "道聽塗說", "def": "泛指沒有經過證實、缺乏根據　的話。"}, {"w": "既往不咎", "def": "指已經過去的事不再追究。後多用於指對過去的錯誤不再責難。"}, {"w": "文質彬彬", "def": "形容人舉止文雅有禮。"}, {"w": "三思而行", "def": "反覆再三考慮，然後再做。後比喻謹慎行事。"}, {"w": "過猶不及", "def": "做事過分就好比做得不夠一樣，皆不妥當。指事情要適得其中。"}]}]}, {"lesson": "1上 第六課 那默默的一群", "themes": [{"title": "與「良好的處事態度」有關的成語", "items": [{"w": "百折不撓", "def": "意志剛強，雖受盡挫折，仍能堅持不變，奮鬥到底。撓，音ㄋㄠˊ。"}, {"w": "孜孜矻矻", "def": "勤勞努力不懈怠。孜，音ㄗ。矻，音ㄎㄨˋ。"}, {"w": "事必躬親", "def": "凡事一定自己去做。"}, {"w": "急公好義", "def": "熱心公益，喜愛助人。"}, {"w": "當仁不讓", "def": "泛指遇到應該做的事，主動承擔起來，而不推讓。"}, {"w": "腳踏實地", "def": "比喻做事切實穩健。"}, {"w": "實事求是", "def": "做事切實，力求真確。或指按照實際情況，確實辦事。"}, {"w": "盡心竭力", "def": "費盡心思，竭盡全力。"}, {"w": "精益求精", "def": "力求技能進步再進步。"}, {"w": "鍥而不舍", "def": "不斷刻下去而不停止。比喻努力不懈，堅持到底。鍥，音ㄑㄧㄝˋ，鏤刻。舍，音ㄕㄜˇ，捨棄、停止。"}]}, {"title": "與「不好的處事態度」有關的成語", "items": [{"w": "一暴十寒", "def": "在陽光下暴晒一天，又接連冷凍十天。比喻人做事缺乏恆心，時常中斷。暴，音ㄆㄨˋ。"}, {"w": "中道而廢", "def": "事情尚未完成，就停止不做了。"}, {"w": "因循苟且", "def": "延續舊習，敷衍草率，不思改革。"}, {"w": "好高騖遠", "def": "形容一味的嚮往高遠的目標而不切實際。騖，音ㄨˋ。"}, {"w": "剛愎自用", "def": "性情倔強，固執己見。愎，音ㄅㄧˋ。"}, {"w": "草草了事", "def": "匆忙隨便的解決事情。了，音ㄌㄧㄠˇ，完畢、結束。"}, {"w": "得過且過", "def": "能夠過得去就暫且這樣過下去。後用來形容苟且偷安，不求上進。"}, {"w": "漫不經心", "def": "隨隨便便，不加留意。漫，散漫、隨便。"}, {"w": "輕舉妄動", "def": "行為不慎，舉止輕浮。"}, {"w": "敷衍塞責", "def": "做事不認真，只是表面應付一下。衍，音ㄧㄢˇ。塞，音ㄙㄜˋ。"}]}, {"title": "其他補充成語", "items": [{"w": "不拘小節", "def": "不被生活上的細節所拘束。"}, {"w": "天真爛漫", "def": "性情率真，毫不假飾。"}, {"w": "古道熱腸", "def": "形容待人仁厚、熱心。"}, {"w": "安分守己", "def": "安於本分，謹守其身。"}, {"w": "彬彬有禮", "def": "形容人的禮貌恰到好處，不至於矯情多禮，也不至於粗魯無禮。"}, {"w": "嫉惡如仇", "def": "憎恨邪惡的人或事如同仇敵一般。"}, {"w": "樂善好施", "def": "指樂於行善，喜好施捨、濟助他人。好，音ㄏㄠˋ。"}, {"w": "擇善固執", "def": "指選擇好的、正確的事去做，且堅持不變。"}]}, {"title": "成語充電站", "items": [{"w": "責無旁貸", "def": "自己應盡的責任，沒有理由推卸。"}, {"w": "任勞任怨", "def": "形容人做事熱心負責，不辭勞苦，不怕嫌怨。"}, {"w": "盡忠職守", "def": "竭盡忠誠，堅守崗位。"}, {"w": "任重道遠", "def": "比喻長期肩負重大的任務。"}]}]}, {"lesson": "1上 第七課 兒時記趣", "themes": [{"title": "與「動物」相關的成語", "items": [{"w": "抱頭鼠竄", "def": "形容像鼠懼人一般，狼狽逃走的樣子。竄，音ㄘㄨㄢˋ。"}, {"w": "汗牛充棟", "def": "形容書籍極多。"}, {"w": "狼吞虎嚥", "def": "形容吃東西又猛又急。"}, {"w": "杯弓蛇影", "def": "將酒杯中弓的倒影誤為蛇，因此心生恐懼。比喻為不存在的事情枉自驚惶。"}, {"w": "馬耳東風", "def": "比喻對事情漠不關心。"}, {"w": "替罪羔羊", "def": "根據《舊約聖經》記載，若有人犯了罪，需找沒有殘疾的羊為供物，按手在羊頭上，並將羊宰殺，表示自己的罪過由此羊代受。後比喻代人受過的人。"}, {"w": "尖嘴猴腮", "def": "尖嘴巴瘦面頰。形容人長相極為醜陋。腮，音ㄙㄞ。"}, {"w": "呆若木雞", "def": "愚笨或受驚嚇而發愣的樣子。"}, {"w": "鶴立雞群", "def": "鶴站在雞群之中，非常突出。比喻人的才能超群出眾，不同凡俗。"}, {"w": "蜀犬吠日", "def": "四川多雲霧，偶爾太陽破雲而出，不常見到太陽的蜀犬，竟受驚嚇而向日狂吠。後用以比喻少見多怪。蜀，四川省的簡稱。"}, {"w": "沉魚落雁", "def": "本指魚鳥不辨美醜，就算看見美麗的女子也同樣趕緊逃離。後用來形容女子的容貌美麗。"}, {"w": "盲人摸象", "def": "數個盲者各自摸一隻大象，所摸的部位各不相同，然都誤以為自己所知才是大象真正的樣子。後比喻以偏概全，而未能洞明真相。"}, {"w": "勞燕分飛", "def": "伯勞和燕子離散分飛。比喻別離，而多用於夫妻、情人之間。"}]}, {"title": "有「然」字的成語", "items": [{"w": "孑然一身", "def": "形容孤單一個人。孑然，孤獨的樣子。孑，音ㄐㄧㄝˊ。"}, {"w": "井然有序", "def": "條理分明有秩序。井然，整齊、有條理的樣子。"}, {"w": "安然無恙", "def": "指平安沒有疾病、禍患等事故。恙，音ㄧㄤˋ，禍患、疾病。"}, {"w": "昭然若揭", "def": "如同高舉著日月般地明白清楚。形容含義或真相非常清楚，顯而易見。昭然，明顯的樣子。"}, {"w": "索然無味", "def": "無聊乏味、沒有意思。索然，乏味、落寞。"}, {"w": "茫然若失", "def": "心中恍惚，如有所失。"}, {"w": "軒然大波", "def": "高湧而盛大的波濤。或比喻大的糾紛或風潮。"}, {"w": "斐然成章", "def": "形容言語或文章富有文采，且成章法。常用來稱讚別人的文章。斐然，有文采的樣子。斐，音ㄈㄟˇ。"}, {"w": "肅然起敬", "def": "因受感動而欽佩恭敬。肅然，嚴謹恭敬的樣子。"}, {"w": "溘然長逝", "def": "謂人死亡。溘然，突然。溘，音ㄎㄜˋ。"}, {"w": "截然不同", "def": "彼此差異非常明顯。"}, {"w": "豁然開朗", "def": "形容開闊明亮。或形容領悟了解。豁，音ㄏㄨㄛˋ。"}, {"w": "龐然大物", "def": "體積巨大的東西。"}, {"w": "躍然紙上", "def": "活躍的呈現於紙上。形容描寫得非常生動逼真。"}, {"w": "驀然回首", "def": "忽然回頭。驀，音ㄇㄛˋ。"}, {"w": "黯然失色", "def": "黯淡而失去光彩。黯，音ㄢˋ。"}]}]}, {"lesson": "1上 第八課 紙船印象", "themes": [{"title": "形容「時間快速流逝」或「時光短暫」的成語", "items": [{"w": "一朝一夕", "def": "形容時間短暫。朝，早晨。夕，傍晚。"}, {"w": "日月如梭", "def": "日和月如梭般快速交替運行。形容時光消逝迅速。"}, {"w": "白駒過隙", "def": "指馬從洞孔前一下子就跑過去。後比喻時間過得很快。白駒，駿馬。隙，洞孔。"}, {"w": "光陰似箭", "def": "形容時間消逝如飛箭般迅速。"}, {"w": "春宵苦短", "def": "比喻歡樂時光容易消逝。宵，夜晚。"}, {"w": "流光瞬息", "def": "形容時間短促，很快就過了。瞬息，很快、一下子。"}, {"w": "俯仰之間", "def": "短暫的時間。俯，低頭。仰，抬頭。"}, {"w": "烏飛兔走", "def": "古代傳說太陽中有金烏，月亮中有玉兔。比喻日月運行，光陰流逝快速。"}, {"w": "逝者如斯", "def": "時光、事情的消逝如同河水流去般迅速。"}, {"w": "歲月如梭", "def": "時光像梭子一樣快速的運轉。比喻日子消逝得很快。"}, {"w": "彈指之間", "def": "形容極短暫的時間。或形容時間過得很快。"}, {"w": "翹足而待", "def": "舉足而待。形容極短的時間。"}]}, {"title": "與「時間久遠」有關的成語", "items": [{"w": "地老天荒", "def": "形容時間的久遠。"}, {"w": "海枯石爛", "def": "形容經歷時間長久。後多用以表示意志堅定，永久不變的盟誓之詞。"}, {"w": "經年累月", "def": "經過很長的時間。"}]}, {"title": "與「親情」有關的成語", "items": [{"w": "寸草春暉", "def": "比喻父母恩情深重，子女即使竭盡心意也難以報答。寸草，比喻子女。春暉，比喻父母。暉，音ㄏㄨㄟ。"}, {"w": "六親不認", "def": "形容不留情面或不講情義。六親，泛指所有親屬。"}, {"w": "父慈子孝", "def": "父親慈愛，兒女孝順。"}, {"w": "風木含悲", "def": "比喻父母亡故，兒女不得奉養的悲傷。"}, {"w": "烏鳥之情", "def": "相傳幼烏鴉長成後，會反哺年老而無法覓食的老烏鴉。比喻奉養長輩的孝心。"}, {"w": "舐犢情深", "def": "比喻父母疼愛子女之深情。舐，音ㄕˋ，用舌頭舔東西。犢，音ㄉㄨˊ，小牛。"}, {"w": "痛抱西河", "def": "春秋時，子夏居於西河，其子死，傷心哭至失明。後比喻喪子之痛，常用於悼人喪子之辭。"}, {"w": "綵衣娛親", "def": "老萊子性至孝，年七十，常著五色彩衣，作嬰兒嬉戲的樣子逗父母高興。後用以比喻孝養父母。"}]}, {"title": "其他補充成語", "items": [{"w": "及時行樂", "def": "把握時機，尋歡作樂。"}, {"w": "時不我與", "def": "時間不等待我們。比喻錯失時機，後悔莫及。與，等待。"}, {"w": "馬齒徒長", "def": "自謙年歲徒增而毫無建樹。"}, {"w": "度日如年", "def": "比喻日子不好過。"}, {"w": "時來運轉", "def": "本來處境不好，遇到機會，由逆境轉到順境。"}]}, {"title": "成語充電站", "items": [{"w": "刻舟求劍", "def": "比喻拘泥固執，不知變通。"}, {"w": "破釜沉舟", "def": "比喻做事果決，義無反顧。"}, {"w": "同舟共濟", "def": "比喻同心協力，戰勝困難。"}, {"w": "見風轉舵", "def": "比喻隨機應變，視情況而行動。"}, {"w": "順水推舟", "def": "順著水流推船。比喻順應情勢行事。"}, {"w": "木已成舟", "def": "木材已經做成船隻。比喻已成事實，無法改變。"}, {"w": "水漲船高", "def": "比喻人或事物，隨著憑藉者的地位提升而升高。"}, {"w": "一帆風順", "def": "本指船張滿帆，一路順風而行。後泛指事情進行順利無阻。"}, {"w": "陰溝裡翻船", "def": "事情的演變出乎意料之外。"}, {"w": "腳踏兩條船", "def": "⑴雙腳各踏在一條船上。比喻人投機取巧，兩方討好。⑵心意不決、游移難定。"}, {"w": "船到橋頭自然直", "def": "比喻事情到最後關頭總會有解決的辦法。"}, {"w": "宰相肚裡好撐船", "def": "比喻人胸襟度量寬大，不計前嫌。今多有恭維奉迎之意。"}]}]}, {"lesson": "1上 第九課 下雨天，真好", "themes": [{"title": "與「人的器官」有關的成語", "items": [{"w": "目不暇給", "def": "形容眼前美好事物太多，或景物變化太快，眼睛來不及觀看。暇，音ㄒㄧㄚˊ，空閒。給，音ㄐㄧˇ，供給。"}, {"w": "怵目驚心", "def": "眼見可怕的情景，使內心驚恐不已。引申為感到事態、問題極其嚴重。怵，音ㄔㄨˋ。"}, {"w": "瞠目結舌", "def": "睜大眼睛說不出話。形容吃驚、受窘的樣子。瞠，音ㄔㄥ，瞪著眼睛直看。"}, {"w": "耳濡目染", "def": "聽熟了，看慣了，因而深受影響。濡，音ㄖㄨˊ，習染、感染。"}, {"w": "歷歷在目", "def": "清清楚楚的呈現在眼前。"}, {"w": "過眼雲煙", "def": "比喻事物消逝極快，不留痕跡。"}, {"w": "迫在眉睫", "def": "形容事情急迫。"}, {"w": "舉案齊眉", "def": "東漢 孟光送飯食給丈夫梁鴻時，總是將木盤高舉，與眉平齊，夫妻互敬互愛的故事。後比喻夫妻相敬如賓。"}, {"w": "苦口婆心", "def": "以懇切真摯的態度，竭力勸告他人。"}, {"w": "嗤之以鼻", "def": "從鼻子裡發出冷笑。表示不屑、鄙視。嗤，音ㄔ。"}]}, {"title": "與「雨」有關的成語", "items": [{"w": "雨過天青", "def": "雨後初放晴時的天色。比喻情況由壞轉好。"}, {"w": "未雨綢繆", "def": "鳥兒在未下雨前，便已著手修補窩巢。比喻事先預備，防患未然。綢繆，音ㄔㄡˊ ㄇㄡˊ。"}, {"w": "風調雨順", "def": "風雨及時而適量。比喻豐年安樂的景象。調，音ㄊㄧㄠˊ。"}, {"w": "呼風喚雨", "def": "形容神仙道士法術高強，能夠召喚風雨。比喻人神通廣大、很有影響力。"}]}, {"title": "與「交情」有關的成語", "items": [{"w": "一見如故", "def": "第一次見面就相處和樂融洽，如同老朋友一般。"}, {"w": "忘年之交", "def": "不拘年歲行輩而結交為友。"}, {"w": "兩小無猜", "def": "男女稚齡時，彼此天真無邪，毫無避嫌與猜疑。"}, {"w": "青梅竹馬", "def": "形容小兒女天真無邪的結伴嬉戲。也指從小相識的伴侶。"}]}, {"title": "其他補充成語", "items": [{"w": "曲突徙薪", "def": "有一客人看見主人家直灶旁有一堆木柴，勸告主人將煙囪改建成彎的，並將木柴搬走，以免發生火災。主人不聽其勸告，後來果然失火。後比喻事先採取措施，以防患未然。突，煙囪。徙，音ㄒㄧˇ，遷移、移轉。"}, {"w": "江心補漏", "def": "船到江中才補漏洞。比喻事有缺失不先預防，臨時才補救，但為時已晚。"}, {"w": "臨陣磨槍", "def": "到了陣前才磨槍。意謂事態急迫，匆忙應變。"}, {"w": "時和年豐", "def": "社會安定，五穀豐收。亦指太平盛世。"}, {"w": "記憶猶新", "def": "對接觸過的人或事，還記得很清楚，就像最近才發生的一樣。"}, {"w": "霧裡看花", "def": "形容視界模糊，看不清楚。後比喻看不清楚事情的真相。"}]}]}, {"lesson": "1上 第十課 鬧元宵", "themes": [{"title": "與「節日」有關的成語", "items": [{"w": "一元復始", "def": "指除舊歲，新年開始。"}, {"w": "火樹銀花", "def": "形容燈火通明，燈光燦爛的景象。"}, {"w": "桂子飄香", "def": "形容中秋時桂花綻放，香氣飄散。"}, {"w": "慎終追遠", "def": "指依禮慎重辦理父母喪事，祭祀要誠心的追念遠祖。後亦指慎重從事，追念前賢。終，父母之喪。遠，祖先。"}]}, {"title": "與「龍」有關的成語", "items": [{"w": "龍爭虎鬥", "def": "比喻各強爭鬥。"}, {"w": "龍飛鳳舞", "def": "形容筆勢生動活潑，後亦用來謔稱人的筆勢凌亂潦草。"}, {"w": "龍鳳呈祥", "def": "富貴吉祥的徵兆。"}, {"w": "龍潭虎穴", "def": "指龍潛伏的深淵，老虎藏身的洞穴。比喻凶險之地。潭，深水池。"}, {"w": "龍盤虎踞", "def": "像龍盤繞，像虎蹲踞。形容地勢宏偉險要。踞，音ㄐㄩˋ。"}, {"w": "生龍活虎", "def": "比喻活潑勇猛，生氣勃勃。"}, {"w": "乘龍快婿", "def": "比喻好女婿。"}, {"w": "畫龍點睛", "def": "比喻繪畫、作文時在最重要之處加上一筆，使全體更加生動傳神。"}, {"w": "攀龍附鳳", "def": "趨附權貴，以求進升。"}, {"w": "臥虎藏龍", "def": "比喻潛藏著人才。"}]}, {"title": "其他補充成語", "items": [{"w": "不勞而獲", "def": "毫不費力而得到。"}, {"w": "心心相印", "def": "本指禪宗修行者，師徒間不須經由文字、言語的傳達，即能相互契合，了悟禪理。比喻彼此心意互通。"}, {"w": "以毒攻毒", "def": "用有毒的藥物來治療毒瘡等疾病。比喻用狠毒的手段來對付狠毒的手段或人。"}, {"w": "孤掌難鳴", "def": "一個巴掌拍不出聲響。比喻孤立無助，不能成事。"}, {"w": "金風玉露", "def": "形容秋天的景物。"}, {"w": "咬文嚼字", "def": "在詞句上斟酌推敲。或譏笑士人迂（ㄩ）腐而不知變通。或形容賣弄文才、裝腔作勢。嚼，音ㄐㄧㄠˊ。"}, {"w": "後生可畏", "def": "年輕人每每能超越先輩，令人敬畏。"}, {"w": "高不可攀", "def": "形容難以到達的意思。或形容人高高在上，難以親近。"}, {"w": "殘羹冷飯", "def": "吃剩的羹湯飯菜。羹，音ㄍㄥ。"}, {"w": "無計可施", "def": "想不出計策來。"}, {"w": "無微不至", "def": "每一個細微處皆照顧到。形容非常精細周到。"}, {"w": "童叟無欺", "def": "對待小孩和老人的態度一樣，不會欺瞞。叟，音ㄙㄡˇ，老人。"}, {"w": "五福臨門", "def": "指五種福氣同時降臨家門。"}, {"w": "萬象更新", "def": "一切景象都換了新貌。"}, {"w": "春回大地", "def": "嚴冬過去，春天再度降臨大地。比喻情勢好轉，或事情圓滿成功。"}, {"w": "桃紅柳綠", "def": "桃花綻紅，柳枝垂綠。形容春天絢麗多彩的樣子。"}]}]}, {"lesson": "1上 自學一 善用時間的方法", "themes": [{"title": "與「時間」有關的成語", "items": [{"w": "古往今來", "def": "由古至今。"}, {"w": "俯仰之間", "def": "短暫的時間。俯，低頭。仰，抬頭。"}, {"w": "一朝一夕", "def": "形容時間短暫。朝，早晨。夕，傍晚。"}, {"w": "一日三秋", "def": "比喻思慕心切。"}, {"w": "經年累月", "def": "經過很長的時間。"}, {"w": "電光石火", "def": "閃電呈現的亮光，火石擊發的火光。比喻轉瞬間即逝。"}, {"w": "日月如梭", "def": "日和月如梭般快速交替運行。形容時光消逝迅速。"}, {"w": "歷久不衰", "def": "經歷長久的時間仍不衰退。"}, {"w": "光陰似箭", "def": "形容時間消逝如飛箭般迅速。"}, {"w": "時過境遷", "def": "時間流走，境況也隨之改變。"}, {"w": "瞬息萬變", "def": "形容在極短的時間內變化迅速。"}, {"w": "爭分奪秒", "def": "珍惜每一分每一秒，毫不浪費。"}, {"w": "遙遙無期", "def": "沒有確定的日期，表示希望渺茫。"}, {"w": "刻不容緩", "def": "形容情勢十分緊迫，一刻也不容耽擱。緩，拖延。"}, {"w": "度日如年", "def": "過一天如過一年般的長。比喻日子不好過。"}, {"w": "時來運轉", "def": "本來處境不好，遇到機會，由逆境轉到順境。"}, {"w": "日積月累", "def": "逐日、逐月的長時間累積。比喻歷時遠久。"}]}, {"title": "其他補充成語", "items": [{"w": "不時之需", "def": "隨時的需用。"}, {"w": "驚惶失措", "def": "驚恐慌張，不知如何是好。惶，音ㄏㄨㄤˊ。"}, {"w": "輕重緩急", "def": "各種事情都有主要、次要、緊急、緩慢等狀況的區別。"}, {"w": "割席分坐", "def": "語出南朝 宋 劉義慶《世說新語．德行》：「管寧、華歆共園中鋤菜，見地有片金，管揮鋤與瓦石不異，華捉而擲去之。又嘗同席讀書，有乘軒冕過門者，寧讀如故，歆廢書出看。寧割席分坐曰：『子非吾友也。』」後用以比喻和朋友絕交。"}, {"w": "萬馬奔騰", "def": "形容聲勢浩大。騰，音ㄊㄥˊ。"}, {"w": "七零八落", "def": "散亂的樣子。或形容支離破碎，殘敗不完整。或形容稀少。"}, {"w": "冰消瓦解", "def": "比喻崩潰、分裂或失敗、離散。"}, {"w": "當頭棒喝", "def": "佛教 禪宗接引弟子時，常用棒一擊或大聲一喝，促其領悟。後用以比喻使人立即醒悟的警示。喝，音ㄏㄜˋ。"}, {"w": "遊刃有餘", "def": "好的廚師宰牛時刀刃在骨節間的空隙運轉，覺得空隙還很大。後比喻對於事情能勝任愉快，從容而不費力。"}]}, {"title": "成語充電站", "items": [{"w": "夜以繼日", "def": "表示夜晚接著白天，一直不歇息。"}, {"w": "曇花一現", "def": "比喻人或事物一出現便迅速消失。"}, {"w": "一刻千金", "def": "比喻光陰極為珍貴。"}, {"w": "白駒過隙", "def": "比喻時間過得很快。駒，音ㄐㄩ。"}, {"w": "與日俱新", "def": "隨著時間不斷的更新。"}]}]}, {"lesson": "1上 自學二 拄枴杖的小男孩", "themes": [{"title": "與「同理心、幫助」有關的成語", "items": [{"w": "人飢己飢", "def": "看到別人受飢餓，就像自己受飢餓一樣。形容為政者應有仁愛、慈悲的胸懷，關懷人民疾苦。"}, {"w": "古道熱腸", "def": "形容待人仁厚、熱心。"}, {"w": "同舟共濟", "def": "同乘一條船，合力渡河。比喻同心協力，共圖解救，戰勝困難。"}, {"w": "同病相憐", "def": "有同樣不幸遭遇的人互相同情。"}, {"w": "扶危濟困", "def": "幫助處境危難，救濟生活困苦的人。"}, {"w": "見義勇為", "def": "遇到合乎正義的事，就應該奮勇的去做。"}, {"w": "拔刀相助", "def": "出面替人打抱不平，或出力幫助。"}, {"w": "將心比心", "def": "以自己的立場去衡量別人的立場，體會他人的心意，多方為其設想。"}, {"w": "雪中送炭", "def": "比喻在人艱困危急之時，給予適時的援助。"}, {"w": "愛人如己", "def": "善待他人就像愛惜自己一般。"}, {"w": "樂善好施", "def": "指樂於行善，喜好施捨、濟助他人。"}]}, {"title": "與「不關心」有關的成語", "items": [{"w": "冷眼旁觀", "def": "形容漠不關心。"}, {"w": "置身事外", "def": "對事情不理會，不聞不問。"}, {"w": "漠不關心", "def": "冷冷淡淡，不加關心。"}, {"w": "鐵石心腸", "def": "比喻意志堅定，不為私情所惑。本為讚美之語，後多有貶義。"}]}, {"title": "其他補充成語", "items": [{"w": "一箭之遙", "def": "一箭所射及的地方。比喻不遠的路程、距離。"}, {"w": "時序流轉", "def": "時光流逝。"}, {"w": "寄人籬下", "def": "寄居他人屋下生活。比喻依附他人，而不能自立。或比喻文章著述因襲他人，而不能自創一格。"}, {"w": "愛莫能助", "def": "指內心雖然同情，想要幫助他，卻無能為力。"}, {"w": "楚楚可憐", "def": "形容姿態嬌媚動人，惹人憐愛。"}, {"w": "鰥寡孤獨", "def": "孤獨困苦、無依無靠的人。"}, {"w": "趁火打劫", "def": "趁人之危，從中取利。"}]}, {"title": "成語充電站", "items": [{"w": "感同身受", "def": "像自身承受一樣。"}]}]}, {"lesson": "1上 自學三 曹操掉下去了", "themes": [{"title": "與「技藝」有關的成語", "items": [{"w": "出神入化", "def": "形容文藝、技藝、工藝等之技巧達到至高絕妙的境界。"}, {"w": "巧奪天工", "def": "雖然是人工所製，但是精巧勝過天然。形容技藝巧妙。"}, {"w": "目無全牛", "def": "比喻技藝純熟高超。"}, {"w": "妙手丹青", "def": "繪畫技藝高超的人。"}, {"w": "妙筆生花", "def": "文思俊逸，寫作能力特強。或稱譽文章佳妙。"}, {"w": "技高一籌", "def": "所具備的技能超越他人。籌，音ㄔㄡˊ。"}, {"w": "神乎其技", "def": "形容手法、技巧極為高明巧妙。"}, {"w": "登峰造極", "def": "登上山峰到達絕頂。比喻達到極點或造詣高深精絕。"}, {"w": "雕蟲小技", "def": "比喻微不足道的技能。"}, {"w": "黔驢之技", "def": "從前貴州沒有驢子，有人從外地帶來一頭驢，放在山下餵養。一隻老虎看牠的外表長得很大，起初以為是神，害怕而不敢接近。後來看到這隻驢子除了大聲叫，就只會踢，再也沒有別的本領，就撲上去將牠咬死了。比喻拙劣的技能已經使完，而終至露出虛弱的本質。黔，音ㄑㄧㄢˊ，貴州省的簡稱。"}]}, {"title": "與「傳承」有關的成語", "items": [{"w": "一脈相承", "def": "由一個血統或一個派別承傳沿襲下來。"}, {"w": "克紹箕裘", "def": "比喻能繼承父業。箕裘，指父業。箕，音ㄐㄧ，畚（ㄅㄣˇ）箕。裘，皮襖（ㄠˇ）。"}, {"w": "承先啟後", "def": "承繼先人的遺教，並開啟後來的事業。"}, {"w": "後繼無人", "def": "缺乏可承繼志業的人。"}, {"w": "興滅繼絕", "def": "扶助被滅亡的國家，復興被斷絕的國脈。"}, {"w": "薪火相傳", "def": "比喻師生授受不絕，或種族、血統、文化精神的傳承，綿延不盡。"}, {"w": "繼往開來", "def": "承繼先人的事業，並為後人開拓道路。"}]}, {"title": "其他補充成語", "items": [{"w": "百萬雄兵", "def": "兵力十足，軍威壯盛的軍隊。"}, {"w": "旌旗蔽空", "def": "軍容壯盛的樣子。旌旗，旗子的通稱。旌，音ㄐㄧㄥ。"}, {"w": "殘兵敗將", "def": "戰敗後殘餘的兵將。"}, {"w": "動如脫兔", "def": "軍隊行動迅速，像逃脫的兔子一般。後比喻動作十分敏捷。"}, {"w": "栩栩如生", "def": "形容貌態逼真，彷彿具有生命力。栩栩，形容生動可喜的樣子。栩，音ㄒㄩˇ。"}, {"w": "維妙維肖", "def": "模仿得精細巧妙，逼真傳神。"}, {"w": "靈光一閃", "def": "靈機一動，突發的想法。"}, {"w": "空前絕後", "def": "獨一無二，超越古今，無與倫比。"}, {"w": "雄心壯志", "def": "遠大的志向和抱負。"}]}]}, {"lesson": "1下 第一課 傘", "themes": [{"title": "與「顏色」有關的成語", "items": [{"w": "白頭偕老", "def": "形容夫妻恩愛到老。偕，音ㄒㄧㄝˊ。"}, {"w": "白紙黑字", "def": "白紙寫上黑字。常用以比喻證據確鑿，不容懷疑。"}, {"w": "白手起家", "def": "沒有任何依恃而獨立興起家業。"}, {"w": "信口雌黃", "def": "本指有如口中含著雌黃，能隨時改正不合意的語句。後用以比喻不顧事情真相，隨意批評。雌黃，礦物名，古人用黃紙寫字時，常以雌黃塗抹錯誤之處再改易。雌，音ㄘ。"}, {"w": "青紅皂白", "def": "指各種不同的顏色。比喻事情的是非情由。皂，音ㄗㄠˋ，黑色。"}, {"w": "萬紫千紅", "def": "形容百花盛開，色彩絢麗的景象。"}, {"w": "青出於藍", "def": "青色是從蓼（ㄌㄧㄠˇ）藍裡提煉出來的，但是顏色比蓼藍還深。後用以比喻弟子勝於老師，或後輩優於前輩。"}, {"w": "灰頭土臉", "def": "形容蓬頭垢面，滿面風塵。或比喻碰了一鼻子灰，很沒面子。"}]}, {"title": "與「天氣」有關的成語", "items": [{"w": "火傘高張", "def": "比喻烈日當空。"}, {"w": "秋高氣爽", "def": "形容秋天天氣晴朗涼爽。"}, {"w": "豔陽高照", "def": "形容陽光溫煦（ㄒㄩˇ）亮麗的樣子。"}, {"w": "滂沱大雨", "def": "形容雨勢盛大。滂沱，音ㄆㄤ ㄊㄨㄛˊ。"}]}, {"title": "與「情緒」有關的成語", "items": [{"w": "淚如雨下", "def": "哭得非常傷心，淚水如同下雨一般。形容十分傷心。"}, {"w": "淚流滿面", "def": "淚水布滿整個臉龐。形容非常傷心。"}, {"w": "悲不自勝", "def": "形容極度悲傷而無法承受。勝，音ㄕㄥ。"}, {"w": "悠然自適", "def": "神態從容，心情閒適的樣子。"}, {"w": "悠閒自在", "def": "閒適自得，無所牽掛。"}, {"w": "芒刺在背", "def": "比喻因畏忌而極度不安。芒刺，草葉上的細小尖刺。"}, {"w": "心驚膽顫", "def": "形容非常害怕恐懼。"}, {"w": "杏眼圓睜", "def": "形容女子生氣時瞪大眼睛的神態。"}, {"w": "柳眉倒豎", "def": "形容女子發怒的樣子。柳眉，形容女子的眉毛細如柳葉。"}, {"w": "喜出望外", "def": "因意想不到的喜事而特別高興。"}, {"w": "無動於衷", "def": "心裡絲毫不受感動或影響。"}]}, {"title": "其他補充成語", "items": [{"w": "鐵面無情", "def": "公正嚴明，不講情面。"}, {"w": "荷槍實彈", "def": "持著子彈都已上膛的槍。形容高度警戒，準備隨時戰鬥的狀況。荷，音ㄏㄜˋ。"}, {"w": "不翼而飛", "def": "比喻物品無故遺失。"}, {"w": "亭亭玉立", "def": "形容女子體態秀麗的樣子。"}, {"w": "闔第光臨", "def": "邀請客人全家到來的敬語。闔，音ㄏㄜˊ。"}]}]}, {"lesson": "1下 第二課 近體詩選", "themes": [{"title": "與「隱士」或「隱居生活」有關的成語", "items": [{"w": "東山之志", "def": "晉 謝安曾隱居東山不仕。後用以指隱居不仕的志願。"}, {"w": "梅妻鶴子", "def": "宋 林逋（ㄅㄨ）隱居於杭州 西湖 孤山，植梅養鶴以為伴，逍遙自在。因其無妻無子，故稱為「梅妻鶴子」。後比喻清高或隱居。"}, {"w": "枕石漱流", "def": "以山石為枕，以溪流漱口。形容高潔之士的隱居生活。漱，音ㄕㄨˋ。"}, {"w": "披髮入山", "def": "披頭散髮進入山中，引申為隱居不出仕。"}, {"w": "箕山之志", "def": "相傳堯欲將天下讓給許由，許由不受而避居箕山。後指隱居避世，不慕虛榮的高尚志節。箕，音ㄐㄧ。"}, {"w": "孤雲野鶴", "def": "比喻閒逸自在，不求名利的隱士。"}]}, {"title": "與「情緒」有關的成語", "items": [{"w": "欣喜若狂", "def": "形容快樂、高興到了極點。"}, {"w": "眉飛色舞", "def": "形容非常喜悅得意的神情。"}, {"w": "展眼舒眉", "def": "形容稱心遂意，心情愉悅的樣子。"}, {"w": "愁眉不展", "def": "雙眉緊鎖，很憂愁的樣子。"}, {"w": "樂極生悲", "def": "歡樂至極，往往轉生悲愁。"}]}, {"title": "與「自然景物」有關的成語", "items": [{"w": "東山再起", "def": "晉 謝安退職隱居東山，後來又再度入朝擔任要職。後用以指官員退職後，再度出仕。今亦用此語表示失敗後捲土重來。"}, {"w": "縱橫四海", "def": "無敵於天下。縱，音ㄗㄨㄥ。"}, {"w": "望穿秋水", "def": "形容盼望的深切。秋水，秋天的水明淨澄澈，比喻眼睛。"}, {"w": "水落石出", "def": "冬季水位下降，使石頭顯露出來。或比喻事情真相大白。"}]}, {"title": "其他補充成語", "items": [{"w": "養精蓄銳", "def": "培養精力，以待時機。"}, {"w": "隨機應變", "def": "臨事能妥善變通處置。應，音ㄧㄥˋ。"}, {"w": "舟車勞頓", "def": "旅途疲勞困頓。"}, {"w": "出奇制勝", "def": "發奇兵或用奇計制敵而獲勝。後泛指用奇特、創新的方法取勝。"}, {"w": "置若罔聞", "def": "雖有耳聞，卻好像沒有聽到一樣不加理會。罔，音ㄨㄤˇ，沒有，通「無」。"}, {"w": "四季如春", "def": "形容氣候良好，一整年都很暖和。"}, {"w": "孤芳自賞", "def": "比喻自命清高，自我欣賞。"}, {"w": "穿鑿附會", "def": "憑空杜撰，隨意牽合。"}, {"w": "惻隱之心", "def": "同情憐憫之心。"}]}]}, {"lesson": "1下 第三課 四種讀書的方法", "themes": [{"title": "與「讀書」有關的成語", "items": [{"w": "廢寢忘食", "def": "形容專心努力工作或學習。"}, {"w": "映雪囊螢", "def": "映雪指晉 孫康夜晚利用雪光照明讀書的故事，囊螢指車胤借螢火亮光讀書的故事。形容人在艱困的環境中勤奮讀書。"}, {"w": "懸梁刺股", "def": "比喻人發憤努力學習。"}, {"w": "開卷有益", "def": "打開書本閱讀，即能得到好處。"}, {"w": "韋編三絕", "def": "韋，熟皮。舊時用以串聯竹簡成冊。「韋編三絕」本指孔子勤讀《易》，致使編竹簡的皮繩多次斷裂。後用以比喻讀書勤奮努力。"}, {"w": "兩腳書櫥", "def": "比喻死讀書，不知活用的人。"}, {"w": "學富五車", "def": "形容人書讀很多，學識廣博。"}]}, {"title": "與「情緒、態度」有關的成語", "items": [{"w": "怒不可遏", "def": "憤怒到不能抑制的地步。形容憤怒之極。"}, {"w": "滿面春風", "def": "春風吹拂滿臉上。後用「滿面春風」形容滿臉笑容，心情喜悅，或得意的情狀。"}, {"w": "心平氣和", "def": "形容心氣平和，不急不怒。"}, {"w": "若有所思", "def": "發愣不語，好像在想些什麼似的。"}, {"w": "斬釘截鐵", "def": "形容說話辦事堅決果斷，毫不猶豫。"}, {"w": "悲痛欲絕", "def": "形容傷心哀痛到了極點。"}, {"w": "將信將疑", "def": "表示又有點相信，又有點疑惑。形容對事情的真假，無法明確判斷。將，又、且。"}, {"w": "憂心忡忡", "def": "憂愁不安的樣子。"}, {"w": "一本正經", "def": "一部正規的經典。形容人態度莊重認真。"}, {"w": "六神無主", "def": "形容心慌意亂，拿不定主意。"}, {"w": "百折不撓", "def": "意志剛強，即使受到很多挫折，仍不屈服。"}]}, {"title": "其他補充成語", "items": [{"w": "約法三章", "def": "漢 高祖 劉邦初入咸陽，臨時制定三條法律，與民共守。後用「約法三章」泛指事先約好或規定的事。"}, {"w": "家徒四壁", "def": "家中只剩下四周的牆壁。形容家境極為貧困。"}, {"w": "九霄雲外", "def": "比喻天上極其高遠之處。九霄，指極高的天空。"}, {"w": "才高八斗", "def": "比喻才學極高。"}, {"w": "不二法門", "def": "指觀察事物的道理，要離開相對的兩個極端的看法，才能得其實在，所以是指到達絕對真理的方法。後用以比喻唯一的方法或途徑。不二，不是兩個極端；法門，修行入道的門徑。"}, {"w": "十惡不赦", "def": "十種不可赦免的重罪。後用「十惡不赦」形容罪大惡極，不可饒恕。"}, {"w": "百步穿楊", "def": "形容射箭技術高超或射擊技藝高強。"}, {"w": "各有千秋", "def": "各有長處和特色，或各有其長期存在的價值。"}, {"w": "兩袖清風", "def": "(1)形容喝茶或飲酒後清爽舒暢的感覺。"}, {"w": "五十步笑百步", "def": "作戰時，敗退五十步的人譏笑敗退一百步的人膽小。比喻自己和別人有同樣的缺點或錯誤，卻自以為是而譏笑別人。"}]}]}, {"lesson": "1下 第四課 背影", "themes": [{"title": "與「死亡」有關的成語", "items": [{"w": "如喪考妣", "def": "好像死了父母一般。比喻悲痛至極。考，稱已故的父親。妣，音ㄅㄧˇ，稱已故的母親。"}, {"w": "老成凋謝", "def": "年高望重者逝世。"}, {"w": "行將就木", "def": "比喻年紀已大，壽命將盡。"}, {"w": "屍骨未寒", "def": "指人剛去世，死亡不久。"}, {"w": "香消玉殞", "def": "比喻女子死亡。殞，音ㄩㄣˇ，死亡。"}, {"w": "節哀順變", "def": "抑制悲哀、順應變故。後世用為弔唁（音ㄉㄧㄠˋ ㄧㄢˋ，弔祭死者並慰問喪家）慰問之詞。"}]}, {"title": "與「感情」有關的成語", "items": [{"w": "慈烏反哺", "def": "烏鴉雛鳥長大後，知銜食哺養母鳥。比喻子女報答父母的養育之恩。哺，音ㄅㄨˇ。"}, {"w": "舐犢情深", "def": "比喻父母疼愛子女之深情。舐，音ㄕˋ，用舌頭舔東西。犢，音ㄉㄨˊ，小牛。"}, {"w": "莫逆之交", "def": "心意相投、至好無嫌的朋友。"}]}, {"title": "與「情況變壞」有關的成語", "items": [{"w": "江河日下", "def": "江河之水，源於雪山，春夏冰雪溶則水盛，秋冬冰雪漸凝，江河水則漸少。比喻情況日漸衰微，一天不如一天。"}, {"w": "每況愈下", "def": "情況愈來愈壞。"}, {"w": "雪上加霜", "def": "比喻禍患接踵而至，使傷害加重。"}]}, {"title": "其他補充成語", "items": [{"w": "一飛沖天", "def": "形容上升速度極快，比喻平時沒沒無聞，但才華一經施展，一下子便有驚人的表現。"}, {"w": "天馬行空", "def": "比喻才思敏捷豪放，文筆超逸脫俗。"}, {"w": "口是心非", "def": "嘴上說的和心裡想的不一致。"}, {"w": "背道而馳", "def": "朝著相反方向奔馳。常比喻所要到達的目標和實際進行的方向完全相反。"}, {"w": "大逆不道", "def": "謀反背叛，罪惡重大。或行為嚴重違反常理。"}, {"w": "犯上作亂", "def": "對抗朝廷，冒犯尊長。"}, {"w": "喪盡天良", "def": "形容泯（ㄇㄧㄣˇ）滅人性，極為惡毒。"}, {"w": "悲天憫人", "def": "憂傷時局多變，哀憐百姓疾苦。"}, {"w": "牽腸掛肚", "def": "比喻十分操心、掛念。"}, {"w": "良藥苦口", "def": "能治病的藥，多味苦難嚥。比喻諫言多拂逆於心，但卻有益於人。"}, {"w": "人命關天", "def": "比喻案情重大的案件，多指人命案而言。"}, {"w": "空口無憑", "def": "說話沒有憑證。"}, {"w": "非同小可", "def": "形容事情的重要或情況嚴重。或形容人的學問或本領不同尋常。"}, {"w": "大江東去", "def": "廣闊的江水向東奔流而去。比喻時光流逝不復返。"}]}, {"title": "成語充電站", "items": [{"w": "昊天罔極", "def": "比喻父母恩德如蒼天廣大，無以回報。"}, {"w": "倚門倚閭", "def": "形容父母或親長殷切的盼望子女歸來。"}, {"w": "孟母三遷", "def": "形容家長為教育子女，選擇良好的學習環境所花的苦心。"}, {"w": "十指連心", "def": "比喻人事物的關係非常密切，或父母對每個子女都一樣疼愛。"}, {"w": "噬指棄薪", "def": "比喻母子眷念之情。"}]}]}, {"lesson": "1下 第五課 聲音鐘", "themes": [{"title": "與「飲食」有關的成語", "items": [{"w": "食指大動", "def": "春秋時楚人獻大鱉（ㄅㄧㄝ）給鄭靈公，此時鄭國大夫子家與子公將入朝覲（ㄐㄧㄣˋ）見，子公忽然食指動，遂告訴子家說：「他日我如此，必嘗異味。」後用以指將有美味的東西可以吃，或面對美食而食欲大開。"}, {"w": "簞食瓢飲", "def": "語本《論語．雍也》：「賢哉！回也！一簞食，一瓢飲，在陋巷，人不堪其憂，回也不改其樂。」指顏回生活雖然清苦，卻依舊不改樂道的志趣。用來形容生活簡單、清苦。或比喻安貧樂道。"}]}, {"title": "與「聲音」有關的成語", "items": [{"w": "不絕於耳", "def": "聲響持續不斷。"}, {"w": "珠圓玉潤", "def": "像珠子一般渾圓，像玉石一般溫潤。後用以比喻文詞圓熟或歌聲圓潤。"}, {"w": "暮鼓晨鐘", "def": "佛寺中朝課之前和熄燈之前皆會敲擊鐘鼓，用以警惕與自勵。比喻使人覺悟的言論。"}]}, {"title": "其他補充成語", "items": [{"w": "不同凡響", "def": "較一般事物特出、不平凡。"}, {"w": "天清氣朗", "def": "天候狀況良好，晴朗清新。"}, {"w": "乍暖還寒", "def": "形容天氣冷熱不定。乍，音ㄓㄚˋ，剛剛。還，音ㄏㄨㄢˊ。"}, {"w": "日月如梭", "def": "日和月如梭般快速交替運行。形容時光消逝迅速。"}, {"w": "歷久不衰", "def": "經歷長久的時間卻不衰退。"}, {"w": "嬌生慣養", "def": "從小被寵愛、縱容，沒受過折磨、歷練。"}, {"w": "家徒四壁", "def": "家中只剩四面牆壁。形容家境貧困，一無所有。"}, {"w": "暴殄天物", "def": "指殘害各種生物。亦可喻糟蹋物力，不知珍惜。殄，音ㄊㄧㄢˇ。"}, {"w": "寶山空回", "def": "進入充滿珍寶的山卻空手而回。比喻機會雖好，卻毫無收穫。"}, {"w": "耳濡目染", "def": "形容見得多、聽得多而慢慢受到影響。濡，音ㄖㄨˊ，習染、感染。"}, {"w": "鬼使神差", "def": "冥冥中有鬼神相助。或比喻事出意外，不由自主。"}, {"w": "聚精會神", "def": "本指集合眾人的智慧。後比喻一個人集中精神，專心一意。"}, {"w": "憂心如焚", "def": "內心憂慮有如火在焚燒。比喻非常焦慮不安。"}, {"w": "顧此失彼", "def": "注意這個卻忽略了那個。指不能全面兼顧。"}, {"w": "首當其衝", "def": "最先受到攻擊，或首先遭遇災難。"}]}]}, {"lesson": "1下 第六課 今夜看螢去", "themes": [{"title": "與「昆蟲」有關的成語", "items": [{"w": "招蜂引蝶", "def": "本指花朵吸引蜜蜂、蝴蝶，後用以形容人刻意裝扮自己來吸引眾人的注意。"}, {"w": "蜂腰削背", "def": "形容身材瘦弱細腰。"}, {"w": "蜂擁而至", "def": "比喻如蜂般擁進來。"}, {"w": "蚍蜉撼樹", "def": "以大螞蟻的力量想去搖動大樹。比喻不自量力。蚍蜉，音ㄆㄧˊ ㄈㄨˊ，大蟻。"}, {"w": "蜻蜓點水", "def": "蜻蜓以尾點水而產卵，輕觸即起。形容著力少或費時短。或比喻膚淺而不深入。"}, {"w": "噤若寒蟬", "def": "蟬嘶於夏秋，不久即死。古人以為蟬因天寒而不能發聲，故以噤若寒蟬形容不敢作聲。噤，音ㄐㄧㄣˋ，閉嘴不作聲。"}, {"w": "蠅頭小利", "def": "形容微少的利益。"}, {"w": "蠶食鯨吞", "def": "像蠶吃桑葉般的和緩，或像鯨吞食物般的猛烈。比喻不同的侵略併吞方式。"}]}, {"title": "與「數量」有關的成語", "items": [{"w": "屈指可數", "def": "扳著手指即可數清。形容數量很少。亦形容眾人之中，少數突出的。"}, {"w": "寥若晨星", "def": "稀少得像早晨的星星。形容數量稀少。"}, {"w": "恆河沙數", "def": "印度 恆河的沙多到不可計數。形容數量極多。"}, {"w": "滿坑滿谷", "def": "樂聲盈滿於坑谷。後比喻數量極多，到處都是。"}]}, {"title": "與「聲音」有關的成語", "items": [{"w": "萬籟俱寂", "def": "萬物無聲，一片寂靜。"}, {"w": "鴉雀無聲", "def": "形容非常寂靜。"}, {"w": "人聲鼎沸", "def": "形容人眾會聚，喧譁熱烈，像水在鼎裡煮沸一般。"}, {"w": "甚囂塵上", "def": "喧譁嘈雜，塵沙飛揚。今多用為傳聞四起，議論紛紛的意思。亦可指極為猖狂、囂張之意。"}]}, {"title": "其他補充成語", "items": [{"w": "絕處逢生", "def": "在絕境中又獲得一線生機。"}, {"w": "紈褲子弟", "def": "浮華不知人生甘苦的富家子弟。"}, {"w": "正中下懷", "def": "恰好符合自己的心意。"}, {"w": "淺嘗輒止", "def": "稍微嘗試一下就停止了。比喻做事不澈底，不肯深入研究。"}, {"w": "鑿壁偷光", "def": "本指漢代 匡衡鑿穿牆壁，藉由鄰家燭光照讀的故事。後比喻刻苦勤學。"}]}, {"title": "成語充電站", "items": [{"w": "飛蛾撲火", "def": "比喻自尋死路、自取滅亡。"}, {"w": "金蟬脫殼", "def": "金蟬成蟲時要脫去殼。後比喻用計謀脫身。"}, {"w": "螳臂當車", "def": "螳螂舉起雙臂，想要阻擋車子。比喻不自量力。當，音ㄉㄤˇ。"}, {"w": "聚蚊成雷", "def": "蚊聲雖小，但聚集眾蚊之聲，則聲大如雷。亦可比喻禍患常積於忽微。"}, {"w": "蜩螗沸羹", "def": "飲酒號呼之聲如蟬鳴，笑語之聲如湯沸羹熟。後比喻議論喧騰，紛亂不寧。蜩、螗，皆指蟬。蜩螗，音ㄊㄧㄠˊ ㄊㄤˊ。"}, {"w": "莊周夢蝶", "def": "莊周在夢中幻化為蝴蝶，在天地間遨遊，逍遙自在，不知何為莊周。忽然醒來，發覺自己仍是莊周。後以此比喻人生變幻無常。"}]}]}, {"lesson": "1下 第七課 記承天夜遊", "themes": [{"title": "與「閒」有關的成語", "items": [{"w": "明月清風", "def": "皎潔的圓月，清爽的微風。比喻擺脫塵世羈絆的悠閒生活。"}, {"w": "悠然自得", "def": "神態從容，心情閒適的樣子。"}, {"w": "閒情逸致", "def": "閒適安逸的情趣。"}, {"w": "閒雲野鶴", "def": "比喻來去自如，無所羈絆的人。"}, {"w": "遂心如意", "def": "順心滿意。"}, {"w": "遊手好閒", "def": "遊蕩貪玩，無所事事的樣子。"}, {"w": "隨遇而安", "def": "能安於所處的環境。"}]}, {"title": "與「竹」有關的成語", "items": [{"w": "罄竹難書", "def": "即使把所有竹子做成竹簡，也難以寫盡。後比喻罪狀之多，難以寫盡。罄，音ㄑㄧㄥˋ，盡、用完。"}, {"w": "青梅竹馬", "def": "形容小兒女天真無邪的結伴嬉戲。竹馬，前端裝上木製馬頭的竹竿，小孩夾在胯下當成馬騎。"}, {"w": "胸有成竹", "def": "畫竹之前，心中早已有了竹子的完整形象。比喻處事有定見。"}, {"w": "勢如破竹", "def": "比喻作戰或工作順利進行，毫無阻礙。"}]}, {"title": "與「求知」有關的成語", "items": [{"w": "茅塞頓開", "def": "比喻馬上開悟，忽然明白。"}, {"w": "大惑不解", "def": "十分糊塗、迷惑，不懂道理。後用以指對事物感到非常疑惑，無法了解。"}, {"w": "不求甚解", "def": "讀書著重理解義理，而不過度鑽研字句上的解釋。後多指學習或工作的態度不認真，只求略懂皮毛而不深入理解。"}, {"w": "不學無術", "def": "沒有學問才幹。"}, {"w": "胸無點墨", "def": "胸中沒有一滴墨水。比喻人毫無學識。"}]}, {"title": "其他補充成語", "items": [{"w": "開門見山", "def": "比喻說話或寫文章直截了當，一開始就進入正題。"}, {"w": "兩小無猜", "def": "男女稚齡時，彼此天真無邪，毫無避嫌與猜疑。"}, {"w": "老馬識途", "def": "春秋時齊相管仲，隨桓公出征，在回程時迷路，於是讓老馬走在前頭，其餘人馬跟隨在後，終於找到原路。後稱經歷豐富練達的人。"}, {"w": "心曠神怡", "def": "心情開朗，精神愉悅。"}, {"w": "隨波逐流", "def": "順著水流而行。亦用以比喻人沒有確定的方向和目標，只依從環境、潮流而行動。"}, {"w": "勢均力敵", "def": "雙方力量情勢相當，不分上下。"}, {"w": "馬耳東風", "def": "比喻對事情漠不關心。"}, {"w": "束手無策", "def": "面對問題時，毫無解決的辦法。"}, {"w": "夙夜匪懈", "def": "形容日夜勤奮，從不懈怠。夙，音ㄙㄨˋ，早晨。匪，音ㄈㄟˇ，不。"}, {"w": "勢不可當", "def": "來勢迅速、猛烈，不可抵擋。當，音ㄉㄤˇ，匹敵、抵抗，通「擋」。"}]}, {"title": "成語充電站", "items": [{"w": "竹籬茅舍", "def": "比喻鄉居簡樸的生活環境。"}, {"w": "竹苞松茂", "def": "比喻堅固繁盛。也用為祝賀新居落成的吉詞，或祝壽的頌詞。"}, {"w": "悠哉悠哉", "def": "比喻悠閒自得。"}, {"w": "輕裘緩帶", "def": "形容態度閒適從容。"}, {"w": "忙裡偷閒", "def": "在忙碌中抽空來娛樂。"}, {"w": "安步當車", "def": "形容悠閒自在、不慌忙。"}, {"w": "投閒置散", "def": "置於不重要的地位，不予重用。"}, {"w": "淺斟低唱", "def": "形容悠然自得，遣興消閒的情景。"}]}]}, {"lesson": "1下 第八課 音樂家與職籃巨星", "themes": [{"title": "使用「譬喻」修辭的成語", "items": [{"w": "如坐針氈", "def": "比喻心神不寧，片刻難安。氈，音ㄓㄢ。"}, {"w": "如夢初醒", "def": "好像從睡夢中剛醒過來。比喻從糊塗、錯誤的認識中恍然大悟。"}, {"w": "如鯁在喉", "def": "好像魚骨刺在喉嚨。比喻不把障礙除去則心不能安。鯁，音ㄍㄥˇ。"}, {"w": "淚如雨下", "def": "哭得非常傷心，淚水如同下雨一般。形容十分傷心。"}, {"w": "勢如破竹", "def": "比喻作戰或工作順利進行，毫無阻礙。"}, {"w": "堆積如山", "def": "東西堆積得像一座山。形容很多。"}, {"w": "歸心如箭", "def": "形容回家的心意極為迫切。"}, {"w": "虛懷若谷", "def": "心胸寬廣如山谷能容納萬物。形容為人謙虛，能接納他人的意見。"}]}, {"title": "與「如」有關的成語", "items": [{"w": "如法炮製", "def": "本指依照古法製藥，後多指依照往例或現有的方法辦事。炮，音ㄆㄠˊ。"}, {"w": "如意算盤", "def": "比喻一廂情願的做對自己有利的打算。"}, {"w": "突如其來", "def": "形容出乎意料的突然來到或發生。"}, {"w": "盡如人意", "def": "完全合乎人的心意。"}, {"w": "表裡如一", "def": "內外一致。指思想和言行一致。"}, {"w": "自嘆不如", "def": "自認為比不上。"}]}, {"title": "其他補充成語", "items": [{"w": "堅持不懈", "def": "堅守到底，絕不鬆懈。"}, {"w": "精雕細琢", "def": "精心細緻的雕刻琢磨。形容做事仔細用心。多指藝術品的創作。"}, {"w": "博古通今", "def": "學問淵博，通曉古今。"}, {"w": "異想天開", "def": "不符實際、不合事理的奇特想法。"}, {"w": "莫衷一是", "def": "眾說紛紜，無法得到一致的結論。"}, {"w": "毀譽參半", "def": "毀謗與稱譽的比例相當。"}, {"w": "天涯海角", "def": "偏僻或相距遙遠的地方。"}, {"w": "頂天立地", "def": "頭頂著天，腳立於地。形容人處事光明磊落，氣勢豪邁。"}, {"w": "偷天換日", "def": "比喻暗中改變事物的內容、性質。"}, {"w": "釜底抽薪", "def": "比喻從根本上解決問題。釜，古代的一種烹飪器具，即今之鐵鍋。"}, {"w": "返璞歸真", "def": "除去外在的一切牽絆，回復淳樸原始的自然本性。"}, {"w": "單槍匹馬", "def": "比喻單獨行動，沒有絲毫助力。"}]}, {"title": "成語充電站", "items": [{"w": "持之以恆", "def": "有恆心的堅持到底。"}, {"w": "堅忍不拔", "def": "形容意志堅定，不可動搖。"}, {"w": "積水成淵", "def": "比喻事情的成功是逐漸累積而來。"}, {"w": "愚公移山", "def": "比喻努力不懈，不畏艱難，自能成事。"}, {"w": "磨杵成針", "def": "比喻只要有恆心，努力去做，無論多麼困難的事，都可以成功。"}, {"w": "滴水穿石", "def": "水滴不斷的滴落，久了之後可將石頭穿透。用以比喻有志者事竟成，只要努力不懈就能夠成功。"}, {"w": "心堅石穿", "def": "相傳古代有人修道四十七年，終於用木鑽把磐石穿透，得道升天的故事。比喻人意志堅決，任何艱難都能克服。"}, {"w": "孜孜不倦", "def": "勤勉而不知疲倦。"}, {"w": "夙興夜寐", "def": "早起晚睡。比喻勤勞。"}, {"w": "克勤克儉", "def": "指既能勤勞又能節儉。"}, {"w": "懸梁刺股", "def": "比喻人發憤努力學習。"}, {"w": "業精於勤", "def": "學業的精進在於勤奮努力。"}, {"w": "勤能補拙", "def": "勤奮努力可以彌補天資的不足。"}, {"w": "映雪囊螢", "def": "形容人在艱困的環境中勤奮讀書。"}, {"w": "孜孜矻矻", "def": "勤勞努力不懈怠。矻，音ㄎㄨˋ。"}, {"w": "牛角掛書", "def": "唐 李密貧寒，乘牛掛書於角上，邊行邊讀書。比喻勤勉讀書。"}, {"w": "焚膏繼晷", "def": "指燃燒燈燭一直到白天日光出現。形容夜以繼日的勤讀不怠。"}]}]}, {"lesson": "1下 第九課 謝天", "themes": [{"title": "與「感恩」有關的成語", "items": [{"w": "一飯千金", "def": "淮陰侯 韓信未得志時，曾受漂母（漂洗衣物的老婦）贈飯療飢，後來以千金為報。後比喻報恩隆厚。"}, {"w": "結草銜環", "def": "比喻生前受恩死後圖報。結草，春秋 晉國 魏顆救父親寵妾，而獲老人結草禦敵的故事。銜環，漢時楊寶曾救治遭鴟梟（音ㄔ ㄒㄧㄠ，俗稱貓頭鷹）襲擊的黃雀，後黃雀傷癒飛走，某夜有黃衣童子贈楊寶白環四枚。"}, {"w": "飲水思源", "def": "喝水的時候，想到水的來源。比喻不忘本。"}]}, {"title": "與「不知感恩」有關的成語", "items": [{"w": "自私自利", "def": "只圖自己的私利，而不顧及一切。"}, {"w": "忘恩負義", "def": "受人恩惠不知報答，反而做出對不起恩人的事情。"}, {"w": "鳥盡弓藏", "def": "飛鳥射盡之後，就收起弓箭不用。比喻天下平定之後便遺棄功臣。"}, {"w": "過河拆橋", "def": "一種戰術。渡過了河就把橋拆掉。比喻不念舊情，忘恩負義。"}]}, {"title": "與「謙虛」、「驕傲」有關的成語", "items": [{"w": "功成不居", "def": "本指順應自然的存在，不占為己有。後引申為建立了功勞而不歸功於自己。"}, {"w": "虛懷若谷", "def": "心胸寬廣如山谷能容納萬物。形容為人謙虛，能接納他人的意見。"}, {"w": "謙沖自牧", "def": "為人處事謙和退讓，以修養自我的德性。"}, {"w": "居功自傲", "def": "憑藉著自己的功勞而驕傲自滿。"}]}, {"title": "其他補充成語", "items": [{"w": "亙古未有", "def": "從古到今都沒有過。亙，音ㄍㄣˋ。"}, {"w": "恍然大悟", "def": "心裡忽然明白。恍，音ㄏㄨㄤˇ。"}, {"w": "突如其來", "def": "形容出乎意料的突然來到或發生。"}, {"w": "風中之燭", "def": "比喻老邁，不久於世。"}, {"w": "家喻戶曉", "def": "家家戶戶都知道。形容事情、名聲傳布極廣。"}, {"w": "搖曳生姿", "def": "姿態閑雅，婀娜（音ㄜ ㄋㄨㄛˊ，輕盈柔美的樣子）多姿的樣子。"}, {"w": "遊手好閒", "def": "遊蕩貪玩，無所事事的樣子。"}, {"w": "暴殄天物", "def": "指殘害各種生物。亦可喻糟蹋物力，不知珍惜。殄，音ㄊㄧㄢˇ。"}, {"w": "遺愛人間", "def": "把德惠遺留給後代。多指有德政的人而言。"}, {"w": "不遺餘力", "def": "毫不保留，竭盡全力。"}]}, {"title": "成語充電站", "items": [{"w": "感恩戴德", "def": "感激他人對自己的恩德。"}, {"w": "漆身吞炭", "def": "比喻不惜性命以報答主恩。"}, {"w": "鏤骨銘肌", "def": "比喻深深感激，永遠不忘。"}, {"w": "感恩圖報", "def": "感激他人的恩德而設法報答。"}]}]}, {"lesson": "1下 第十課 另一個春天", "themes": [{"title": "與「勇敢」有關的成語", "items": [{"w": "奮勇當先", "def": "鼓起勇氣，站到前面。形容勇敢向前。"}, {"w": "渾身是膽", "def": "比喻人膽量大，無所畏忌。"}, {"w": "見義勇為", "def": "遇到合乎正義的事，就應該奮勇的去做。"}, {"w": "急流勇退", "def": "在湍（ㄊㄨㄢ）急的水勢中，當機立斷回舟退出。比喻人處於得意順遂時，能見機功成身退，以求明哲保身。"}, {"w": "視死如歸", "def": "形容人勇敢不怕死。"}, {"w": "乘風破浪", "def": "順著風，破浪前進。或喻志向遠大，不畏艱難，奮勇前進。"}]}, {"title": "其他補充成語", "items": [{"w": "強弩之末", "def": "強弩射出的箭，到射程盡頭，已經沒有力道。比喻原本強大的力量已經衰竭，不能再發揮效用。弩，音ㄋㄨˇ，用機械力量發射的硬弓。"}, {"w": "縛雞之力", "def": "綁雞的力量。形容極小的力量。"}, {"w": "優柔寡斷", "def": "行事猶豫不決，不能當機立斷。"}, {"w": "雕蟲小技", "def": "比喻微不足道的技能。"}, {"w": "掩人耳目", "def": "比喻欺騙、蒙蔽他人。"}, {"w": "振奮人心", "def": "振作人心，使之奮發激昂。"}, {"w": "近鄉情怯", "def": "久別故鄉，再重返家園時，所產生的一種既期待又畏懼的心情。"}, {"w": "耳提面命", "def": "比喻懇切教誨。"}, {"w": "堅忍不拔", "def": "形容意志堅定，不可動搖。"}, {"w": "克勤克儉", "def": "指既能勤勞又能節儉。"}, {"w": "弄巧成拙", "def": "本想取巧，卻反而敗事。有枉費心機的意思。"}, {"w": "興致勃勃", "def": "形容興趣濃厚。勃勃，旺盛的樣子。"}, {"w": "礙手礙腳", "def": "占據地方，妨礙別人做事，使人不便。"}, {"w": "習以為常", "def": "養成習慣後，便成為常規。"}, {"w": "紛至沓來", "def": "形容接連不斷的到來。紛，眾多。沓，音ㄊㄚˋ，重覆。"}, {"w": "恃才傲物", "def": "依仗本身有才幹而驕傲，目空一切。"}, {"w": "七手八腳", "def": "形容人多動作紛亂沒條理。"}, {"w": "老態龍鍾", "def": "形容年老體衰，行動遲緩不靈活。"}]}, {"title": "成語充電站", "items": [{"w": "勇猛果敢", "def": "勇敢有決斷。"}, {"w": "勇往直前", "def": "奮勇前進、無所畏懼。"}, {"w": "奮不顧身", "def": "勇往直前，不顧生死。"}, {"w": "智勇雙全", "def": "智慧與勇氣兩者兼備。"}, {"w": "赴湯蹈火", "def": "比喻奮不顧身，不避艱險。"}, {"w": "自告奮勇", "def": "自動請求擔負冒險犯難的事。"}, {"w": "大勇若怯", "def": "外表懼怯，但事實上十分勇敢的人。"}, {"w": "義無反顧", "def": "本著正義，勇往直前，絕不退縮。"}, {"w": "挺身而出", "def": "遇到危難時，勇敢的站出來，擔當其任。"}, {"w": "前仆後繼", "def": "作戰時前面的人倒下，後面的繼續往前衝。形容不怕犧牲，奮勇向前。仆，音ㄆㄨ。"}, {"w": "履險如夷", "def": "指走危險的路像走平地一樣。比喻人在艱難環境中，奮不顧身，沉著應付。履，行走。夷，平坦、平安。"}]}]}, {"lesson": "1下 自學一 東風吹馬耳", "themes": [{"title": "與「動物」有關的成語", "items": [{"w": "馬齒徒長", "def": "自謙年歲徒增而毫無建樹。"}, {"w": "一馬當先", "def": "趕在眾人之前，領先前進。"}, {"w": "汗馬功勞", "def": "本指作戰時，戰馬奔馳而大量出汗。比喻戰功或工作的辛勞與成績。"}, {"w": "龍馬精神", "def": "形容精神健旺、充沛。龍馬，傳說為伏羲氏所見的神馬，後亦指駿馬。"}, {"w": "心猿意馬", "def": "佛教以猿馬性喜外馳來形容眾生的心，不能安住，喜攀緣外境。後用來形容心意不定，不能自持。"}, {"w": "聲色犬馬", "def": "嗜好歌聲、美色、養狗、騎馬等的荒淫享樂。"}, {"w": "懸崖勒馬", "def": "瀕臨懸崖而能及時勒住奔馬。引申為人們警悟險境，及時回頭。"}, {"w": "老驥伏櫪", "def": "好馬雖老了，伏在馬槽邊，仍想奔跑千里的路程。比喻年雖老而仍懷雄心壯志。驥，音ㄐㄧˋ，千里馬。櫪，音ㄌㄧˋ，馬槽，泛指馬房。"}, {"w": "獐頭鼠目", "def": "獐頭小而尖，鼠目小而凸出。形容人相貌鄙陋，令人生厭。獐，音ㄓㄤ。"}, {"w": "泥牛入海", "def": "泥塑的牛一旦掉入海中，立刻瓦解。比喻一去不復返。"}, {"w": "與虎謀皮", "def": "比喻所謀者與他人利害相牴觸，事情必辦不成。"}, {"w": "殺雞儆猴", "def": "比喻懲罰一個人以警告其他人。儆，音ㄐㄧㄥˇ。"}, {"w": "白雲蒼狗", "def": "原作「白衣蒼狗」，指白雲原本像一件潔淨的白衣，轉眼間卻變成灰狗的模樣。比喻世事變幻無常。"}]}, {"title": "與「耳」有關的成語", "items": [{"w": "耳提面命", "def": "比喻懇切教誨。"}, {"w": "耳聰目明", "def": "形容腦筋靈敏，聽覺既好，視力也強。"}, {"w": "充耳不聞", "def": "塞住耳朵，裝著沒聽見。形容故意不理會或不願聽取別人的意見。"}, {"w": "洗耳恭聽", "def": "專心、恭敬的聆聽。"}, {"w": "如雷貫耳", "def": "好像雷聲傳入耳朵那樣響亮。比喻人名氣很大，眾所共聞。"}, {"w": "俯首帖耳", "def": "低頭垂耳。形容恭順馴服的樣子。帖，音ㄊㄧㄝ。"}]}, {"title": "成語充電站", "items": [{"w": "指鹿為馬", "def": "比喻顛倒是非。"}, {"w": "盲人瞎馬", "def": "比喻極為危險。"}, {"w": "害群之馬", "def": "比喻危害大眾的人。"}, {"w": "老馬識途", "def": "稱經歷豐富練達的人。"}, {"w": "馬革裹屍", "def": "比喻英勇作戰，效命沙場。"}, {"w": "千軍萬馬", "def": "比喻戰爭激烈，聲勢浩大。"}, {"w": "倚馬可待", "def": "比喻文思敏捷，寫作迅速。"}, {"w": "兵荒馬亂", "def": "形容戰爭所造成的混亂景象。"}, {"w": "蛛絲馬跡", "def": "比喻有線索跡象可以尋查推求。"}, {"w": "巴蛇吞象", "def": "比喻人心貪婪無度。"}, {"w": "虎頭蛇尾", "def": "比喻做事有始無終。"}, {"w": "牛鬼蛇神", "def": "比喻形形色色的壞人。"}, {"w": "蛇蠍心腸", "def": "比喻人心地陰險、惡毒。"}, {"w": "虛與委蛇", "def": "指假意殷勤，敷衍應付。"}, {"w": "畫蛇添足", "def": "比喻多此一舉而於事無補。"}, {"w": "龍蛇混雜", "def": "比喻愚賢不一的人混在一起。"}, {"w": "杯弓蛇影", "def": "比喻為不存在的事情枉自驚惶。"}, {"w": "筆走龍蛇", "def": "比喻文筆揮灑自如或書法優美熟練。"}, {"w": "打草驚蛇", "def": "比喻行事不密，使對方有所察覺，預先防備。"}, {"w": "交頭接耳", "def": "低聲私語。"}, {"w": "掩耳盜鈴", "def": "比喻自欺欺人。"}, {"w": "耳鬢廝磨", "def": "形容親暱的樣子。"}, {"w": "掩人耳目", "def": "比喻欺騙、蒙蔽他人。"}, {"w": "耳濡目染", "def": "聽熟了，看慣了，因而深受影響。"}, {"w": "面紅耳赤", "def": "形容羞愧、焦急或發怒時的樣子。"}, {"w": "酒酣耳熱", "def": "形容酒喝得意興正濃的暢快神態。"}]}]}, {"lesson": "1下 自學二 賣油翁", "themes": [{"title": "與「言語」有關的成語", "items": [{"w": "一針見血", "def": "比喻議論透澈而中肯。"}, {"w": "一語中的", "def": "一句話就說中事情的重點。的，音ㄉㄧˋ，箭靶的中心。"}, {"w": "火上加油", "def": "比喻使事態更加擴張或惡化。"}, {"w": "出爾反爾", "def": "你怎麼對待別人，別人也會怎麼待你。後比喻人的言行前後反覆，自相矛盾。"}, {"w": "加油添醋", "def": "比喻傳述事情時，任意增添情節，誇大、渲染其內容。"}, {"w": "老生常談", "def": "老書生的尋常言論。比喻時常聽到，了無新意的老話。"}, {"w": "良藥苦口", "def": "能治病的藥，多味苦難嚥。比喻諫言多拂逆於心，但卻有益於人。"}, {"w": "言之成理", "def": "言論能自成道理。"}, {"w": "忠言逆耳", "def": "誠懇正直的規勸往往刺耳，而不易被人接受。"}, {"w": "油腔滑調", "def": "寫文章或言語態度浮滑，不切實。"}, {"w": "苦口婆心", "def": "形容以懇切真摯的態度，竭力勸告他人。"}, {"w": "能言善道", "def": "口舌伶俐、善於說話。"}]}, {"title": "與「箭」有關的成語", "items": [{"w": "左右開弓", "def": "雙手都能彎弓射箭。形容雙手同時或輪流做某一動作。"}, {"w": "百步穿楊", "def": "本指春秋時楚國的養由基能在百步內射中柳葉。後比喻射箭技術高超或技藝高強。"}, {"w": "百發百中", "def": "比喻射擊技藝高妙，絕無虛發。或比喻料事如神，所謀皆中。"}, {"w": "暗箭傷人", "def": "趁人不備，用狡詐陰險的手段傷害人。"}, {"w": "萬箭齊發", "def": "上萬支箭一同發射。"}]}, {"title": "其他補充成語", "items": [{"w": "十拿九穩", "def": "比喻很有把握。"}, {"w": "不得要領", "def": "沒有能夠掌握到事物的要點和主旨。"}, {"w": "半生不熟", "def": "食物未完全煮熟。或指對事物或技藝尚未熟悉。"}, {"w": "滾瓜爛熟", "def": "滾落在地上的瓜，熟透了。比喻極為純熟流利。"}, {"w": "瓜熟蒂落", "def": "比喻時機成熟，自然成功。"}, {"w": "穩如泰山", "def": "穩定牢固如泰山一般，不可動搖。"}, {"w": "虛懷若谷", "def": "心胸寬廣如山谷能容納萬物。形容為人謙虛，能接納他人的意見。"}, {"w": "馬耳東風", "def": "比喻對事情漠不關心。"}, {"w": "駕輕就熟", "def": "駕著輕車走熟路。比喻對事情很熟悉，做起來很容易。"}]}, {"title": "成語充電站", "items": [{"w": "如箭在弦", "def": "比喻勢在必行。"}, {"w": "萬箭穿心", "def": "形容極端的痛苦。"}, {"w": "一箭之地", "def": "比喻不遠的路程、距離。"}, {"w": "歸心似箭", "def": "形容回家的心意非常迫切。"}, {"w": "眾矢之的", "def": "比喻大家一致攻擊的目標。"}, {"w": "光陰似箭", "def": "形容時間消逝如飛箭般迅速。"}, {"w": "箭無虛發", "def": "形容射箭技術高超，每發必中。"}, {"w": "一箭雙鵰", "def": "比喻一次舉動便可達到雙倍效果。"}, {"w": "無的放矢", "def": "沒有箭靶而胡亂放箭。比喻言語或行動沒有目的。或比喻毫無事實根據而胡亂的指責、攻擊別人。"}, {"w": "強弩之末", "def": "強弩射出的箭，到射程盡頭，已經沒有力道。比喻原本強大的力量已經衰竭，不能再發揮效用。弩，音ㄋㄨˇ，用機械力量發射的硬弓。"}, {"w": "妄自尊大", "def": "驕矜自大，自命不凡。"}, {"w": "恃寵而驕", "def": "倚仗得寵而驕傲自大。"}, {"w": "剛愎自用", "def": "性情倔強，固執己見。"}, {"w": "旁若無人", "def": "形容意態自然或高傲。"}, {"w": "盛氣凌人", "def": "用傲慢的氣勢壓迫別人。"}, {"w": "驕矜狂妄", "def": "傲慢、自大，膽大妄為。"}, {"w": "心高氣傲", "def": "因自視過高而盛氣凌人。"}, {"w": "不可一世", "def": "形容狂妄自大已達極點。"}, {"w": "目空一切", "def": "自視甚高，一切都瞧不起。"}, {"w": "目中無人", "def": "形容自高自大，瞧不起他人。"}, {"w": "唯我獨尊", "def": "形容人高傲自大，目空一切。"}, {"w": "頤指氣使", "def": "形容以高傲的態度指使屬下。"}, {"w": "恃才傲物", "def": "依仗本身有才幹而驕傲，目空一切。"}, {"w": "趾高氣揚", "def": "走路腳抬得很高，十分神氣。後形容驕傲自滿、得意忘形的樣子。"}]}]}, {"lesson": "1下 自學三 再見，西莎", "themes": [{"title": "與「神態」有關的成語", "items": [{"w": "百無聊賴", "def": "非常無聊。指無事可做，或思想感情沒有寄託的狀況。"}, {"w": "垂頭喪氣", "def": "低垂著頭，意氣消沉。形容失意沮喪的樣子。"}, {"w": "興高采烈", "def": "形容興致勃勃，情緒熱烈的樣子。興，音ㄒㄧㄥˋ。"}, {"w": "齜牙咧嘴", "def": "張嘴露牙，形容凶狠的樣子。齜，音ㄗ。咧，音ㄌㄧㄝˇ。"}]}, {"title": "與「別離」有關的成語", "items": [{"w": "天各一方", "def": "形容分離後各居一地，相隔遙遠。"}, {"w": "目斷飛鴻", "def": "極目遠望，直至飛雁不見。形容離別的悲悽之情。"}, {"w": "死生契闊", "def": "指生死離合。契，相合。闊，離別。"}, {"w": "勞燕分飛", "def": "伯勞和燕子離散分飛。比喻別離，而多用於夫妻、情人之間。"}, {"w": "悲歡聚散", "def": "比喻人世間的聚散無常。"}, {"w": "霸陵折柳", "def": "漢 唐時，長安送客東行，多至霸陵折柳送別。後指送客作別。"}]}, {"title": "與「狗」有關的成語", "items": [{"w": "兔死狗烹", "def": "兔子死盡，用來捕兔的獵狗失去了作用，故而烹食之。比喻事成之後，出過力的人即遭到殺戮或見棄的命運。多指統治者殺戮功臣而言。"}, {"w": "狗尾續貂", "def": "古代近侍之官以貂尾為帽冠的裝飾，晉代朝廷任官太濫，以致貂尾不足，而以狗尾代之。比喻任官太濫，或事物以壞續好，前後不相稱。"}, {"w": "狗急跳牆", "def": "狗本是不跳牆的，但被追得無路可走時，也不得不越牆而逃。比喻走投無路時，不顧後果的冒險，只求一條生路。"}, {"w": "狗苟蠅營", "def": "如狗般卑劣苟且，如蒼蠅般到處鑽營。比喻小人鑽營攀附，阿諛諂媚的行為。"}, {"w": "狗馬聲色", "def": "比喻喜好聲色等享樂、不務正業的行為。"}, {"w": "狼心狗肺", "def": "比喻人心腸狠毒，毫無良心。"}, {"w": "偷雞摸狗", "def": "形容做事偷偷摸摸，不光明正大。"}, {"w": "賣狗懸羊", "def": "表裡不一，欺騙矇混。"}]}, {"title": "其他補充成語", "items": [{"w": "別風淮雨", "def": "本為「列風淫雨」的誤寫。後借指文章中錯字連篇，以訛（ㄜˊ，錯誤）傳訛。淮，音ㄏㄨㄞˊ。"}, {"w": "別開生面", "def": "重新描繪舊畫像，而使原已褪色的面貌變得鮮明、生動。後比喻開創新的風格、形式。"}, {"w": "投桃報李", "def": "你送桃子，我回贈以李子。後用以比喻朋友間友好往來或相互贈答。"}, {"w": "萍水相逢", "def": "指浮萍因水而四處流蕩，聚散不定。比喻兩個人本來不相識，因機緣巧合偶然相逢，同時亦指交情尚屬微淺。萍，浮萍。"}]}, {"title": "成語充電站", "items": [{"w": "蜀犬吠日", "def": "比喻少見多怪。"}, {"w": "雞犬不寧", "def": "比喻被嚴重的騷擾。"}, {"w": "喪家之犬", "def": "比喻不得志、無所歸宿或驚慌失措的人。"}, {"w": "雞鳴狗盜", "def": "比喻有某種卑下技能的人，或卑微的技能。"}, {"w": "犬馬之勞", "def": "舊時人臣對君王表達效忠之心，也用來表示願為他人效勞的用語。"}]}]}, {"lesson": "2上 第一課 小詩選", "themes": [{"title": "與「風」有關的成語", "items": [{"w": "風吹草動", "def": "比喻輕微的動靜變化。"}, {"w": "風塵僕僕", "def": "形容四處奔波，旅途勞累。"}, {"w": "風燭殘年", "def": "風中的燭火，隨時可能熄滅。比喻臨近死亡的晚年。"}, {"w": "呼風喚雨", "def": "比喻人神通廣大、很有影響力。"}, {"w": "捕風捉影", "def": "比喻所做之事或所說的話毫無根據，憑空揣測。"}, {"w": "一帆風順", "def": "本指船張滿帆，一路順風而行。"}, {"w": "甘拜下風", "def": "表示心悅誠服。"}, {"w": "櫛風沐雨", "def": "以風梳髮，以雨沐浴。比喻在外奔走，極為辛勞。櫛，音ㄐㄧㄝˊ，梳理。"}]}, {"title": "與「豪情壯志」有關的成語", "items": [{"w": "人定勝天", "def": "指人為的力量，能夠克服自然阻礙，改造環境。"}, {"w": "夸父逐日", "def": "上古神話故事。傳說夸父威猛好勝，乃與太陽追趕競走，總追不上，路上又累又渴，喝光了黃河、渭水仍然不夠，再往北邊大澤去找水喝，卻渴死在途中。他隨身的手杖棄置在地上，後來長出了一片桃林。比喻不自量力或有雄心壯志但未竟大業。夸，音ㄎㄨㄚ。"}, {"w": "老驥伏櫪", "def": "好馬雖老了，伏在馬槽邊，仍想奔跑千里的路程。比喻年紀雖大，卻仍懷雄心壯志。驥，音ㄐㄧˋ，好馬。櫪，音ㄌㄧˋ，馬槽。"}, {"w": "壯志未酬", "def": "偉大的志願尚未實現。"}, {"w": "鬥志昂揚", "def": "爭強鬥勝的意志高昂飛揚。"}, {"w": "鴻鵠之志", "def": "像鴻雁一舉千里般的壯志。比喻志向遠大。鴻鵠，音ㄏㄨㄥˊ ㄏㄨˊ。"}]}, {"title": "其他補充成語", "items": [{"w": "平步青雲", "def": "比喻順利無阻，迅速晉升高位。"}, {"w": "扶搖直上", "def": "乘著風，快速上升。亦比喻仕途得意或事業蒸蒸日上。"}, {"w": "旁敲側擊", "def": "寫文章或說話不從正面直接說明，而從旁比喻或暗示來表達。"}, {"w": "蚍蜉撼樹", "def": "指以大螞蟻的力量想去搖動大樹。比喻不自量力。蚍蜉，音ㄆㄧˊ ㄈㄨˊ，大螞蟻。"}, {"w": "揮金如土", "def": "花錢像撒土一樣。比喻極端浪費錢財。"}, {"w": "無懈可擊", "def": "沒有任何缺點可讓人攻擊。"}, {"w": "橫衝直撞", "def": "胡亂的四處衝撞。"}, {"w": "簡明扼要", "def": "精簡明白，能抓住重點。"}, {"w": "黯然神傷", "def": "心神沮喪，神情憂傷。"}]}, {"title": "成語充電站", "items": [{"w": "細水長流", "def": "節約使用財物，才能長久不缺。"}, {"w": "背水一戰", "def": "指陷入絕境中的決死戰鬥。"}, {"w": "水深火熱", "def": "比喻處境艱困、痛苦。"}, {"w": "覆水難收", "def": "比喻既定的事實很難再改變。"}, {"w": "水滴石穿", "def": "比喻持之以恆，事必有成。"}, {"w": "出水芙蓉", "def": "形容文章清新可愛或女子嬌柔清。"}, {"w": "車水馬龍", "def": "形容車馬絡繹不絕的熱鬧景象。"}, {"w": "水中撈月", "def": "比喻無法辦到的事情。"}, {"w": "水落石出", "def": "比喻事情真相大白。"}, {"w": "行雲流水", "def": "形容詩文文筆流暢、毫無滯礙。"}, {"w": "順水推舟", "def": "比喻順應情勢行事，既合時機，。"}, {"w": "如魚得水", "def": "比喻得到和自己意氣相投的人或。"}, {"w": "山高水長", "def": "比喻人品高潔，垂範久遠。亦用。"}, {"w": "逆水行舟", "def": "勉勵人不論學習或做事都要不斷。"}]}]}, {"lesson": "2上 第二課 古體詩選", "themes": [{"title": "與「傷逝親友」有關的成語", "items": [{"w": "立雪神傷", "def": "典源為「程門立雪」。用於哀悼師長喪。"}, {"w": "抱痛西河", "def": "子夏在西河時，因喪子而痛哭失明。後比喻喪子之痛。"}, {"w": "風木含悲", "def": "典源為「樹欲靜而風不止，子欲養而親不待」。比喻父母亡故，兒女不得奉養的悲傷。"}, {"w": "雁行折翼", "def": "比喻兄弟分離或死亡。雁行，比喻兄弟。"}, {"w": "話冷雞窗", "def": "為悼祭同學的題辭。雞窗，書房，借指同學。"}, {"w": "鼓盆之戚", "def": "典源為莊子喪妻後鼓盆而歌。比喻喪妻之痛。"}]}, {"title": "與「動物」有關的成語", "items": [{"w": "投鼠忌器", "def": "想擲打老鼠，卻擔心老鼠身旁的器物被擊壞而不敢下手。後比喻做事有所顧忌，不敢下手。"}, {"w": "九牛一毛", "def": "許多牛身上的一根毛。比喻多數中的極少部分，對大體沒有什麼影響。"}, {"w": "馬不停蹄", "def": "到處奔行而不止息。形容忙碌不休。"}, {"w": "烏鳥私情", "def": "相傳幼烏鴉長成後，會反哺年老無法覓食的老烏鴉，故以烏鳥私情比喻奉養長輩的孝心。"}, {"w": "亡羊補牢", "def": "丟失了羊，就趕快修補羊圈，還不算晚。比喻犯錯後及時更正，尚能補救。"}, {"w": "指鹿為馬", "def": "本指趙高獻給秦二世一隻鹿，故意指稱是馬，並問臣子是鹿或馬，而將答鹿者暗中殺害，使群臣畏懼自己，以謀篡位。後比喻顛倒是非。"}, {"w": "虎視眈眈", "def": "如老虎般貪狠的注視。比喻心懷不軌，伺機掠奪。"}, {"w": "守株待兔", "def": "相傳一農夫見兔觸樹而死，為他所得，遂不事農作，守在樹旁，等待兔子撞樹，終一無所獲。後比喻拘泥守成，不知變通或妄想不勞而獲。"}, {"w": "虎頭蛇尾", "def": "虎頭大，蛇尾小。比喻做事有始無終。"}, {"w": "魚目混珠", "def": "以魚眼睛混充珍珠。比喻以假亂真。"}]}, {"title": "其他補充成語", "items": [{"w": "寸草春暉", "def": "比喻父母恩情深重，子女即使竭盡心意也難以報答。"}, {"w": "犬馬之養", "def": "泛指奉養父母。"}, {"w": "烏合之眾", "def": "比喻暫時湊合，無組織、無紀律的一群人。"}, {"w": "愛屋及烏", "def": "比喻愛一個人也連帶的關愛與他有關的人或物。"}, {"w": "睹物思人", "def": "看到故人所留下的物品，而引起對他的思念。"}, {"w": "魂牽夢縈", "def": "形容十分掛念、思念的樣子。縈，音ㄧㄥˊ，圍繞、纏繞。"}]}]}, {"lesson": "2上 第三課 土芭樂的生存之道", "themes": [{"title": "與「食物的滋味」有關的成語", "items": [{"w": "別有風味", "def": "形容食物味道美好，另有一種特色，不同尋常。"}, {"w": "味同嚼蠟", "def": "比喻沒有味道。"}, {"w": "味如雞肋", "def": "比喻沒有味道或少有實惠。"}, {"w": "津津有味", "def": "形容食欲盎然或食物的美味。"}, {"w": "美饌佳肴", "def": "美味精緻的食物。"}, {"w": "淡而無味", "def": "清淡而沒有味道。"}, {"w": "齒頰生香", "def": "吃了美味食品後，牙齒和兩頰逐漸感到香甜的味道。"}, {"w": "饌玉炊金", "def": "形容飲食的豐盛美味。"}]}, {"title": "與「生存」有關的成語", "items": [{"w": "化險為夷", "def": "轉化危險為平安。"}, {"w": "生死存亡", "def": "生存或亡歿。比喻情勢到了關鍵時刻。"}, {"w": "生機勃勃", "def": "形容充滿生氣活力，生命力旺盛。"}, {"w": "死裡逃生", "def": "從極危險中脫身。"}, {"w": "物競天擇", "def": "物種互相競爭，適應自然者則生存，不適者淘汰。"}, {"w": "苟延殘喘", "def": "勉強存續生命。"}, {"w": "貪生怕死", "def": "貪戀生存，害怕死亡。"}, {"w": "絕處逢生", "def": "在毫無辦法之下又得生路。"}]}, {"title": "與「水果」有關的成語", "items": [{"w": "李代桃僵", "def": "李樹代替桃樹受蟲咬而枯死，用以諷刺兄弟間不能互助互愛。後比喻以此代彼或代人受過。"}, {"w": "倒吃甘蔗", "def": "漸入佳境。意謂甘蔗愈近根部甜度愈高，故愈吃愈甜。"}, {"w": "望梅止渴", "def": "曹操率兵行軍至途中，士兵乾渴難耐，曹操就騙士兵前有梅林，梅子又酸又甜，誘使士兵流出口水以解渴的故事。後比喻用空想來安慰自己。"}, {"w": "橘化為枳", "def": "語本《晏子春秋．內篇．雜下》：「橘生淮南則為橘，生于淮北則為枳。」後比喻同樣的東西會因環境的不同而引起變化。枳，音ㄓˇ。"}]}]}, {"lesson": "2上 第四課 五柳先生傳", "themes": [{"title": "與「貧困」有關的成語", "items": [{"w": "一文不名", "def": "形容人非常窮困，一文錢都沒有。"}, {"w": "一貧如洗", "def": "形容一無所有，十分貧窮。"}, {"w": "入不敷出", "def": "收入少而支出多。"}, {"w": "三餐不繼", "def": "三餐無法接續。形容生活貧困，連吃飯都有一餐沒一餐的。"}, {"w": "安貧樂道", "def": "以信守道義為樂，而能安於貧困的處境。"}, {"w": "身無長物", "def": "長物，多餘的物品。後以身無長物比喻節儉或貧困。"}, {"w": "室如懸磬", "def": "指居室空無所有，比喻非常貧窮。磬，音ㄑㄧㄥˋ，古代矩形樂器。"}, {"w": "食不果腹", "def": "吃不飽。形容生活貧窮困苦。"}, {"w": "家徒四壁", "def": "家中只剩四面牆壁。形容家境貧困，一無所有。"}, {"w": "家無斗儲", "def": "家中沒有餘糧儲藏。形容生活極為貧窮困苦。"}, {"w": "捉襟見肘", "def": "形容人衣衫破敗。"}, {"w": "簞食瓢飲", "def": "語本《論語．雍也》：「賢哉！回也！一簞食，一瓢飲，在陋巷，人不堪其憂，回也不改其樂。」指顏回生活雖然清苦，卻依舊不改樂道的志趣。後用以比喻安貧樂道。"}, {"w": "簞瓢屢空", "def": "食具、水瓢裡經常空空的，此指飲食常常缺乏。簞，音ㄉㄢ，盛飯的圓形竹器。瓢，音ㄆㄧㄠˊ，舀水的器具。"}]}, {"title": "與「求知」有關的成語", "items": [{"w": "追根究柢", "def": "追查探究事物的根本。"}, {"w": "不求甚解", "def": "此指不拘泥字句，不鑽研無關緊要的問題。一般多指學習或工作的態度不認真，只求略懂皮毛而不深入理解。甚，過度。"}, {"w": "囫圇吞棗", "def": "把棗子整個吞下去，而不加咀嚼。比喻理解事物籠統含糊，或為學不求甚解。囫圇，音ㄏㄨˊ ㄌㄨㄣˊ。"}, {"w": "淺嘗輒止", "def": "稍微嘗試一下就停止了。比喻做事不澈底，不肯深入研究。輒，音ㄓㄜˊ，即、就。"}]}, {"title": "其他補充成語", "items": [{"w": "柳暗花明", "def": "比喻在曲折艱辛之後，忽然絕處逢生，另有一番情景。"}, {"w": "蒲柳之姿", "def": "比喻身體衰弱。"}, {"w": "酒酣耳熱", "def": "形容酒喝得意興正濃的暢快神態。"}, {"w": "光明磊落", "def": "形容心地坦蕩清白無私。"}, {"w": "行不由徑", "def": "走路不走捷徑。比喻行事光明正大，不投機取巧。"}, {"w": "臨危不亂", "def": "面臨危難時，仍然能夠冷靜思考，沉著應對。"}, {"w": "彬彬有禮", "def": "形容人的禮貌恰到好處，不至於矯情多禮，也不至於粗魯無禮。"}, {"w": "汲汲營營", "def": "本指匆匆往來的樣子。後多形容人急切求取名利的樣子。汲汲，勤求不休止的樣子；營營，追逐求取。"}, {"w": "嫉惡如仇", "def": "憎恨邪惡的人或事如同仇敵一般。"}, {"w": "潛移默化", "def": "人的思想、性格或習慣，受到環境或別人的影響，於不知不覺中起了變化。"}]}]}, {"lesson": "2上 第五課 田園之秋選", "themes": [{"title": "與「風、雨」有關的成語", "items": [{"w": "風和日麗", "def": "微風和煦，陽光明麗。形容天氣晴好。"}, {"w": "捕風捉影", "def": "比喻所做之事或所說的話毫無根據，憑空揣測。"}, {"w": "馬耳東風", "def": "比喻對事情漠不關心。"}, {"w": "未雨綢繆", "def": "鴟鴞在未下雨前，便已著手修補窩巢。比喻事先預備，防患未然。"}, {"w": "風雨如晦", "def": "風雨交加，天色昏暗，猶如黑夜。比喻處於險惡環境中也不改變其操守。"}, {"w": "櫛風沐雨", "def": "以風梳髮，以雨沐浴。比喻在外奔走，極為辛勞。櫛，音ㄐㄧㄝˊ，梳理。"}, {"w": "呼風喚雨", "def": "比喻人神通廣大、很有影響力。"}, {"w": "風起雲湧", "def": "大風起來，烏雲湧現。形容氣勢雄偉。"}, {"w": "風馳電掣", "def": "比喻快速。掣，音ㄔㄜˋ，疾速而過。"}, {"w": "雷厲風行", "def": "像打雷般猛烈，如颳風般快速。比喻執行政令嚴格迅速。"}]}, {"title": "與「雲」有關的成語", "items": [{"w": "浮雲朝露", "def": "浮雲易散，朝露易乾。比喻人生的短促。"}, {"w": "愁雲慘霧", "def": "色彩慘淡的雲霧。比喻淒涼，使人發愁的景象。"}, {"w": "撥雲見日", "def": "撥去烏雲，重見天日。比喻除去障礙，重見光明。"}, {"w": "過眼雲煙", "def": "比喻事物消逝極快，不留痕跡。"}, {"w": "平步青雲", "def": "比喻順利無阻，迅速晉升高位。"}]}, {"title": "與「雷、電」有關的成語", "items": [{"w": "電光石火", "def": "閃電呈現的亮光，火石擊發的火光。比喻轉瞬間即逝。"}, {"w": "目光如電", "def": "形容眼光湛然有神，似閃電一般。"}, {"w": "疾如雷電", "def": "快得如同雷響電閃一般。形容動作非常快速。"}, {"w": "晴天霹靂", "def": "陽光普照的晴朗天氣裡突然打起響雷。比喻突發的驚人事件。"}]}, {"title": "其他補充成語", "items": [{"w": "冰天雪地", "def": "形容氣候嚴寒。"}, {"w": "雪中送炭", "def": "比喻在人艱困危急之時，給予適時的援助。"}, {"w": "滄海桑田", "def": "大海變為陸地，陸地淪為大海。比喻世事無常，變化很快。"}]}, {"title": "成語充電站", "items": [{"w": "雷大雨小", "def": "比喻虛張聲勢。"}, {"w": "疾風迅雷", "def": "比喻事情發生得突然、迅速。"}, {"w": "如雷貫耳", "def": "比喻人名氣很大，眾所共聞。"}, {"w": "歡聲雷動", "def": "形容熱烈歡樂的場面。"}, {"w": "大發雷霆", "def": "比喻非常生氣。"}, {"w": "風平浪靜", "def": "比喻平靜或情勢穩定。"}, {"w": "瓦釜雷鳴", "def": "比喻平庸無才德的人卻居於顯赫。"}, {"w": "雨後春筍", "def": "比喻事物在某一時期後大量湧。"}]}]}, {"lesson": "2上 第六課 不要放棄你的夢想", "themes": [{"title": "與「積極、正向的處事態度」有關的成語", "items": [{"w": "持之以恆", "def": "有恆心的堅持到底。"}, {"w": "不屈不撓", "def": "不因為受阻礙而屈服。"}, {"w": "勇往直前", "def": "奮勇前進、無所畏懼。"}, {"w": "三思而行", "def": "反覆再三考慮，然後再做。"}, {"w": "當機立斷", "def": "抓住時機，立刻作出決斷。"}, {"w": "臨機應變", "def": "臨事能做適當的變通處置。"}, {"w": "優柔寡斷", "def": "行事猶豫不決，不能當機立斷。"}, {"w": "滴水穿石", "def": "水滴不斷的滴落，久了之後可將石頭穿透。用以比喻有志者事竟成，只要努力不懈就能夠成功。"}, {"w": "鍥而不捨", "def": "指不斷刻下去而不停止。比喻堅持到底，奮勉不懈。鍥，音ㄑㄧㄝˋ，鏤刻。"}, {"w": "劍及履及", "def": "春秋時楚莊王急於為大夫申舟報仇，一直到前院，僕人才追上他並送上鞋子，追到了寢門外，才送上佩劍。形容人行動果決、快速，而不拖泥帶水。"}]}, {"title": "與「消極、負面的處事態度」有關的成語", "items": [{"w": "裹足不前", "def": "停止腳步，不往前行。比喻有所顧忌，不願去做。"}, {"w": "按圖索驥", "def": "按照圖象尋求好馬。後比喻做事拘泥成法，呆板不知變通。"}, {"w": "閉門造車", "def": "按照一定的規格在家裡造車。後比喻凡事只憑主觀思想辦事，不問是否切合實際。"}, {"w": "知難而退", "def": "本指作戰時隨機應變，遇形勢不利則退卻。後泛指行事遇到困難退縮不前或應伺機退卻。"}, {"w": "一暴十寒", "def": "在陽光下暴晒一天，又接連冷凍十天。比喻人做事缺乏恆心，時常中斷。暴，音ㄆㄨˋ。"}, {"w": "一意孤行", "def": "謝絕一切請託，按照己意獨立處理公事。後多用作貶義詞，指某人不接受勸告，固執己見，獨斷獨行。"}]}, {"title": "其他補充成語", "items": [{"w": "舉一反三", "def": "指列舉一例而能曉喻其他各事。"}, {"w": "指桑罵槐", "def": "指著桑樹罵槐樹，比喻拐彎抹角的罵人。"}, {"w": "冠冕堂皇", "def": "表面上光明正大的樣子。亦形容表面莊嚴體面、高貴氣派的樣子。"}, {"w": "張冠李戴", "def": "把姓張的人的帽子誤戴到姓李的頭上。比喻名實不符或弄錯事情、對象。"}, {"w": "杞人憂天", "def": "古時杞國有個人，擔心天會塌下來，因而寢食難安。後比喻無謂的憂慮。"}, {"w": "李代桃僵", "def": "李樹代替桃樹受蟲咬而枯死，用以諷刺兄弟間不能互助互愛。後比喻以此代彼或代人受過。"}, {"w": "指鹿為馬", "def": "本指趙高獻給秦二世一隻鹿，故意指稱是馬，並問臣子是鹿或馬，而將答鹿者暗中殺害，使群臣畏懼自己，以謀篡位。後比喻顛倒是非。"}]}, {"title": "成語充電站", "items": [{"w": "堅定不移", "def": "專一固定，毫不動搖。"}, {"w": "堅忍不拔", "def": "形容意志堅定，不可動搖。"}, {"w": "心如鐵石", "def": "人意志堅定像鐵石般堅硬。"}, {"w": "傲雪凌霜", "def": "比喻雖處逆境，亦能堅定不移。"}, {"w": "虎頭蛇尾", "def": "比喻做事有始無終。"}, {"w": "三心二意", "def": "形容猶豫不決、意志不堅。"}, {"w": "朝三暮四", "def": "比喻心意不定、反覆無常。"}, {"w": "半途而廢", "def": "比喻事情還沒做完成就停止。"}, {"w": "舉棋不定", "def": "比喻做事猶豫不決，拿不定主意。"}]}]}, {"lesson": "2上 第七課 愛蓮說", "themes": [{"title": "與「植物」有關的成語", "items": [{"w": "蕙質蘭心", "def": "比喻女子芳潔的心地、高雅的品德。"}, {"w": "金蘭之交", "def": "情意相投的好朋友。"}, {"w": "望梅止渴", "def": "曹操率兵行軍至途中，士兵乾渴難耐，曹操就騙士兵前有梅林，梅子又酸又甜，誘使士兵流出口水以解渴的故事。後比喻用空想來安慰自己。"}, {"w": "梅妻鶴子", "def": "宋 林逋隱居於杭州 西湖 孤山，植梅養鶴以為伴，逍遙自在。因其無妻無子，故稱為「梅妻鶴子」。後比喻清高或隱居。"}, {"w": "梨花帶雨", "def": "形容美女的淚容，有如春天沾著雨的梨花。"}, {"w": "柳暗花明", "def": "比喻在曲折艱辛之後，忽然絕處逢生，另有一番情景。"}, {"w": "胸有成竹", "def": "畫竹之前，心中早已有了竹子的完整形象。比喻處事有定見。"}, {"w": "勢如破竹", "def": "比喻作戰或工作順利進行，毫無阻礙。"}, {"w": "雨後春筍", "def": "春筍在雨後長得又多又快。比喻事物在某一時期後大量湧現，迅速發展。"}, {"w": "指桑罵槐", "def": "指著桑樹罵槐樹。比喻拐彎抹角的罵人。槐，音ㄏㄨㄞˊ。"}, {"w": "芒刺在背", "def": "比喻因畏忌而極度不安。"}, {"w": "曇花一現", "def": "曇花，優曇婆羅華的簡稱，即無花果。印度傳說無花果只在聖王出世時才會開花。後多用於比喻人或事物一出現便迅速消失。曇，音ㄊㄢˊ。"}, {"w": "一葉知秋", "def": "比喻由局部的、細小的徵兆，可推知事物的演變和趨勢。"}, {"w": "三寸金蓮", "def": "舊稱婦女的纏足。"}, {"w": "百步穿楊", "def": "本指春秋時楚國的養由基能在百步內射中柳葉。後比喻射箭技術高超或技藝高強。"}]}, {"title": "與「品德」有關的成語", "items": [{"w": "才德兼備", "def": "兼具才華和品德。"}, {"w": "文質彬彬", "def": "文采和實質均備，配合諧調。"}, {"w": "玉潔冰清", "def": "如玉和冰一般純淨潔白。比喻人格高尚品行高潔。"}, {"w": "白璧無瑕", "def": "潔白玉上毫無瑕疵。比喻人或事的十全十美。"}, {"w": "光明磊落", "def": "形容心地坦蕩清白無私。"}, {"w": "高風亮節", "def": "高尚的品格，堅貞的氣節。"}, {"w": "同流合汙", "def": "隨世浮沉。後多指跟壞人一起做壞事。"}, {"w": "衣冠禽獸", "def": "空有外表而行同禽獸。比喻品德敗壞的人。"}, {"w": "狼心狗肺", "def": "比喻人心腸狠毒，毫無良心。"}, {"w": "狼狽為奸", "def": "狼與狽相互合作，傷害牲畜。比喻彼此勾結做壞事。"}, {"w": "笑裡藏刀", "def": "比喻外貌和善可親，內心卻陰險。"}, {"w": "趨炎附勢", "def": "比喻依附權勢。炎，指有權勢的人。"}]}, {"title": "其他補充成語", "items": [{"w": "曲高和寡", "def": "曲調愈高深，則能與之唱和者愈少。比喻言行卓越不凡，知音難求或作品艱深高妙，賞識者很少。"}, {"w": "亭亭玉立", "def": "形容女子體態秀麗的樣子。"}, {"w": "屢見不鮮", "def": "常常見到，並不新奇。"}]}, {"title": "成語充電站", "items": [{"w": "舌粲蓮花", "def": "形容口才好。"}, {"w": "明日黃花", "def": "指在重陽節欣賞菊花最能景與情。"}, {"w": "出水芙蓉", "def": "形容文章清新可愛或女子嬌柔清麗。"}, {"w": "空谷幽蘭", "def": "生長在深谷中的蘭花。比喻人品。"}]}]}, {"lesson": "2上 第八課 鳥", "themes": [{"title": "與「鳥」有關的成語", "items": [{"w": "鳥盡弓藏", "def": "飛鳥射盡之後，就收起弓箭不用。比喻天下平定之後便遺棄功臣。"}, {"w": "鳥語花香", "def": "鳥兒歌唱，花開芬芳。形容景色的美好。"}, {"w": "小鳥依人", "def": "形容女子或小孩依傍他人的嬌弱可愛模樣。"}, {"w": "倦鳥知返", "def": "比喻人長久在外奔波流浪，心生倦意，想要回家。"}, {"w": "一石二鳥", "def": "用一塊石頭同時打下兩隻鳥。比喻做一件事獲得兩種效果。"}, {"w": "池魚籠鳥", "def": "比喻身遭拘禁，失去自由。"}, {"w": "驚弓之鳥", "def": "魏國射箭能手更羸僅是拉動弓弦，不用箭，一隻受過箭傷的大雁便因過度驚懼而落下的故事。比喻曾受打擊或驚嚇，心有餘悸，稍有動靜就害怕的人。"}]}, {"title": "與「飛」有關的成語", "items": [{"w": "飛黃騰達", "def": "比喻得意於仕途。飛黃，神馬名。騰達，形容馬的飛馳。"}, {"w": "飛蛾撲火", "def": "比喻自尋死路、自取滅亡。"}, {"w": "灰飛煙滅", "def": "像灰、煙般的消逝。比喻完全消失殆盡。"}, {"w": "突飛猛進", "def": "急速飛騰，猛烈的向前躍進。比喻發展進步得很快。"}, {"w": "鳶飛魚躍", "def": "鳶，老鷹。鳶飛魚躍指鷹在天空飛翔，魚在水中騰躍。比喻萬物任其天性而動，各得其所。"}, {"w": "神采飛揚", "def": "活力充沛，神色自得的樣子。"}, {"w": "口沫橫飛", "def": "唾液四處飛散。形容人放情談論。"}, {"w": "健步如飛", "def": "形容人步行的速度像飛行一般快速。"}, {"w": "勞燕分飛", "def": "伯勞和燕子離散分飛。比喻別離，而多用於夫妻、情人之間。"}, {"w": "運筆如飛", "def": "形容寫作或繪畫的速度很快。"}]}, {"title": "其他補充成語", "items": [{"w": "可見一斑", "def": "由事情的某一點可推論其全貌。"}, {"w": "危機四伏", "def": "到處隱藏著危險。"}, {"w": "玲瓏剔透", "def": "形容器物精巧細緻，雕工完美。"}, {"w": "珠圓玉潤", "def": "像珠子一般渾圓，像玉石一般溫潤。後用以比喻文詞圓熟或歌聲圓潤。"}, {"w": "魚沉雁杳", "def": "比喻音訊斷絕。"}, {"w": "意氣風發", "def": "形容精神振奮，志氣昂揚的樣子。"}, {"w": "搖曳生姿", "def": "姿態閑雅，婀娜多姿的樣子。"}, {"w": "器宇軒昂", "def": "形容人的神采奕奕，氣度不凡。"}]}, {"title": "成語充電站", "items": [{"w": "籠鳥檻猿", "def": "籠中鳥，檻中猿。比喻人不自由。"}]}]}, {"lesson": "2上 第九課 我在圖書館的一天", "themes": [{"title": "與「建築物」有關的成語", "items": [{"w": "美輪美奐", "def": "形容房屋裝飾得極為華美。"}, {"w": "金碧輝煌", "def": "形容裝飾華彩絢爛。多指宮殿等建築物。"}, {"w": "瓊樓玉宇", "def": "形容精美華麗的樓閣。亦用以指月宮或神仙住的地方。"}, {"w": "高樓大廈", "def": "高大堂皇的建築物。廈，音ㄒㄧㄚˋ。"}, {"w": "斷垣殘壁", "def": "毀壞倒塌的牆。形容建築物倒塌殘破的景象。"}, {"w": "鱗次櫛比", "def": "像魚鱗和梳齒那樣相次排列。形容建築物排列的密集。"}, {"w": "拔地而起", "def": "形容山峰、植物、建築物等從地面突兀而起，非常高聳、陡峭。"}]}, {"title": "與「讀書」有關的成語", "items": [{"w": "焚膏繼晷", "def": "指燃燒燈燭一直到白天日光出現。形容夜以繼日的勤讀不怠。膏，油脂，指燈燭。晷，音ㄍㄨㄟˇ，日影、日光。"}, {"w": "映雪囊螢", "def": "形容人在艱困的環境中勤奮讀書。映雪指晉 孫康夜晚利用雪光照明讀書的故事。囊螢指車胤借螢火亮光讀書的故事。"}, {"w": "博覽群書", "def": "形容人閱讀廣博，學識豐富。"}, {"w": "廢書而嘆", "def": "讀書時心有所感而輟讀興嘆。"}, {"w": "開卷有益", "def": "打開書本閱讀，即能得好處。"}, {"w": "不求甚解", "def": "讀書著重理解義理，而不過度鑽研字句上的解釋。後多指學習或工作的態度不認真，只求略懂皮毛而不深入理解。"}, {"w": "兩腳書櫥", "def": "比喻死讀書，不知活用的人。"}, {"w": "目不知書", "def": "不會讀書寫文章。"}]}, {"title": "與「意志」有關的成語", "items": [{"w": "雄心壯志", "def": "遠大的志向和抱負。"}, {"w": "心慵意懶", "def": "意志消沉，精神萎靡。"}, {"w": "興致勃勃", "def": "形容興趣濃厚。勃勃，旺盛的樣子。"}, {"w": "委靡不振", "def": "形容頹喪消沉，沒有精神。"}]}, {"title": "與「態度」有關的成語", "items": [{"w": "正襟危坐", "def": "整理服裝儀容，端正的坐好。形容莊重嚴肅的樣子。"}, {"w": "鄭重其事", "def": "處理事物的態度嚴肅認真。"}, {"w": "油腔滑調", "def": "寫文章或言語態度浮滑，不切實。"}, {"w": "搖頭晃腦", "def": "頭搖來搖去。形容自以為是或自得其樂。"}]}, {"title": "其他補充成語", "items": [{"w": "門庭若市", "def": "門庭間來往的人很多，像市集一般熱鬧。比喻上門來的人很多。"}, {"w": "升堂入室", "def": "比喻學問或技藝循序漸進，達到高深的境界。"}, {"w": "近水樓臺", "def": "指因接近某些人或事物而得到優先方便獲利的機會。"}, {"w": "宮牆外望", "def": "比喻未能得師門真傳，不能領略師學之美。宮牆，比喻師門。"}, {"w": "海市蜃樓", "def": "比喻虛幻的景象或事物。"}]}, {"title": "成語充電站", "items": [{"w": "牛角掛書", "def": "比喻勤勉讀書。"}, {"w": "書香門第", "def": "世代讀書的人家。"}, {"w": "書富五車", "def": "形容人書讀很多，學問淵博。"}, {"w": "蠅頭細書", "def": "如蠅頭般細小的字或用小字寫成。"}, {"w": "知書達禮", "def": "熟讀詩書，懂得禮節。比喻人有。"}]}]}, {"lesson": "2上 第十課 拆牆", "themes": [{"title": "與「牆」有關的成語", "items": [{"w": "兄弟鬩牆", "def": "指兄弟失和爭吵。鬩，音ㄒ一ˋ，爭吵。"}, {"w": "朽木糞牆", "def": "比喻不可收拾的局面或不堪造就的人。"}, {"w": "狗急跳牆", "def": "比喻走投無路時，不顧後果的冒險，只求一條生路。"}, {"w": "禍起蕭牆", "def": "比喻災禍或災難發生於內部。蕭牆，屏障大門的牆壁，比喻內部。"}, {"w": "銅牆鐵壁", "def": "用銅、鐵造成的牆壁。比喻防禦工程非常堅固嚴密，難以摧毀。"}, {"w": "騎牆之見", "def": "比喻心存觀望，態度立場模稜兩可。"}]}, {"title": "與「報恩」、「忘恩」有關的成語", "items": [{"w": "忘恩負義", "def": "受人恩惠而不知報答，反而做出對不起恩人的事情。"}, {"w": "感恩圖報", "def": "感激他人的恩德而設法報答。"}, {"w": "一飯千金", "def": "淮陰侯 韓信未得志時，曾受漂母贈飯療飢，後來以千金為報。後遂以一飯千金比喻報恩隆厚。"}, {"w": "結草銜環", "def": "比喻生前受恩死後圖報。結草，指魏顆救父妾，而獲老人結草禦敵的故事。銜環，指楊寶救一隻黃雀，後得黃衣童子以四枚白環相報的故事。"}, {"w": "過河拆橋", "def": "一種戰術。渡過了河就把橋拆掉。比喻不念舊情，忘恩負義。"}]}, {"title": "與「人際關係」有關的成語", "items": [{"w": "投桃報李", "def": "你送桃子，我回贈以李子。後用以比喻彼此間的贈答。"}, {"w": "禮尚往來", "def": "指別人以禮相待，也要以禮回報。尚，注重。"}, {"w": "不共戴天", "def": "不願與仇人共生世間。"}, {"w": "水火不容", "def": "比喻互相對立，不能相容。"}]}, {"title": "與「幫助」有關的成語", "items": [{"w": "愛莫能助", "def": "本指隱而不見，所以無法給予幫助。後指內心雖然同情，想要幫助他，卻無能為力。"}, {"w": "心餘力絀", "def": "心有餘，力不足。心裡很想做，能力不夠，無法做到。絀，音ㄔㄨˋ，不足、短缺。"}, {"w": "拔刀相助", "def": "出力幫助。"}, {"w": "以鄰為壑", "def": "戰國時白圭築堤治水，將本國氾濫的洪水排入鄰國，把其當成洩洪的水泊。比喻損人利己。"}]}, {"title": "其他補充成語", "items": [{"w": "尸位素餐", "def": "占著職位享受俸祿而不做事。"}, {"w": "面有菜色", "def": "面容如菜色般青黃。形容人營養不良，臉色不佳。"}, {"w": "琴瑟和鳴", "def": "比喻夫妻情感和諧融洽。"}, {"w": "順藤摸瓜", "def": "順著瓜藤可以摸到瓜。比喻沿著線索追究，可以得到結果。"}]}, {"title": "成語充電站", "items": [{"w": "紅杏出牆", "def": "比喻已婚婦女有外遇。"}, {"w": "隔牆有耳", "def": "比喻說祕密時，要防備有人偷聽。"}, {"w": "門牆桃李", "def": "比喻師長所栽培的後輩或所教的。"}, {"w": "糞土之牆不可杇", "def": "比喻劣質之物，難以造。"}, {"w": "牆倒眾人推", "def": "比喻人若一旦失勢，則眾人皆。"}, {"w": "牆裡開花牆外香", "def": "比喻成就不受本地重視，。"}]}]}, {"lesson": "2上 自學一 世說新語選", "themes": [{"title": "與「雞」有關的成語", "items": [{"w": "雞犬升天", "def": "淮南王 劉安得道升天，雞犬吃了剩下的仙藥，也隨之升天。後比喻一個人發達得勢，左右有關係的人也跟著發跡。"}, {"w": "雞鳴狗盜", "def": "戰國時秦昭王囚孟嘗君，打算加以殺害。孟嘗君的門客，一個裝狗入秦宮偷狐白裘，另一個學雞叫使函谷關關門早開，孟嘗君因此而脫難。後以比喻有某種卑下技能的人，或指卑微的技能。"}, {"w": "嫁雞隨雞", "def": "傳統禮教認為女性婚後，不論丈夫好壞，都要從一而終。"}, {"w": "聞雞起舞", "def": "晉代 祖逖，半夜聞雞啼，立即起床操練武藝的故事。後用以比喻及時奮起行動。"}, {"w": "味如雞肋", "def": "味兒與雞的肋骨一樣無味。比喻沒有味道或少有實惠。"}, {"w": "牛鼎烹雞", "def": "用烹牛的鼎煮雞。比喻大器小用。"}, {"w": "呆若木雞", "def": "愚笨或受驚嚇而發愣的樣子。"}, {"w": "鶴立雞群", "def": "鶴站在雞群之中，非常突出。比喻人的才能超群出眾，不同凡俗。"}]}, {"title": "與「誠信」有關的成語", "items": [{"w": "一諾千金", "def": "形容承諾信用高，一旦許諾別人，必定做到。"}, {"w": "出爾反爾", "def": "你怎麼對待別人，別人也會怎麼待你。後指人的言行前後反覆，自相矛盾。"}, {"w": "言而無信", "def": "說話不講信用。"}, {"w": "輕諾寡信", "def": "隨便答應他人的請求，往往難以實踐諾言。"}]}, {"title": "與「生氣」、「冷靜」有關的成語", "items": [{"w": "勃然大怒", "def": "忿怒的樣子。"}, {"w": "面紅耳赤", "def": "形容因高溫、羞愧、焦急或發怒時而臉上、耳朵發紅的樣子。"}, {"w": "氣急敗壞", "def": "上氣不接下氣，狼狽不堪的樣子。常用以形容慌張或惱怒的樣子。"}, {"w": "暴跳如雷", "def": "跳腳怒吼，如同打雷一般。形容人急怒的樣子。"}, {"w": "平心靜氣", "def": "形容心情平和，態度冷靜。"}]}, {"title": "與「慌張」、「沉著」有關的成語", "items": [{"w": "惶惶無措", "def": "慌張失措。"}, {"w": "戰戰兢兢", "def": "因畏懼而顫抖。形容戒懼謹慎的樣子。"}, {"w": "兢兢業業", "def": "形容謹肅恐懼，認真小心。"}, {"w": "泰然自若", "def": "形容遇到緊急或危難的情況時，仍能沉著鎮定而不驚惶失措。"}]}, {"title": "其他補充成語", "items": [{"w": "一言九鼎", "def": "形容說話很有分量。"}, {"w": "所託非人", "def": "把事情委託給不適當的人。"}, {"w": "愛莫能助", "def": "本指隱而不見，所以無法給予幫助。後指內心雖然同情，想要幫助他，卻無能為力。"}]}, {"title": "成語充電站", "items": [{"w": "東床快婿", "def": "比喻好女婿。"}, {"w": "標新立異", "def": "創立新奇的名目或主張，以表示。"}, {"w": "望梅止渴", "def": "比喻用空想來安慰自己。"}, {"w": "東山再起", "def": "指官員退職後，再度出仕。今亦。"}, {"w": "拾人牙慧", "def": "比喻蹈襲他人的言論或主張。"}, {"w": "自慚形穢", "def": "比喻自愧不如。"}, {"w": "代人捉刀", "def": "比喻代人做事，多指寫文章而言。"}, {"w": "割席分坐", "def": "比喻和朋友絕交。"}, {"w": "應接不暇", "def": "形容美景繁多，令人目不暇給。後。"}, {"w": "七步成詩", "def": "形容運思敏捷，有才氣。"}, {"w": "登峰造極", "def": "比喻達到極點或造詣高深精絕。"}, {"w": "管中窺豹", "def": "比喻所見狹小，未得全貌。"}, {"w": "口若懸河", "def": "比喻說話滔滔不絕，能言舌辯。"}, {"w": "一往情深", "def": "指人情感深厚、真摯，一旦投入，。"}, {"w": "咄咄逼人", "def": "指盛氣凌人，使人驚懼。"}]}]}, {"lesson": "2上 自學二 定伯賣鬼", "themes": [{"title": "與「鬼」有關的成語", "items": [{"w": "鬼使神差", "def": "形容事情非常湊巧，好像暗中有鬼神支配一般。"}, {"w": "鬼斧神工", "def": "形容技藝精巧，非人力所能及。"}, {"w": "鬼哭狼號", "def": "形容悲慘恐怖的聲音。"}, {"w": "鬼影幢幢", "def": "形容陰森恐怖的樣子。"}, {"w": "引鬼上門", "def": "比喻把壞人引進來。"}, {"w": "牛鬼蛇神", "def": "泛指各種奇形怪狀的鬼神。比喻形形色色的壞人。牛鬼，神話傳說中陰間的牛頭鬼卒。蛇神，傳說中人面蛇身之神。"}, {"w": "各懷鬼胎", "def": "比喻各自藏著不可告人的念頭、算計。"}, {"w": "神出鬼沒", "def": "形容行動快速，變化莫測。"}, {"w": "裝神弄鬼", "def": "指玩弄手段或花樣來欺騙他人。"}, {"w": "疑神疑鬼", "def": "形容內心多疑。"}]}, {"title": "與「古代重量單位」有關的成語", "items": [{"w": "千鈞一髮", "def": "用一根頭髮綁住千鈞重的東西。比喻非常危險。"}, {"w": "半斤八兩", "def": "半斤和八兩輕重相當。比喻彼此不相上下。"}, {"w": "偷斤減兩", "def": "以少報多、以輕報重的不實行徑。亦比喻不依規定行事。"}, {"w": "雷霆萬鈞", "def": "比喻威力強大，無法抗拒。"}, {"w": "錙銖必較", "def": "斤斤計較。"}]}, {"title": "與「應變能力」有關的成語", "items": [{"w": "因時制宜", "def": "根據不同時期的情況，採取合宜的措施應對。"}, {"w": "見風轉舵", "def": "比喻隨機應變，視情況而行動。"}, {"w": "見機行事", "def": "視情況變化而採因應之道。"}, {"w": "急中生智", "def": "在緊急狀況下猛然想出了應付的方法。"}, {"w": "通權達變", "def": "不墨守常規，而根據實際情況，作適當的處置。"}, {"w": "趁風揚帆", "def": "隨機應變。"}, {"w": "刻舟求劍", "def": "楚人過江，劍掉水中，便於船舷刻一記號，待船停止，從刻記號處下水尋劍的故事。後用以比喻拘泥固執，不知變通。"}]}, {"title": "其他補充成語", "items": [{"w": "一成不變", "def": "刑罰一經執行，犯人或死或傷的事實，絕不可改變。引申為事物一經形成，即不易改變。後多用來比喻墨守成規，不知變通。"}, {"w": "秀外慧中", "def": "形容女子容貌清秀，內心聰慧。"}, {"w": "過目不忘", "def": "形容記憶力很強，看過後不易忘記。"}]}, {"title": "成語充電站", "items": [{"w": "鬼話連篇", "def": "滿嘴胡言亂語。"}, {"w": "鬼鬼祟祟", "def": "行事不光明的樣子。"}, {"w": "鬼哭神號", "def": "形容悲慘恐怖的聲音。"}, {"w": "鬼頭鬼腦", "def": "形容精靈狡猾或行事鬼祟的樣。"}, {"w": "神鬼莫測", "def": "鬼神都無法預知、測度。形容極。"}]}]}, {"lesson": "2上 自學三 買春聯", "themes": [{"title": "與「寫字、寫作」有關的成語", "items": [{"w": "力透紙背", "def": "寫字運筆的力量能穿透紙張到達紙的另一面。形容寫字、畫畫筆力遒勁有力。"}, {"w": "入木三分", "def": "晉朝 王羲之書祝版，工人削版，墨跡透入木板三分的故事。本形容筆力遒勁。後比喻評論深刻中肯或描寫精到生動。"}, {"w": "洛陽紙貴", "def": "晉代 左思寫成〈三都賦〉後，時人競相傳寫，使洛陽的紙價上漲而昂貴。後比喻著作風行一時，流傳甚廣。"}, {"w": "臨池學書", "def": "相傳東漢 張芝學習書法很勤，家中衣帛都被寫上字，然後再煮白。他在池邊學書法，池水都被染黑了。後人稱學習書法為「臨池學書」。"}, {"w": "煮字療飢", "def": "指賣文維生。"}, {"w": "揮灑自如", "def": "隨意寫作詩文或書畫，不受拘束。"}, {"w": "舞文弄墨", "def": "指玩弄法條作弊，敗壞法紀。後比喻賣弄筆墨文辭。"}]}, {"title": "與「比較」有關的成語", "items": [{"w": "一較高下", "def": "互相較量以分出勝負、優劣。"}, {"w": "不分軒輊", "def": "相比較的結果，分不出高下。"}, {"w": "平分秋色", "def": "形容二者一樣出色，分不出高下。"}, {"w": "判若雲泥", "def": "比喻相差極為懸殊。"}]}, {"title": "與「生命力」有關的成語", "items": [{"w": "生意盎然", "def": "形容充滿生機，生命力旺盛。"}, {"w": "栩栩如生", "def": "形容貌態逼真，彷彿具有生命力。"}, {"w": "躍然紙上", "def": "活躍的呈現於紙上。形容描寫得非常生動逼真。"}]}, {"title": "其他補充成語", "items": [{"w": "別出心裁", "def": "獨出巧思，不同流俗。"}, {"w": "招財進寶", "def": "招來財氣，以發財致富。"}, {"w": "光耀門楣", "def": "光彩照耀家門，使家人覺得光榮。"}, {"w": "神仙眷屬", "def": "比喻婚姻美滿、感情和睦的夫婦。"}, {"w": "嶄露頭角", "def": "比喻顯示特出的才華或本領。"}, {"w": "酣暢淋漓", "def": "極為暢達痛快的樣子。"}, {"w": "追根究柢", "def": "追查探究事物的根本。"}, {"w": "糊里糊塗", "def": "形容人行事極為迷糊或不明道理。"}, {"w": "奴顏媚骨", "def": "卑躬屈膝，奉承諂媚的樣子。"}, {"w": "音容宛在", "def": "人的聲音與容貌彷若在眼前，多用於弔唁之詞。"}, {"w": "蜂擁而上", "def": "比喻如蜂般簇擁上來。"}, {"w": "力排眾議", "def": "為維持自己的意見，竭力排除各種不同的議論。"}]}, {"title": "成語充電站", "items": [{"w": "筆走龍蛇", "def": "比喻文筆揮灑自如或書法優美。"}, {"w": "跌宕遒麗", "def": "形容文詞或書法豪放不羈，剛勁。"}, {"w": "鐵畫銀鉤", "def": "形容筆畫如鐵般的剛勁，如銀般。"}, {"w": "揮翰成風", "def": "形容寫字或繪畫極為快速和熟。"}, {"w": "龍飛鳳舞", "def": "形容筆勢生動活潑，後亦用來謔。"}, {"w": "矯若驚龍", "def": "形容筆勢、舞姿等的伸縮、騰轉，。"}, {"w": "筆力萬鈞", "def": "形容書法筆畫蒼勁有力。或形容。"}]}]}, {"lesson": "2下 第一課 一棵開花的樹", "themes": [{"title": "與「花」有關的成語", "items": [{"w": "花好月圓", "def": "比喻人事美好圓滿。常用於新婚祝頌之詞。"}, {"w": "花枝招展", "def": "比喻女子打扮美麗、婀娜多姿的樣子。"}, {"w": "花容月貌", "def": "形容女子容貌美好。"}, {"w": "花團錦簇", "def": "形容五彩繽紛、繁華美麗的樣子。簇，音ㄘㄨˋ。"}, {"w": "天花亂墜", "def": "形容說話言詞巧妙，有聲有色，非常動聽。多指誇大而不切實際。"}, {"w": "心花怒放", "def": "形容心情像盛開的花朵般舒暢快活。"}, {"w": "借花獻佛", "def": "比喻借用他人的東西來作人情。"}, {"w": "落花流水", "def": "形容零落殘敗，亂七八糟的景象。"}, {"w": "曇花一現", "def": "比喻人或事物一出現便迅速消失。曇，音ㄊㄢˊ。"}, {"w": "鏡花水月", "def": "比喻空幻不實在。"}, {"w": "柳暗花明", "def": "比喻在曲折艱辛之後，忽然絕處逢生，另有一番情景。"}, {"w": "人面桃花", "def": "比喻男子思念的意中人或與意中人無緣再相見。"}, {"w": "火樹銀花", "def": "形容燈火通明，燈光燦爛的景象。"}, {"w": "舌粲蓮花", "def": "形容口才好。"}, {"w": "妙筆生花", "def": "文思俊逸，寫作能力特強。或稱譽文章佳妙。"}, {"w": "走馬看花", "def": "比喻略觀事物外象，而不究其底蘊。"}, {"w": "明日黃花", "def": "比喻過時的事物。"}, {"w": "錦上添花", "def": "比喻美上加美，喜上加喜。"}, {"w": "霧裡看花", "def": "比喻看不清楚事情的真相。"}, {"w": "鐵樹開花", "def": "比喻事物罕見或極難實現。"}]}, {"title": "與「樹」有關的成語", "items": [{"w": "樹大招風", "def": "比喻個人名聲太大，容易招來妒嫉毀謗。"}, {"w": "獨樹一格", "def": "比喻自成一家，擁有獨自的品味和風格。"}, {"w": "百年樹人", "def": "形容培育人才的不容易。"}]}, {"title": "其他補充成語", "items": [{"w": "人多勢眾", "def": "人多勢力就大。"}, {"w": "入木三分", "def": "比喻評論深刻中肯或描寫精到生動。"}, {"w": "風吹草動", "def": "比喻輕微的動靜、變化。"}, {"w": "格格不入", "def": "彼此牴觸，不相調和。"}, {"w": "動人心弦", "def": "感人至為深切，引起觀聽人的共鳴。"}, {"w": "眾望所歸", "def": "深得眾人擁護、愛戴。"}, {"w": "弦外之音", "def": "比喻言外之意。"}, {"w": "分庭抗禮", "def": "比喻平起平坐，地位相當。"}, {"w": "歸心似箭", "def": "形容回家的心意非常迫"}]}, {"title": "與「愛情堅貞」有關的成語", "items": [{"w": "情之所鍾", "def": "情感所專注的。"}, {"w": "白頭偕老", "def": "形容夫妻恩愛到老。"}, {"w": "山盟海誓", "def": "對著山、海盟誓，以示堅定永久。多用以表示愛情的真誠不變。"}, {"w": "雙宿雙飛", "def": "本指鳥類雌雄相隨，後用來比喻男女因情深而起居相依，形影不離。"}, {"w": "海枯石爛", "def": "海水枯乾，石頭風化粉碎。形容經歷時間長久。後多用以表示意志堅定，永久不變的盟誓之詞。"}]}, {"title": "與「期待、盼望」有關的成語", "items": [{"w": "懸懸而望", "def": "形容非常盼望、掛念。"}, {"w": "眼穿腸斷", "def": "形容盼望渴切，傷心極了。"}, {"w": "望穿秋水", "def": "形容盼望的深切，同「望眼欲穿」。"}, {"w": "朝思暮想", "def": "白天晚上都在想念。形容思念極深。"}, {"w": "翹首引領", "def": "抬起頭，伸長脖子遠望。形容盼望殷切。"}, {"w": "夢寐以求", "def": "睡夢中都在尋找、追求。形容願望強烈、迫切。"}, {"w": "拭目以待", "def": "擦亮眼睛等待著。比喻期待事情的發展及結果。"}]}, {"title": "與「失落、失望」有關的成語", "items": [{"w": "大失所望", "def": "非常失望。"}, {"w": "心灰意冷", "def": "心情失望，意志消沉。"}, {"w": "垂頭喪氣", "def": "形容失意沮喪的樣子。"}, {"w": "悵然若失", "def": "神志迷惘，若有所失的樣子。"}, {"w": "萬念俱灰", "def": "所有念頭全化成了灰。比喻心灰意冷。"}, {"w": "槁木死灰", "def": "形容人因遭受挫折變故而灰心絕望的樣子。"}]}, {"title": "詠嘆愛情的千古名句", "items": [{"w": "死生契闊，與子成說。執子之手，與子偕老。（《詩經．邶風．擊鼓》）", "def": ""}, {"w": "天長路遠魂飛苦，夢魂不到關山難。長相思，摧心肝。（李白〈長相思〉其一）", "def": ""}, {"w": "還君明珠雙淚垂，恨不相逢未嫁時。（張籍〈節婦吟〉）", "def": ""}, {"w": "曾經滄海難為水，除卻巫山不是雲。（元稹〈離思〉其四）", "def": ""}, {"w": "在天願作比翼鳥，在地願為連理枝。（白居易〈長恨歌〉）", "def": ""}, {"w": "春蠶到死絲方盡，蠟炬成灰淚始乾。（李商隱〈無題〉）", "def": ""}, {"w": "得成比目何辭死，願作鴛鴦不羨仙。（盧照鄰〈長安古意〉）", "def": ""}, {"w": "衣帶漸寬終不悔，為伊消得人憔悴。（柳永〈蝶戀花〉）", "def": ""}, {"w": "天涯地角有窮時，只有相思無盡處。（晏殊〈玉樓春〉）", "def": ""}, {"w": "淚眼問花花不語，亂紅飛過秋千去。（歐陽脩〈蝶戀花〉其一）", "def": ""}, {"w": "兩情若是久長時，又豈在朝朝暮暮？（秦觀〈鵲橋仙〉）", "def": ""}, {"w": "恨人間，情是何物，直教生死相許。（元好問〈摸魚兒〉其一）", "def": ""}]}]}, {"lesson": "2下 第二課 樂府詩選——木蘭詩", "themes": [{"title": "與「戰爭」、「軍事」有關的成語", "items": [{"w": "所向披靡", "def": "比喻力量所到之處，敵人紛紛潰退。"}, {"w": "勢如破竹", "def": "比喻作戰或工作順利進行，毫無阻礙。"}, {"w": "旌旗蔽空", "def": "軍容壯盛的樣子。旌，音ㄐㄧㄥ。"}, {"w": "潰不成軍", "def": "指軍隊潰敗得不成個軍隊。形容遭到慘敗。"}, {"w": "節節敗退", "def": "因戰場上失利而不斷向後撤退。後泛指連連失利。"}, {"w": "兵馬倥傯", "def": "兵荒馬亂。倥傯，音ㄎㄨㄥˇ ㄗㄨㄥˇ。"}, {"w": "兵荒馬亂", "def": "形容戰爭所造成的混亂景象。"}, {"w": "兵連禍結", "def": "接連用兵，戰禍不絕。"}, {"w": "厲兵秣馬", "def": "磨利兵器，餵飽馬匹。指完成作戰準備。秣，音ㄇㄛˋ。"}, {"w": "嚴陣以待", "def": "預先做好嚴整的陣勢，準備迎擊來犯的敵人。比喻事先做好萬全的準備。"}, {"w": "解甲歸田", "def": "脫下鎧甲，回家種田。指軍人退伍後回鄉務農。"}, {"w": "投筆從戎", "def": "指棄文從軍以衛國建功。"}]}, {"title": "與「功績」有關的成語", "items": [{"w": "不世之功", "def": "世所罕有的功績。"}, {"w": "功成不居", "def": "建立了功勞而不歸功於自己。"}, {"w": "功成名就", "def": "事業有所成就，而且有名望。"}, {"w": "前功盡棄", "def": "將以往辛苦建立的功勞，全部廢棄。"}, {"w": "垂裕後昆", "def": "為後世子孫留下財富或功績。"}, {"w": "歌功頌德", "def": "歌頌功績和恩德。"}, {"w": "論功行賞", "def": "依據功績的大小，給予賞賜。"}, {"w": "戴罪立功", "def": "以有罪過之身去建立功勞，將功折罪。"}]}, {"title": "其他補充成語", "items": [{"w":
