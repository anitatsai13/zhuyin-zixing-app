 "一決雌雄", "def": "比喻互相較量以決定勝敗、高下。"}, {"w": "太平盛世", "def": "天下安定，國家興盛的時代。"}, {"w": "自出機杼", "def": "比喻詩文的組織、構思，別出心裁，獨創新意。"}, {"w": "衣錦還鄉", "def": "形容人功成名就後榮歸故鄉。"}, {"w": "別出心裁", "def": "獨出巧思，不同流俗。"}, {"w": "所向無敵", "def": "形容力量強大，銳不可擋。"}, {"w": "拾人牙慧", "def": "比喻蹈襲他人的言論或主張。"}, {"w": "撲朔迷離", "def": "形容事物錯綜複雜，難以明瞭真相。"}, {"w": "整裝待發", "def": "整理行囊、用具，準備出發。"}, {"w": "獨具匠心", "def": "具有獨創性的想法、構思。"}]}]}, {"lesson": "2下 第三課 情緒是生命的指引", "themes": [{"title": "與「情緒」有關的成語", "items": [{"w": "樂不可支", "def": "形容快樂到了極點。"}, {"w": "喜上眉梢", "def": "喜悅之情流露於眉宇之間。"}, {"w": "心花怒放", "def": "形容心情像盛開的花朵般舒暢快活。"}, {"w": "喜怒無常", "def": "情緒變化不定，令人難以捉摸。"}, {"w": "目眥盡裂", "def": "形容怒目而視。眥，眼眶。"}, {"w": "義憤填膺", "def": "指胸中充滿因正義而激起的憤怒。"}, {"w": "怒髮衝冠", "def": "憤怒得頭髮直豎頂起帽子。形容盛怒的樣子。"}, {"w": "抑鬱寡歡", "def": "憂愁煩悶、不快樂的樣子。"}, {"w": "愁眉不展", "def": "雙眉緊鎖，很憂愁的樣子。"}, {"w": "悲不自勝", "def": "形容極度悲傷而無法承受。"}, {"w": "心曠神怡", "def": "心情開朗，精神愉悅。"}, {"w": "眉飛色舞", "def": "形容非常喜悅得意的神情。"}, {"w": "欣喜若狂", "def": "形容快樂、高興到了極點。"}, {"w": "手舞足蹈", "def": "手、腳舞動跳躍。形容非常高興喜悅的樣子。"}, {"w": "肝腸寸斷", "def": "比喻悲傷到了極點。"}, {"w": "黯然神傷", "def": "心情沮喪，神色憂傷。"}, {"w": "心如刀割", "def": "心像被刀割一樣。比喻極度痛苦。"}, {"w": "淚流滿面", "def": "淚水布滿整個臉龐。形容非常傷心。"}, {"w": "愁腸百結", "def": "憂愁纏結在腹中。比喻憂愁無從排解。"}]}, {"title": "與「指引、引導」有關的成語", "items": [{"w": "循循善誘", "def": "指循序漸進的誘導。"}, {"w": "誨人不倦", "def": "耐心教導人而不知倦怠。"}, {"w": "言傳身教", "def": "用言語和行動來教示他人。"}, {"w": "春風化雨", "def": "比喻師長和藹親切的教育。"}, {"w": "引人入勝", "def": "引領人進入美麗玄妙的境地。"}, {"w": "因勢利導", "def": "順著事物發展的趨勢加以引導。"}, {"w": "耳提面命", "def": "耳提，揪著對方耳朵提醒；面命，當面告訴。形容對人懇切教誨、叮嚀。"}, {"w": "拋磚引玉", "def": "自謙之詞，比喻先以自己較不好的意見或行為，來引起別人更為優秀的表現。"}, {"w": "振聾發聵", "def": "聲音大到使耳聾的人都能聽見。比喻大聲疾呼，以喚醒愚昧的人。聵，音ㄎㄨㄟˋ，耳聾的人。"}, {"w": "醍醐灌頂", "def": "將牛奶中精煉出來的乳酪澆到頭上。佛家以此比喻灌輸智慧，使人得到啟發，澈底醒悟。亦可比喻令人感到清涼舒適。"}]}]}, {"lesson": "2下 第四課 張釋之執法", "themes": [{"title": "與「法律」有關的成語", "items": [{"w": "奉公守法", "def": "以公事為重，謹守法紀，不徇私舞弊。"}, {"w": "明鏡高懸", "def": "比喻官吏執法嚴明，判案公正，或辦事明察秋毫，公正無私。"}, {"w": "執法如山", "def": "執行法律，立場堅定，不受動搖。"}, {"w": "以身試法", "def": "不顧法律的制裁而故意犯法。"}, {"w": "目無法紀", "def": "膽大妄為，無視於法律的存在。"}, {"w": "違法亂紀", "def": "違反法律，擾亂綱紀。"}, {"w": "逍遙法外", "def": "犯罪者逃過法律制裁，仍自由行動。"}, {"w": "言出法隨", "def": "話一說出，法律效力隨即有效執行。"}, {"w": "金科玉律", "def": "形容完善嚴密的法律條文。後比喻不可變更的信條。"}, {"w": "法外施恩", "def": "除應負的刑責外，在法律許可的範圍內盡量給予方便。"}, {"w": "懲一戒百", "def": "懲罰一人以警戒眾人。"}, {"w": "約法三章", "def": "泛指事先約好或規定的事。"}]}, {"title": "與「悔悟」有關的成語", "items": [{"w": "洗心革面", "def": "比喻澈底悔悟，改過自新。"}, {"w": "痛改前非", "def": "澈底改正以往的過錯。"}, {"w": "幡然悔悟", "def": "澈底的悔改、醒悟。幡，音ㄈㄢ。"}, {"w": "執迷不悟", "def": "堅持錯誤的觀念而不醒悟。"}]}, {"title": "其他補充成語", "items": [{"w": "口誅筆伐", "def": "用言語和文字來揭發、譴責他人的罪狀。"}, {"w": "井然有序", "def": "條理分明而有秩序。"}, {"w": "忍氣吞聲", "def": "受了氣也強自忍耐，不敢作聲抗爭。"}, {"w": "勃然大怒", "def": "忿怒的樣子。"}, {"w": "栩栩如生", "def": "形容貌態逼真，彷彿具有生命力。"}, {"w": "條理分明", "def": "有系統、層次，不紊亂。"}, {"w": "理直氣壯", "def": "理由正大、充分，則氣盛而無所畏懼。"}, {"w": "維妙維肖", "def": "模仿得精細巧妙，逼真傳神。"}, {"w": "據理力爭", "def": "根據事理，竭力爭取。"}, {"w": "積重難返", "def": "長期所形成的不良習慣與弊病，難以改變。"}]}, {"title": "成語充電站", "items": [{"w": "嚴刑峻法", "def": "嚴厲的刑法。"}, {"w": "貪贓枉法", "def": "貪汙受賄，破壞法紀。"}, {"w": "知法犯法", "def": "知道法律而故意犯法。"}, {"w": "無顏見江東父老", "def": "指心懷羞愧，沒臉見自己人。"}]}]}, {"lesson": "2下 第五課 我所知道的康橋", "themes": [{"title": "與「草」有關的成語", "items": [{"w": "草木皆兵", "def": "見到風吹草動，都以為是敵兵。比喻緊張、恐懼，疑神疑鬼。"}, {"w": "草菅人命", "def": "比喻輕視人命，濫殺無辜。菅，音ㄐㄧㄢ。"}, {"w": "寸草春暉", "def": "比喻父母恩情深重，子女即使竭盡心意也難以報答。"}, {"w": "結草銜環", "def": "比喻生前受恩死後圖報。"}, {"w": "疾風勁草", "def": "經過猛烈大風的吹襲，才知道堅韌的草挺立不倒。比喻在艱難困苦的環境下，才能考驗出人的堅強意志和節操。"}, {"w": "風吹草動", "def": "比喻輕微的動靜變化。"}]}, {"title": "與「日」有關的成語", "items": [{"w": "旭日東升", "def": "清晨太陽剛從東方升起。常用以比喻充滿活力，生機勃勃的景象。"}, {"w": "日薄西山", "def": "太陽已經接近西邊的山。比喻事物接近衰亡或人近老年，殘生將盡。"}, {"w": "蒸蒸日上", "def": "形容不斷進步發展。"}]}, {"title": "與「愉快」、「憂愁」有關的成語", "items": [{"w": "眉飛色舞", "def": "形容非常喜悅得意的神情。"}, {"w": "喜笑顏開", "def": "心情愉快，笑容滿面。"}, {"w": "眉開眼笑", "def": "十分愉快。"}, {"w": "愁眉不展", "def": "雙眉緊鎖，很憂愁的樣子。"}]}, {"title": "與「變化」有關的成語", "items": [{"w": "瞬息萬變", "def": "形容在極短的時間內變化迅速。"}, {"w": "千變萬化", "def": "形容變化無窮。"}, {"w": "變幻莫測", "def": "事物變化多端，難以預測。"}, {"w": "朝令夕改", "def": "比喻政令、主張或意見反覆無常。"}, {"w": "千篇一律", "def": "形式或內容毫無變化。"}]}, {"title": "其他補充成語", "items": [{"w": "方興未艾", "def": "正在蓬勃發展中，一時不會停止。"}, {"w": "栩栩如生", "def": "形容貌態逼真，彷彿具有生命力。"}, {"w": "荒誕不經", "def": "荒唐而不近情理。"}, {"w": "曙光乍現", "def": "比喻事情在混沌不明中突然出現一線光明、一絲希望。"}, {"w": "如沐春風", "def": "比喻遇到良師誠摯教誨的感受。"}, {"w": "伺機而動", "def": "等候適當的時機再行動。"}]}]}, {"lesson": "2下 第六課 迷途羔羊——弗氏海豚", "themes": [{"title": "「不□不□」式的成語", "items": [{"w": "不仁不義", "def": "比喻心腸惡毒，做事違反常理。"}, {"w": "不折不扣", "def": "完完全全的、一點都不打折扣的。"}, {"w": "不卑不亢", "def": "形容處事待人態度得體，不傲慢、不卑屈，恰到好處。"}, {"w": "不屈不撓", "def": "不因為受阻礙而屈服。"}, {"w": "不知不覺", "def": "不自覺。"}, {"w": "不倫不類", "def": "形容不像樣或不合格式。"}, {"w": "不疾不徐", "def": "不快不慢，形容能掌握事情進展的適當節奏。"}, {"w": "不偏不倚", "def": "不偏向任何一方。"}, {"w": "不痛不癢", "def": "形容無關緊要，沒有感覺。或比喻沒有切中要害，或不能解決問題。"}, {"w": "不愧不怍", "def": "行事光明正大，問心無愧。怍，音ㄗㄨㄛˋ。"}, {"w": "不聞不問", "def": "置身事外，漠不關心。"}, {"w": "不蔓不枝", "def": "比喻文章簡潔而流暢。"}]}, {"title": "其他補充成語", "items": [{"w": "一盤散沙", "def": "比喻人心渙散，缺乏凝合的力量，不能團結組織起來。"}, {"w": "七零八落", "def": "散亂的樣子。"}, {"w": "先發制人", "def": "凡事先下手取得主動權而制伏對方。"}, {"w": "判若兩人", "def": "形容一個人的行為態度，前後截然不同。"}, {"w": "抱頭鼠竄", "def": "形容像鼠懼人一般，狼狽逃走的樣子。"}, {"w": "盲人摸象", "def": "比喻以偏概全，而未能洞明真相。"}, {"w": "惘然若失", "def": "惆悵失意，有如失去了什麼似的。"}, {"w": "潛移默化", "def": "人的思想、性格或習慣，受到環境或別人的影響，於不知不覺中起了變化。"}, {"w": "驚慌失措", "def": "驚恐慌張不知如何是好。"}, {"w": "蠶食鯨吞", "def": "比喻不同的侵略併吞方式。"}]}, {"title": "與「動物」有關的成語", "items": [{"w": "投鼠忌器", "def": "比喻做事有所顧忌，不敢下手。"}, {"w": "汗牛充棟", "def": "形容書籍極多。"}, {"w": "羊質虎皮", "def": "比喻空有壯麗的外表，而缺乏實力。"}, {"w": "兔死狐悲", "def": "比喻因同類的死亡而感到悲傷。"}, {"w": "攀龍附鳳", "def": "趨附權貴，以求晉升。"}, {"w": "畫蛇添足", "def": "比喻多此一舉而於事無補。"}, {"w": "心猿意馬", "def": "形容心意不定，不能自持。"}, {"w": "殺雞取卵", "def": "比喻貪圖眼前微小的好處而損害更大的利益。"}, {"w": "白雲蒼狗", "def": "比喻世事變幻無常。"}, {"w": "風聲鶴唳", "def": "形容極為驚慌疑懼。"}, {"w": "引狼入室", "def": "比喻自招其禍。"}, {"w": "指鹿為馬", "def": "比喻顛倒是非。"}, {"w": "鳳毛麟角", "def": "比喻稀罕珍貴的人、物。"}, {"w": "千里鵝毛", "def": "比喻禮物雖輕而情意深重。"}, {"w": "蠶食鯨吞", "def": "比喻不同的侵略併吞方式。"}, {"w": "管中窺豹", "def": "比喻所見狹小，未得全貌。"}]}]}, {"lesson": "2下 第七課 陋室銘", "themes": [{"title": "與「龍」有關的成語", "items": [{"w": "龍韜虎略", "def": "比喻用兵有謀略膽識。韜，音ㄊㄠ。"}, {"w": "生龍活虎", "def": "比喻活潑勇猛，生氣勃勃。"}, {"w": "來龍去脈", "def": "比喻事情首尾始末條理清楚。"}, {"w": "乘龍快婿", "def": "比喻好女婿。"}, {"w": "畫龍點睛", "def": "比喻繪畫、作文時在最重要之處加上一筆，使全體更加生動傳神。"}, {"w": "群龍無首", "def": "一群人之中缺少領袖。"}, {"w": "攀龍附鳳", "def": "趨附權貴，以求進升。"}, {"w": "人中之龍", "def": "比喻品格高逸，出類拔萃的人。"}, {"w": "臥虎藏龍", "def": "比喻潛藏著人才。"}, {"w": "望子成龍", "def": "希望自己的兒子能成大器。"}]}, {"title": "與「學問」有關的成語", "items": [{"w": "才高八斗", "def": "比喻才學極高。"}, {"w": "學富五車", "def": "形容人書讀很多，學問淵博。"}, {"w": "目不識丁", "def": "比喻不識字或毫無學問。"}, {"w": "胸無點墨", "def": "比喻人毫無學識。"}, {"w": "孤陋寡聞", "def": "學識淺薄，見聞不廣泛。"}]}, {"title": "與「工作」有關的成語", "items": [{"w": "案牘勞形", "def": "形容因文書工作繁重而疲憊不堪。"}, {"w": "枵腹從公", "def": "形容不顧己身，勤於公事。枵，音ㄒㄧㄠ。"}, {"w": "尸位素餐", "def": "占著職位享受俸祿而不做事。尸，音ㄕ。"}, {"w": "遊手好閒", "def": "遊蕩貪玩，無所事事的樣子。"}]}, {"title": "其他補充成語", "items": [{"w": "三顧茅廬", "def": "比喻敬賢之禮或誠心邀請。"}, {"w": "中飽私囊", "def": "經手公款，以不正當的手段，從中牟利自肥。"}, {"w": "兩袖清風", "def": "比喻官吏清廉，毫無貪贓枉法之事。"}, {"w": "廉潔奉公", "def": "清廉正直，奉公守法。"}, {"w": "潔身自好", "def": "保持自身純潔清白，而不與人同流合汙。或指怕招惹是非，只管自己，不管別人。"}, {"w": "明哲保身", "def": "明達事理、洞見時勢的人，不參與會帶給自己危險的事。"}, {"w": "隨波逐流", "def": "比喻人沒有確定的方向和目標，只依從環境、潮流而行動。"}, {"w": "鴻鵠之志", "def": "比喻志向遠大。鵠，音ㄏㄨˊ。"}, {"w": "傾家蕩產", "def": "用盡全部的家產。"}, {"w": "素昧平生", "def": "向來不相識。"}, {"w": "敝帚自珍", "def": "比喻東西雖不好，卻因為是自己的，仍然非常珍視。"}]}, {"title": "與「高尚品德」有關的成語", "items": [{"w": "飲水思源", "def": "比喻不忘本。"}, {"w": "捨生取義", "def": "為維護正義真理而不惜犧牲生命。"}, {"w": "兄友弟恭", "def": "兄弟間感情和睦，能相互友愛尊敬。"}, {"w": "一介不取", "def": "形容人的操守清廉。"}, {"w": "謙沖自牧", "def": "為人處事謙和退讓，以修養自我的德性。"}, {"w": "豁然大度", "def": "形容心胸寬闊、度量宏大。"}, {"w": "澹泊明志", "def": "表恬靜寡欲，志向高遠。"}, {"w": "高風亮節", "def": "高尚的品格，堅貞的氣節。"}, {"w": "蕙質蘭心", "def": "比喻女子芳潔的心地、高雅的品德。"}, {"w": "風雨如晦", "def": "比喻處於險惡環境中也不改變其操守。"}, {"w": "潔身自好", "def": "保持自身純潔清白，而不與人同流合汙。"}]}, {"title": "與「居住環境」有關的成語", "items": [{"w": "畫棟雕梁", "def": "形容建築富麗堂皇。"}, {"w": "金碧輝煌", "def": "形容裝飾華彩絢爛。多指宮殿等建築物。"}, {"w": "瓊樓玉宇", "def": "形容精美華麗的樓閣。亦用以指月宮或神仙住的地方。"}, {"w": "窗明几淨", "def": "窗子明亮，茶几乾淨。形容居室明亮潔淨。"}, {"w": "室如懸磬", "def": "指居室空無所有，比喻非常貧窮。"}, {"w": "蓬門蓽戶", "def": "用蓬蓽做成的門戶。形容貧苦人家簡陋的居室。"}, {"w": "家徒四壁", "def": "家中只剩四面牆壁。形容家境貧困，一無所有。"}]}]}, {"lesson": "2下 第八課 成功是失敗之母", "themes": [{"title": "與「成」、「敗」有關的成語", "items": [{"w": "一敗塗地", "def": "形容失敗到無法收拾的地步。"}, {"w": "反敗為勝", "def": "從敗勢中得到勝利。"}, {"w": "木已成舟", "def": "木材已經做成船隻。比喻已成事實，無法改變。"}, {"w": "功成名就", "def": "事業有所成就，而且有名望。"}, {"w": "白首無成", "def": "年老而一事無成。"}, {"w": "老成練達", "def": "老練持重、通達事理。"}, {"w": "身敗名裂", "def": "事業、地位喪失，名譽毀壞。比喻人澈底失敗。"}, {"w": "泣不成聲", "def": "哭得發不出聲音。形容十分悲傷。"}, {"w": "殘兵敗將", "def": "戰敗後殘餘的兵將。"}, {"w": "屢戰屢敗", "def": "每次打仗都失敗。"}]}, {"title": "與「驕傲」有關的成語", "items": [{"w": "志驕意滿", "def": "形容驕傲自滿的樣子。"}, {"w": "恃寵而驕", "def": "倚仗得寵而驕傲自大。"}, {"w": "傲世輕物", "def": "傲慢驕橫，輕視他人。"}, {"w": "傲賢慢士", "def": "用輕視怠慢的態度對待賢人。"}, {"w": "驕兵必敗", "def": "比喻自負強大而輕敵的軍隊必會打敗仗。"}]}, {"title": "與「說話」有關的成語", "items": [{"w": "不由分說", "def": "不容許分辯解釋。"}, {"w": "仗義執言", "def": "伸張正義，激昂陳詞。"}, {"w": "守口如瓶", "def": "嘴像瓶口一樣封得嚴緊。比喻嚴守祕密。"}, {"w": "肺腑之言", "def": "發自內心的真話。"}, {"w": "流言蜚語", "def": "本指製造不實的傳言，用來詆毀他人。後泛指謠言。蜚，音ㄈㄟ。"}, {"w": "現身說法", "def": "比喻以親身經歷為例證，來勸導別人。"}, {"w": "誇誇其談", "def": "言談浮誇，不切實際。"}, {"w": "違心之論", "def": "違背本心的言論。"}]}, {"title": "與「成敗」有關的成語、諺語", "items": [{"w": "成敗利鈍", "def": "成功失敗與順利挫折。"}, {"w": "功敗垂成", "def": "事情在即將成功時失敗了。"}, {"w": "成事不足，敗事有餘", "def": "無能力把事情辦好，卻往往把事情弄壞。"}, {"w": "成者為王，敗者為寇", "def": "形容以成敗論人，而不計其過程、為人等。"}, {"w": "勝不驕，敗不餒", "def": "勝利了不驕傲，失敗了也不氣餒。表示不論勝敗，都能保持平常心。"}]}, {"title": "與「盛衰」有關的成語", "items": [{"w": "月盈則食", "def": "比喻物盛極必衰。"}, {"w": "絕處逢生", "def": "在絕境中又獲得一線生機。"}, {"w": "否極泰來", "def": "比喻情況壞到極點後逐漸好轉。"}, {"w": "樂極生悲", "def": "歡樂至極，往往轉生悲愁。"}, {"w": "興盡悲來", "def": "高興到極點，悲哀就隨之而來。"}, {"w": "苦盡甘來", "def": "艱難的困境已經結束，逐漸進入佳境。"}]}]}, {"lesson": "2下 第九課 罐頭由來", "themes": [{"title": "與「人物典故」有關的成語", "items": [{"w": "江郎才盡", "def": "江郎，指南朝 梁文人江淹。江郎才盡原指江淹少以詩文著稱，獨步當代。晚年時，偶憩於一亭中，夢見郭璞索還五色筆，自此江淹作詩絕無佳句。比喻文思枯竭，佳作不再。"}, {"w": "東山再起", "def": "晉 謝安退職隱居東山，後來又再度入朝擔任要職。後用以指官員退職後，再度出仕。今亦用此語表示失敗後捲土重來。"}, {"w": "洛陽紙貴", "def": "晉代 左思寫成〈三都賦〉後，時人競相傳寫，使洛陽的紙價上漲而昂貴。後比喻著作風行一時，流傳甚廣。"}, {"w": "約法三章", "def": "原指漢高祖入咸陽，臨時制定三條法律，與民共守。後泛指事先約好或規定的事。"}, {"w": "望梅止渴", "def": "曹操率兵行軍至途中，士兵乾渴難耐，曹操就騙士兵前有梅林，梅子又酸又甜，誘使士兵流出口水以解渴的故事。後比喻用空想來安慰自己。"}, {"w": "圖窮匕見", "def": "戰國時，燕太子丹派荊軻獻燕國的地圖，而藏匕首於圖中，以謀刺秦王。後比喻事情發展到最後，形跡敗露，現出真相。匕，音ㄅㄧˇ。"}, {"w": "聞雞起舞", "def": "晉代 祖逖（ㄊㄧˋ）半夜聽到雞啼聲，立即起床操練武藝。後用以比喻及時奮起行動。"}, {"w": "樂不思蜀", "def": "蜀漢亡後，後主 劉禪被送往洛陽，司馬昭設宴招待劉禪，並派人演出蜀國的歌舞雜耍，劉禪樂在其中，司馬昭因而問：「是否思蜀？」劉禪答：「此間樂，不思蜀。」後比喻樂而忘返或樂而忘本。"}, {"w": "蕭規曹隨", "def": "漢代 曹參繼蕭何為相國，舉事皆無所變更。比喻後任的人依循前任所訂的規章行事。"}, {"w": "舉案齊眉", "def": "東漢 孟光送飯食給丈夫梁鴻時，總是將木盤高舉，與眉平齊，夫妻互敬互愛的故事。後比喻夫妻相敬如賓。"}, {"w": "煮豆燃萁", "def": "三國 魏文帝 曹丕妒嫉其弟曹植的才能而欲加害，命曹植在七步之內完成一首詩，曹植便作〈七步詩〉一首：「煮豆持作羹，漉菽以為汁。萁在釜下燃，豆在釜中泣。本自同根生，相煎何太急？」後用煮豆燃萁比喻兄弟相迫，骨肉相殘。萁，大豆的莖。"}]}, {"title": "其他補充成語", "items": [{"w": "與時俱進", "def": "與時代一同前進。"}, {"w": "改弦易轍", "def": "比喻改變制度、做法或態度。"}, {"w": "物美價廉", "def": "物品精美，價格便宜。"}, {"w": "秋毫無犯", "def": "一點都不侵犯。"}, {"w": "差強人意", "def": "指大體上尚能令人勉強滿意。"}, {"w": "釜底抽薪", "def": "比喻從根本上解決問題。"}, {"w": "鬼斧神工", "def": "形容景觀奇特或技藝精巧，像是鬼神所造。"}, {"w": "循規蹈矩", "def": "遵守規矩。"}, {"w": "著書立說", "def": "寫作書籍，以成一家之言。"}, {"w": "池魚之殃", "def": "春秋時，宋 司馬桓有寶珠，後因畏罪出亡，故投珠於池中。景公派人汲乾池水，但尋珠不著，而池魚卻因此而亡。後比喻無辜卻受牽累而遭禍。"}]}]}, {"lesson": "2下 第十課 項鍊", "themes": [{"title": "與「情緒」有關的成語", "items": [{"w": "怒不可遏", "def": "怒氣難以抑制的樣子。"}, {"w": "暴跳如雷", "def": "形容人急怒的樣子。"}, {"w": "怒火中燒", "def": "形容非常憤怒。"}, {"w": "欣喜若狂", "def": "形容快樂、高興到了極點。"}, {"w": "眉開眼笑", "def": "十分愉快。"}, {"w": "悶悶不樂", "def": "心情憂鬱不快樂。"}, {"w": "愁眉不展", "def": "雙眉緊鎖，很憂愁的樣子。"}, {"w": "滿面愁容", "def": "滿臉憂愁的樣子。"}, {"w": "蹙額顰眉", "def": "皺著眉頭。蹙，音ㄘㄨˋ。顰，音ㄆㄧㄣˊ。"}, {"w": "忐忑不安", "def": "心情起伏不定的樣子。"}, {"w": "坐立難安", "def": "形容焦急、煩躁，心神不寧的樣子。"}, {"w": "惴惴不安", "def": "因恐懼耽憂而心神不定"}]}, {"title": "與「錢財」有關的成語", "items": [{"w": "不值一錢", "def": "比喻毫無價值。"}, {"w": "生財有道", "def": "形容擅長發財致富。"}, {"w": "輕財重義", "def": "輕視錢財而看重道義。"}, {"w": "日食萬錢", "def": "形容生活極為奢侈豪華。"}, {"w": "財大氣粗", "def": "指富者倚仗財勢蠻橫囂張。"}, {"w": "不義之財", "def": "以不正當手段所獲取的錢財。"}, {"w": "輕財好施", "def": "不重視財物而喜歡施捨助人。"}, {"w": "倚財仗勢", "def": "仗著金錢與權勢，欺壓別人。"}, {"w": "愛財如命", "def": "形容十分吝嗇、貪婪。"}, {"w": "見錢眼開", "def": "形容人貪婪愛財，唯利是圖。"}, {"w": "不名一錢", "def": "形容人極其貧窮。"}, {"w": "臨財不苟", "def": "面對錢財引誘，能不隨便求取。意謂廉潔自好。"}]}, {"title": "其他補充成語", "items": [{"w": "好高騖遠", "def": "形容一味的嚮往高遠的目標而不切實際。"}, {"w": "安分守己", "def": "安守本分，堅持原則。"}, {"w": "作繭自縛", "def": "比喻人做事反使自己陷入困境。"}, {"w": "利欲薰心", "def": "貪圖名利私欲而蒙蔽了心智。"}, {"w": "束手就擒", "def": "不加抵抗，讓人綑綁捉拿。"}, {"w": "沽名釣譽", "def": "故意做作，用手段謀取名聲和讚譽。"}, {"w": "愛慕虛榮", "def": "比喻貪戀浮名及富貴。"}, {"w": "縛手縛腳", "def": "比喻處處受約束。"}]}]}, {"lesson": "2下 自學三 空城計", "themes": [{"title": "與「計略」有關的成語", "items": [{"w": "人急計生", "def": "人在情急之下會突然想出應變的計謀。"}, {"w": "力屈計窮", "def": "計謀、辦法都已用盡。"}, {"w": "千方百計", "def": "費盡心機，想盡一切辦法、計謀。"}, {"w": "才疏計拙", "def": "才能淺薄，不善謀略。"}, {"w": "百年大計", "def": "影響深遠的計畫或措施。"}, {"w": "枉費心計", "def": "白白的浪費心思。意謂徒勞無功。"}, {"w": "將計就計", "def": "利用對方的計策，順水推舟，反施其計。"}, {"w": "陰謀詭計", "def": "暗中策畫做壞事。"}, {"w": "運籌帷幄", "def": "謀畫策略。帷幄，音ㄨㄟˊ ㄨㄛˋ。"}, {"w": "緩兵之計", "def": "比喻暫時設法拖延時間，使事態緩和的方法。"}, {"w": "權宜之計", "def": "因應某種時機而暫用的計謀。"}]}, {"title": "與「時機」、「行動」有關的成語", "items": [{"w": "先發制人", "def": "凡事先下手取得主動權而制伏對方。"}, {"w": "當機立斷", "def": "抓住時機，立刻作出決斷。"}, {"w": "輕舉妄動", "def": "行為不慎，舉止輕浮。"}, {"w": "鋌而走險", "def": "在窮途末路或受逼迫時採取冒險行動或不正當的行為。"}, {"w": "伺機而動", "def": "等候適當的時機再行動。"}, {"w": "枕戈待旦", "def": "形容時時警惕，準備作戰，不敢安睡。枕，音ㄓㄣˋ。"}]}, {"title": "其他補充成語", "items": [{"w": "大驚失色", "def": "形容十分驚嚇，以致變了臉色。"}, {"w": "化險為夷", "def": "轉化危險為平安。"}, {"w": "神鬼莫測", "def": "形容極隱密奇異，無法預料。"}, {"w": "勝券在握", "def": "比喻很有把握，相信自己已經可以成功。"}, {"w": "閒雲野鶴", "def": "比喻來去自如，無所羈絆的人。"}, {"w": "撥亂反正", "def": "除去禍亂，歸於正道。"}, {"w": "謹言慎行", "def": "指言談小心，行事謹慎。"}]}]}, {"lesson": "3上 第一課 戲李白", "themes": [{"title": "與「地名」有關的成語", "items": [{"w": "得隴望蜀", "def": "比喻貪得無厭，不知滿足。"}, {"w": "廬山面目", "def": "比喻不易窺知真相的事物。"}, {"w": "洛陽紙貴", "def": "晉代 左思寫成〈三都賦〉後，時人競相傳寫，使洛陽的紙價上漲而昂貴。後比喻著作風行一時，流傳甚廣。"}, {"w": "終南捷徑", "def": "唐代 盧藏用舉進士，然不受重用，遂隱居終南山以求高名，後果被召任官的故事。後用於比喻求官或求名利的便捷途徑。"}, {"w": "合浦珠還", "def": "漢 合浦郡沿海盛產珍珠，因宰守貪穢，濫採無度，珠遂漸遷移交阯郡。後孟嘗任合浦太守，革易舊弊，珠乃漸還。後比喻人離開而復返或東西失而復得。"}, {"w": "邯鄲學步", "def": "相傳戰國時期，燕國有個人到趙國的都城邯鄲，看到趙國人走路姿勢很美，就跟著學。結果不但沒有學好，連自己原來的走法也忘掉了，便爬著回去。後用來比喻仿效他人，未能成就，反而失卻自己本來的面目。邯鄲，音ㄏㄢˊ ㄉㄢ。"}, {"w": "逼上梁山", "def": "《水滸傳》中眾多好漢因受到官府逼迫，上梁山造反。後比喻被迫走上絕路，而做出自己不想做或不應做的事。"}, {"w": "泰山北斗", "def": "比喻負有聲望的人，為世人所景仰，或指學術高深卓絕，為人景仰。泰山為五嶽之首，北斗星為眾星中最明亮之星。"}]}, {"title": "與「趣」有關的成語", "items": [{"w": "自討沒趣", "def": "言行不得當，招致難堪、窘迫。"}, {"w": "相映成趣", "def": "互相襯托而更添意趣。"}, {"w": "了無生趣", "def": "毫無生存的意願。"}]}, {"title": "與「戲」有關的成語", "items": [{"w": "拿手好戲", "def": "最擅長表演的戲。"}, {"w": "逢場作戲", "def": "隨事應景，偶爾遊戲玩耍。"}, {"w": "官場如戲", "def": "比喻當官的人爭逐權勢，陞遷貶謫，變化無常，有如兒戲一般。"}]}, {"title": "其他補充成語", "items": [{"w": "繼往開來", "def": "承續先人的事業，並為後人開拓道路。"}, {"w": "龍蟠虎踞", "def": "形容地勢雄偉險要。"}, {"w": "被山帶河", "def": "被群山與河流環繞。形容地勢險要。"}, {"w": "千古獨步", "def": "古往今來絕無僅有。"}, {"w": "天下無雙", "def": "天下沒有第二個，獨一無二。"}, {"w": "虎視眈眈", "def": "如老虎般貪狠的注視。比喻心懷不軌，伺機掠奪。"}, {"w": "無獨有偶", "def": "兩項事物恰巧相同或類似。"}, {"w": "筆走龍蛇", "def": "比喻文筆揮灑自如或書法優美熟練。"}]}, {"title": "成語充電站", "items": [{"w": "江河日下", "def": "比喻情況日漸衰微，一天不如一天。"}, {"w": "江心補漏", "def": "比喻事有缺失不先預防，臨時才補救，但為時已晚。"}, {"w": "過江之鯽", "def": "比喻來往的人眾多。鯽，音ㄐㄧˋ。"}, {"w": "江山如畫", "def": "形容山水風景如圖畫般美麗。"}, {"w": "口若懸河", "def": "比喻能言善道，說話時有如流水傾瀉一般，滔滔不絕。"}, {"w": "過河拆橋", "def": "比喻不念舊情，忘恩負義。"}, {"w": "暴虎馮河", "def": "比喻人有勇而無謀。馮，音ㄆ一ㄥˊ。"}, {"w": "信口開河", "def": "不加思索的隨意亂說。"}, {"w": "抱痛西河", "def": "比喻喪子之痛。"}, {"w": "河清海晏", "def": "比喻太平盛世。"}, {"w": "翻江倒海", "def": "比喻力量或聲勢巨大。"}, {"w": "錦繡河山", "def": "形容國土山河像精美的絲織品一樣美好。"}, {"w": "不到烏江心不死", "def": "比喻不到完全絕望，絕不肯認輸放棄。"}, {"w": "船到江心補漏遲", "def": "比喻不事先預防，臨時出事，想補救也來不及了。"}, {"w": "跳在黃河洗不清", "def": "比喻冤枉無法洗刷。"}, {"w": "不到黃河心不死", "def": "比喻不到完全絕望的地步，絕不輕言放棄。"}]}]}, {"lesson": "3上 第二課 詞選", "themes": [{"title": "與「顏色」有關的成語", "items": [{"w": "碧波萬頃", "def": "形容水色碧綠，廣闊無際的樣子。"}, {"w": "黃袍加身", "def": "宋太祖 趙匡胤 陳橋兵變，被擁戴為皇帝的故事。"}, {"w": "白雲蒼狗", "def": "指白雲原本像一件潔淨的白衣，轉眼間卻變成灰狗的模樣。比喻世事變幻無常。"}, {"w": "青黃不接", "def": "指作物還沒成熟，存糧又已吃完。比喻有所匱乏，一時難以接濟。青，指還沒成熟的綠色農作物。黃，指黃熟的穀物。"}, {"w": "近朱者赤", "def": "靠近硃砂容易被染成紅色，靠近墨則容易被染成黑色。後比喻人的習性因環境影響而改變。"}, {"w": "明日黃花", "def": "指在重陽節欣賞菊花最能景與情會，若錯過時令就毫無興味。後比喻為過時的事物。明日，重陽節後。黃花，菊花。"}, {"w": "白駒過隙", "def": "指馬從洞孔前一下子就跑過去。後比喻時間過得很快。白駒，駿馬。隙，洞孔。"}, {"w": "青紅皂白", "def": "指各種不同的顏色。比喻事情的是非情由。皂，黑色。"}, {"w": "青出於藍", "def": "指青色是從蓼（ㄌㄧㄠˇ）藍裡提煉出來的，但是顏色比蓼藍還深。後用以比喻弟子勝於老師，或後輩優於前輩。藍，蓼藍，可以提取靛青染料的植物。"}, {"w": "面紅耳赤", "def": "形容因高溫、羞愧、焦急或發怒時而臉上、耳朵發紅的樣子。"}, {"w": "信口雌黃", "def": "比喻不顧事情真相，隨意批評。"}, {"w": "爐火純青", "def": "指煉丹成功時，爐火火焰由紅色轉成純青色。後比喻學問、技術、功夫等到達精純完美的境地。"}, {"w": "慘綠少年", "def": "本指身穿暗綠色衣服的少年。後用以指風度翩翩、意氣風發的青年才俊。慘，暗淡、昏暗。"}, {"w": "昏天黑地", "def": "光線昏暗，無法辨別方向。"}, {"w": "白璧微瑕", "def": "潔白的璧玉上有小斑點。比喻很好的人或事還有小缺點，帶有惋惜的意味。"}, {"w": "月黑風高", "def": "形容沒有月亮，風很大的晚上。"}, {"w": "青梅竹馬", "def": "指從小相識的伴侶。竹馬，前端裝上木製馬頭的竹竿，小孩夾在胯下當成馬騎。"}, {"w": "白頭偕老", "def": "形容夫妻恩愛到老。"}, {"w": "金碧輝煌", "def": "形容裝飾華彩絢爛。多指宮殿等建築物。"}, {"w": "平步青雲", "def": "比喻順利無阻，迅速晉升高位。"}]}, {"title": "其他補充成語", "items": [{"w": "肥馬輕裘", "def": "形容生活豪奢。"}, {"w": "少不更事", "def": "年紀輕，閱歷淺薄。"}, {"w": "垂簾聽政", "def": "女后臨朝管理國事。"}, {"w": "甘棠遺愛", "def": "本指周代 召公行德政，人民感戴，對召公憩息過的甘棠樹亦愛護有加。後用以表示對賢官廉吏的愛戴或懷念。"}, {"w": "悠然神往", "def": "由內心深處所升起的一股企盼，而心神嚮往。"}]}, {"title": "成語充電站", "items": [{"w": "以身許國", "def": "比喻盡忠報國。"}, {"w": "為國捐軀", "def": "為國犧牲性命。"}, {"w": "赤膽忠心", "def": "形容極為忠誠不二。"}, {"w": "保國安民", "def": "保衛國家，安定人民。"}, {"w": "碧血丹心", "def": "形容赤忱、忠誠的心。"}, {"w": "精忠報國", "def": "盡心盡力的報效國家。"}, {"w": "憂國恤民", "def": "憂慮國事，憐恤百姓。"}, {"w": "鞠躬盡瘁", "def": "指不辭辛勞，盡力於國事。"}]}]}, {"lesson": "3上 第三課 人間好時節", "themes": [{"title": "與「四季」有關的成語", "items": [{"w": "流金鑠石", "def": "形容天氣非常炎熱，好像能把金、石鎔化。鑠，音ㄕㄨㄛˋ，鎔化。"}, {"w": "火傘高張", "def": "比喻烈日當空。"}, {"w": "冰天雪地", "def": "形容氣候嚴寒。"}, {"w": "望穿秋水", "def": "形容盼望的深切。秋水，秋天的水明淨澄澈，比喻眼睛。"}, {"w": "春寒料峭", "def": "早春的寒風吹得人有些冷。"}, {"w": "浮瓜沉李", "def": "浮沉於水中的瓜、李，是夏天清涼可口的食物。比喻夏日消暑的樂事。"}, {"w": "秋扇見捐", "def": "入秋天涼，扇子就被棄置不用。比喻女子不再年輕貌美而遭受冷落。"}, {"w": "虎尾春冰", "def": "踏到老虎的尾巴，走在春天的薄冰上。比喻處於極端危險的環境。"}, {"w": "臨去秋波", "def": "比喻清澈明亮的眼睛。指臨別時傳情的眼眸，或比喻臨走之前給人好處。秋波，秋天澄淨的水波。"}, {"w": "秋風過耳", "def": "比喻漠不關心。"}]}, {"title": "與「年齡」有關的成語", "items": [{"w": "春秋鼎盛", "def": "正當壯盛之年。"}, {"w": "懸車之年", "def": "指官員告老引退的年齡，通常為七十歲。懸車，把車子掛起來，指辭官退隱。"}, {"w": "黃口小兒", "def": "幼兒。比喻淺薄幼稚的人。"}, {"w": "豆蔻年華", "def": "比喻年輕少女，多指女子十三、四歲之時。也作「荳蔻年華」。"}]}, {"title": "其他補充成語", "items": [{"w": "禍國殃民", "def": "使國家和人民都受到災禍。"}, {"w": "渾然天成", "def": "自然形成，沒有人為雕琢的痕跡。"}, {"w": "食不下咽", "def": "飲食不下。形容內心非常悲傷、憂愁或煩惱。"}, {"w": "隨遇而安", "def": "能安於所處的環境。"}, {"w": "鬱鬱蔥蔥", "def": "茂盛的樣子。"}]}, {"title": "成語充電站", "items": [{"w": "春光明媚", "def": "形容春景妙麗動人。"}, {"w": "春花秋月", "def": "比喻美好的時光與景物。"}, {"w": "暑往寒來", "def": "夏天過去，冬天到來。泛指時光流逝。"}, {"w": "秋高氣爽", "def": "形容秋天天氣晴朗涼爽。"}, {"w": "桂子飄香", "def": "形容中秋時桂花綻放，香氣飄散。"}, {"w": "臘盡冬殘", "def": "年終歲末。"}, {"w": "寒冬臘月", "def": "指最寒冷的十二月天。"}, {"w": "恍然大悟", "def": "心裡忽然明白。"}, {"w": "暮鼓晨鐘", "def": "比喻使人覺悟的言論。"}, {"w": "茅塞頓開", "def": "比喻馬上開悟，忽然明白。"}, {"w": "當頭棒喝", "def": "比喻使人立即醒悟的警示。"}, {"w": "發人深省", "def": "啟發人深刻思考而有所醒悟。"}]}]}, {"lesson": "3上 第四課 生於憂患死於安樂", "themes": [{"title": "與「憂」有關的成語", "items": [{"w": "憂心如焚", "def": "內心憂慮有如火在焚燒。比喻非常焦慮不安。"}, {"w": "憂能傷人", "def": "憂愁煩悶會損害人的健康。"}, {"w": "憂國憂民", "def": "憂慮國家大計和人民疾苦。"}, {"w": "內憂外患", "def": "指國家內部的動亂和外敵的侵擾。亦比喻個人所遭遇的內在糾紛與外在壓力的困境。"}, {"w": "殷憂啟聖", "def": "深切的憂慮能啟發聖明。"}, {"w": "無憂無慮", "def": "毫無憂慮。形容心情怡然自得。"}, {"w": "杞人憂天", "def": "古時杞國有個人，擔心天會塌下來，因而寢食難安。後比喻無謂的憂慮。"}, {"w": "後顧之憂", "def": "來自後方、家裡或將來的憂患。"}, {"w": "高枕無憂", "def": "安臥閒適而無憂慮。"}, {"w": "樂以忘憂", "def": "非常快樂而忘了憂愁。"}]}, {"title": "與「情況的好壞」有關的成語", "items": [{"w": "否極泰來", "def": "情況壞到極點後逐漸好轉。"}, {"w": "苦盡甘來", "def": "艱難困苦的境遇已經結束，而將逐步進入佳境。"}, {"w": "時來運轉", "def": "本來處境不好，遇到機會，由逆境轉到順境。"}, {"w": "樂極生悲", "def": "歡樂至極，往往轉生悲愁。"}, {"w": "坐困愁城", "def": "形容處境艱困、沒有出路，且無力擺脫。"}]}, {"title": "與「準備」有關的成語", "items": [{"w": "未雨綢繆", "def": "鴟鴞在未下雨前，便已著手修補窩巢。比喻事先預備，防患未然。"}, {"w": "有備無患", "def": "凡事有準備，方可免後患。"}, {"w": "防範未然", "def": "事故還沒有發生之前就加以防範。"}, {"w": "臨渴掘井", "def": "比喻事到臨頭才著手準備，為時已晚。"}]}, {"title": "其他補充成語", "items": [{"w": "不勞而獲", "def": "毫不費力而得到。"}, {"w": "坐享其成", "def": "不出勞力，而享受現成的福利。"}, {"w": "坐收漁利", "def": "利用別人彼此間的衝突矛盾而獲利。"}, {"w": "自食其力", "def": "憑藉自己的力量養活自己。"}, {"w": "俯仰無愧", "def": "無論對人、對天都問心無愧。"}]}]}, {"lesson": "3上 第五課 清心苦味", "themes": [{"title": "與「飲食」有關的成語", "items": [{"w": "飢腸轆轆", "def": "形容非常飢餓的樣子。轆轆，音ㄌㄨˋ ㄌㄨˋ，擬聲詞，形容餓時腹部發出的聲音。"}, {"w": "粗茶淡飯", "def": "粗糙簡單的飲食。"}, {"w": "齒頰留香", "def": "形容食物味道鮮美，令人回味無窮。"}, {"w": "垂涎欲滴", "def": "嘴饞得口水快要流下來，形容極貪饞。"}, {"w": "酒囊飯袋", "def": "比喻只會吃喝，而不會辦事的無能之人。"}, {"w": "大快朵頤", "def": "指飽食愉快的樣子。朵，動。頤，下巴。朵頤，指動著腮頰欲食的樣子。"}, {"w": "觥籌交錯", "def": "酒器和酒籌錯雜相交。比喻暢飲。"}, {"w": "食不下咽", "def": "飲食不下。形容內心非常悲傷、憂愁或煩惱。"}, {"w": "鐘鳴鼎食", "def": "古代富貴人家吃飯時，擊鐘為號，列鼎而食。形容生活極為奢華。"}, {"w": "別有風味", "def": "形容食物味道美好，另有一種特色，不同尋常。"}, {"w": "弱肉強食", "def": "比喻強者欺凌、吞併弱者。"}, {"w": "節衣縮食", "def": "生活節儉。"}]}, {"title": "與「苦」有關的成語", "items": [{"w": "苦口婆心", "def": "以懇切真摯的態度，竭力勸告他人。"}, {"w": "孤苦伶仃", "def": "孤單貧苦，無依無助。"}, {"w": "良藥苦口", "def": "能治病的藥，多味苦難嚥。比喻諫言多拂逆於心，但卻有益於人。"}, {"w": "煞費苦心", "def": "極費心思。"}, {"w": "用心良苦", "def": "極費心思，用意深遠。"}, {"w": "臥薪嘗膽", "def": "越王 句踐戰敗後以柴草臥鋪，並經常舔嘗苦膽，以時時警惕自己不忘所受苦難的故事。後用以比喻刻苦自勵。"}]}, {"title": "其他補充成語", "items": [{"w": "冷言酸語", "def": "諷刺、譏笑的話。"}, {"w": "抱薪救火", "def": "抱著木柴去救火。比喻處理事情的方法錯誤，以致雖有心消弭禍害，卻反使禍害擴大。"}, {"w": "見異思遷", "def": "見到新奇的事物就改變心意。比喻意志不堅定。"}, {"w": "事過境遷", "def": "事情過了，環境也已改變。"}, {"w": "滿城風雨", "def": "多用來形容深秋或晚春時到處颳風下雨之景色。今則多借指事情一經傳出，流言四起，到處議論紛紛。"}, {"w": "意氣用事", "def": "處理事務只憑感情，多不依據理性。"}, {"w": "撲朔迷離", "def": "指兔子奔跑時很難辨別雌雄。後用來形容事物錯綜複雜，難以明瞭真相。"}, {"w": "暴殄天物", "def": "指殘害各種生物。亦可喻糟蹋物力，不知珍惜。殄，音ㄊㄧㄢˇ，滅絕。"}, {"w": "忠言逆耳", "def": "誠懇正直的規勸往往刺耳，而不易被人接受。"}, {"w": "舉目無親", "def": "放眼望去，沒有一個親人。形容孤單無依。"}, {"w": "專心致志", "def": "專一心思，貫徹意志。"}, {"w": "語重心長", "def": "言辭真誠具影響力而情意深長。"}]}, {"title": "成語充電站", "items": [{"w": "津津有味", "def": "形容興味濃厚。"}, {"w": "飢不擇食", "def": "比喻急迫時不作選擇、挑剔。"}, {"w": "杯盤狼藉", "def": "形容酒席完畢，杯盤散亂的情形。"}, {"w": "簞食瓢飲", "def": "只吃一碗飯，只喝一瓢水。形容生活簡單、清苦。"}, {"w": "歹竹出好筍", "def": "比喻不出色的父母，卻生養出優秀的子女。"}, {"w": "薑是老的辣", "def": "比喻年長者經驗豐富，見識廣而辦事歷練。"}, {"w": "食飯皇帝大", "def": "形容吃飯這件事最重要，什麼事都不能打擾、中斷。"}]}]}, {"lesson": "3上 第六課 獵人", "themes": [{"title": "與「動物、植物」有關的成語", "items": [{"w": "兔死狗烹", "def": "兔子死盡，用來捕兔的獵狗失去了作用，故而烹食之。比喻事成之後，出過力的人即遭到殺戮或見棄的命運。多指統治者殺戮功臣而言。"}, {"w": "狐死首丘", "def": "傳說狐狸死時，頭必朝向狐穴所在的山丘。比喻不忘本或對故鄉的思念。"}, {"w": "首鼠兩端", "def": "形容躊躇不決，瞻前顧後的樣子。"}, {"w": "蚍蜉撼樹", "def": "比喻不自量力。"}, {"w": "釜底游魚", "def": "比喻處於危亡困境中的人。"}, {"w": "風行草偃", "def": "比喻在上位者以德化民。"}, {"w": "望梅止渴", "def": "曹操率兵行軍至途中，士兵乾渴難耐，曹操就騙士兵前有梅林，梅子又酸又甜，誘使士兵流出口水以解渴的故事。後比喻用空想來安慰自己。"}, {"w": "勢如破竹", "def": "比喻作戰或工作順利進行，毫無阻礙。"}]}, {"title": "與「打獵」有關的成語", "items": [{"w": "一箭雙鵰", "def": "北周 長孫晟善射，嘗見二鵰飛而爭肉，長孫晟乃射一箭而同時貫穿兩隻鵰。後用以比喻一次舉動便可達到雙倍效果，兼得兩種好處。"}, {"w": "見獵心喜", "def": "程顥看到打獵，激起舊日的愛好而心喜。後比喻舊習難忘，觸其所好，便心情愉悅而躍躍欲試。"}, {"w": "涸澤而漁", "def": "排盡池湖的水而捕魚。比喻一味的耗盡、榨取而不留餘地。"}, {"w": "鳥盡弓藏", "def": "飛鳥射盡之後，就收起弓箭不用。比喻天下平定之後便遺棄功臣。"}, {"w": "網開一面", "def": "比喻寬大仁厚，對犯錯的人從寬處置。"}]}, {"title": "與「疊字」有關的成語", "items": [{"w": "汲汲營營", "def": "本指匆匆往來的樣子。後多形容人急切求取名利的樣子。汲汲，勤求不休止的樣子。營營，追逐求取。"}, {"w": "沸沸揚揚", "def": "形容人聲雜亂，議論紛紛，如水沸騰一般。"}, {"w": "朝朝暮暮", "def": "從早到晚，日復一日。"}, {"w": "渾渾噩噩", "def": "迷糊不知事理。"}, {"w": "熙熙攘攘", "def": "形容人來人往，熱鬧擁擠的樣子。"}, {"w": "岌岌可危", "def": "形容非常危險。"}, {"w": "喋喋不休", "def": "言語囉嗦，沒完沒了的樣子。"}]}, {"title": "成語充電站", "items": [{"w": "一網打盡", "def": "比喻澈底消滅。"}, {"w": "飛蒼走黃", "def": "指放出蒼鷹和獵犬打獵。蒼，蒼鷹。黃，黃犬。"}, {"w": "鹿死誰手", "def": "比喻共同爭奪一件事物，不知道誰能取得最後的勝利。"}, {"w": "飛鷹走馬", "def": "打獵。指放鷹獵捕、騎馬追逐野獸。也作「飛鷹走狗」。"}, {"w": "焚林而畋", "def": "比喻索取一空，不留餘地。畋，音ㄊㄧㄢˊ。"}, {"w": "兔起鶻落", "def": "兔子剛躍起，鶻鳥就猛衝下來。比喻動作快速敏捷。後常借比喻書寫作畫時下筆疾速。鶻，音ㄏㄨˊ。"}]}]}, {"lesson": "3上 第七課 與宋元思書", "themes": [{"title": "與「山水美景」有關的成語", "items": [{"w": "千巖競秀", "def": "形容眾峰奇石競相爭美。"}, {"w": "山明水秀", "def": "形容山水秀麗，風景優美。"}, {"w": "水綠山青", "def": "形容風景優美秀麗。"}, {"w": "世外桃源", "def": "比喻風景優美而人跡罕至的地方。"}, {"w": "名山大川", "def": "著名的高山與河流。"}, {"w": "依山傍水", "def": "靠山臨水。形容風景清幽如畫。"}, {"w": "洞天福地", "def": "神仙所住的地方。比喻名山勝境。"}, {"w": "連雲疊嶂", "def": "形容高聳入雲，重疊連綿的山峰。"}, {"w": "湖光山色", "def": "形容美好的自然風景。"}, {"w": "錦繡江山", "def": "形容壯麗的國土。"}]}, {"title": "與「聲音」有關的成語", "items": [{"w": "牙牙學語", "def": "形容嬰兒初學說話的聲音。"}, {"w": "泣不成聲", "def": "哭得發不出聲音。形容十分悲傷。"}, {"w": "怨聲載道", "def": "到處充滿了怨恨的聲音。形容群眾普遍怨恨、不滿。"}, {"w": "震耳欲聾", "def": "形容聲音很大，幾乎要將耳朵震聾。"}, {"w": "餘音繞梁", "def": "餘音環繞屋梁旋轉不去。形容音樂美妙感人，餘味不絕。"}, {"w": "聲色俱厲", "def": "說話時的聲音和臉色都很嚴肅。"}, {"w": "歡聲雷動", "def": "歡呼的聲音像雷響一樣。形容熱烈歡樂的場面。"}, {"w": "鑼鼓喧天", "def": "敲鑼打鼓的聲音響徹雲霄。形容氣氛熱鬧非凡。"}]}, {"title": "成語充電站", "items": [{"w": "山光水色", "def": "形容山水的美景佳勝。"}, {"w": "跋山涉水", "def": "形容走長遠路途的艱苦。"}, {"w": "千巖萬壑", "def": "形容高山深谷交疊成群。"}, {"w": "水木清華", "def": "形容池沼園林清朗明麗。"}, {"w": "千山萬水", "def": "比喻路途遙遠，險阻甚多。"}, {"w": "山窮水盡", "def": "比喻陷於絕境，窮困之至。"}, {"w": "山高水長", "def": "像山一樣的高聳，像水一樣的長流。比喻人品高潔，垂範久遠。"}]}]}, {"lesson": "3上 第八課 畫說湖心亭看雪", "themes": [{"title": "與「志趣相投」有關的成語", "items": [{"w": "同類相求", "def": "志趣相同的人自然結合在一起。"}, {"w": "志同道合", "def": "彼此的志趣和理想一致。"}, {"w": "氣味相合", "def": "雙方志趣、性情相投合。"}, {"w": "臭味相投", "def": "雙方志趣、性情相投合。或譏諷人的興趣、性情相合。"}, {"w": "意氣相合", "def": "彼此的性情志趣相投合。"}]}, {"title": "與「方向字」有關的成語", "items": [{"w": "掌上明珠", "def": "捧在手掌上的一顆珍貴明珠。比喻極受寵愛珍視的人。多指愛女。"}, {"w": "紙上談兵", "def": "比喻不合實際的空談、議論。"}, {"w": "後來居上", "def": "用以讚揚後人的成就超越前人。或落後的人超過領先的人。"}, {"w": "甘拜下風", "def": "表示心悅誠服。"}, {"w": "花前月下", "def": "本指景色幽美的環境，後多指男女幽會談情的美好情境。"}, {"w": "居高臨下", "def": "處於有利的地位，可控制一切。"}, {"w": "虛左以待", "def": "古禮以左為尊，後以虛左以待指留著尊位以待賢者。"}, {"w": "旁門左道", "def": "不正派的宗教派別。後比喻不遵循正規的途徑、法門。"}, {"w": "被髮左衽", "def": "形容頭髮散亂，穿衣服開左邊的文化落後民族。被髮，頭髮散亂。衽，衣襟。"}, {"w": "東窗事發", "def": "比喻陰謀敗露，將被懲治。"}, {"w": "河東獅吼", "def": "用以譏嘲妻子凶悍，使丈夫畏懼。"}, {"w": "馬耳東風", "def": "比喻對事情漠不關心。"}, {"w": "日落西山", "def": "用以比喻盛壯繁榮的事物轉為衰微敗落。"}, {"w": "駕鶴西歸", "def": "神仙駕鶴回到西天，比喻人死。多用於輓辭。"}, {"w": "剪燭西窗", "def": "思念妻子而盼望相聚。後亦泛指在夜晚與親友聚談。"}]}, {"title": "與「雪」有關的成語", "items": [{"w": "雪中送炭", "def": "比喻在人艱困危急之時，給予適時的援助。"}, {"w": "雪泥鴻爪", "def": "鴻雁踏過雪泥遺留的爪痕。比喻往事所遺留的痕跡。"}, {"w": "雪上加霜", "def": "比喻禍患接踵而至，使傷害加重。"}, {"w": "冰天雪地", "def": "形容氣候嚴寒。"}, {"w": "飽經霜雪", "def": "形容歷經許多艱辛磨練。"}, {"w": "如湯沃雪", "def": "好像用熱水潑在雪上一樣。比喻事情極為容易解決。"}]}, {"title": "其他補充成語", "items": [{"w": "勢不兩立", "def": "敵對的雙方不能同時並存。"}, {"w": "話不投機", "def": "談話時彼此意見不合。"}, {"w": "同床異夢", "def": "比喻共同生活或一起做事的人意見不同，各有各的打算。"}, {"w": "道不相謀", "def": "指思想志趣不相同，無法一起討論或共事。"}, {"w": "針鋒相對", "def": "比喻雙方的勢力、行為、言詞等尖銳的對立著，不相上下。"}]}, {"title": "成語充電站", "items": [{"w": "妙手丹青", "def": "繪畫技藝高超的人。"}, {"w": "畫中有詩", "def": "泛指畫作中有詩意。"}, {"w": "鬼斧神工", "def": "形容技藝精巧，非人力所能及。"}, {"w": "栩栩如生", "def": "形容貌態逼真，彷彿具有生命力。"}, {"w": "匠心獨運", "def": "運用精巧高妙的創作構想與心思。"}, {"w": "精雕細琢", "def": "形容做事仔細用心，多指藝術品的創作。"}, {"w": "鐵畫銀鉤", "def": "形容筆畫如鐵般的剛勁，如銀般的柔媚。"}, {"w": "巧奪天工", "def": "雖然是人工所製，但是精巧勝過天然，形容技藝巧妙。"}, {"w": "咳唾成珠", "def": "比喻言談不凡或文詞優美。"}, {"w": "文思泉湧", "def": "比喻行文時，思路迅速豐暢。"}, {"w": "夢筆生花", "def": "比喻文人才思泉湧、文筆富麗。"}, {"w": "一揮而就", "def": "形容在書畫作文方面的敏捷高超。"}, {"w": "文不加點", "def": "形容文思敏捷、下筆成章，通篇無所塗改。"}, {"w": "自出機杼", "def": "比喻詩文的組織、構思，別出心裁，獨創新意。"}, {"w": "尋章摘句", "def": "寫作時，只知套用前人的章法、語句，而不講究創造性。"}]}]}, {"lesson": "3上 第九課 喂，出來！", "themes": [{"title": "與「說話」有關的成語", "items": [{"w": "口說無憑", "def": "光靠嘴說不足為證。"}, {"w": "異口同聲", "def": "形容眾口一辭，意見相同。"}, {"w": "能說善道", "def": "擅長於以言語或道理來說服別人。"}, {"w": "眾說紛紜", "def": "各式各樣的說法紛亂不一致。"}, {"w": "談天說地", "def": "上至天文，下至地理，無所不談。形容人知識豐富，能廣泛談論各種事情。亦指漫無邊際的高談闊論。"}, {"w": "自圓其說", "def": "自行解釋自己牽強矛盾的說法，使無破綻。"}, {"w": "七嘴八舌", "def": "形容人多口雜，議論紛亂的樣子。"}]}, {"title": "與「犯法」有關的成語", "items": [{"w": "漏網之魚", "def": "比喻僥倖逃避法律制裁的人。亦比喻驚慌逃離危險的人。"}, {"w": "逍遙法外", "def": "犯罪者逃過法律制裁，仍自由行動。"}, {"w": "罪有應得", "def": "為所犯的錯承受應得的懲罰。"}, {"w": "天網恢恢", "def": "上天的法網雖寬大稀疏，但絕不會縱容作惡的壞人。後以比喻犯法者難逃國法制裁。"}, {"w": "法外施恩", "def": "除應負的刑責外，在法律許可的範圍內儘量給予方便。"}]}, {"title": "其他補充成語", "items": [{"w": "欲壑難填", "def": "形容人的欲望有如深谷，永難滿足。"}, {"w": "貪得無厭", "def": "貪心而不滿足。"}, {"w": "咎由自取", "def": "所有的責難、災禍都是自己找來的。語含自作自受之意。"}, {"w": "禍福相倚", "def": "禍與福互相依存，往往福因禍而生，而禍中也潛伏有福的因子。"}, {"w": "投機取巧", "def": "利用時機，獲取利益。"}, {"w": "雨後春筍", "def": "比喻事物在某一時期後大量湧現，迅速發展。"}, {"w": "耐人尋味", "def": "意味深遠雋永，讓人反覆尋思體會。"}, {"w": "千山萬壑", "def": const TONE_R={'ˊ':1,'ˇ':1,'ˋ':1,'ˉ':1};
function vzhuyin(syl){syl=(syl||'').trim();let base=syl,tone='',pos='';if(syl[0]==='˙'){tone='˙';pos='t';base=syl.slice(1);}else{const last=syl[syl.length-1];if(TONE_R[last]){tone=last;pos='r';base=syl.slice(0,-1);}}let h='<span class="zn">';for(const ch of base)h+=`<span class="zsym">${ch}</span>`;if(tone)h+=`<span class="zt zt-${pos}">${tone}</span>`;return h+'</span>';}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* 誘答挑易混淆：注音相似度(同音>同音異調>共用聲母/韻母)、成語共用字 */
function toneless(s){return (s||'').replace(/[ˊˇˋ˙]/g,'');}
function simYin(a,b){if(!a||!b)return 0;if(a===b)return 6;var ta=toneless(a),tb=toneless(b);if(ta===tb)return 5;var i=0;while(i<ta.length&&i<tb.length&&ta[i]===tb[i])i++;var j=0;while(j+i<ta.length&&j+i<tb.length&&ta[ta.length-1-j]===tb[tb.length-1-j])j++;return i+j+(ta[0]===tb[0]?0.5:0);}
function idiomDist(w,all,n){var wc=new Set([...String(w)]),wl=[...w].length;var cand=[...new Set(all)].filter(x=>x&&x!==w);var scored=cand.map(function(x){var sh=0;for(const c of new Set([...x]))if(wc.has(c))sh++;return {x:x,s:sh*2+([...x].length===wl?1:0)};}).sort((a,b)=>b.s-a.s);var top=scored.slice(0,Math.max(n+4,8)).map(o=>o.x);return shuffle(top).slice(0,n);}
function hanLen(w){return (w.match(/[一-鿿]/g)||[]).length}
function fit(w){const n=hanLen(w);if(n<=1)return 72;if(n<=2)return 60;if(n<=3)return 50;if(n<=5)return 40;return 30;}
function fitFlip(w){const n=hanLen(w);if(n<=2)return 56;if(n<=3)return 48;if(n<=5)return 40;return 32;}
function rubyHTML(word,zhuyin,size){const chars=[...word],syl=zhuyin.split(' ').filter(Boolean);if(chars.length!==syl.length)return `<div class="word" style="font-size:${size}px">${word}</div><div class="pinyin" style="color:var(--accent);font-style:normal;font-size:18px;letter-spacing:2px">${zhuyin}</div>`;let h='<div class="rubyword">';chars.forEach((c,i)=>h+=`<span class="ruby"><span class="rb" style="font-size:${size}px">${c}</span>${vzhuyin(syl[i])}</span>`);return h+'</div>';}
function egHTML(word,e){if(!e)return "";return `<div class="eg">例：${e.split(word).join('<b>'+word+'</b>')}</div>`;}

/* 近似字 */
function ru(c,y){return `<span class="ruby"><span class="rb">${c}</span>${vzhuyin(y)}</span>`;}
function simWord(w,y){const cs=[...w],ys=y.split(' ').filter(Boolean);let h='<span class="sim-word">';cs.forEach((c,i)=>h+=ru(c,ys[i]||''));return h+'</span>';}
function renderSim(el,ds){
  el.innerHTML=`<div class="seg" id="smode"><button data-m="browse" class="on">📖 瀏覽</button><button data-m="quiz">✍️ 測驗</button></div>

  el.querySelector('#sarea').innerHTML=h;

  ds.sim.forEach(g=>{const group=g.chars.map(x=>x.c);g.chars.forEach(ch=>{if(!ch.lesson)return;ch.egs.forEach(e=>{const i=[...e[0]].indexOf(ch.c);if(i>=0)SIMQ.push({word:e[0],yin:e[1],ans:ch.c,idx:i,group});});});});
  let order=[],pos=0,done=0,right=0,total=0,roundLen=10,round;

/* 字音字形測驗（成語 / 字詞） */
function renderZiQuiz(el,ds,kind){
  const pool=kind==='成語'?ds.data.filter(d=>d.type==='成語'):ds.data.filter(d=>d.type==='單字'||d.type==='詞語');

  const q=s=>el.querySelector(s);
  let order=[],pos=0,done=0,right=0,total=0,roundLen=10,round;

  function upd(){q('#qDone').textContent=`${done}/${total}`;q('#qRight').textContent=right;q('#qRate').textContent=(done?Math.round(right/done*100):0)+'%';}
  function soundDist(d){return shuffle(pool.filter(x=>x.word!==d.word)).slice(0,3).map(x=>x.zhuyin);}
  function formDist(d){const chars=[...d.word],cand=new Set();const idxs=chars.map((c,i)=>LL[c]?i:-1).filter(i=>i>=0);if(idxs.length){const ki=idxs[idxs.length-1];for(const s of shuffle(LL[chars[ki]])){const w=chars.slice();w[ki]=s;const cw=w.join('');if(cw!==d.word){cand.add(cw);if(cand.size>=3)break;}}}if(cand.size<3){let same=pool.filter(x=>x.word!==d.word&&x.type===d.type&&hanLen(x.word)===hanLen(d.word));if(same.length<3)same=pool.filter(x=>x.word!==d.word);for(const x of shuffle(same)){if(!cand.has(x.word)&&x.word!==d.word){cand.add(x.word);if(cand.size>=3)break;}}}return [...cand].slice(0,3);}

    else{correct=d.word;const opts=shuffle([d.word,...formDist(d)]);s=`<div class="q-prompt"><div class="q-type form">字形 · 選正確的字</div><div class="q-big" style="font-size:26px;color:var(--accent)">${d.zhuyin}</div><div class="q-small">${d.senses[0].m}</div></div><div class="options">`;opts.forEach((o,i)=>s+=`<button class="opt" data-v="${o}"><span class="k">${'ABCD'[i]}</span><span style="font-family:'DFKai-SB','Kaiti TC',serif;font-size:20px">${o}</span></button>`);}

  }
  function result(){const pct=total?Math.round(right/total*100):0;const msg=pct>=90?'太厲害了！🏆':pct>=70?'不錯，再加油！💪':'多練習幾次會更好！📚';q('#qArea').innerHTML=`<div class="result"><div class="big">${pct}%</div><p>答對 ${right} / ${total} 題<br>${msg}</p><button class="btn btn-main" style="max-width:240px;margin:0 auto" id="qagain">再測一次 🔄</button></div>`;q('#qagain').onclick=start;}

  function paintFilter(){q('#fqlf').innerHTML=twoFilterHTML(ds.lessons,vf,lf);
    const v=q('#fqlf .vsel'),l=q('#fqlf .lsel');
    if(v)v.onchange=()=>{vf=v.value;lf='全部';paintFilter();start();};
    if(l)l.onchange=()=>{lf=l.value;paintFilter();start();};}
  function buildPool(){const sel=twoFilter(ds.lessons,vf,lf);pool=[];sel.forEach(L=>L.items.forEach(it=>pool.push(it)));}
  function start(){round=newRound();buildPool();order=shuffle(pool.map((_,i)=>i));if(roundLen>0)order=order.slice(0,roundLen);total=order.length;pos=0;done=0;right=0;upd();next();}
  function upd(){q('#fqDone').textContent=`${done}/${total}`;q('#fqRight').textContent=right;q('#fqRate').textContent=(done?Math.round(right/done*100):0)+'%';}
  function formOpts(it){const cand=new Set();if(LLALL[it.char])shuffle(LLALL[it.char]).forEach(c=>{if(cand.size<3&&c!==it.char)cand.add(c);});if(cand.size<3){const byYin=pool.filter(x=>x.char!==it.char).map(x=>({c:x.char,s:simYin(it.yin,x.yin)})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s);for(const o of byYin){if(cand.size<3&&o.c!==it.char)cand.add(o.c);}}if(cand.size<3)shuffle(pool.filter(x=>x.ask==='form'&&x.char!==it.char)).forEach(x=>{if(cand.size<3&&x.char!==it.char)cand.add(x.char);});return shuffle([it.char,...cand]);}
  function soundOpts(it){const yins=[...new Set(pool.filter(x=>x.yin&&x.yin!==it.yin).map(x=>x.yin))];const scored=yins.map(y=>({y:y,s:simYin(it.yin,y)})).sort((a,b)=>b.s-a.s);const cand=shuffle(scored.slice(0,Math.max(6,3)).map(o=>o.y)).slice(0,3);if(cand.length<3)shuffle(yins).forEach(y=>{if(cand.length<3&&cand.indexOf(y)<0)cand.push(y);});return shuffle([it.yin,...cand]);}
  function next(){
    if(pos>=order.length)return result();
    const it=pool[order[pos]];let s,correct;
    if(it.ask==='form'){
      correct=it.char;const blanked=it.word.replace(it.char,'<span class="blank">？</span>');const opts=formOpts(it);
      s=`<div class="q-prompt"><div class="q-type form">字形 · 選國字</div><div class="q-big" style="font-size:32px">${blanked}</div><div class="q-small">${it.yin}</div></div><div class="options">`;
      opts.forEach((o,i)=>s+=`<button class="opt" data-v="${o}"><span class="k">${'ABCD'[i]}</span><span style="font-family:'DFKai-SB','Kaiti TC',serif;font-size:24px">${o}</span></button>`);
    }else{
      correct=it.yin;const hw=it.word.replace(it.char,`<span style="color:var(--accent)">${it.char}</span>`);const opts=soundOpts(it);
      s=`<div class="q-prompt"><div class="q-type sound">字音 · 選注音</div><div class="q-big" style="font-size:30px">${hw}</div><div class="q-small">「${it.char}」的注音？</div></div><div class="options">`;
      opts.forEach((o,i)=>s+=`<button class="opt" data-v="${o}"><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`);
    }
    s+=`</div><div class="feedback" id="fqfb"></div>`;q('#fqArea').innerHTML=s;
    q('#fqArea').querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{const ok=btn.dataset.v===correct;q('#fqArea').querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===correct)b.classList.add('correct');if(b===btn&&!ok)b.classList.add('wrong');});done++;if(ok)right++;upd();if(!ok)logWrong({round,t:new Date().toISOString(),ds:ds.name,type:'字音字形題庫·'+(it.ask==='form'?'填國字':'填注音'),head:it.word,yin:it.yin,prompt:it.ask==='form'?'選正確國字':('「'+it.char+'」的注音'),correct:correct,you:btn.dataset.v});const fb=q('#fqfb');fb.className='feedback '+(ok?'ok':'no');fb.innerHTML=(ok?'✔ 答對了！':'✘ 正確答案：'+correct)+`<div class="fb-def">${it.word}（${it.yin}）</div><button class="btn btn-main" style="margin-top:12px;max-width:220px" id="fqnx">下一題 →</button>`;q('#fqnx').onclick=()=>{pos++;next();};});
  }
  function result(){const pct=total?Math.round(right/total*100):0;const msg=pct>=90?'太厲害了！🏆':pct>=70?'不錯，再加油！💪':'多練習幾次會更好！📚';q('#fqArea').innerHTML=`<div class="result"><div class="big">${pct}%</div><p>答對 ${right} / ${total} 題<br>${msg}</p><button class="btn btn-main" style="max-width:240px;margin:0 auto" id="fqagain">再測一次 🔄</button></div>`;q('#fqagain').onclick=start;}
  el.querySelectorAll('#fqlen button').forEach(b=>b.onclick=()=>{el.querySelectorAll('#fqlen button').forEach(x=>x.classList.remove('on'));b.classList.add('on');roundLen=parseInt(b.dataset.len);start();});
  paintFilter();start();
}

/* 錯題本 */
function renderWrong(el){
  let auth='';
  if(!SB_ON){auth=`<div class="wnote">（雲端會員尚未設定）</div>`;}
  else if(isLoggedIn()){auth=`<div class="authbar"><span>☁ 已登入：<b>${acctName()}</b></span><button class="btn btn-ghost" id="alogout" style="flex:0 0 auto;padding:8px 12px;font-size:13px">登出</button></div>`;}
  else{auth=`<div class="authcard"><div class="authrow"><input id="aacc" placeholder="帳號" autocomplete="username"><input id="apw" type="password" placeholder="密碼（至少 6 碼）" autocomplete="current-password"></div><div class="authrow"><button class="btn btn-main" id="alogin">登入</button><button class="btn btn-ghost" id="areg">註冊新帳號</button></div><div class="authmsg" id="amsg">登入後錯題會存到雲端，換手機或電腦重新登入都看得到。</div></div>`;}
  el.innerHTML=auth+`<div id="wbody"></div>`;
  if(SB_ON&&isLoggedIn()){el.querySelector('#alogout').onclick=()=>{doLogout();renderWrong(el);};}
  else if(SB_ON){
    const gv=id=>el.querySelector(id).value, msg=t=>{el.querySelector('#amsg').innerHTML=t;};
    el.querySelector('#alogin').onclick=async()=>{msg('登入中…');const r=await sbLogin(gv('#aacc'),gv('#apw'));if(r.error)msg('⚠ '+r.error);else{MEM=null;CLOUD_READY=false;await syncCloud();renderWrong(el);}};
    el.querySelector('#areg').onclick=async()=>{if(!gv('#aacc').trim()){msg('⚠ 請輸入帳號');return;}if((gv('#apw')||'').length<6){msg('⚠ 密碼至少 6 碼');return;}msg('註冊中…');const r=await sbSignup(gv('#aacc'),gv('#apw'));if(r.error)msg('⚠ '+r.error);else{MEM=null;CLOUD_READY=false;await syncCloud();renderWrong(el);}};
  }
  const body=el.querySelector('#wbody');
  if(isLoggedIn()&&!CLOUD_READY){body.innerHTML=`<div class="result"><p>☁ 載入雲端錯題中…</p></div>`;syncCloud().then(()=>renderWrong(el));return;}
  renderWrongBody(body,el);
}
function renderWrongBody(body,root){
  const all=loadMist();
  const groups=[],idx={};
  all.forEach(r=>{if(!(r.round in idx)){idx[r.round]=groups.length;groups.push({t:r.t,ds:r.ds,type:r.type,items:[]});}groups[idx[r.round]].items.push(r);});
  groups.reverse();
  let h=`<div class="wbar"><span>共 ${all.length} 題錯誤 · ${groups.length} 次測驗</span><div style="display:flex;gap:6px;flex:0 0 auto"><button class="btn btn-ghost" id="wexport" style="flex:0 0 auto;padding:8px 10px;font-size:13px">⬇ 匯出</button><button class="btn btn-ghost" id="wimport" style="flex:0 0 auto;padding:8px 10px;font-size:13px">⬆ 匯入</button><button class="btn btn-ghost" id="wclear" style="flex:0 0 auto;padding:8px 10px;font-size:13px">🗑 清空</button></div></div><input type="file" id="wfile" accept="application/json,.json" style="display:none">`;
  if(!isLoggedIn()&&!CANPERSIST)h+=`<div class="wnote">⚠ 此瀏覽器未開放本機儲存，錯題僅保留至本次關閉前</div>`;
  if(!groups.length){h+=`<div class="result"><p>目前沒有錯題，繼續加油！🎉<br><span style="font-size:13px">去做測驗，答錯的題目會自動記到這裡${isLoggedIn()?'（雲端）':''}。</span></p></div>`;}
  else{groups.forEach(g=>{h+=`<div class="theme"><h3><span class="lesson-tag">${fmtTime(g.t)}</span>${g.ds} · ${g.type} · 答錯 ${g.items.length} 題</h3>`;g.items.forEach(it=>{h+=`<div class="wrong-item"><div class="wi-head">${it.head}${it.yin?`<span class="wi-yin">${it.yin}</span>`:''}</div>${it.prompt?`<div class="wi-prompt">${it.prompt}</div>`:''}<div class="wi-ans"><span class="ok">正解：${it.correct}</span><span class="no">你選：${it.you}</span></div></div>`;});h+=`</div>`;});}
  body.innerHTML=h;
  body.querySelector('#wclear').onclick=async()=>{if(confirm('確定要清空所有錯題紀錄嗎？此動作無法復原。')){if(isLoggedIn()){await cloudClear();MEM=[];}else{persistLocal([]);MEM=[];}renderWrong(root);}};
  body.querySelector('#wexport').onclick=()=>{const data=loadMist();if(!data.length){alert('目前沒有錯題可匯出');return;}const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');const n=new Date(),p=x=>(''+x).padStart(2,'0');a.href=url;a.download=`錯題本_${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}_${p(n.getHours())}${p(n.getMinutes())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};
  const fileEl=body.querySelector('#wfile');
  body.querySelector('#wimport').onclick=()=>fileEl.click();
  fileEl.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const arr=JSON.parse(rd.result);if(!Array.isArray(arr))throw 0;const cur=loadMist();const sig=r=>[r.round,r.t,r.head,r.you].join('|');const seen=new Set(cur.map(sig));const fresh=arr.filter(r=>r&&r.head&&!seen.has(sig(r)));if(isLoggedIn()){for(const r of fresh){await cloudInsert(r);MEM.push(r);}}else{fresh.forEach(r=>cur.push(r));cur.sort((a,b)=>(''+(a.t||'')).localeCompare(''+(b.t||'')));persistLocal(cur);}alert('已匯入 '+fresh.length+' 題（檔案 '+arr.length+' 題，重複略過）');renderWrong(root);}catch(err){alert('匯入失敗：檔案格式不正確');}};rd.readAsText(f);};
}

renderDsSeg();renderTabs();renderStage();
</script>
