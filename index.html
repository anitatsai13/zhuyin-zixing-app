lesson": "2上 自學三 買春聯", "themes": [{"title": "與「寫字、寫作」有關的成語", "items": [{"w": "力透紙背", "def": "寫字運筆的力量能穿透紙張到達紙的另一面。形容寫字、畫畫筆力遒勁有力。"}, {"w": "入木三分", "def": "晉朝 王羲之書祝版，工人削版，墨跡透入木板三分的故事。本形容筆力遒勁。後比喻評論深刻中肯或描寫精到生動。"}, {"w": "洛陽紙貴", "def": "晉代 左思寫成〈三都賦〉後，時人競相傳寫，使洛陽的紙價上漲而昂貴。後比喻著作風行一時，流傳甚廣。"}, {"w": "臨池學書", "def": "相傳東漢 張芝學習書法很勤，家中衣帛都被寫上字，然後再煮白。他在池邊學書法，池水都被染黑了。後人稱學習書法為「臨池學書」。"}, {"w": "煮字療飢", "def": "指賣文維生。"}, {"w": "揮灑自如", "def": "隨意寫作詩文或書畫，不受拘束。"}, {"w": "舞文弄墨", "def": "指玩弄法條作弊，敗壞法紀。後比喻賣弄筆墨文辭。"}]}, {"title": "與「比較」有關的成語", "items": [{"w": "一較高下", "def": "互相較量以分出勝負、優劣。"}, {"w": "不分軒輊", "def": "相比較的結果，分不出高下。"}, {"w": "平分秋色", "def": "形容二者一樣出色，分不出高下。"}, {"w": "判若雲泥", "def": "比喻相差極為懸殊。"}]}, {"title": "與「生命力」有關的成語", "items": [{"w": "生意盎然", "def": "形容充滿生機，生命力旺盛。"}, {"w": "栩栩如生", "def": "形容貌態逼真，彷彿具有生命力。"}, {"w": "躍然紙上", "def": "活躍的呈現於紙上。形容描寫得非常生動逼真。"}]}, {"title": "其他補充成語", "items": [{"w": "別出心裁", "def": "獨出巧思，不同流俗。"}, {"w": "招財進寶", "def": "招來財氣，以發財致富。"}, {"w": "光耀門楣", "def": "光彩照耀家門，使家人覺得光榮。"}, {"w": "神仙眷屬", "def": "比喻婚姻美滿、感情和睦的夫婦。"}, {"w": "嶄露頭角", "def": "比喻顯示特出的才華或本領。"}, {"w": "酣暢淋漓", "def": "極為暢達痛快的樣子。"}, {"w": "追根究柢", "def": "追查探究事物的根本。"}, {"w": "糊里糊塗", "def": "形容人行事極為迷糊或不明道理。"}, {"w": "奴顏媚骨", "def": "卑躬屈膝，奉承諂媚的樣子。"}, {"w": "音容宛在", "def": "人的聲音與容貌彷若在眼前，多用於弔唁之詞。"}, {"w": "蜂擁而上", "def": "比喻如蜂般簇擁上來。"}, {"w": "力排眾議", "def": "為維持自己的意見，竭力排除各種不同的議論。"}]}, {"title": "成語充電站", "items": [{"w": "筆走龍蛇", "def": "比喻文筆揮灑自如或書法優美。"}, {"w": "跌宕遒麗", "def": "形容文詞或書法豪放不羈，剛勁。"}, {"w": "鐵畫銀鉤", "def": "形容筆畫如鐵般的剛勁，如銀般。"}, {"w": "揮翰成風", "def": "形容寫字或繪畫極為快速和熟。"}, {"w": "龍飛鳳舞", "def": "形容筆勢生動活潑，後亦用來謔。"}, {"w": "矯若驚龍", "def": "形容筆勢、舞姿等的伸縮、騰轉，。"}, {"w": "筆力萬鈞", "def": "形容書法筆畫蒼勁有力。或形容。"}]}]}, {"lesson": "2下 第一課 一棵開花的樹", "themes": [{"title": "與「花」有關的成語", "items": [{"w": "花好月圓", "def": "比喻人事美好圓滿。常用於新婚祝頌之詞。"}, {"w": "花枝招展", "def": "比喻女子打扮美麗、婀娜多姿的樣子。"}, {"w": "花容月貌", "def": "形容女子容貌美好。"}, {"w": "花團錦簇", "def": "形容五彩繽紛、繁華美麗的樣子。簇，音ㄘㄨˋ。"}, {"w": "天花亂墜", "def": "形容說話言詞巧妙，有聲有色，非常動聽。多指誇大而不切實際。"}, {"w": "心花怒放", "def": "形容心情像盛開的花朵般舒暢快活。"}, {"w": "借花獻佛", "def": "比喻借用他人的東西來作人情。"}, {"w": "落花流水", "def": "形容零落殘敗，亂七八糟的景象。"}, {"w": "曇花一現", "def": "比喻人或事物一出現便迅速消失。曇，音ㄊㄢˊ。"}, {"w": "鏡花水月", "def": "比喻空幻不實在。"}, {"w": "柳暗花明", "def": "比喻在曲折艱辛之後，忽然絕處逢生，另有一番情景。"}, {"w": "人面桃花", "def": "比喻男子思念的意中人或與意中人無緣再相見。"}, {"w": "火樹銀花", "def": "形容燈火通明，燈光燦爛的景象。"}, {"w": "舌粲蓮花", "def": "形容口才好。"}, {"w": "妙筆生花", "def": "文思俊逸，寫作能力特強。或稱譽文章佳妙。"}, {"w": "走馬看花", "def": "比喻略觀事物外象，而不究其底蘊。"}, {"w": "明日黃花", "def": "比喻過時的事物。"}, {"w": "錦上添花", "def": "比喻美上加美，喜上加喜。"}, {"w": "霧裡看花", "def": "比喻看不清楚事情的真相。"}, {"w": "鐵樹開花", "def": "比喻事物罕見或極難實現。"}]}, {"title": "與「樹」有關的成語", "items": [{"w": "樹大招風", "def": "比喻個人名聲太大，容易招來妒嫉毀謗。"}, {"w": "獨樹一格", "def": "比喻自成一家，擁有獨自的品味和風格。"}, {"w": "百年樹人", "def": "形容培育人才的不容易。"}]}, {"title": "其他補充成語", "items": [{"w": "人多勢眾", "def": "人多勢力就大。"}, {"w": "入木三分", "def": "比喻評論深刻中肯或描寫精到生動。"}, {"w": "風吹草動", "def": "比喻輕微的動靜、變化。"}, {"w": "格格不入", "def": "彼此牴觸，不相調和。"}, {"w": "動人心弦", "def": "感人至為深切，引起觀聽人的共鳴。"}, {"w": "眾望所歸", "def": "深得眾人擁護、愛戴。"}, {"w": "弦外之音", "def": "比喻言外之意。"}, {"w": "分庭抗禮", "def": "比喻平起平坐，地位相當。"}, {"w": "歸心似箭", "def": "形容回家的心意非常迫"}]}, {"title": "與「愛情堅貞」有關的成語", "items": [{"w": "情之所鍾", "def": "情感所專注的。"}, {"w": "白頭偕老", "def": "形容夫妻恩愛到老。"}, {"w": "山盟海誓", "def": "對著山、海盟誓，以示堅定永久。多用以表示愛情的真誠不變。"}, {"w": "雙宿雙飛", "def": "本指鳥類雌雄相隨，後用來比喻男女因情深而起居相依，形影不離。"}, {"w": "海枯石爛", "def": "海水枯乾，石頭風化粉碎。形容經歷時間長久。後多用以表示意志堅定，永久不變的盟誓之詞。"}]}, {"title": "與「期待、盼望」有關的成語", "items": [{"w": "懸懸而望", "def": "形容非常盼望、掛念。"}, {"w": "眼穿腸斷", "def": "形容盼望渴切，傷心極了。"}, {"w": "望穿秋水", "def": "形容盼望的深切，同「望眼欲穿」。"}, {"w": "朝思暮想", "def": "白天晚上都在想念。形容思念極深。"}, {"w": "翹首引領", "def": "抬起頭，伸長脖子遠望。形容盼望殷切。"}, {"w": "夢寐以求", "def": "睡夢中都在尋找、追求。形容願望強烈、迫切。"}, {"w": "拭目以待", "def": "擦亮眼睛等待著。比喻期待事情的發展及結果。"}]}, {"title": "與「失落、失望」有關的成語", "items": [{"w": "大失所望", "def": "非常失望。"}, {"w": "心灰意冷", "def": "心情失望，意志消沉。"}, {"w": "垂頭喪氣", "def": "形容失意沮喪的樣子。"}, {"w": "悵然若失", "def": "神志迷惘，若有所失的樣子。"}, {"w": "萬念俱灰", "def": "所有念頭全化成了灰。比喻心灰意冷。"}, {"w": "槁木死灰", "def": "形容人因遭受挫折變故而灰心絕望的樣子。"}]}, {"title": "詠嘆愛情的千古名句", "items": [{"w": "死生契闊，與子成說。執子之手，與子偕老。（《詩經．邶風．擊鼓》）", "def": ""}, {"w": "天長路遠魂飛苦，夢魂不到關山難。長相思，摧心肝。（李白〈長相思〉其一）", "def": ""}, {"w": "還君明珠雙淚垂，恨不相逢未嫁時。（張籍〈節婦吟〉）", "def": ""}, {"w": "曾經滄海難為水，除卻巫山不是雲。（元稹〈離思〉其四）", "def": ""}, {"w": "在天願作比翼鳥，在地願為連理枝。（白居易〈長恨歌〉）", "def": ""}, {"w": "春蠶到死絲方盡，蠟炬成灰淚始乾。（李商隱〈無題〉）", "def": ""}, {"w": "得成比目何辭死，願作鴛鴦不羨仙。（盧照鄰〈長安古意〉）", "def": ""}, {"w": "衣帶漸寬終不悔，為伊消得人憔悴。（柳永〈蝶戀花〉）", "def": ""}, {"w": "天涯地角有窮時，只有相思無盡處。（晏殊〈玉樓春〉）", "def": ""}, {"w": "淚眼問花花不語，亂紅飛過秋千去。（歐陽脩〈蝶戀花〉其一）", "def": ""}, {"w": "兩情若是久長時，又豈在朝朝暮暮？（秦觀〈鵲橋仙〉）", "def": ""}, {"w": "恨人間，情是何物，直教生死相許。（元好問〈摸魚兒〉其一）", "def": ""}]}]}, {"lesson": "2下 第二課 樂府詩選——木蘭詩", "themes": [{"title": "與「戰爭」、「軍事」有關的成語", "items": [{"w": "所向披靡", "def": "比喻力量所到之處，敵人紛紛潰退。"}, {"w": "勢如破竹", "def": "比喻作戰或工作順利進行，毫無阻礙。"}, {"w": "旌旗蔽空", "def": "軍容壯盛的樣子。旌，音ㄐㄧㄥ。"}, {"w": "潰不成軍", "def": "指軍隊潰敗得不成個軍隊。形容遭到慘敗。"}, {"w": "節節敗退", "def": "因戰場上失利而不斷向後撤退。後泛指連連失利。"}, {"w": "兵馬倥傯", "def": "兵荒馬亂。倥傯，音ㄎㄨㄥˇ ㄗㄨㄥˇ。"}, {"w": "兵荒馬亂", "def": "形容戰爭所造成的混亂景象。"}, {"w": "兵連禍結", "def": "接連用兵，戰禍不絕。"}, {"w": "厲兵秣馬", "def": "磨利兵器，餵飽馬匹。指完成作戰準備。秣，音ㄇㄛˋ。"}, {"w": "嚴陣以待", "def": "預先做好嚴整的陣勢，準備迎擊來犯的敵人。比喻事先做好萬全的準備。"}, {"w": "解甲歸田", "def": "脫下鎧甲，回家種田。指軍人退伍後回鄉務農。"}, {"w": "投筆從戎", "def": "指棄文從軍以衛國建功。"}]}, {"title": "與「功績」有關的成語", "items": [{"w": "不世之功", "def": "世所罕有的功績。"}, {"w": "功成不居", "def": "建立了功勞而不歸功於自己。"}, {"w": "功成名就", "def": "事業有所成就，而且有名望。"}, {"w": "前功盡棄", "def": "將以往辛苦建立的功勞，全部廢棄。"}, {"w": "垂裕後昆", "def": "為後世子孫留下財富或功績。"}, {"w": "歌功頌德", "def": "歌頌功績和恩德。"}, {"w": "論功行賞", "def": "依據功績的大小，給予賞賜。"}, {"w": "戴罪立功", "def": "以有罪過之身去建立功勞，將功折罪。"}]}, {"title": "其他補充成語", "items": [{"w": "一決雌雄", "def": "比喻互相較量以決定勝敗、高下。"}, {"w": "太平盛世", "def": "天下安定，國家興盛的時代。"}, {"w": "自出機杼", "def": "比喻詩文的組織、構思，別出心裁，獨創新意。"}, {"w": "衣錦還鄉", "def": "形容人功成名就後榮歸故鄉。"}, {"w": "別出心裁", "def": "獨出巧思，不同流俗。"}, {"w": "所向無敵", "def": "形容力量強大，銳不可擋。"}, {"w": "拾人牙慧", "def": "比喻蹈襲他人的言論或主張。"}, {"w": "撲朔迷離", "def": "形容事物錯綜複雜，難以明瞭真相。"}, {"w": "整裝待發", "def": "整理行囊、用具，準備出發。"}, {"w": "獨具匠心", "def": "具有獨創性的想法、構思。"}]}]}, {"lesson": "2下 第三課 情緒是生命的指引", "themes": [{"title": "與「情緒」有關的成語", "items": [{"w": "樂不可支", "def": "形容快樂到了極點。"}, {"w": "喜上眉梢", "def": "喜悅之情流露於眉宇之間。"}, {"w": "心花怒放", "def": "形容心情像盛開的花朵般舒暢快活。"}, {"w": "喜怒無常", "def": "情緒變化不定，令人難以捉摸。"}, {"w": "目眥盡裂", "def": "形容怒目而視。眥，眼眶。"}, {"w": "義憤填膺", "def": "指胸中充滿因正義而激起的憤怒。"}, {"w": "怒髮衝冠", "def": "憤怒得頭髮直豎頂起帽子。形容盛怒的樣子。"}, {"w": "抑鬱寡歡", "def": "憂愁煩悶、不快樂的樣子。"}, {"w": "愁眉不展", "def": "雙眉緊鎖，很憂愁的樣子。"}, {"w": "悲不自勝", "def": "形容極度悲傷而無法承受。"}, {"w": "心曠神怡", "def": "心情開朗，精神愉悅。"}, {"w": "眉飛色舞", "def": "形容非常喜悅得意的神情。"}, {"w": "欣喜若狂", "def": "形容快樂、高興到了極點。"}, {"w": "手舞足蹈", "def": "手、腳舞動跳躍。形容非常高興喜悅的樣子。"}, {"w": "肝腸寸斷", "def": "比喻悲傷到了極點。"}, {"w": "黯然神傷", "def": "心情沮喪，神色憂傷。"}, {"w": "心如刀割", "def": "心像被刀割一樣。比喻極度痛苦。"}, {"w": "淚流滿面", "def": "淚水布滿整個臉龐。形容非常傷心。"}, {"w": "愁腸百結", "def": "憂愁纏結在腹中。比喻憂愁無從排解。"}]}, {"title": "與「指引、引導」有關的成語", "items": [{"w": "循循善誘", "def": "指循序漸進的誘導。"}, {"w": "誨人不倦", "def": "耐心教導人而不知倦怠。"}, {"w": "言傳身教", "def": "用言語和行動來教示他人。"}, {"w": "春風化雨", "def": "比喻師長和藹親切的教育。"}, {"w": "引人入勝", "def": "引領人進入美麗玄妙的境地。"}, {"w": "因勢利導", "def": "順著事物發展的趨勢加以引導。"}, {"w": "耳提面命", "def": "耳提，揪著對方耳朵提醒；面命，當面告訴。形容對人懇切教誨、叮嚀。"}, {"w": "拋磚引玉", "def": "自謙之詞，比喻先以自己較不好的意見或行為，來引起別人更為優秀的表現。"}, {"w": "振聾發聵", "def": "聲音大到使耳聾的人都能聽見。比喻大聲疾呼，以喚醒愚昧的人。聵，音ㄎㄨㄟˋ，耳聾的人。"}, {"w": "醍醐灌頂", "def": "將牛奶中精煉出來的乳酪澆到頭上。佛家以此比喻灌輸智慧，使人得到啟發，澈底醒悟。亦可比喻令人感到清涼舒適。"}]}]}, {"lesson": "2下 第四課 張釋之執法", "themes": [{"title": "與「法律」有關的成語", "items": [{"w": "奉公守法", "def": "以公事為重，謹守法紀，不徇私舞弊。"}, {"w": "明鏡高懸", "def": "比喻官吏執法嚴明，判案公正，或辦事明察秋毫，公正無私。"}, {"w": "執法如山", "def": "執行法律，立場堅定，不受動搖。"}, {"w": "以身試法", "def": "不顧法律的制裁而故意犯法。"}, {"w": "目無法紀", "def": "膽大妄為，無視於法律的存在。"}, {"w": "違法亂紀", "def": "違反法律，擾亂綱紀。"}, {"w": "逍遙法外", "def": "犯罪者逃過法律制裁，仍自由行動。"}, {"w": "言出法隨", "def": "話一說出，法律效力隨即有效執行。"}, {"w": "金科玉律", "def": "形容完善嚴密的法律條文。後比喻不可變更的信條。"}, {"w": "法外施恩", "def": "除應負的刑責外，在法律許可的範圍內盡量給予方便。"}, {"w": "懲一戒百", "def": "懲罰一人以警戒眾人。"}, {"w": "約法三章", "def": "泛指事先約好或規定的事。"}]}, {"title": "與「悔悟」有關的成語", "items": [{"w": "洗心革面", "def": "比喻澈底悔悟，改過自新。"}, {"w": "痛改前非", "def": "澈底改正以往的過錯。"}, {"w": "幡然悔悟", "def": "澈底的悔改、醒悟。幡，音ㄈㄢ。"}, {"w": "執迷不悟", "def": "堅持錯誤的觀念而不醒悟。"}]}, {"title": "其他補充成語", "items": [{"w": "口誅筆伐", "def": "用言語和文字來揭發、譴責他人的罪狀。"}, {"w": "井然有序", "def": "條理分明而有秩序。"}, {"w": "忍氣吞聲", "def": "受了氣也強自忍耐，不敢作聲抗爭。"}, {"w": "勃然大怒", "def": "忿怒的樣子。"}, {"w": "栩栩如生", "def": "形容貌態逼真，彷彿具有生命力。"}, {"w": "條理分明", "def": "有系統、層次，不紊亂。"}, {"w": "理直氣壯", "def": "理由正大、充分，則氣盛而無所畏懼。"}, {"w": "維妙維肖", "def": "模仿得精細巧妙，逼真傳神。"}, {"w": "據理力爭", "def": "根據事理，竭力爭取。"}, {"w": "積重難返", "def": "長期所形成的不良習慣與弊病，難以改變。"}]}, {"title": "成語充電站", "items": [{"w": "嚴刑峻法", "def": "嚴厲的刑法。"}, {"w": "貪贓枉法", "def": "貪汙受賄，破壞法紀。"}, {"w": "知法犯法", "def": "知道法律而故意犯法。"}, {"w": "無顏見江東父老", "def": "指心懷羞愧，沒臉見自己人。"}]}]}, {"lesson": "2下 第五課 我所知道的康橋", "themes": [{"title": "與「草」有關的成語", "items": [{"w": "草木皆兵", "def": "見到風吹草動，都以為是敵兵。比喻緊張、恐懼，疑神疑鬼。"}, {"w": "草菅人命", "def": "比喻輕視人命，濫殺無辜。菅，音ㄐㄧㄢ。"}, {"w": "寸草春暉", "def": "比喻父母恩情深重，子女即使竭盡心意也難以報答。"}, {"w": "結草銜環", "def": "比喻生前受恩死後圖報。"}, {"w": "疾風勁草", "def": "經過猛烈大風的吹襲，才知道堅韌的草挺立不倒。比喻在艱難困苦的環境下，才能考驗出人的堅強意志和節操。"}, {"w": "風吹草動", "def": "比喻輕微的動靜變化。"}]}, {"title": "與「日」有關的成語", "items": [{"w": "旭日東升", "def": "清晨太陽剛從東方升起。常用以比喻充滿活力，生機勃勃的景象。"}, {"w": "日薄西山", "def": "太陽已經接近西邊的山。比喻事物接近衰亡或人近老年，殘生將盡。"}, {"w": "蒸蒸日上", "def": "形容不斷進步發展。"}]}, {"title": "與「愉快」、「憂愁」有關的成語", "items": [{"w": "眉飛色舞", "def": "形容非常喜悅得意的神情。"}, {"w": "喜笑顏開", "def": "心情愉快，笑容滿面。"}, {"w": "眉開眼笑", "def": "十分愉快。"}, {"w": "愁眉不展", "def": "雙眉緊鎖，很憂愁的樣子。"}]}, {"title": "與「變化」有關的成語", "items": [{"w": "瞬息萬變", "def": "形容在極短的時間內變化迅速。"}, {"w": "千變萬化", "def": "形容變化無窮。"}, {"w": "變幻莫測", "def": "事物變化多端，難以預測。"}, {"w": "朝令夕改", "def": "比喻政令、主張或意見反覆無常。"}, {"w": "千篇一律", "def": "形式或內容毫無變化。"}]}, {"title": "其他補充成語", "items": [{"w": "方興未艾", "def": "正在蓬勃發展中，一時不會停止。"}, {"w": "栩栩如生", "def": "形容貌態逼真，彷彿具有生命力。"}, {"w": "荒誕不經", "def": "荒唐而不近情理。"}, {"w": "曙光乍現", "def": "比喻事情在混沌不明中突然出現一線光明、一絲希望。"}, {"w": "如沐春風", "def": "比喻遇到良師誠摯教誨的感受。"}, {"w": "伺機而動", "def": "等候適當的時機再行動。"}]}]}, {"lesson": "2下 第六課 迷途羔羊——弗氏海豚", "themes": [{"title": "「不□不□」式的成語", "items": [{"w": "不仁不義", "def": "比喻心腸惡毒，做事違反常理。"}, {"w": "不折不扣", "def": "完完全全的、一點都不打折扣的。"}, {"w": "不卑不亢", "def": "形容處事待人態度得體，不傲慢、不卑屈，恰到好處。"}, {"w": "不屈不撓", "def": "不因為受阻礙而屈服。"}, {"w": "不知不覺", "def": "不自覺。"}, {"w": "不倫不類", "def": "形容不像樣或不合格式。"}, {"w": "不疾不徐", "def": "不快不慢，形容能掌握事情進展的適當節奏。"}, {"w": "不偏不倚", "def": "不偏向任何一方。"}, {"w": "不痛不癢", "def": "形容無關緊要，沒有感覺。或比喻沒有切中要害，或不能解決問題。"}, {"w": "不愧不怍", "def": "行事光明正大，問心無愧。怍，音ㄗㄨㄛˋ。"}, {"w": "不聞不問", "def": "置身事外，漠不關心。"}, {"w": "不蔓不枝", "def": "比喻文章簡潔而流暢。"}]}, {"title": "其他補充成語", "items": [{"w": "一盤散沙", "def": "比喻人心渙散，缺乏凝合的力量，不能團結組織起來。"}, {"w": "七零八落", "def": "散亂的樣子。"}, {"w": "先發制人", "def": "凡事先下手取得主動權而制伏對方。"}, {"w": "判若兩人", "def": "形容一個人的行為態度，前後截然不同。"}, {"w": "抱頭鼠竄", "def": "形容像鼠懼人一般，狼狽逃走的樣子。"}, {"w": "盲人摸象", "def": "比喻以偏概全，而未能洞明真相。"}, {"w": "惘然若失", "def": "惆悵失意，有如失去了什麼似的。"}, {"w": "潛移默化", "def": "人的思想、性格或習慣，受到環境或別人的影響，於不知不覺中起了變化。"}, {"w": "驚慌失措", "def": "驚恐慌張不知如何是好。"}, {"w": "蠶食鯨吞", "def": "比喻不同的侵略併吞方式。"}]}, {"title": "與「動物」有關的成語", "items": [{"w": "投鼠忌器", "def": "比喻做事有所顧忌，不敢下手。"}, {"w": "汗牛充棟", "def": "形容書籍極多。"}, {"w": "羊質虎皮", "def": "比喻空有壯麗的外表，而缺乏實力。"}, {"w": "兔死狐悲", "def": "比喻因同類的死亡而感到悲傷。"}, {"w": "攀龍附鳳", "def": "趨附權貴，以求晉升。"}, {"w": "畫蛇添足", "def": "比喻多此一舉而於事無補。"}, {"w": "心猿意馬", "def": "形容心意不定，不能自持。"}, {"w": "殺雞取卵", "def": "比喻貪圖眼前微小的好處而損害更大的利益。"}, {"w": "白雲蒼狗", "def": "比喻世事變幻無常。"}, {"w": "風聲鶴唳", "def": "形容極為驚慌疑懼。"}, {"w": "引狼入室", "def": "比喻自招其禍。"}, {"w": "指鹿為馬", "def": "比喻顛倒是非。"}, {"w": "鳳毛麟角", "def": "比喻稀罕珍貴的人、物。"}, {"w": "千里鵝毛", "def": "比喻禮物雖輕而情意深重。"}, {"w": "蠶食鯨吞", "def": "比喻不同的侵略併吞方式。"}, {"w": "管中窺豹", "def": "比喻所見狹小，未得全貌。"}]}]}, {"lesson": "2下 第七課 陋室銘", "themes": [{"title": "與「龍」有關的成語", "items": [{"w": "龍韜虎略", "def": "比喻用兵有謀略膽識。韜，音ㄊㄠ。"}, {"w": "生龍活虎", "def": "比喻活潑勇猛，生氣勃勃。"}, {"w": "來龍去脈", "def": "比喻事情首尾始末條理清楚。"}, {"w": "乘龍快婿", "def": "比喻好女婿。"}, {"w": "畫龍點睛", "def": "比喻繪畫、作文時在最重要之處加上一筆，使全體更加生動傳神。"}, {"w": "群龍無首", "def": "一群人之中缺少領袖。"}, {"w": "攀龍附鳳", "def": "趨附權貴，以求進升。"}, {"w": "人中之龍", "def": "比喻品格高逸，出類拔萃的人。"}, {"w": "臥虎藏龍", "def": "比喻潛藏著人才。"}, {"w": "望子成龍", "def": "希望自己的兒子能成大器。"}]}, {"title": "與「學問」有關的成語", "items": [{"w": "才高八斗", "def": "比喻才學極高。"}, {"w": "學富五車", "def": "形容人書讀很多，學問淵博。"}, {"w": "目不識丁", "def": "比喻不識字或毫無學問。"}, {"w": "胸無點墨", "def": "比喻人毫無學識。"}, {"w": "孤陋寡聞", "def": "學識淺薄，見聞不廣泛。"}]}, {"title": "與「工作」有關的成語", "items": [{"w": "案牘勞形", "def": "形容因文書工作繁重而疲憊不堪。"}, {"w": "枵腹從公", "def": "形容不顧己身，勤於公事。枵，音ㄒㄧㄠ。"}, {"w": "尸位素餐", "def": "占著職位享受俸祿而不做事。尸，音ㄕ。"}, {"w": "遊手好閒", "def": "遊蕩貪玩，無所事事的樣子。"}]}, {"title": "其他補充成語", "items": [{"w": "三顧茅廬", "def": "比喻敬賢之禮或誠心邀請。"}, {"w": "中飽私囊", "def": "經手公款，以不正當的手段，從中牟利自肥。"}, {"w": "兩袖清風", "def": "比喻官吏清廉，毫無貪贓枉法之事。"}, {"w": "廉潔奉公", "def": "清廉正直，奉公守法。"}, {"w": "潔身自好", "def": "保持自身純潔清白，而不與人同流合汙。或指怕招惹是非，只管自己，不管別人。"}, {"w": "明哲保身", "def": "明達事理、洞見時勢的人，不參與會帶給自己危險的事。"}, {"w": "隨波逐流", "def": "比喻人沒有確定的方向和目標，只依從環境、潮流而行動。"}, {"w": "鴻鵠之志", "def": "比喻志向遠大。鵠，音ㄏㄨˊ。"}, {"w": "傾家蕩產", "def": "用盡全部的家產。"}, {"w": "素昧平生", "def": "向來不相識。"}, {"w": "敝帚自珍", "def": "比喻東西雖不好，卻因為是自己的，仍然非常珍視。"}]}, {"title": "與「高尚品德」有關的成語", "items": [{"w": "飲水思源", "def": "比喻不忘本。"}, {"w": "捨生取義", "def": "為維護正義真理而不惜犧牲生命。"}, {"w": "兄友弟恭", "def": "兄弟間感情和睦，能相互友愛尊敬。"}, {"w": "一介不取", "def": "形容人的操守清廉。"}, {"w": "謙沖自牧", "def": "為人處事謙和退讓，以修養自我的德性。"}, {"w": "豁然大度", "def": "形容心胸寬闊、度量宏大。"}, {"w": "澹泊明志", "def": "表恬靜寡欲，志向高遠。"}, {"w": "高風亮節", "def": "高尚的品格，堅貞的氣節。"}, {"w": "蕙質蘭心", "def": "比喻女子芳潔的心地、高雅的品德。"}, {"w": "風雨如晦", "def": "比喻處於險惡環境中也不改變其操守。"}, {"w": "潔身自好", "def": "保持自身純潔清白，而不與人同流合汙。"}]}, {"title": "與「居住環境」有關的成語", "items": [{"w": "畫棟雕梁", "def": "形容建築富麗堂皇。"}, {"w": "金碧輝煌", "def": "形容裝飾華彩絢爛。多指宮殿等建築物。"}, {"w": "瓊樓玉宇", "def": "形容精美華麗的樓閣。亦用以指月宮或神仙住的地方。"}, {"w": "窗明几淨", "def": "窗子明亮，茶几乾淨。形容居室明亮潔淨。"}, {"w": "室如懸磬", "def": "指居室空無所有，比喻非常貧窮。"}, {"w": "蓬門蓽戶", "def": "用蓬蓽做成的門戶。形容貧苦人家簡陋的居室。"}, {"w": "家徒四壁", "def": "家中只剩四面牆壁。形容家境貧困，一無所有。"}]}]}, {"lesson": "2下 第八課 成功是失敗之母", "themes": [{"title": "與「成」、「敗」有關的成語", "items": [{"w": "一敗塗地", "def": "形容失敗到無法收拾的地步。"}, {"w": "反敗為勝", "def": "從敗勢中得到勝利。"}, {"w": "木已成舟", "def": "木材已經做成船隻。比喻已成事實，無法改變。"}, {"w": "功成名就", "def": "事業有所成就，而且有名望。"}, {"w": "白首無成", "def": "年老而一事無成。"}, {"w": "老成練達", "def": "老練持重、通達事理。"}, {"w": "身敗名裂", "def": "事業、地位喪失，名譽毀壞。比喻人澈底失敗。"}, {"w": "泣不成聲", "def": "哭得發不出聲音。形容十分悲傷。"}, {"w": "殘兵敗將", "def": "戰敗後殘餘的兵將。"}, {"w": "屢戰屢敗", "def": "每次打仗都失敗。"}]}, {"title": "與「驕傲」有關的成語", "items": [{"w": "志驕意滿", "def": "形容驕傲自滿的樣子。"}, {"w": "恃寵而驕", "def": "倚仗得寵而驕傲自大。"}, {"w": "傲世輕物", "def": "傲慢驕橫，輕視他人。"}, {"w": "傲賢慢士", "def": "用輕視怠慢的態度對待賢人。"}, {"w": "驕兵必敗", "def": "比喻自負強大而輕敵的軍隊必會打敗仗。"}]}, {"title": "與「說話」有關的成語", "items": [{"w": "不由分說", "def": "不容許分辯解釋。"}, {"w": "仗義執言", "def": "伸張正義，激昂陳詞。"}, {"w": "守口如瓶", "def": "嘴像瓶口一樣封得嚴緊。比喻嚴守祕密。"}, {"w": "肺腑之言", "def": "發自內心的真話。"}, {"w": "流言蜚語", "def": "本指製造不實的傳言，用來詆毀他人。後泛指謠言。蜚，音ㄈㄟ。"}, {"w": "現身說法", "def": "比喻以親身經歷為例證，來勸導別人。"}, {"w": "誇誇其談", "def": "言談浮誇，不切實際。"}, {"w": "違心之論", "def": "違背本心的言論。"}]}, {"title": "與「成敗」有關的成語、諺語", "items": [{"w": "成敗利鈍", "def": "成功失敗與順利挫折。"}, {"w": "功敗垂成", "def": "事情在即將成功時失敗了。"}, {"w": "成事不足，敗事有餘", "def": "無能力把事情辦好，卻往往把事情弄壞。"}, {"w": "成者為王，敗者為寇", "def": "形容以成敗論人，而不計其過程、為人等。"}, {"w": "勝不驕，敗不餒", "def": "勝利了不驕傲，失敗了也不氣餒。表示不論勝敗，都能保持平常心。"}]}, {"title": "與「盛衰」有關的成語", "items": [{"w": "月盈則食", "def": "比喻物盛極必衰。"}, {"w": "絕處逢生", "def": "在絕境中又獲得一線生機。"}, {"w": "否極泰來", "def": "比喻情況壞到極點後逐漸好轉。"}, {"w": "樂極生悲", "def": "歡樂至極，往往轉生悲愁。"}, {"w": "興盡悲來", "def": "高興到極點，悲哀就隨之而來。"}, {"w": "苦盡甘來", "def": "艱難的困境已經結束，逐漸進入佳境。"}]}]}, {"lesson": "2下 第九課 罐頭由來", "themes": [{"title": "與「人物典故」有關的成語", "items": [{"w": "江郎才盡", "def": "江郎，指南朝 梁文人江淹。江郎才盡原指江淹少以詩文著稱，獨步當代。晚年時，偶憩於一亭中，夢見郭璞索還五色筆，自此江淹作詩絕無佳句。比喻文思枯竭，佳作不再。"}, {"w": "東山再起", "def": "晉 謝安退職隱居東山，後來又再度入朝擔任要職。後用以指官員退職後，再度出仕。今亦用此語表示失敗後捲土重來。"}, {"w": "洛陽紙貴", "def": "晉代 左思寫成〈三都賦〉後，時人競相傳寫，使洛陽的紙價上漲而昂貴。後比喻著作風行一時，流傳甚廣。"}, {"w": "約法三章", "def": "原指漢高祖入咸陽，臨時制定三條法律，與民共守。後泛指事先約好或規定的事。"}, {"w": "望梅止渴", "def": "曹操率兵行軍至途中，士兵乾渴難耐，曹操就騙士兵前有梅林，梅子又酸又甜，誘使士兵流出口水以解渴的故事。後比喻用空想來安慰自己。"}, {"w": "圖窮匕見", "def": "戰國時，燕太子丹派荊軻獻燕國的地圖，而藏匕首於圖中，以謀刺秦王。後比喻事情發展到最後，形跡敗露，現出真相。匕，音ㄅㄧˇ。"}, {"w": "聞雞起舞", "def": "晉代 祖逖（ㄊㄧˋ）半夜聽到雞啼聲，立即起床操練武藝。後用以比喻及時奮起行動。"}, {"w": "樂不思蜀", "def": "蜀漢亡後，後主 劉禪被送往洛陽，司馬昭設宴招待劉禪，並派人演出蜀國的歌舞雜耍，劉禪樂在其中，司馬昭因而問：「是否思蜀？」劉禪答：「此間樂，不思蜀。」後比喻樂而忘返或樂而忘本。"}, {"w": "蕭規曹隨", "def": "漢代 曹參繼蕭何為相國，舉事皆無所變更。比喻後任的人依循前任所訂的規章行事。"}, {"w": "舉案齊眉", "def": "東漢 孟光送飯食給丈夫梁鴻時，總是將木盤高舉，與眉平齊，夫妻互敬互愛的故事。後比喻夫妻相敬如賓。"}, {"w": "煮豆燃萁", "def": "三國 魏文帝 曹丕妒嫉其弟曹植的才能而欲加害，命曹植在七步之內完成一首詩，曹植便作〈七步詩〉一首：「煮豆持作羹，漉菽以為汁。萁在釜下燃，豆在釜中泣。本自同根生，相煎何太急？」後用煮豆燃萁比喻兄弟相迫，骨肉相殘。萁，大豆的莖。"}]}, {"title": "其他補充成語", "items": [{"w": "與時俱進", "def": "與時代一同前進。"}, {"w": "改弦易轍", "def": "比喻改變制度、做法或態度。"}, {"w": "物美價廉", "def": "物品精美，價格便宜。"}, {"w": "秋毫無犯", "def": "一點都不侵犯。"}, {"w": "差強人意", "def": "指大體上尚能令人勉強滿意。"}, {"w": "釜底抽薪", "def": "比喻從根本上解決問題。"}, {"w": "鬼斧神工", "def": "形容景觀奇特或技藝精巧，像是鬼神所造。"}, {"w": "循規蹈矩", "def": "遵守規矩。"}, {"w": "著書立說", "def": "寫作書籍，以成一家之言。"}, {"w": "池魚之殃", "def": "春秋時，宋 司馬桓有寶珠，後因畏罪出亡，故投珠於池中。景公派人汲乾池水，但尋珠不著，而池魚卻因此而亡。後比喻無辜卻受牽累而遭禍。"}]}]}, {"lesson": "2下 第十課 項鍊", "themes": [{"title": "與「情緒」有關的成語", "items": [{"w": "怒不可遏", "def": "怒氣難以抑制的樣子。"}, {"w": "暴跳如雷", "def": "形容人急怒的樣子。"}, {"w": "怒火中燒", "def": "形容非常憤怒。"}, {"w": "欣喜若狂", "def": "形容快樂、高興到了極點。"}, {"w": "眉開眼笑", "def": "十分愉快。"}, {"w": "悶悶不樂", "def": "心情憂鬱不快樂。"}, {"w": "愁眉不展", "def": "雙眉緊鎖，很憂愁的樣子。"}, {"w": "滿面愁容", "def": "滿臉憂愁的樣子。"}, {"w": "蹙額顰眉", "def": "皺著眉頭。蹙，音ㄘㄨˋ。顰，音ㄆㄧㄣˊ。"}, {"w": "忐忑不安", "def": "心情起伏不定的樣子。"}, {"w": "坐立難安", "def": "形容焦急、煩躁，心神不寧的樣子。"}, {"w": "惴惴不安", "def": "因恐懼耽憂而心神不定"}]}, {"title": "與「錢財」有關的成語", "items": [{"w": "不值一錢", "def": "比喻毫無價值。"}, {"w": "生財有道", "def": "形容擅長發財致富。"}, {"w": "輕財重義", "def": "輕視錢財而看重道義。"}, {"w": "日食萬錢", "def": "形容生活極為奢侈豪華。"}, {"w": "財大氣粗", "def": "指富者倚仗財勢蠻橫囂張。"}, {"w": "不義之財", "def": "以不正當手段所獲取的錢財。"}, {"w": "輕財好施", "def": "不重視財物而喜歡施捨助人。"}, {"w": "倚財仗勢", "def": "仗著金錢與權勢，欺壓別人。"}, {"w": "愛財如命", "def": "形容十分吝嗇、貪婪。"}, {"w": "見錢眼開", "def": "形容人貪婪愛財，唯利是圖。"}, {"w": "不名一錢", "def": "形容人極其貧窮。"}, {"w": "臨財不苟", "def": "面對錢財引誘，能不隨便求取。意謂廉潔自好。"}]}, {"title": "其他補充成語", "items": [{"w": "好高騖遠", "def": "形容一味的嚮往高遠的目標而不切實際。"}, {"w": "安分守己", "def": "安守本分，堅持原則。"}, {"w": "作繭自縛", "def": "比喻人做事反使自己陷入困境。"}, {"w": "利欲薰心", "def": "貪圖名利私欲而蒙蔽了心智。"}, {"w": "束手就擒", "def": "不加抵抗，讓人綑綁捉拿。"}, {"w": "沽名釣譽", "def": "故意做作，用手段謀取名聲和讚譽。"}, {"w": "愛慕虛榮", "def": "比喻貪戀浮名及富貴。"}, {"w": "縛手縛腳", "def": "比喻處處受約束。"}]}]}, {"lesson": "2下 自學三 空城計", "themes": [{"title": "與「計略」有關的成語", "items": [{"w": "人急計生", "def": "人在情急之下會突然想出應變的計謀。"}, {"w": "力屈計窮", "def": "計謀、辦法都已用盡。"}, {"w": "千方百計", "def": "費盡心機，想盡一切辦法、計謀。"}, {"w": "才疏計拙", "def": "才能淺薄，不善謀略。"}, {"w": "百年大計", "def": "影響深遠的計畫或措施。"}, {"w": "枉費心計", "def": "白白的浪費心思。意謂徒勞無功。"}, {"w": "將計就計", "def": "利用對方的計策，順水推舟，反施其計。"}, {"w": "陰謀詭計", "def": "暗中策畫做壞事。"}, {"w": "運籌帷幄", "def": "謀畫策略。帷幄，音ㄨㄟˊ ㄨㄛˋ。"}, {"w": "緩兵之計", "def": "比喻暫時設法拖延時間，使事態緩和的方法。"}, {"w": "權宜之計", "def": "因應某種時機而暫用的計謀。"}]}, {"title": "與「時機」、「行動」有關的成語", "items": [{"w": "先發制人", "def": "凡事先下手取得主動權而制伏對方。"}, {"w": "當機立斷", "def": "抓住時機，立刻作出決斷。"}, {"w": "輕舉妄動", "def": "行為不慎，舉止輕浮。"}, {"w": "鋌而走險", "def": "在窮途末路或受逼迫時採取冒險行動或不正當的行為。"}, {"w": "伺機而動", "def": "等候適當的時機再行動。"}, {"w": "枕戈待旦", "def": "形容時時警惕，準備作戰，不敢安睡。枕，音ㄓㄣˋ。"}]}, {"title": "其他補充成語", "items": [{"w": "大驚失色", "def": "形容十分驚嚇，以致變了臉色。"}, {"w": "化險為夷", "def": "轉化危險為平安。"}, {"w": "神鬼莫測", "def": "形容極隱密奇異，無法預料。"}, {"w": "勝券在握", "def": "比喻很有把握，相信自己已經可以成功。"}, {"w": "閒雲野鶴", "def": "比喻來去自如，無所羈絆的人。"}, {"w": "撥亂反正", "def": "除去禍亂，歸於正道。"}, {"w": "謹言慎行", "def": "指言談小心，行事謹慎。"}]}]}, {"lesson": "3上 第一課 戲李白", "themes": [{"title": "與「地名」有關的成語", "items": [{"w": "得隴望蜀", "def": "比喻貪得無厭，不知滿足。"}, {"w": "廬山面目", "def": "比喻不易窺知真相的事物。"}, {"w": "洛陽紙貴", "def": "晉代 左思寫成〈三都賦〉後，時人競相傳寫，使洛陽的紙價上漲而昂貴。後比喻著作風行一時，流傳甚廣。"}, {"w": "終南捷徑", "def": "唐代 盧藏用舉進士，然不受重用，遂隱居終南山以求高名，後果被召任官的故事。後用於比喻求官或求名利的便捷途徑。"}, {"w": "合浦珠還", "def": "漢 合浦郡沿海盛產珍珠，因宰守貪穢，濫採無度，珠遂漸遷移交阯郡。後孟嘗任合浦太守，革易舊弊，珠乃漸還。後比喻人離開而復返或東西失而復得。"}, {"w": "邯鄲學步", "def": "相傳戰國時期，燕國有個人到趙國的都城邯鄲，看到趙國人走路姿勢很美，就跟著學。結果不但沒有學好，連自己原來的走法也忘掉了，便爬著回去。後用來比喻仿效他人，未能成就，反而失卻自己本來的面目。邯鄲，音ㄏㄢˊ ㄉㄢ。"}, {"w": "逼上梁山", "def": "《水滸傳》中眾多好漢因受到官府逼迫，上梁山造反。後比喻被迫走上絕路，而做出自己不想做或不應做的事。"}, {"w": "泰山北斗", "def": "比喻負有聲望的人，為世人所景仰，或指學術高深卓絕，為人景仰。泰山為五嶽之首，北斗星為眾星中最明亮之星。"}]}, {"title": "與「趣」有關的成語", "items": [{"w": "自討沒趣", "def": "言行不得當，招致難堪、窘迫。"}, {"w": "相映成趣", "def": "互相襯托而更添意趣。"}, {"w": "了無生趣", "def": "毫無生存的意願。"}]}, {"title": "與「戲」有關的成語", "items": [{"w": "拿手好戲", "def": "最擅長表演的戲。"}, {"w": "逢場作戲", "def": "隨事應景，偶爾遊戲玩耍。"}, {"w": "官場如戲", "def": "比喻當官的人爭逐權勢，陞遷貶謫，變化無常，有如兒戲一般。"}]}, {"title": "其他補充成語", "items": [{"w": "繼往開來", "def": "承續先人的事業，並為後人開拓道路。"}, {"w": "龍蟠虎踞", "def": "形容地勢雄偉險要。"}, {"w": "被山帶河", "def": "被群山與河流環繞。形容地勢險要。"}, {"w": "千古獨步", "def": "古往今來絕無僅有。"}, {"w": "天下無雙", "def": "天下沒有第二個，獨一無二。"}, {"w": "虎視眈眈", "def": "如老虎般貪狠的注視。比喻心懷不軌，伺機掠奪。"}, {"w": "無獨有偶", "def": "兩項事物恰巧相同或類似。"}, {"w": "筆走龍蛇", "def": "比喻文筆揮灑自如或書法優美熟練。"}]}, {"title": "成語充電站", "items": [{"w": "江河日下", "def": "比喻情況日漸衰微，一天不如一天。"}, {"w": "江心補漏", "def": "比喻事有缺失不先預防，臨時才補救，但為時已晚。"}, {"w": "過江之鯽", "def": "比喻來往的人眾多。鯽，音ㄐㄧˋ。"}, {"w": "江山如畫", "def": "形容山水風景如圖畫般美麗。"}, {"w": "口若懸河", "def": "比喻能言善道，說話時有如流水傾瀉一般，滔滔不絕。"}, {"w": "過河拆橋", "def": "比喻不念舊情，忘恩負義。"}, {"w": "暴虎馮河", "def": "比喻人有勇而無謀。馮，音ㄆㄧㄥˊ。"}, {"w": "信口開河", "def": "不加思索的隨意亂說。"}, {"w": "抱痛西河", "def": "比喻喪子之痛。"}, {"w": "河清海晏", "def": "比喻太平盛世。"}, {"w": "翻江倒海", "def": "比喻力量或聲勢巨大。"}, {"w": "錦繡河山", "def": "形容國土山河像精美的絲織品一樣美好。"}, {"w": "不到烏江心不死", "def": "比喻不到完全絕望，絕不肯認輸放棄。"}, {"w": "船到江心補漏遲", "def": "比喻不事先預防，臨時出事，想補救也來不及了。"}, {"w": "跳在黃河洗不清", "def": "比喻冤枉無法洗刷。"}, {"w": "不到黃河心不死", "def": "比喻不到完全絕望的地步，絕不輕言放棄。"}]}]}, {"lesson": "3上 第二課 詞選", "themes": [{"title": "與「顏色」有關的成語", "items": [{"w": "碧波萬頃", "def": "形容水色碧綠，廣闊無際的樣子。"}, {"w": "黃袍加身", "def": "宋太祖 趙匡胤 陳橋兵變，被擁戴為皇帝的故事。"}, {"w": "白雲蒼狗", "def": "指白雲原本像一件潔淨的白衣，轉眼間卻變成灰狗的模樣。比喻世事變幻無常。"}, {"w": "青黃不接", "def": "指作物還沒成熟，存糧又已吃完。比喻有所匱乏，一時難以接濟。青，指還沒成熟的綠色農作物。黃，指黃熟的穀物。"}, {"w": "近朱者赤", "def": "靠近硃砂容易被染成紅色，靠近墨則容易被染成黑色。後比喻人的習性因環境影響而改變。"}, {"w": "明日黃花", "def": "指在重陽節欣賞菊花最能景與情會，若錯過時令就毫無興味。後比喻為過時的事物。明日，重陽節後。黃花，菊花。"}, {"w": "白駒過隙", "def": "指馬從洞孔前一下子就跑過去。後比喻時間過得很快。白駒，駿馬。隙，洞孔。"}, {"w": "青紅皂白", "def": "指各種不同的顏色。比喻事情的是非情由。皂，黑色。"}, {"w": "青出於藍", "def": "指青色是從蓼（ㄌㄧㄠˇ）藍裡提煉出來的，但是顏色比蓼藍還深。後用以比喻弟子勝於老師，或後輩優於前輩。藍，蓼藍，可以提取靛青染料的植物。"}, {"w": "面紅耳赤", "def": "形容因高溫、羞愧、焦急或發怒時而臉上、耳朵發紅的樣子。"}, {"w": "信口雌黃", "def": "比喻不顧事情真相，隨意批評。"}, {"w": "爐火純青", "def": "指煉丹成功時，爐火火焰由紅色轉成純青色。後比喻學問、技術、功夫等到達精純完美的境地。"}, {"w": "慘綠少年", "def": "本指身穿暗綠色衣服的少年。後用以指風度翩翩、意氣風發的青年才俊。慘，暗淡、昏暗。"}, {"w": "昏天黑地", "def": "光線昏暗，無法辨別方向。"}, {"w": "白璧微瑕", "def": "潔白的璧玉上有小斑點。比喻很好的人或事還有小缺點，帶有惋惜的意味。"}, {"w": "月黑風高", "def": "形容沒有月亮，風很大的晚上。"}, {"w": "青梅竹馬", "def": "指從小相識的伴侶。竹馬，前端裝上木製馬頭的竹竿，小孩夾在胯下當成馬騎。"}, {"w": "白頭偕老", "def": "形容夫妻恩愛到老。"}, {"w": "金碧輝煌", "def": "形容裝飾華彩絢爛。多指宮殿等建築物。"}, {"w": "平步青雲", "def": "比喻順利無阻，迅速晉升高位。"}]}, {"title": "其他補充成語", "items": [{"w": "肥馬輕裘", "def": "形容生活豪奢。"}, {"w": "少不更事", "def": "年紀輕，閱歷淺薄。"}, {"w": "垂簾聽政", "def": "女后臨朝管理國事。"}, {"w": "甘棠遺愛", "def": "本指周代 召公行德政，人民感戴，對召公憩息過的甘棠樹亦愛護有加。後用以表示對賢官廉吏的愛戴或懷念。"}, {"w": "悠然神往", "def": "由內心深處所升起的一股企盼，而心神嚮往。"}]}, {"title": "成語充電站", "items": [{"w": "以身許國", "def": "比喻盡忠報國。"}, {"w": "為國捐軀", "def": "為國犧牲性命。"}, {"w": "赤膽忠心", "def": "形容極為忠誠不二。"}, {"w": "保國安民", "def": "保衛國家，安定人民。"}, {"w": "碧血丹心", "def": "形容赤忱、忠誠的心。"}, {"w": "精忠報國", "def": "盡心盡力的報效國家。"}, {"w": "憂國恤民", "def": "憂慮國事，憐恤百姓。"}, {"w": "鞠躬盡瘁", "def": "指不辭辛勞，盡力於國事。"}]}]}, {"lesson": "3上 第三課 人間好時節", "themes": [{"title": "與「四季」有關的成語", "items": [{"w": "流金鑠石", "def": "形容天氣非常炎熱，好像能把金、石鎔化。鑠，音ㄕㄨㄛˋ，鎔化。"}, {"w": "火傘高張", "def": "比喻烈日當空。"}, {"w": "冰天雪地", "def": "形容氣候嚴寒。"}, {"w": "望穿秋水", "def": "形容盼望的深切。秋水，秋天的水明淨澄澈，比喻眼睛。"}, {"w": "春寒料峭", "def": "早春的寒風吹得人有些冷。"}, {"w": "浮瓜沉李", "def": "浮沉於水中的瓜、李，是夏天清涼可口的食物。比喻夏日消暑的樂事。"}, {"w": "秋扇見捐", "def": "入秋天涼，扇子就被棄置不用。比喻女子不再年輕貌美而遭受冷落。"}, {"w": "虎尾春冰", "def": "踏到老虎的尾巴，走在春天的薄冰上。比喻處於極端危險的環境。"}, {"w": "臨去秋波", "def": "比喻清澈明亮的眼睛。指臨別時傳情的眼眸，或比喻臨走之前給人好處。秋波，秋天澄淨的水波。"}, {"w": "秋風過耳", "def": "比喻漠不關心。"}]}, {"title": "與「年齡」有關的成語", "items": [{"w": "春秋鼎盛", "def": "正當壯盛之年。"}, {"w": "懸車之年", "def": "指官員告老引退的年齡，通常為七十歲。懸車，把車子掛起來，指辭官退隱。"}, {"w": "黃口小兒", "def": "幼兒。比喻淺薄幼稚的人。"}, {"w": "豆蔻年華", "def": "比喻年輕少女，多指女子十三、四歲之時。也作「荳蔻年華」。"}]}, {"title": "其他補充成語", "items": [{"w": "禍國殃民", "def": "使國家和人民都受到災禍。"}, {"w": "渾然天成", "def": "自然形成，沒有人為雕琢的痕跡。"}, {"w": "食不下咽", "def": "飲食不下。形容內心非常悲傷、憂愁或煩惱。"}, {"w": "隨遇而安", "def": "能安於所處的環境。"}, {"w": "鬱鬱蔥蔥", "def": "茂盛的樣子。"}]}, {"title": "成語充電站", "items": [{"w": "春光明媚", "def": "形容春景妙麗動人。"}, {"w": "春花秋月", "def": "比喻美好的時光與景物。"}, {"w": "暑往寒來", "def": "夏天過去，冬天到來。泛指時光流逝。"}, {"w": "秋高氣爽", "def": "形容秋天天氣晴朗涼爽。"}, {"w": "桂子飄香", "def": "形容中秋時桂花綻放，香氣飄散。"}, {"w": "臘盡冬殘", "def": "年終歲末。"}, {"w": "寒冬臘月", "def": "指最寒冷的十二月天。"}, {"w": "恍然大悟", "def": "心裡忽然明白。"}, {"w": "暮鼓晨鐘", "def": "比喻使人覺悟的言論。"}, {"w": "茅塞頓開", "def": "比喻馬上開悟，忽然明白。"}, {"w": "當頭棒喝", "def": "比喻使人立即醒悟的警示。"}, {"w": "發人深省", "def": "啟發人深刻思考而有所醒悟。"}]}]}, {"lesson": "3上 第四課 生於憂患死於安樂", "themes": [{"title": "與「憂」有關的成語", "items": [{"w": "憂心如焚", "def": "內心憂慮有如火在焚燒。比喻非常焦慮不安。"}, {"w": "憂能傷人", "def": "憂愁煩悶會損害人的健康。"}, {"w": "憂國憂民", "def": "憂慮國家大計和人民疾苦。"}, {"w": "內憂外患", "def": "指國家內部的動亂和外敵的侵擾。亦比喻個人所遭遇的內在糾紛與外在壓力的困境。"}, {"w": "殷憂啟聖", "def": "深切的憂慮能啟發聖明。"}, {"w": "無憂無慮", "def": "毫無憂慮。形容心情怡然自得。"}, {"w": "杞人憂天", "def": "古時杞國有個人，擔心天會塌下來，因而寢食難安。後比喻無謂的憂慮。"}, {"w": "後顧之憂", "def": "來自後方、家裡或將來的憂患。"}, {"w": "高枕無憂", "def": "安臥閒適而無憂慮。"}, {"w": "樂以忘憂", "def": "非常快樂而忘了憂愁。"}]}, {"title": "與「情況的好壞」有關的成語", "items": [{"w": "否極泰來", "def": "情況壞到極點後逐漸好轉。"}, {"w": "苦盡甘來", "def": "艱難困苦的境遇已經結束，而將逐步進入佳境。"}, {"w": "時來運轉", "def": "本來處境不好，遇到機會，由逆境轉到順境。"}, {"w": "樂極生悲", "def": "歡樂至極，往往轉生悲愁。"}, {"w": "坐困愁城", "def": "形容處境艱困、沒有出路，且無力擺脫。"}]}, {"title": "與「準備」有關的成語", "items": [{"w": "未雨綢繆", "def": "鴟鴞在未下雨前，便已著手修補窩巢。比喻事先預備，防患未然。"}, {"w": "有備無患", "def": "凡事有準備，方可免後患。"}, {"w": "防範未然", "def": "事故還沒有發生之前就加以防範。"}, {"w": "臨渴掘井", "def": "比喻事到臨頭才著手準備，為時已晚。"}]}, {"title": "其他補充成語", "items": [{"w": "不勞而獲", "def": "毫不費力而得到。"}, {"w": "坐享其成", "def": "不出勞力，而享受現成的福利。"}, {"w": "坐收漁利", "def": "利用別人彼此間的衝突矛盾而獲利。"}, {"w": "自食其力", "def": "憑藉自己的力量養活自己。"}, {"w": "俯仰無愧", "def": "無論對人、對天都問心無愧。"}]}]}, {"lesson": "3上 第五課 以粥養生", "themes": [{"title": "與「飲食」有關的成語", "items": [{"w": "飢腸轆轆", "def": "形容非常飢餓的樣子。轆轆，音ㄌㄨˋ ㄌㄨˋ，狀聲詞，形容空腹的鳴叫聲。"}, {"w": "粗茶淡飯", "def": "粗糙簡單的飲食。"}, {"w": "齒頰留香", "def": "形容食物味道鮮美，令人回味無窮。"}, {"w": "垂涎欲滴", "def": "嘴饞得口水快要流下來，形容極貪饞。"}, {"w": "酒囊飯袋", "def": "比喻只會吃喝，而不會辦事的無能之人。"}, {"w": "大快朵頤", "def": "指飽食愉快的樣子。朵，動。頤，下巴。朵頤，指動著腮頰欲食的樣子。"}, {"w": "觥籌交錯", "def": "酒器和酒籌錯雜相交。比喻暢飲。"}, {"w": "食不下咽", "def": "飲食不下。形容內心非常悲傷、憂愁或煩惱。"}, {"w": "鐘鳴鼎食", "def": "古代富貴人家吃飯時，擊鐘為號，列鼎而食。形容生活極為奢華。"}, {"w": "別有風味", "def": "形容食物味道美好，另有一種特色，不同尋常。"}, {"w": "弱肉強食", "def": "比喻強者欺凌、吞併弱者。"}, {"w": "節衣縮食", "def": "生活節儉。"}]}, {"title": "與「粥」有關的成語", "items": [{"w": "斷虀畫粥", "def": "形容不畏艱苦，刻苦勤學。虀，音ㄐㄧ。"}, {"w": "粥少僧多", "def": "比喻東西少而需要的人多，不夠分配。"}, {"w": "煮粥焚鬚", "def": "比喻手足情深。"}]}, {"title": "其他補充成語", "items": [{"w": "米珠薪桂", "def": "米如珍珠，柴如桂木。比喻物價昂貴。"}, {"w": "糜軀碎首", "def": "粉身碎骨。比喻不惜犧牲性命。"}, {"w": "不葷不素", "def": "不三不四。"}, {"w": "簞食瓢飲", "def": "(1)只吃一碗飯，只喝一瓢水。形容生活簡單、清苦。(2)指顏回生活雖然清苦，卻依舊不改樂道的志趣。後用以比喻安貧樂道。食，指食物。飲，指飲水。"}, {"w": "津津有味", "def": "形容興味濃厚。"}, {"w": "飢不擇食", "def": "比喻急迫時不作選擇、挑剔。"}, {"w": "杯盤狼藉", "def": "形容酒席完畢，杯盤散亂的情形。"}, {"w": "暴殄天物", "def": "原指殘害各種生物。後比喻糟蹋物力，不知珍惜。殄，音ㄊㄧㄢˇ，浪費、糟蹋。"}, {"w": "延年益壽", "def": "延長壽命。"}, {"w": "壽比南山", "def": "壽命如南山那樣長久。為祝人長壽之辭。"}, {"w": "長命百歲", "def": "健康長壽，活到一百歲。多用作祝福人長壽的話。"}, {"w": "雞皮鶴髮", "def": "白頭髮且皮膚上有皺紋。形容老人的形貌。"}]}]}, {"lesson": "3上 第六課 獵人", "themes": [{"title": "與「動物、植物」有關的成語", "items": [{"w": "兔死狗烹", "def": "兔子死盡，用來捕兔的獵狗失去了作用，故而烹食之。比喻事成之後，出過力的人即遭到殺戮或見棄的命運。多指統治者殺戮功臣而言。"}, {"w": "狐死首丘", "def": "傳說狐狸死時，頭必朝向狐穴所在的山丘。比喻不忘本或對故鄉的思念。"}, {"w": "首鼠兩端", "def": "形容躊躇不決，瞻前顧後的樣子。"}, {"w": "蚍蜉撼樹", "def": "比喻不自量力。"}, {"w": "釜底游魚", "def": "比喻處於危亡困境中的人。"}, {"w": "風行草偃", "def": "比喻在上位者以德化民。"}, {"w": "望梅止渴", "def": "曹操率兵行軍至途中，士兵乾渴難耐，曹操就騙士兵前有梅林，梅子又酸又甜，誘使士兵流出口水以解渴的故事。後比喻用空想來安慰自己。"}, {"w": "勢如破竹", "def": "比喻作戰或工作順利進行，毫無阻礙。"}]}, {"title": "與「打獵」有關的成語", "items": [{"w": "一箭雙鵰", "def": "北周 長孫晟善射，嘗見二鵰飛而爭肉，長孫晟乃射一箭而同時貫穿兩隻鵰。後用以比喻一次舉動便可達到雙倍效果，兼得兩種好處。"}, {"w": "見獵心喜", "def": "程顥看到打獵，激起舊日的愛好而心喜。後比喻舊習難忘，觸其所好，便心情愉悅而躍躍欲試。"}, {"w": "涸澤而漁", "def": "排盡池湖的水而捕魚。比喻一味的耗盡、榨取而不留餘地。"}, {"w": "鳥盡弓藏", "def": "飛鳥射盡之後，就收起弓箭不用。比喻天下平定之後便遺棄功臣。"}, {"w": "網開一面", "def": "比喻寬大仁厚，對犯錯的人從寬處置。"}]}, {"title": "與「疊字」有關的成語", "items": [{"w": "汲汲營營", "def": "本指匆匆往來的樣子。後多形容人急切求取名利的樣子。汲汲，勤求不休止的樣子。營營，追逐求取。"}, {"w": "沸沸揚揚", "def": "形容人聲雜亂，議論紛紛，如水沸騰一般。"}, {"w": "朝朝暮暮", "def": "從早到晚，日復一日。"}, {"w": "渾渾噩噩", "def": "迷糊不知事理。"}, {"w": "熙熙攘攘", "def": "形容人來人往，熱鬧擁擠的樣子。"}, {"w": "岌岌可危", "def": "形容非常危險。"}, {"w": "喋喋不休", "def": "言語囉嗦，沒完沒了的樣子。"}]}, {"title": "成語充電站", "items": [{"w": "一網打盡", "def": "比喻澈底消滅。"}, {"w": "飛蒼走黃", "def": "指放出蒼鷹和獵犬打獵。蒼，蒼鷹。黃，黃犬。"}, {"w": "鹿死誰手", "def": "比喻共同爭奪一件事物，不知道誰能取得最後的勝利。"}, {"w": "飛鷹走馬", "def": "打獵。指放鷹獵捕、騎馬追逐野獸。也作「飛鷹走狗」。"}, {"w": "焚林而畋", "def": "比喻索取一空，不留餘地。畋，音ㄊㄧㄢˊ。"}, {"w": "兔起鶻落", "def": "兔子剛躍起，鶻鳥就猛衝下來。比喻動作快速敏捷。後常借比喻書寫作畫時下筆疾速。鶻，音ㄏㄨˊ。"}]}]}, {"lesson": "3上 第七課 與宋元思書", "themes": [{"title": "與「山水美景」有關的成語", "items": [{"w": "千巖競秀", "def": "形容眾峰奇石競相爭美。"}, {"w": "山明水秀", "def": "形容山水秀麗，風景優美。"}, {"w": "水綠山青", "def": "形容風景優美秀麗。"}, {"w": "世外桃源", "def": "比喻風景優美而人跡罕至的地方。"}, {"w": "名山大川", "def": "著名的高山與河流。"}, {"w": "依山傍水", "def": "靠山臨水。形容風景清幽如畫。"}, {"w": "洞天福地", "def": "神仙所住的地方。比喻名山勝境。"}, {"w": "連雲疊嶂", "def": "形容高聳入雲，重疊連綿的山峰。"}, {"w": "湖光山色", "def": "形容美好的自然風景。"}, {"w": "錦繡江山", "def": "形容壯麗的國土。"}]}, {"title": "與「聲音」有關的成語", "items": [{"w": "牙牙學語", "def": "形容嬰兒初學說話的聲音。"}, {"w": "泣不成聲", "def": "哭得發不出聲音。形容十分悲傷。"}, {"w": "怨聲載道", "def": "到處充滿了怨恨的聲音。形容群眾普遍怨恨、不滿。"}, {"w": "震耳欲聾", "def": "形容聲音很大，幾乎要將耳朵震聾。"}, {"w": "餘音繞梁", "def": "餘音環繞屋梁旋轉不去。形容音樂美妙感人，餘味不絕。"}, {"w": "聲色俱厲", "def": "說話時的聲音和臉色都很嚴肅。"}, {"w": "歡聲雷動", "def": "歡呼的聲音像雷響一樣。形容熱烈歡樂的場面。"}, {"w": "鑼鼓喧天", "def": "敲鑼打鼓的聲音響徹雲霄。形容氣氛熱鬧非凡。"}]}, {"title": "成語充電站", "items": [{"w": "山光水色", "def": "形容山水的美景佳勝。"}, {"w": "跋山涉水", "def": "形容走長遠路途的艱苦。"}, {"w": "千巖萬壑", "def": "形容高山深谷交疊成群。"}, {"w": "水木清華", "def": "形容池沼園林清朗明麗。"}, {"w": "千山萬水", "def": "比喻路途遙遠，險阻甚多。"}, {"w": "山窮水盡", "def": "比喻陷於絕境，窮困之至。"}, {"w": "山高水長", "def": "像山一樣的高聳，像水一樣的長流。比喻人品高潔，垂範久遠。"}]}]}, {"lesson": "3上 第八課 畫說湖心亭看雪", "themes": [{"title": "與「志趣相投」有關的成語", "items": [{"w": "同類相求", "def": "志趣相同的人自然結合在一起。"}, {"w": "志同道合", "def": "彼此的志趣和理想一致。"}, {"w": "氣味相合", "def": "雙方志趣、性情相投合。"}, {"w": "臭味相投", "def": "雙方志趣、性情相投合。或譏諷人的興趣、性情相合。"}, {"w": "意氣相合", "def": "彼此的性情志趣相投合。"}]}, {"title": "與「方向字」有關的成語", "items": [{"w": "掌上明珠", "def": "捧在手掌上的一顆珍貴明珠。比喻極受寵愛珍視的人。多指愛女。"}, {"w": "紙上談兵", "def": "比喻不合實際的空談、議論。"}, {"w": "後來居上", "def": "用以讚揚後人的成就超越前人。或落後的人超過領先的人。"}, {"w": "甘拜下風", "def": "表示心悅誠服。"}, {"w": "花前月下", "def": "本指景色幽美的環境，後多指男女幽會談情的美好情境。"}, {"w": "居高臨下", "def": "處於有利的地位，可控制一切。"}, {"w": "虛左以待", "def": "古禮以左為尊，後以虛左以待指留著尊位以待賢者。"}, {"w": "旁門左道", "def": "不正派的宗教派別。後比喻不遵循正規的途徑、法門。"}, {"w": "被髮左衽", "def": "形容頭髮散亂，穿衣服開左邊的文化落後民族。被髮，頭髮散亂。衽，衣襟。"}, {"w": "東窗事發", "def": "比喻陰謀敗露，將被懲治。"}, {"w": "河東獅吼", "def": "用以譏嘲妻子凶悍，使丈夫畏懼。"}, {"w": "馬耳東風", "def": "比喻對事情漠不關心。"}, {"w": "日落西山", "def": "用以比喻盛壯繁榮的事物轉為衰微敗落。"}, {"w": "駕鶴西歸", "def": "神仙駕鶴回到西天，比喻人死。多用於輓辭。"}, {"w": "剪燭西窗", "def": "思念妻子而盼望相聚。後亦泛指在夜晚與親友聚談。"}]}, {"title": "與「雪」有關的成語", "items": [{"w": "雪中送炭", "def": "比喻在人艱困危急之時，給予適時的援助。"}, {"w": "雪泥鴻爪", "def": "鴻雁踏過雪泥遺留的爪痕。比喻往事所遺留的痕跡。"}, {"w": "雪上加霜", "def": "比喻禍患接踵而至，使傷害加重。"}, {"w": "冰天雪地", "def": "形容氣候嚴寒。"}, {"w": "飽經霜雪", "def": "形容歷經許多艱辛磨練。"}, {"w": "如湯沃雪", "def": "好像用熱水潑在雪上一樣。比喻事情極為容易解決。"}]}, {"title": "其他補充成語", "items": [{"w": "勢不兩立", "def": "敵對的雙方不能同時並存。"}, {"w": "話不投機", "def": "談話時彼此意見不合。"}, {"w": "同床異夢", "def": "比喻共同生活或一起做事的人意見不同，各有各的打算。"}, {"w": "道不相謀", "def": "指思想志趣不相同，無法一起討論或共事。"}, {"w": "針鋒相對", "def": "比喻雙方的勢力、行為、言詞等尖銳的對立著，不相上下。"}]}, {"title": "成語充電站", "items": [{"w": "妙手丹青", "def": "繪畫技藝高超的人。"}, {"w": "畫中有詩", "def": "泛指畫作中有詩意。"}, {"w": "鬼斧神工", "def": "形容技藝精巧，非人力所能及。"}, {"w": "栩栩如生", "def": "形容貌態逼真，彷彿具有生命力。"}, {"w": "匠心獨運", "def": "運用精巧高妙的創作構想與心思。"}, {"w": "精雕細琢", "def": "形容做事仔細用心，多指藝術品的創作。"}, {"w": "鐵畫銀鉤", "def": "形容筆畫如鐵般的剛勁，如銀般的柔媚。"}, {"w": "巧奪天工", "def": "雖然是人工所製，但是精巧勝過天然，形容技藝巧妙。"}, {"w": "咳唾成珠", "def": "比喻言談不凡或文詞優美。"}, {"w": "文思泉湧", "def": "比喻行文時，思路迅速豐暢。"}, {"w": "夢筆生花", "def": "比喻文人才思泉湧、文筆富麗。"}, {"w": "一揮而就", "def": "形容在書畫作文方面的敏捷高超。"}, {"w": "文不加點", "def": "形容文思敏捷、下筆成章，通篇無所塗改。"}, {"w": "自出機杼", "def": "比喻詩文的組織、構思，別出心裁，獨創新意。"}, {"w": "尋章摘句", "def": "寫作時，只知套用前人的章法、語句，而不講究創造性。"}]}]}, {"lesson": "3上 第九課 喂，出來！", "themes": [{"title": "與「說話」有關的成語", "items": [{"w": "口說無憑", "def": "光靠嘴說不足為證。"}, {"w": "異口同聲", "def": "形容眾口一辭，意見相同。"}, {"w": "能說善道", "def": "擅長於以言語或道理來說服別人。"}, {"w": "眾說紛紜", "def": "各式各樣的說法紛亂不一致。"}, {"w": "談天說地", "def": "上至天文，下至地理，無所不談。形容人知識豐富，能廣泛談論各種事情。亦指漫無邊際的高談闊論。"}, {"w": "自圓其說", "def": "自行解釋自己牽強矛盾的說法，使無破綻。"}, {"w": "七嘴八舌", "def": "形容人多口雜，議論紛亂的樣子。"}]}, {"title": "與「犯法」有關的成語", "items": [{"w": "漏網之魚", "def": "比喻僥倖逃避法律制裁的人。亦比喻驚慌逃離危險的人。"}, {"w": "逍遙法外", "def": "犯罪者逃過法律制裁，仍自由行動。"}, {"w": "罪有應得", "def": "為所犯的錯承受應得的懲罰。"}, {"w": "天網恢恢", "def": "上天的法網雖寬大稀疏，但絕不會縱容作惡的壞人。後以比喻犯法者難逃國法制裁。"}, {"w": "法外施恩", "def": "除應負的刑責外，在法律許可的範圍內儘量給予方便。"}]}, {"title": "其他補充成語", "items": [{"w": "欲壑難填", "def": "形容人的欲望有如深谷，永難滿足。"}, {"w": "貪得無厭", "def": "貪心而不滿足。"}, {"w": "咎由自取", "def": "所有的責難、災禍都是自己找來的。語含自作自受之意。"}, {"w": "禍福相倚", "def": "禍與福互相依存，往往福因禍而生，而禍中也潛伏有福的因子。"}, {"w": "投機取巧", "def": "利用時機，獲取利益。"}, {"w": "雨後春筍", "def": "比喻事物在某一時期後大量湧現，迅速發展。"}, {"w": "耐人尋味", "def": "意味深遠雋永，讓人反覆尋思體會。"}, {"w": "千山萬壑", "def": "形容高山深谷極多。"}, {"w": "拔地參天", "def": "形容高大或氣勢雄偉。"}, {"w": "博大精深", "def": "廣博深遠。亦形容一個人知識宏闊，見解精闢。"}, {"w": "眾目睽睽", "def": "眾人都睜大眼睛注視著。"}, {"w": "病從口入", "def": "疾病是由於飲食不慎所引起的。"}, {"w": "被髮佯狂", "def": "披散著頭髮，假裝成瘋狂的樣子。"}]}, {"title": "成語充電站", "items": [{"w": "龍潭虎穴", "def": "比喻凶險之地。"}, {"w": "洞若觀火", "def": "觀察事物非常清楚透澈。"}, {"w": "空穴來風", "def": "比喻憑空捏造不實的傳言。"}, {"w": "滿坑滿谷", "def": "比喻數量極多，到處都是。"}, {"w": "別有洞天", "def": "指風景極為秀麗，引人入勝。"}, {"w": "洞天福地", "def": "神仙所住的地方。比喻名山勝境。"}, {"w": "狡兔三窟", "def": "比喻有多處藏身的地方或多種避禍的準備。"}, {"w": "漏洞百出", "def": "常指作文、說話或行為不嚴謹，往往自相矛盾，無法自圓其說。"}]}]}, {"lesson": "3上 自學一 養成新聞判讀力，迎向更美好的生活", "themes": [{"title": "與「真實」、「虛假」有關的成語", "items": [{"w": "貨真價實", "def": "泛指事物真實不假。"}, {"w": "天花亂墜", "def": "傳說佛祖講經說法，感動了天神，天上各色香花從空中紛紛落下。後用以形容說話言詞巧妙，有聲有色，非常動聽。多指誇大而不切實際。"}, {"w": "穿鑿附會", "def": "憑空杜撰，隨意牽合。"}, {"w": "望文生義", "def": "穿鑿附會字面上的意思，而不求了解詞句正確的內容。"}, {"w": "無中生有", "def": "道家指萬有生於虛。後多以無中生有指本無其事憑空造作。"}, {"w": "誇誇其談", "def": "言談浮誇，不切實際。"}]}, {"title": "與「金錢」、「利益」有關的成語", "items": [{"w": "一擲千金", "def": "形容不惜金錢的豪舉。"}, {"w": "爭名逐利", "def": "追逐名聲、爭取利益。形容人喜好名利，唯名利是圖。"}, {"w": "殺人越貨", "def": "指殺人搶劫。"}, {"w": "賣國求榮", "def": "出賣國家，以謀求個人的榮華富貴。"}, {"w": "薄利多銷", "def": "商家以低價微利的方式銷售商品，刺激顧客購買意願，藉此達到銷量增加的目的。"}, {"w": "蠅頭小利", "def": "形容微少的利益。"}]}, {"title": "其他補充成語", "items": [{"w": "應付自如", "def": "形容處理事情從容不迫。"}, {"w": "腳踏實地", "def": "比喻做事切實穩健。"}, {"w": "應接不暇", "def": "形容美景繁多，令人目不暇給。後亦用以比喻人事物繁多紛至，令人窮於應付。"}, {"w": "一言九鼎", "def": "形容說話很有分量。鼎，古代禮儀中的重器。"}, {"w": "輕諾寡信", "def": "隨便答應他人的請求，往往難以實踐諾言。"}, {"w": "風馳電掣", "def": "比喻快速。掣，音ㄔㄜˋ，疾速而過。"}, {"w": "追風逐電", "def": "形容速度非常快。"}, {"w": "魚雁不絕", "def": "書信往來頻繁。"}, {"w": "杳無音信", "def": "沒有任何消息。"}, {"w": "有條不紊", "def": "指條理分明而不紊亂。"}, {"w": "屢見不鮮", "def": "常常見到，並不新奇。"}, {"w": "前仆後繼", "def": "作戰時前面的人倒下，後面的繼續往前衝。形容不怕犧牲，奮勇向前。"}, {"w": "輾轉反側", "def": "形容因心事而翻來覆去睡不著覺。"}, {"w": "無人問津", "def": "沒有人詢問渡口。比喻事物已遭冷落，無人探問。"}]}, {"title": "成語充電站", "items": [{"w": "以訛傳訛", "def": "指將不正確的訊息繼續傳播下去。"}, {"w": "捕風捉影", "def": "比喻所做之事或所說的話毫無根據，憑空揣測。"}, {"w": "眾口鑠金", "def": "本指眾人說法一致，其力量足以銷熔金石。後引申指人多口雜，足以混淆是非。"}, {"w": "道聽塗說", "def": "在路上聽到一些沒有根據的話，不加求證就又在路途中說給其他的人聽。後泛指沒有經過證實、缺乏根據的話。"}, {"w": "曾參殺人", "def": "曾參在費邑時，有一個與他姓名相同的人殺了人，卻誤傳為曾參殺人，曾母起先不信，但經人再三的傳告，便信以為真，丟下手中正在織布的杼，嚇得逃跑了。後比喻流言可畏或誣枉的災禍。"}]}]}, {"lesson": "3上 自學二 大明湖", "themes": [{"title": "與「旅行」有關的成語", "items": [{"w": "風塵僕僕", "def": "形容四處奔波，旅途勞累。"}, {"w": "登山臨水", "def": "攀登山嶺，瀕臨江河。形容遊覽山水名勝或指長途跋涉。"}, {"w": "跋山涉水", "def": "形容走長遠路途的艱苦。"}, {"w": "曉行夜宿", "def": "白天出來活動而晚上休息。形容趕路匆忙的樣子。"}, {"w": "翻山越嶺", "def": "翻越過許多山嶺。形容長途跋涉、旅途辛苦。"}, {"w": "舊地重遊", "def": "再度到曾經去過的地方遊玩。"}]}, {"title": "與「季節」有關的成語", "items": [{"w": "草長鶯飛", "def": "形容暮春三月的景色。"}, {"w": "沉李浮瓜", "def": "比喻夏日消暑的樂事。"}, {"w": "金風玉露", "def": "形容秋天的景物。"}, {"w": "水落石出", "def": "冬季水位下降，使石頭顯露出來。比喻事情真相大白。"}]}, {"title": "其他補充成語", "items": [{"w": "坐井觀天", "def": "坐在井底看天。比喻眼界狹小，所見有限。"}, {"w": "家喻戶曉", "def": "家戶戶都知道。形容事情、名聲傳布極廣。"}, {"w": "歷歷在目", "def": "清清楚楚的呈現在眼前。"}, {"w": "拍案叫絕", "def": "拍桌驚嘆。表示情緒激動。"}, {"w": "游刃有餘", "def": "比喻對於事情能勝任愉快，從容不迫。"}, {"w": "遊手好閒", "def": "遊蕩貪玩，無所事事的樣子。"}, {"w": "格格不入", "def": "牴觸阻隔而不相合。"}, {"w": "獨樹一幟", "def": "比喻自成一家，獨具風格。幟，旗幟。"}, {"w": "排山倒海", "def": "比喻力量、氣勢巨大。"}, {"w": "高山流水", "def": "形容樂曲的高妙。"}, {"w": "矯若遊龍", "def": "形容筆勢、舞姿等靈活似遊龍的姿態。"}]}]}, {"lesson": "3上 自學三 無關歲月", "themes": [{"title": "與「孩童」有關的成語", "items": [{"w": "牙牙學語", "def": "形容嬰兒初學說話的聲音。"}, {"w": "兩小無猜", "def": "男女稚齡時，彼此天真無邪，毫無避嫌與猜疑。"}, {"w": "返老還童", "def": "比喻年老卻如年輕人般的健壯有精力。"}, {"w": "童心未泯", "def": "年歲已大，卻仍保有兒童一般天真、純潔的心性。"}, {"w": "童言無忌", "def": "孩子說話本無節制，因此說錯了也不必忌諱在意。"}, {"w": "童叟無欺", "def": "對待小孩和老人的態度一樣，不會欺瞞。"}]}, {"title": "與「十二生肖」有關的成語", "items": [{"w": "投鼠忌器", "def": "比喻做事有所顧忌，不敢下手。"}, {"w": "汗牛充棟", "def": "形容書籍極多。"}, {"w": "如虎添翼", "def": "比喻強有力者又增添生力軍，使之更強。"}, {"w": "動如脫兔", "def": "比喻動作十分敏捷。"}, {"w": "龍馬精神", "def": "形容精神健旺、充沛。"}, {"w": "筆走龍蛇", "def": "比喻文筆揮灑自如或書法優美熟練。"}, {"w": "馬到成功", "def": "比喻成功迅速而順利。"}, {"w": "順手牽羊", "def": "趁便順勢，取走他人的財物。"}, {"w": "沐猴而冠", "def": "比喻人徒具衣冠而不脫粗鄙本性。"}, {"w": "鶴立雞群", "def": "比喻人的才能超群出眾，不同凡俗。"}, {"w": "白雲蒼狗", "def": "比喻世事變幻無常。"}, {"w": "泥豬瓦狗", "def": "比喻無用之物。"}]}, {"title": "成語充電站", "items": [{"w": "萬事大吉", "def": "一切順利。"}, {"w": "大吉大利", "def": "形容非常吉利。"}, {"w": "除舊布新", "def": "去除舊的，建立新的。"}, {"w": "國泰民安", "def": "國家太平，人民安樂。"}, {"w": "招財進寶", "def": "招來財氣，以發財致富。"}, {"w": "吉祥如意", "def": "諸事吉利順遂合於心意。"}, {"w": "喜氣洋洋", "def": "形容人意興風發、笑逐顏開。"}, {"w": "急景凋年", "def": "光陰急逝，歲殘年盡。後多指歲暮。"}, {"w": "山珍海味", "def": "水陸出產的珍美菜肴。泛指豐盛的食物。"}, {"w": "財運亨通", "def": "獲取錢財的運氣好，賺錢順利，財源滾滾。"}, {"w": "風調雨順", "def": "風雨及時而適量。形容豐年安樂，天下太平的景象。"}, {"w": "天官賜福", "def": "俗傳農曆正月十五日上元節時，天官下降，賜福人間。"}, {"w": "春回大地", "def": "嚴冬過去，春天再度降臨大地。比喻情勢好轉，或事情圓滿成功。"}]}]}, {"lesson": "3下 第一課 臺灣竹枝詞選", "themes": [{"title": "與「植物生長」有關的成語", "items": [{"w": "枝葉扶疏", "def": "枝葉繁密四布。形容樹木茂盛。"}, {"w": "欣欣向榮", "def": "草木繁盛的樣子。"}, {"w": "花團錦簇", "def": "花朵錦繡聚集在一起。形容繁花茂盛。後亦用以形容五彩繽紛、繁華美麗的樣子。"}, {"w": "長林豐草", "def": "幽深的樹林，茂盛的野草。後泛指山林草野之地。"}, {"w": "離離蔚蔚", "def": "非常茂盛的樣子。"}, {"w": "鬱鬱蔥蔥", "def": "茂盛的樣子。"}, {"w": "寸草不生", "def": "連一點小草都無法生長。形容土地非常荒蕪貧瘠。"}, {"w": "不毛之地", "def": "荒涼貧瘠、不長草木的土地。"}, {"w": "赤地千里", "def": "形容災荒後廣大土地寸草不生的荒涼景象。"}, {"w": "童山濯濯", "def": "指無草木的樣子。後多用以形容人禿頭、無髮。童山，草木不生的山。濯濯，音ㄓㄨㄛˊㄓㄨㄛˊ，形容乾乾淨淨的樣子。"}]}, {"title": "與「海」有關的成語", "items": [{"w": "大海撈針", "def": "比喻東西很難找到或事情難以完成。"}, {"w": "天涯海角", "def": "偏僻或相距遙遠的地方。"}, {"w": "海枯石爛", "def": "形容經歷時間長久。後多用以表示意志堅定，永久不變的盟誓之詞。"}, {"w": "海闊天空", "def": "比喻心胸開闊或心情開朗。"}, {"w": "滄海一粟", "def": "比喻渺小，微不足道。"}, {"w": "滄海桑田", "def": "比喻世事無常，變化很快。"}]}, {"title": "與「水果」有關的成語", "items": [{"w": "瓜熟蒂落", "def": "比喻時機成熟，自然成功。"}, {"w": "朱脣榴齒", "def": "嘴脣紅潤，牙齒像石榴子那樣整齊。形容女子容貌美麗。"}, {"w": "投桃報李", "def": "你送桃子，我回贈以李子。後用以比喻彼此間的贈答。"}, {"w": "李代桃僵", "def": "李樹代替桃樹受蟲咬而枯死，用以諷刺兄弟間不能互助互愛。後比喻以此代彼或代人受過。"}, {"w": "橘化為枳", "def": "語本《晏子春秋．內篇．雜下》：「橘生淮南則為橘，生于淮北則為枳。」後比喻同樣的東西會因環境的不同而引起變化。枳，音ㄓˇ。"}, {"w": "讓棗推梨", "def": "讓棗，指南朝王泰不與諸兄爭棗栗的故事。推梨，指東漢孔融讓梨與兄的故事。後以讓棗推梨比喻兄弟間的友愛。"}]}, {"title": "與「地勢」、「地形」有關的成語", "items": [{"w": "龍蟠虎踞", "def": "形容地勢雄偉險要。"}, {"w": "壁立千仞", "def": "形容岩壁矗立之勢極高。"}, {"w": "表裡山河", "def": "有山河為屏障，固守無虞。"}, {"w": "居高臨下", "def": "處於有利的地位，可控制一切。"}, {"w": "山河襟帶", "def": "比喻山河形勢險要，如同人衣服上的襟帶。"}, {"w": "懸崖峭壁", "def": "高峻的山崖，陡峭的石壁。形容山勢高直險峻。"}]}, {"title": "與「豐饒」、「貧瘠」有關的成語", "items": [{"w": "沃野千里", "def": "形容土地肥美，而且面積廣大。"}, {"w": "物阜民豐", "def": "物產豐富而民生富足。"}, {"w": "魚米之鄉", "def": "泛指物產富庶之地。"}, {"w": "鬱鬱蔥蔥", "def": "茂盛的樣子。"}, {"w": "荒時暴月", "def": "收成不好或青黃不接的時候。"}, {"w": "青黃不接", "def": "指新穀還沒成熟，存糧又已吃完。比喻有所匱乏，一時難以為繼。"}, {"w": "不毛之地", "def": "形容荒涼貧瘠的土地。"}, {"w": "寸草不生", "def": "連一點小草都無法生長。形容土地非常荒蕪貧瘠。"}]}, {"title": "與「甘」、「甜」有關的成語", "items": [{"w": "倒吃甘蔗", "def": "漸入佳境。"}, {"w": "甜嘴蜜舌", "def": "說話甜美誘人。"}, {"w": "嘴甜心苦", "def": "形容人說話動聽卻居心狠毒。"}, {"w": "酸甜苦辣", "def": "各種味道。也用來比喻生活中如意、失意等種種遭遇。"}, {"w": "甘之如飴", "def": "比喻樂意承擔艱苦的事情，或處於困境卻能甘心安受。"}]}]}, {"lesson": "3下 第二課 曲選", "themes": [{"title": "與「悲傷」有關的成語", "items": [{"w": "兔死狐悲", "def": "比喻因同類的死亡而感到悲傷。"}, {"w": "泣不成聲", "def": "哭得發不出聲音。形容十分悲傷。"}, {"w": "哀毀骨立", "def": "形容因居親喪過於悲傷哀痛，以致身形瘦損。"}, {"w": "風木之思", "def": "比喻父母亡故，兒女不得奉養的悲傷。"}, {"w": "涕淚縱橫", "def": "鼻涕眼淚縱橫交錯。形容極度悲傷。"}, {"w": "悲憤填膺", "def": "悲傷憤怒之情充塞心中。"}, {"w": "椎心泣血", "def": "自捶胸脯，哭得眼中流出血來。形容哀痛到了極點。"}, {"w": "睹物興悲", "def": "看到某些事物而興起悲傷之情。"}]}, {"title": "與「自然景物」有關的成語", "items": [{"w": "日暮途窮", "def": "天色已晚，路已到盡頭。比喻力竭計窮，陷入絕境。"}, {"w": "如日中天", "def": "好像太陽正當中午，熾熱光明。比喻事物正發展到十分興盛的地步。"}, {"w": "江河日下", "def": "江河之水，源於雪山，春夏冰雪溶則水盛，秋冬冰雪漸凝，江河水則漸少。比喻情況日漸衰微，一天不如一天。"}, {"w": "鏡花水月", "def": "鏡中的花，水裡的月。比喻空幻不實在。"}, {"w": "平步青雲", "def": "比喻順利無阻，迅速晉升高位。"}, {"w": "浮雲朝露", "def": "浮雲易散，朝露易乾。比喻人生的短促。"}, {"w": "海市蜃樓", "def": "比喻虛幻的景象或事物。"}, {"w": "咫尺天涯", "def": "形容相距雖近，卻無緣相見，如同相隔千里。"}]}, {"title": "與「面對困境」有關的成語", "items": [{"w": "一蹶不振", "def": "跌了一跤就不敢再走路。後比喻遭受挫折或失敗後，無法再振作恢復。"}, {"w": "一籌莫展", "def": "一點計策也施展不出來。比喻毫無辦法。"}, {"w": "束手無策", "def": "面對問題時，毫無解決的辦法。"}, {"w": "幸災樂禍", "def": "指心懷妒忌，對於他人的不幸遭遇引以為樂。"}, {"w": "患難之交", "def": "共同經歷困苦艱難而互相扶持的好朋友。"}]}, {"title": "其他補充成語", "items": [{"w": "殊途同歸", "def": "比喻採取的方法雖不同，所得的結果卻相同。"}, {"w": "異曲同工", "def": "曲調雖異，工妙則同。比喻不同人的辭章或方法，卻有相同的造詣或功效。"}, {"w": "方興未艾", "def": "正在蓬勃發展。"}, {"w": "人生如寄", "def": "比喻人生短促，有如暫時寄居於世間。"}, {"w": "悲天憫人", "def": "憂傷時局多變，哀憐百姓疾苦。"}, {"w": "搜索枯腸", "def": "比喻竭力思索。"}, {"w": "泛泛之交", "def": "普通的交情。"}, {"w": "勞燕分飛", "def": "伯勞和燕子離散分飛。比喻別離，而多用於夫妻、情人之間。"}, {"w": "鴉雀無聲", "def": "形容非常寂靜。"}]}]}, {"lesson": "3下 第三課 二十年後", "themes": [{"title": "與「約定、信用」有關的成語", "items": [{"w": "一諾千金", "def": "形容承諾信用高，一旦許諾別人，必定做到。"}, {"w": "海誓山盟", "def": "強調誓盟的堅久不變。"}, {"w": "出爾反爾", "def": "你怎麼對待別人，別人也會怎麼待你。後指人的言行前後反覆，自相矛盾。"}, {"w": "言而無信", "def": "說話不講信用。"}, {"w": "背信忘義", "def": "不守信用，忽視道義。"}, {"w": "輕諾寡信", "def": "輕易答應別人的請求，卻很少實踐諾言。"}, {"w": "約法三章", "def": "原指漢高祖入咸陽，臨時制定三條法律，與民共守。後泛指事先約好或規定的事。"}, {"w": "約定俗成", "def": "事物的名稱或法則，經人倡導，而成為社會習用或公認者。"}, {"w": "大信不約", "def": "真正講信用，不在於立誓訂約。"}, {"w": "不約而同", "def": "彼此並未事先約定，而意見或行為卻相同。"}]}, {"title": "與「方向」有關的成語", "items": [{"w": "前因後果", "def": "事情的起因和結果。"}, {"w": "左右為難", "def": "處境難堪，無所適從。"}, {"w": "左右逢源", "def": "左右兩邊都能夠得到水源。指學道有得，即可得心應手，取用不竭。後比喻行文、辦事得心應手或處事圓融。"}, {"w": "八面玲瓏", "def": "形容人處世圓滑，面面俱到。"}]}, {"title": "其他補充成語", "items": [{"w": "一脈相承", "def": "由一個血統或一個派別承傳沿襲下來。"}, {"w": "小巧玲瓏", "def": "形容極細緻精巧。"}, {"w": "龐然大物", "def": "體積巨大的東西。"}, {"w": "來龍去脈", "def": "指事情的由來和變化。"}, {"w": "進退兩難", "def": "前進不了，又後退不得。形容處境困窘。"}, {"w": "恍然大悟", "def": "心裡忽然明白。"}, {"w": "豁然開朗", "def": "形容領悟了解。"}, {"w": "情同手足", "def": "情感如親兄弟般的深厚。"}, {"w": "狼狽為奸", "def": "狼與狽相互合作，傷害牲畜。比喻彼此勾結做壞事。"}, {"w": "龍潭虎穴", "def": "指龍潛伏的深淵，老虎藏身的洞穴。比喻凶險之地。潭，深水池。"}, {"w": "豐功偉業", "def": "偉大的功績、事業。"}, {"w": "別開生面", "def": "重新描繪舊畫像，而使原已褪色的面貌變得鮮明、生動。後比喻開創新的風格、形式。"}, {"w": "安身立命", "def": "指有了容身之處，生活有著落，精神上有所寄託。安身，得以容身。立命，精神安定。"}, {"w": "瞠目結舌", "def": "睜大眼睛說不出話。形容吃驚、受窘的樣子。"}]}, {"title": "與「約定」、「信用」有關的成語", "items": [{"w": "不期而遇", "def": "未經約定而相遇。"}, {"w": "背信忘義", "def": "不守信用，忽視道義。"}, {"w": "一諾千金", "def": "形容信守承諾，說話算數。"}, {"w": "輕諾寡信", "def": "輕易答應他人的請求，卻很少實踐諾言。"}, {"w": "不約而同", "def": "彼此並未事先約定，而意見或行為卻相同。"}, {"w": "言出必行", "def": "說出的話一定做到。形容有信用、守承諾。"}, {"w": "駟馬難追", "def": "話一說出去，就是用四匹馬拉的車子也追不回來。比喻言之既出，不可挽回。"}]}]}, {"lesson": "3下 第四課 火車與熱氣球", "themes": [{"title": "與「速度快、慢」有關的成語", "items": [{"w": "一目十行", "def": "形容閱讀迅速。"}, {"w": "一瀉千里", "def": "形容水的奔流通暢快速。後亦比喻文筆流暢，氣勢奔放，或比喻快速下降且持續不停"}, {"w": "步履如飛", "def": "形容行動快速。"}, {"w": "風馳電掣", "def": "比喻快速。"}, {"w": "疾如雷電", "def": "形容動作非常快速。"}, {"w": "姍姍來遲", "def": "形容女子遲步緩來的樣子。後亦形容人或事物不依時出現，害人苦等。"}, {"w": "慢條斯理", "def": "從容不迫的樣子"}, {"w": "鵝行鴨步", "def": "比喻走路緩慢。"}]}, {"title": "與「理想、志向」有關的成語", "items": [{"w": "好高騖遠", "def": "指一味的嚮往高遠的目標而不切實際。"}, {"w": "老驥伏櫪", "def": "比喻年紀雖大，仍懷雄心壯志。"}, {"w": "壯志未酬", "def": "偉大的志願尚未實現。"}, {"w": "志同道合", "def": "彼此的志趣和理想一致。"}, {"w": "志在四方", "def": "立志遠行各地以建功立業，不以株守一地為滿足。"}, {"w": "勇往直前", "def": "奮勇前進、無所畏懼。"}]}, {"title": "與「交通工具」有關的成語", "items": [{"w": "水漲船高", "def": "比喻人或事物，隨著憑藉者的地位提升而升高。"}, {"w": "同舟共濟", "def": "比喻同心協力，戰勝困難。"}, {"w": "舟車勞頓", "def": "旅途疲勞困頓。"}, {"w": "車水馬龍", "def": "形容車馬絡繹不絕，繁華熱鬧的景象。"}, {"w": "杯水車薪", "def": "比喻無濟於事。"}, {"w": "前車之鑑", "def": "比喻可以作為後人借鏡的失敗經驗或教訓。"}, {"w": "破釜沉舟", "def": "做事果決、義無反顧。"}, {"w": "順水推舟", "def": "比喻順應情勢行事。"}, {"w": "安步當車", "def": "形容悠閒自在、不慌忙。或比喻安貧節儉。"}, {"w": "快馬加鞭", "def": "對跑很快的馬再加以鞭策，使牠跑得更快。形容快上加快。"}]}, {"title": "與「旅行」有關的成語", "items": [{"w": "遊山玩水", "def": "遊覽山水景致。"}, {"w": "浪跡天涯", "def": "到處流浪，走遍各地。"}, {"w": "曉行夜宿", "def": "形容趕路匆忙的樣子。"}, {"w": "千山萬水", "def": "比喻路途遙遠險阻甚多。"}, {"w": "跋山涉水", "def": "形容走長遠路途的艱苦。"}, {"w": "風塵僕僕", "def": "形容四處奔波，旅途勞累。"}, {"w": "走南闖北", "def": "往來各地、到過很多地方。"}, {"w": "披星戴月", "def": "形容早出晚歸，旅途勞累。"}, {"w": "餐風露宿", "def": "形容野外生活或行旅的艱苦。"}]}]}, {"lesson": "3下 第五課 憶高畑勳：螢火蟲之墓", "themes": [{"title": "與「戰爭」有關的成語", "items": [{"w": "大動干戈", "def": "原指雙方交戰激烈，後多用來比喻行事大肆聲張、勞師動眾或大費手腳。"}, {"w": "拋戈棄甲", "def": "在戰場上打了敗戰。"}, {"w": "枕戈待旦", "def": "枕著武器等待天明。形容時時警惕，準備作戰，不敢安睡。"}, {"w": "烽火連天", "def": "比喻戰火連綿。烽火，戰亂。"}, {"w": "鳴金收兵", "def": "以敲鑼作信號，指揮兵士速退。"}, {"w": "厲兵秣馬", "def": "磨利兵器，餵飽馬匹。指完成作戰準備。厲，磨。秣，音ㄇㄛˋ，餵。"}, {"w": "窮兵黷武", "def": "恣意運用兵力，發動戰爭。黷，音ㄉㄨˊ，濫用，沒有節制。"}]}, {"title": "與「電」或「影」有關的成語", "items": [{"w": "電光石火", "def": "閃電呈現的亮光，火石擊發的火光。比喻轉瞬間即逝。"}, {"w": "風馳電掣", "def": "比喻快速。掣，音ㄔㄜˋ，疾速而過。"}, {"w": "目光如電", "def": "形容眼光湛然有神，似閃電一般。"}, {"w": "形影不離", "def": "形容關係親密，無時無處不在一起。"}, {"w": "含沙射影", "def": "傳說水中有一種叫蜮的怪物，能含沙噴射人影，使人得病。比喻暗中害人。"}, {"w": "立竿見影", "def": "豎竿於陽光下，可立見其影。比喻迅速收到成效。"}, {"w": "捕風捉影", "def": "比喻所做之事或所說的話毫無根據，憑空揣測。"}, {"w": "杯弓蛇影", "def": "比喻為不存在的事情枉自驚惶。"}]}, {"title": "與「依靠」有關的成語", "items": [{"w": "孤苦伶仃", "def": "孤單貧苦，無依無助。"}, {"w": "鰥寡孤獨", "def": "孤獨困苦、無依無靠的人。鰥，音ㄍㄨㄢ，年老無妻或喪妻的人。"}, {"w": "寄人籬下", "def": "寄居他人屋下生活。比喻依附他人，而不能自立。"}, {"w": "仰人鼻息", "def": "比喻依靠他人生活或看別人的臉色行事，不能自主。"}, {"w": "自食其力", "def": "憑藉自己的力量養活自己。"}]}, {"title": "其他補充成語", "items": [{"w": "椎心泣血", "def": "自捶胸脯，哭得眼中流出血來。形容哀痛到了極點。"}, {"w": "肝腸寸斷", "def": "比喻悲傷到了極點。"}, {"w": "手舞足蹈", "def": "手、腳舞動跳躍。形容非常高興喜悅。"}, {"w": "心花怒放", "def": "形容心情像盛開的花朵般舒暢快活。"}, {"w": "苦口婆心", "def": "以懇切真摯的態度，竭力勸告他人。"}, {"w": "暮鼓晨鐘", "def": "比喻使人覺悟的言論。"}, {"w": "戰戰兢兢", "def": "因畏懼而顫抖。形容戒懼謹慎的樣子。"}, {"w": "獨樹一幟", "def": "比喻自成一家，獨具風格。幟，旗幟。"}, {"w": "天人交戰", "def": "正義和私欲相互衝突。"}, {"w": "出雙入對", "def": "形容情侶感情很好，形影不離。"}]}]}, {"lesson": "3下 第六課 后羿射月", "themes": [{"title": "與「情緒」有關的成語", "items": [{"w": "兔死狐悲", "def": "比喻因同類的死亡而感到悲傷。"}, {"w": "受寵若驚", "def": "因意外受到寵愛，致喜悅中帶有不安。"}, {"w": "恐懼不安", "def": "恐慌害怕，心裡難安。"}, {"w": "深惡痛絕", "def": "厭惡、痛恨到極點。"}, {"w": "喜上眉梢", "def": "喜悅之情流露於眉宇之間。"}, {"w": "惱羞成怒", "def": "因羞愧到極點而惱恨發怒。"}, {"w": "愁眉苦臉", "def": "眉頭緊皺，苦喪著臉。形容憂傷、愁苦的神色。"}, {"w": "憂心忡忡", "def": "憂愁不安的樣子。忡，音ㄔㄨㄥ。"}, {"w": "樂不思蜀", "def": "蜀漢亡後，後主劉禪被送往洛陽，司馬昭設宴待禪，作蜀漢故技於前，禪樂在其中，司馬昭因而問禪：「是否思蜀？」禪答：「此間樂，不思蜀。」後比喻樂而忘返或樂而忘本。"}, {"w": "鬱鬱寡歡", "def": "悶悶不樂。"}]}, {"title": "與「對比字」有關的成語", "items": [{"w": "上行下效", "def": "在上位的人怎麼做，下面的人就起而效法。"}, {"w": "口是心非", "def": "嘴上說的和心裡想的不一致。"}, {"w": "大同小異", "def": "大體相同，但略有差異。"}, {"w": "天長地久", "def": "天地永恆無窮的存在著。後用以形容時間悠遠長久。"}, {"w": "左顧右盼", "def": "東張西望，心中不安的樣子。"}, {"w": "改邪歸正", "def": "改正錯誤，回到正確的道路上。"}, {"w": "前仆後繼", "def": "作戰時前面的人倒下，後面的繼續往前衝。形容不怕犧牲，奮勇向前。仆，音ㄆㄨ。"}, {"w": "紙短情長", "def": "深長的情意，非筆墨所能盡述。"}, {"w": "賞善罰惡", "def": "獎賞行善的人，懲罰作惡的人。"}, {"w": "積少成多", "def": "累積少量而成多數。"}]}, {"title": "與「神話」有關的成語", "items": [{"w": "開天闢地", "def": "神話傳說中天地是由盤古所分開。後比喻前所未有。"}, {"w": "愚公移山", "def": "相傳北山愚公苦於家門前有太形、王屋二山阻攔出路，因而率領子孫挖掘土石，決心鏟平二山。後天帝為其真誠所感動，於是命夸蛾氏二子背負二山，移去他地。後比喻努力不懈，不畏艱難，自能成事。"}, {"w": "夸父逐日", "def": "傳說夸父威猛好勝，乃與太陽追趕競走，總追不上，路上又累又渴，喝光了黃河、渭水仍然不夠，再往北邊大澤去找水喝，卻渴死在途中。他隨身的手杖棄置在地上，後來長出了一片桃林。後比喻不自量力或有雄心壯志但未竟大業。"}, {"w": "牛郎織女", "def": "相傳織女為天帝孫女，長年織造雲錦天衣。嫁給牛郎後，荒廢織事，天帝大怒。責令織女與牛郎分離，只准兩人於每年七夕相會一次。後比喻分離兩地，難以會面的夫妻或情侶。"}, {"w": "女媧補天", "def": "傳說上古時代，女媧曾煉五色石以補天的裂縫，截斷鰲足以作為撐天的大柱。"}, {"w": "吳剛伐桂", "def": "神話傳說中吳剛在學仙時犯了錯誤，遭天帝懲罰到月宮砍伐桂樹，其樹隨砍隨合，所以必須不斷砍伐。"}, {"w": "精衛填海", "def": "本指炎帝幼女溺死東海，化為精衛鳥，憤而銜木石以填東海的故事。比喻心懷冤憤，立志報仇。亦比喻意志堅定，不懼艱苦。"}]}]}, {"lesson": "3下 自學一 聊齋志異選——種梨", "themes": [{"title": "與「樹」有關的成語", "items": [{"w": "樹大招風", "def": "樹長得高大時容易受到風吹。比喻個人名聲太大，容易招來妒嫉毀謗。"}, {"w": "火樹銀花", "def": "形容燈火通明，燈光燦爛的景象。"}, {"w": "玉樹臨風", "def": "形容人年少才貌出眾。"}, {"w": "枯樹生華", "def": "乾枯的樹再生新花。比喻在絕望中獲得生機。"}, {"w": "風樹之悲", "def": "比喻父母親亡故，兒女不得奉養的悲傷。"}, {"w": "劍樹刀山", "def": "比喻極其危險艱難的境地。"}, {"w": "獨樹一幟", "def": "比喻自成一家，獨具風格。幟，旗幟。"}, {"w": "林無靜樹", "def": "比喻萬事萬物的變化不止。"}, {"w": "芝蘭玉樹", "def": "比喻優秀的子弟。後用作對別人子弟的讚美詞。"}, {"w": "蚍蜉撼樹", "def": "指以大螞蟻的力量想去搖動大樹。比喻不自量力。蚍蜉，音ㄆㄧˊㄈㄨˊ，大螞蟻。"}]}, {"title": "與「梨」有關的成語", "items": [{"w": "梨園子弟", "def": "泛稱表演戲曲的藝人。"}, {"w": "梨頰微渦", "def": "形容美女的笑靨迷人可愛。梨頰，梨花色的臉頰。渦，酒渦。"}, {"w": "杏雨梨雲", "def": "杏花如雨，梨花似雲。形容春天景色美麗。"}, {"w": "雨打梨花", "def": "雨點擊打在梨花上，形容暮春的景象，或比喻美人的遲暮。"}, {"w": "讓棗推梨", "def": "讓棗，指南朝王泰不與諸兄爭棗栗的故事。推梨，指東漢孔融讓梨與兄的故事。後以讓棗推梨比喻手足間的友愛。"}, {"w": "禍棗災梨", "def": "稱濫刻沒有價值的書籍，徒使刻書用的梨木、棗木受到災禍。"}]}, {"title": "與「吝嗇」、「慷慨」有關的成語", "items": [{"w": "一毛不拔", "def": "本指戰國時楊朱所倡的為我、貴己學說。後用以譏諷人極端吝嗇、自私。"}, {"w": "小裡小氣", "def": "形容人吝嗇或舉止不大方，缺乏大家氣派。"}, {"w": "稱薪而爨", "def": "秤剛夠分量的柴薪煮飯。形容人斤斤計較，節儉吝嗇。爨，音ㄘㄨㄢˋ，用火燒熟食物。"}, {"w": "慷慨解囊", "def": "指毫不吝嗇的給別人經濟援助。囊，錢袋。"}]}, {"title": "其他補充成語", "items": [{"w": "不毛之地", "def": "荒涼貧瘠、不生草木的土地。"}, {"w": "貽笑大方", "def": "被識見廣博或精通此道的內行人所譏笑。貽，音ㄧˊ，遺留、留傳。貽笑，遺留笑柄。大方，指識見廣博的人。"}]}]}, {"lesson": "3下 自學二 錢是省出來的", "themes": [{"title": "與「錢」有關的成語", "items": [{"w": "一錢不值", "def": "比喻毫無價值。"}, {"w": "用錢如水", "def": "形容揮霍無度。"}, {"w": "見錢眼開", "def": "形容人貪婪愛財，唯利是圖。"}, {"w": "愛錢如命", "def": "愛惜錢財就像疼惜自己的生命一樣。形容十分刻薄、吝嗇。"}, {"w": "日食萬錢", "def": "每天飲食須耗費上萬的錢。形容生活極為奢侈豪華。"}]}, {"title": "與「買賣」有關的成語", "items": [{"w": "招兵買馬", "def": "招募軍士，購置戰馬。比喻組織或擴充軍事力量。引申指招攬人員，以籌組事業或進行某種活動。"}, {"w": "裝瘋賣傻", "def": "故意假裝成痴呆瘋癲的樣子。"}, {"w": "賣友求榮", "def": "出賣朋友以謀求自己的榮華富貴。"}, {"w": "賣弄玄虛", "def": "故意玩弄花招，使人不可捉摸。"}, {"w": "賣狗懸羊", "def": "表裡不一，欺騙矇混。"}]}, {"title": "與「臭」有關的成語", "items": [{"w": "逐臭之夫", "def": "追逐臭味的人。後用以比喻有怪癖的人。"}, {"w": "遺臭萬年", "def": "惡名永遠流傳下去，遭人唾罵。臭，音ㄔㄡˋ，惡名，不好的名聲。"}, {"w": "乳臭未乾", "def": "嘴裡還有奶腥味。比喻年幼無知。臭，音ㄒㄧㄡˋ，氣味。"}]}, {"title": "與「香」有關的成語", "items": [{"w": "香消玉殞", "def": "比喻女子死亡。"}, {"w": "憐香惜玉", "def": "比喻愛憐、善待女性。香、玉，比喻青春美麗的女子。"}, {"w": "香火鼎盛", "def": "朝拜、進香的人極多。"}]}, {"title": "與「節儉」有關的成語、諺語", "items": [{"w": "節衣縮食", "def": "生活節儉。"}, {"w": "東撙西節", "def": "形容處處節約。"}, {"w": "躬行節儉", "def": "親自實踐節省儉約。"}, {"w": "惡衣惡食", "def": "形容生活儉約樸實。"}, {"w": "克勤克儉", "def": "指既能勤勞又能節儉。"}, {"w": "細水長流", "def": "節約使用財物，才能長久不缺。"}, {"w": "食不二味", "def": "飲食時不用兩種菜肴。形容生活儉樸。"}, {"w": "開源節流", "def": "比喻開發財源，節省支出，以儲蓄財力。"}, {"w": "修舊利廢", "def": "將壞的、舊的東西修理好，使成為可利用之物。"}, {"w": "居不重席", "def": "坐臥處不鋪設兩重墊子。比喻生活非常的節約。"}, {"w": "勤是搖錢樹，儉是聚寶盆", "def": "勤能生財，儉能守成。比喻必須勤、儉並重，開源與節流同時並進，方能致富。"}, {"w": "常將有日思無日，莫待無時思有時", "def": "有錢的時候，要想窮困時的辛苦，不要等到財富用光了，再後悔前時生活得太過奢華。勸人要節儉度日，有備無患。"}]}]}, {"lesson": "3下 自學三 賀伯吹來的教導", "themes": [{"title": "與「風」有關的成語", "items": [{"w": "風行雷厲", "def": "像打雷般猛烈，如颳風般快速。比喻執行政令嚴格迅速。"}, {"w": "風吹草動", "def": "比喻輕微的動靜變化。"}, {"w": "風華正茂", "def": "形容年輕有為，才華橫溢。"}, {"w": "風燭殘年", "def": "風中的燭火，隨時可能熄滅。比喻臨近死亡的晚年。"}, {"w": "見風轉舵", "def": "比喻隨機應變，視情況而行動。舵，音ㄉㄨㄛˋ。"}, {"w": "淒風苦雨", "def": "形容天氣惡劣。比喻悲慘淒涼的境況。"}, {"w": "聞風喪膽", "def": "聽到一點消息就嚇破膽。形容極度恐懼。"}, {"w": "八面威風", "def": "比喻聲勢浩大、神氣十足的樣子。"}, {"w": "風馳電掣", "def": "比喻快速。"}, {"w": "風聲鶴唳", "def": "形容極為驚慌疑懼。"}, {"w": "風調雨順", "def": "比喻豐年安樂的景象。"}, {"w": "風平浪靜", "def": "比喻平靜或情勢穩定。"}, {"w": "雷厲風行", "def": "比喻執行政令嚴格迅速。"}, {"w": "櫛風沐雨", "def": "比喻在外奔走，極為辛勞。"}, {"w": "風塵僕僕", "def": "形容四處奔波，旅途勞累。"}, {"w": "春風化雨", "def": "比喻師長和藹親切的教育。"}, {"w": "高風亮節", "def": "高尚的品格，堅貞的氣節。"}, {"w": "疾風迅雷", "def": "比喻事情發生得突然、迅速。"}, {"w": "呼風喚雨", "def": "比喻人神通廣大、很有影響力。"}, {"w": "風雨飄搖", "def": "比喻時局動蕩不安，極不穩定。"}, {"w": "光風霽月", "def": "比喻政治清明，時世太平的局面。"}, {"w": "風雨如晦", "def": "比喻處於險惡環境中也不改變其操守。"}, {"w": "弱不禁風", "def": "虛弱得無法承受風吹，形容身體極為虛弱。"}, {"w": "疾風勁草", "def": "比喻在艱難困苦的環境下，才能考驗出人的堅強意志和節操。"}, {"w": "捕風捉影", "def": "比喻所做之事或所說的話毫無根據，憑空揣測。或比喻事情毫無成果、徒勞無功。"}]}, {"title": "其他補充成語", "items": [{"w": "形容枯槁", "def": "身形乾瘦。"}, {"w": "行將就木", "def": "比喻年紀已大，壽命將盡。"}, {"w": "心驚膽戰", "def": "形容十分害怕。"}, {"w": "提心吊膽", "def": "形容心理上、精神上擔憂恐懼，無法平靜下來。"}, {"w": "銳不可當", "def": "氣勢威猛，不可抵擋。當，音ㄉㄤˇ，匹敵、抵抗。"}, {"w": "見機行事", "def": "視情況變化而採因應之道。"}, {"w": "因時制宜", "def": "根據不同時期的情況，採取合宜的措施應對。"}, {"w": "刻舟求劍", "def": "楚人過江，劍掉水中，便於船舷刻一記號，待船停止，從刻記號處下水尋劍的故事。後用以比喻拘泥固執，不知變通。"}, {"w": "獨木難支", "def": "比喻事情非常重大，非一人之力所能支持。"}, {"w": "推波助瀾", "def": "從旁鼓動，使事態擴大。比喻不能消弭事情，反而助長它。"}, {"w": "咎由自取", "def": "所有的責難、災禍都是自己找來的。語含自作自受之意。"}, {"w": "動輒得咎", "def": "一有舉動就會犯過，受到責難。指人處境困難，極易遭到罪責。咎，音ㄐㄧㄡˋ，責罰、怪罪。"}, {"w": "幸災樂禍", "def": "指心懷妒忌，對於他人的不幸遭遇引以為樂。幸災，見人有難而高興。樂禍，見人有難而引以為樂。"}, {"w": "雨過天青", "def": "雨後初放晴時的天色。比喻情況由壞轉好。"}, {"w": "青雲直上", "def": "比喻順利的迅速升到高位。青雲，指顯要的地位。"}, {"w": "厲兵秣馬", "def": "磨利兵器，餵飽馬匹。指完成作戰準備。厲，磨。秣，音ㄇㄛˋ，餵。"}]}]}]}];

const TONE_R={'ˊ':1,'ˇ':1,'ˋ':1,'ˉ':1};
function vzhuyin(syl){syl=(syl||'').trim();let base=syl,tone='',pos='';if(syl[0]==='˙'){tone='˙';pos='t';base=syl.slice(1);}else{const last=syl[syl.length-1];if(TONE_R[last]){tone=last;pos='r';base=syl.slice(0,-1);}}let h='<span class="zn">';for(const ch of base)h+=`<span class="zsym">${ch}</span>`;if(tone)h+=`<span class="zt zt-${pos}">${tone}</span>`;return h+'</span>';}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* 誘答挑易混淆：注音相似度(同音>同音異調>共用聲母/韻母)、成語共用字 */
function toneless(s){return (s||'').replace(/[ˊˇˋ˙]/g,'');}
function simYin(a,b){if(!a||!b)return 0;if(a===b)return 6;var ta=toneless(a),tb=toneless(b);if(ta===tb)return 5;var i=0;while(i<ta.length&&i<tb.length&&ta[i]===tb[i])i++;var j=0;while(j+i<ta.length&&j+i<tb.length&&ta[ta.length-1-j]===tb[tb.length-1-j])j++;return i+j+(ta[0]===tb[0]?0.5:0);}
var DEF_LEAD=/^(比喻為|比喻|形容為|形容|意謂|意指|指稱|表示|謂|喻|指)/;
var DEF_STOP=new Set([...'的了地得之而也是與和或於在為以及其此該對將把被使即則乃且所又不無沒很非常十分人事物']);
function defTerms(def){var s=String(def||'').replace(DEF_LEAD,'').replace(/[^一-鿿]/g,'');var arr=[...s];var chars=new Set(arr.filter(c=>!DEF_STOP.has(c)));var grams=new Set();for(var i=0;i<arr.length-1;i++)grams.add(arr[i]+arr[i+1]);return {chars:chars,grams:grams};}
function defSim(A,B){var g=0;A.grams.forEach(x=>{if(B.grams.has(x))g++;});var c=0;A.chars.forEach(x=>{if(B.chars.has(x))c++;});return g*3+c;}
/* 成語擂臺是「看釋義選成語」→ 誘答優先挑「釋義相近」的成語（近義成語），共用字/字數只作次要加權 */
function idiomDist(target,pool,n){
  var A=defTerms(target.def),wl=[...target.w].length,wc=new Set([...target.w]);
  var seen={},uniq=[];pool.forEach(function(x){if(x&&x.w!==target.w&&x.def&&!seen[x.w]){seen[x.w]=1;uniq.push(x);}});
  var scored=uniq.map(function(x){var d=defSim(A,defTerms(x.def));var sh=0;for(const c of new Set([...x.w]))if(wc.has(c))sh++;return {w:x.w,s:d*4+sh+([...x.w].length===wl?0.5:0)};}).sort(function(a,b){return b.s-a.s;});
  var top=scored.slice(0,Math.max(n+4,8)).map(o=>o.w);
  return shuffle(top).slice(0,n);
}
function hanLen(w){return (w.match(/[一-鿿]/g)||[]).length}
function fit(w){const n=hanLen(w);if(n<=1)return 72;if(n<=2)return 60;if(n<=3)return 50;if(n<=5)return 40;return 30;}
function fitFlip(w){const n=hanLen(w);if(n<=2)return 56;if(n<=3)return 48;if(n<=5)return 40;return 32;}
function rubyHTML(word,zhuyin,size){const chars=[...word],syl=zhuyin.split(' ').filter(Boolean);if(chars.length!==syl.length)return `<div class="word" style="font-size:${size}px">${word}</div><div class="pinyin" style="color:var(--accent);font-style:normal;font-size:18px;letter-spacing:2px">${zhuyin}</div>`;let h='<div class="rubyword">';chars.forEach((c,i)=>h+=`<span class="ruby"><span class="rb" style="font-size:${size}px">${c}</span>${vzhuyin(syl[i])}</span>`);return h+'</div>';}
function egHTML(word,e){if(!e)return "";return `<div class="eg">例：${e.split(word).join('<b>'+word+'</b>')}</div>`;}

DATASETS.forEach(ds=>{ if(ds.kind==='zixing'){ ds.LL={}; ds.sim.forEach(g=>{const cs=g.chars.map(x=>x.c);cs.forEach(c=>{ds.LL[c]=(ds.LL[c]||[]).concat(cs.filter(x=>x!==c));});}); } });
const LLALL={}; DATASETS.forEach(ds=>{ if(ds.kind==='zixing'&&ds.LL){ for(const k in ds.LL){ LLALL[k]=(LLALL[k]||[]).concat(ds.LL[k]); } } });
const DIANGU={"id":"diangu","name":"讀典故知文史","sub":"第壹篇 · 60 則","kind":"diangu","lessons":[{"lesson":"第壹篇 第1單元 帝王故事","items":[{"no":"01","title":"問鼎","story":"春秋時期，先後打敗多國的楚莊王，又再度打敗了陸渾〔ㄏㄨㄣˊ〕的戎人，接著跑到周天子的地盤上炫〔ㄒㄩㄢˋ〕耀武力，操辦了盛大的「閱兵儀式」。周天子一看大事不妙，趕緊派大臣王孫滿前去慰勞〔ㄌㄠˋ〕。楚莊王趁這個機會，向王孫滿詢問起周朝九鼎。因為九鼎代表著王權，誰能擁有它，誰就是老大。於是，他假裝好奇地問：「聽說這九鼎很重，能告訴我，它們到底多重嗎？」王孫滿知道楚莊王別有用心，說：「大王，九鼎的重量不在於本身，而在於民心。民心所向，九鼎便穩如泰山；民心如果背離，鼎就算再大，也輕得保不住啊！」楚莊王聽完後知道自己的小心思被看穿了，只好灰溜溜地撤〔ㄔㄜˋ〕兵了。","note":"「陸渾」：中國古代部落，居住在陸渾","def":"指覬〔ㄐㄧˋ〕覦〔ㄩˊ〕王位，謀取政權；或指謀取最高榮譽、地位。","def_note":null,"ex":"奇奇的烘焙〔ㄅㄟˋ〕技術精湛〔ㄓㄢˋ〕，問鼎甜點比賽冠軍，獎品是一年分的麵粉，看來我們有機會品嘗美味點心了。","rel":[{"tag":"延伸","w":"一言九鼎","d":"形容說話很有分量。"},{"tag":"延伸","w":"鼎立","d":"三方勢力如鼎足般對峙〔ㄓˋ〕並立。"},{"tag":"延伸","w":"鼎力相助","d":"大力幫助。"}]},{"no":"02","title":"烽火戲諸侯","story":"西周的周幽王有一個最寵愛的妃子叫褒〔ㄅㄠ〕姒〔ㄙˋ〕，因為她總是不笑，周幽王便絞〔ㄐㄧㄠˇ〕盡腦汁想要取悅她。某天，他想到點燃烽火臺的主意，這本是敵人入侵時的警報措施。周幽王點燃了烽火臺，諸侯見狀急忙帶兵趕來，卻發現根本沒有敵人。而褒姒看到諸侯被戲耍〔ㄕㄨㄚˇ〕的樣子，竟噗〔ㄆㄨ〕哧〔ㄔ〕地笑了出來，讓周幽王開心得不得了。然而，三番兩次的戲弄，讓諸侯逐漸對周幽王失去了信任。後來敵人真的來了，周幽王再次點燃烽火，但諸侯以為這次又是惡作劇，無人前往救援。結果周幽王被殺，褒姒被俘，最終導致國家滅亡。","note":null,"def":"指周幽王為了博得褒姒一笑，竟然點燃作戰時才會點燃的烽火臺，戲弄諸侯，最終失去諸侯信任，導致國家滅亡。","def_note":null,"ex":"這位主管為了測試員工忠誠度，故意捏造裁員消息，結果公司人心惶〔ㄏㄨㄤˊ〕惶〔ㄏㄨㄤˊ〕，簡直是烽火戲諸侯。","rel":[{"tag":"相似","w":"放羊的孩子","d":"一個牧童因為多次謊報狼來了，最終在狼真的來時無人相信，而導致羊群被吃掉的故事。比喻多次說謊戲耍別人的人，最終會失去他人的信任。"}]},{"no":"03","title":"作壁上觀","story":"秦末時百姓生活非常困苦，於是各地英雄起義反抗，誓與秦朝決裂。趙王被秦朝名將章邯〔ㄏㄢˊ〕追擊，一路逃到鉅鹿，眼看就要被滅，楚國派宋義和項羽救趙。宋義主張等秦趙兩敗俱傷，再出手撿便宜，此與項羽意見不合，於是項羽先殺了宋義，自己再帶兵攻打秦國。其他前來幫忙的諸侯國，都因恐懼秦軍不敢向前，只敢在營壘上觀看楚軍作戰，儼〔ㄧㄢˇ〕然如「吃瓜群眾」，看到項羽一下子就把秦軍打得落花流水，他們都嚇傻了，轉而對他畢恭畢敬。從此，項羽成了真正的老大。","note":null,"def":"在壁壘〔ㄌㄟˇ〕上旁觀別人交戰。今比喻坐觀成敗，不幫助任何一方。","def_note":"「壁壘」：軍營的圍牆","ex":"公司兩位主管在會議上脣槍舌劍，小員工只能作壁上觀，默默祈禱會議趕快結束。","rel":[{"tag":"相似","w":"隔岸觀火","d":"比喻事不干己，袖手旁觀的態度。"},{"tag":"相反","w":"拔刀相助","d":"出面替人打抱不平。"}]},{"no":"04","title":"九五之尊","story":"古代有本很厲害的算命書叫易經，裡面有很多神祕的圖案，叫做「卦〔ㄍㄨㄚˋ〕」，每個卦由六行線組成，這些線叫做「爻〔ㄧㄠˊ〕」。其中最厲害的是第一卦叫「乾〔ㄑㄧㄢˊ〕卦」，象徵天，代表不息的活力，一般代表帝王也就是皇帝。乾卦的六個爻都是陽爻，陽爻就像太陽一樣，代表著好運和力量。這六個爻從下往上數，分別是一（初）、二、三、四、五、六（上），就像樓層一樣。第五層，也就是第五爻，叫做「九五」，是最棒的位置。為什麼呢？因為九五的位置既高又穩。太高的位置容易摔下來，太低的位置又沒有好風景。「九五」就像坐在摩天輪上的最佳位置，風景最好，又很安全！而乾卦是所有卦裡的第一名，九五又是乾卦裡最好的爻，所以九五就是所有爻中的上選。古人認為，只有皇帝才能配得上這個位置，因此，「九五之尊」就成了皇帝的代名詞。","note":"「爻」：長的橫線「—」，稱為陽爻；斷開的兩條線「- -」，稱為陰爻","def":"比喻君位。","def_note":null,"ex":"爺爺在家裡地位最高，每次家庭聚會，他總坐在最舒適的沙發中央，大家笑說他是「家中九五之尊」。","rel":[]},{"no":"05","title":"三過家門而不入","story":"大禹的父親鯀〔ㄍㄨㄣˇ〕因為治水失敗去世了，於是大禹接下這個艱鉅任務。他四處奔波治水，十三年間曾至少路過家門三次，卻忙得連回家的時間都沒有，因為他知道，雖然老婆和孩子在家裡等他，但只要洪水沒治好，就會有更多人受苦。憑著這份堅毅與決心，大禹終於成功治好了洪水，造福萬民。","note":null,"def":"比喻公而忘私，勤於職守。","def_note":null,"ex":"疫情期間，醫護人員們為了守護大家的健康，夜以繼日地工作，三過家門而不入的精神，令人感佩。","rel":[{"tag":"相似","w":"捨己為人","d":"為他人而犧牲自己。"},{"tag":"相反","w":"樂不思蜀〔ㄕㄨˇ〕","d":"比喻樂而忘返或樂而忘本。"}]},{"no":"06","title":"牝〔ㄆㄧㄣˋ〕雞司晨","story":"商紂〔ㄓㄡˋ〕王沉迷酒色、荒廢朝政，不好好治理國家，只對寵妃妲〔ㄉㄚˊ〕己的話言聽計從。這時，周武王決定討伐商紂王，他在牧野召開誓師大會，並引用古話：「母雞不該鳴叫，如果母雞早晨鳴叫，這家必會倒楣〔ㄇㄟˊ〕！」以此諷〔ㄈㄥˋ〕刺商紂王任由女人掌權的不正常現象。最終，周武王擊敗商紂王，建立周朝。「牝雞司晨」由此而來，古代認為女性掌權是不好的事。然而，隨著時代進步，這種觀點已逐漸被淘汰。","note":null,"def":"母雞代公雞執行清晨報曉的鳴啼。比喻女性專權。","def_note":"「牝」：雌〔ㄘ〕性動物","ex":"公司新來的女主管行事果決，領導能力不輸男性，有人私下議論說她是牝雞司晨，這無疑是性別歧視！","rel":[]},{"no":"07","title":"黃袍加身","story":"五代十國時期，天下大亂。趙匡胤〔ㄧㄣˋ〕奉命帶兵抵抗外敵的入侵。一天，趙匡胤帶兵打仗，在陳橋驛〔ㄧˋ〕紮〔ㄓㄚ〕營休息。士兵們早就厭倦了打打殺殺的日子，於是幾個膽大的士兵趁著趙匡胤睡著時，偷偷溜進他的帳篷，拿出準備好的亮閃閃黃袍幫他披上。趙匡胤醒來一看：「咦！我怎麼穿了件金光閃閃的衣服？」士兵們立刻跪倒一片，高呼萬歲：「恭喜皇上！賀喜皇上！」就這樣，趙匡胤「黃袍加身」當上皇帝，建立了宋朝。","note":null,"def":"指被擁戴為皇帝。","def_note":"「黃袍」：唐高祖時黃袍成為皇帝專用服裝","ex":"我家的狗套上爸爸的舊黃色雨衣後，威風凜〔ㄌㄧㄣˇ〕凜〔ㄌㄧㄣˇ〕地巡視全家，宛如黃袍加身般霸氣。","rel":[]},{"no":"08","title":"何不食肉糜〔ㄇㄧˊ〕","story":"西晉惠帝聽說百姓因饑〔ㄐㄧ〕荒而沒飯吃，便皺〔ㄓㄡˋ〕著眉頭疑惑地問：「那他們怎麼不吃肉粥呢？」大臣們聽了差點昏倒，因為肉粥對當時的百姓來說是奢〔ㄕㄜ〕侈〔ㄔˇ〕品，窮人根本吃不起。大臣們只好解釋說：「老百姓現在窮得連基本的飯都吃不起，哪來的肉和米煮粥啊？」晉惠帝這才恍然大悟，原來自己說了不合時宜的話。","note":"「不合時宜」：不適合時下的潮流、趨向","def":"比喻不了解民間疾苦，脫離現實。","def_note":"「糜」：濃稠的稀飯","ex":"老闆說員工工作效率低是因為不夠努力，真是何不食肉糜，完全忽視加班時長與工作壓力。","rel":[]},{"no":"09","title":"挾〔ㄒㄧㄚˊ〕天子以令諸侯","story":"東漢末年，天下大亂，就像一個班級沒有老師，大家吵吵鬧鬧沒人管，這時曹操憑謀略與能力崛〔ㄐㄩㄝˊ〕起。當時的皇帝漢獻帝形同虛設，被董卓欺負。曹操看不下去，便打跑了董卓，救出獻帝。然而，曹操沒有將皇權還給獻帝，而是把他「保護」起來，實際上操控了他。\n這就像曹操拿著老師的教鞭，對其他同學說：「老師說，你們都要聽我的！」其他人雖然不服，但看到曹操權勢在手，也只能聽命。藉著皇帝的名義，曹操號令天下，打敗其他地方勢力，統一北方，成為當時最有權勢的人。「挾天子以令諸侯」便由此而來。雖然做法不可取，但充分展現了曹操的才智。","note":null,"def":"比喻借重權勢者的名義發號施令。","def_note":"「挾」：脅〔ㄒㄧㄝˊ〕持","ex":"他在公司雖無正式職位，卻因和老闆關係密切，常常挾天子以令諸侯，讓同事們敢怒不敢言。","rel":[]},{"no":"10","title":"哈姆雷特","story":"丹麥王子哈姆雷特的父親突然去世，而叔叔克勞狄斯不僅娶了哈姆雷特的母親，還奪走了王位。正當哈姆雷特覺得事有蹊〔ㄒㄧ〕蹺〔ㄑㄧㄠ〕時，父親的鬼魂出現，告訴他自己是被克勞狄斯毒死的。為了復仇，哈姆雷特開始裝瘋賣傻，暗中收集證據。他安排一場戲劇重現父親的死因，而克勞狄斯的反應證實了鬼魂的話。\n在復仇的過程中，哈姆雷特誤殺了女友的父親，女友因悲傷過度而死。最後，哈姆雷特與克勞狄斯決鬥，成功殺死克勞狄斯，但自己也中毒身亡。","note":"「蹊蹺」：怪異而違背常情","def":"莎士比亞筆下的丹麥王子哈姆雷特為父報仇，最終卻走向毀滅的悲劇故事。","def_note":null,"ex":"","rel":[],"title_en":"Hamlet","badge":"西洋"}]},{"lesson":"第壹篇 第2單元 施政方法","items":[{"no":"01","title":"蕭規曹隨","story":"秦朝末年天下大亂，各路英雄好漢紛紛冒出頭來。劉邦在家鄉父老的贊助下，也加入了滅秦大軍。他手底下的得力幹將蕭何和曹參〔ㄘㄢ〕，簡直是他的左膀〔ㄅㄤˇ〕右臂。後來，劉邦建立漢朝成為皇帝。他封蕭何當丞相，蕭何制定了一大堆規章制度，治國有條不紊〔ㄨㄣˇ〕。可是蕭何和曹參的關係卻變了，以前好得不行，現在卻彼此疏遠。沒想到蕭何臨死前，居然向劉邦推薦〔ㄐㄧㄢˋ〕曹參接任丞相。曹參上任後，完全按照蕭何那一套作法！他說：「蕭何大哥制定的規矩很完美了，我只要照著做就行，亂改搞不好還弄巧成拙呢！」曹參執政期間，國家安穩、百姓安居樂業。大家紛紛稱讚蕭何和曹參，說蕭何制定規矩，曹參遵守規矩，這就叫「蕭規曹隨」。","note":null,"def":"比喻後人依循前人所訂的規章辦事。","def_note":null,"ex":"新任市長決定蕭規曹隨，延續前任的政策，以維持城市的穩定發展。","rel":[{"tag":"相反","w":"改弦〔ㄒㄧㄢˊ〕易轍〔ㄔㄜˋ〕","d":"比喻改變制度、做法或態度。"},{"tag":"延伸","w":"依樣畫葫蘆","d":"比喻一味模仿，毫無創見。"}]},{"no":"02","title":"摩頂放〔ㄈㄤˇ〕踵〔ㄓㄨㄥˇ〕","story":"春秋戰國時期，思想家們就像選秀節目裡的選手，各顯本領，希望能輔佐君王治理國家。其中，楊朱和墨子代表了兩個極端。楊朱的「貴己」學說，奉行「我的利益最重要」原則，哪怕拔根汗毛對世界有益，他也堅決不做；墨子則相反，他的「兼愛」學說，主張愛所有人，即使摩禿了頭，走破了後腳跟，只要對天下有利，他都在所不辭。孟子評論他們說：「楊朱拔一毛以利天下而不為，墨子摩頂放踵利天下而為之。」","note":null,"def":"比喻捨身救世，不辭勞苦。","def_note":"「放」：至。「踵」：後腳跟","ex":"志工們摩頂放踵地為災區重建付出，令人敬佩。","rel":[{"tag":"相似","w":"鞠躬盡瘁〔ㄘㄨㄟˋ〕","d":"指不辭辛勞，盡力於國事。"},{"tag":"相反","w":"好逸惡〔ㄨˋ〕勞","d":"貪圖安逸，憎〔ㄗㄥ〕惡〔ㄨˋ〕勞動。（「憎」：厭惡）"}]},{"no":"03","title":"風行草偃〔ㄧㄢˇ〕","story":"魯國季康子問孔子：「孔夫子，我在想要不要把壞人殺光，提拔好人，您覺得這樣好不好呢？」孔子聽後嚴肅地回答：「您治理國家，怎麼想著殺戮〔ㄌㄨˋ〕呢？其實上位者的品德就像風，百姓的品德像草，風往哪兒吹，草就往哪兒倒。您要是刮起良善之風，大家自然會向善。所以，只要您以身作則，自然能潛移默化地影響人民。」","note":null,"def":"比喻在上位者以德化民。","def_note":"「偃」：仆〔ㄆㄨ〕倒、倒伏","ex":"這位校長以身作則，師生皆受其感召〔ㄓㄠˋ〕，於是風行草偃形成良好的校風。","rel":[{"tag":"相反","w":"上梁不正下梁歪","d":"比喻在上位的人或長輩行為不正，在下位的人或晚輩受其影響，也跟著行為不正。"},{"tag":"延伸","w":"上行下效","d":"在上位的人怎麼做，下面的人就起而效法。"}]},{"no":"04","title":"只許州官放火，不許百姓點燈","story":"宋朝有個州官叫田登，只要是和他的名字「登」同音的字，都要用其他字來替代，要是有人觸犯這個忌諱〔ㄏㄨㄟˋ〕，就要挨鞭子。元宵節快到了，按照習俗要張燈結綵〔ㄘㄞˇ〕，這讓處理告示的官員感到為難，想了好久，只好把「放燈」寫成「放火」，最後貼出來告示是「本州依例放火三日」。當地的老百姓平時就不滿田登的蠻橫〔ㄏㄥˋ〕無理，看到這個告示更是氣憤萬分，忿〔ㄈㄣˋ〕忿〔ㄈㄣˋ〕地說：「只許州官放火，不許百姓點燈，這是什麼世道啊！」","note":"「忌諱」：避忌、隱諱某些言語或舉動；「張燈結綵」：張掛燈籠，紮結著彩球、彩帶。是一種表現喜慶的習俗","def":"比喻在上者可為非作歹，在下者卻受到種種的限制。","def_note":null,"ex":"公司規定員工不得遲到，但主管卻經常姍〔ㄕㄢ〕姍〔ㄕㄢ〕來遲，真是只許州官放火，不許百姓點燈！","rel":[{"tag":"相反","w":"王子犯法與庶〔ㄕㄨˋ〕民同罪","d":"帝王的兒子觸犯了法律，要和平民接受同樣的罪刑。意謂法律之前人人平等。"}]},{"no":"05","title":"約法三章","story":"秦朝末年起義不斷，劉邦和項羽最受矚〔ㄓㄨˇ〕目。劉邦深知「得民心者得天下」的道理，明白光靠武力是不夠的，還得贏得百姓的支持。所以，他的軍隊紀律嚴明，從不燒殺搶掠〔ㄌㄩㄝˋ〕。攻打到霸上時，秦朝皇帝投降了。有些將領建議趁機「斬草除根」，但劉邦拒絕，說：「人家已經投降，再殺就太不厚道，百姓會失望的。」\n後來又攻下咸〔ㄒㄧㄢˊ〕陽，劉邦不急著慶祝，而是回到霸上，對父老鄉親們說：「大家被秦朝折磨夠了吧？從現在起，廢除秦朝苛法，只留三條：殺人償〔ㄔㄤˊ〕命，傷人抵罪，偷盜坐牢！」百姓聽了欣喜若狂，都稱讚劉邦是大好人。他的「約法三章」為劉邦日後建立漢朝奠〔ㄉㄧㄢˋ〕定了基礎。","note":null,"def":"泛指事先約好或規定的事。","def_note":null,"ex":"為了避免爭吵，室友們約法三章，輪流打掃房間。","rel":[{"tag":"相反","w":"胡作非為","d":"指不顧法紀或不講道理地任意妄為。"}]},{"no":"06","title":"草菅〔ㄐㄧㄢ〕人命","story":"梁懷王是漢文帝最寵愛的小兒子，皇帝特地請大才子賈誼〔ㄧˋ〕當他的家庭教師。賈誼心想：教皇子讀書容易，教他如何做人才是關鍵！一天，賈誼對梁懷王說：「殿下，商朝、周朝厲害是因為有好規矩，而秦朝整天鑽研陰謀詭計和嚴刑峻〔ㄐㄩㄣˋ〕法，最終僅二代就滅亡了！」他又說：「秦二世胡亥〔ㄏㄞˋ〕本來不是壞人，但趙高教他的全是酷刑和欺詐，所以胡亥才變得冷血無情，把殺人看得跟割野草一樣！」賈誼語重心長地說：「所以殿下，讀書固然重要，但更重要的是學做人！否則即便身居高位，也可能重蹈覆轍〔ㄔㄜˋ〕，留下不好的名聲。」","note":null,"def":"比喻輕視人命，濫殺無辜。","def_note":"「菅」：一種多年生的野草","ex":"不肖商人販售黑心食品，根本是草菅人命，令人痛恨。","rel":[{"tag":"相似","w":"視如草芥〔ㄐㄧㄝˋ〕","d":"看成像小草一般卑賤。比喻輕蔑〔ㄇㄧㄝˋ〕，藐〔ㄇㄧㄠˇ〕視。"},{"tag":"延伸","w":"菅屨〔ㄐㄩˋ〕","d":"用菅草編成的鞋，喪〔ㄙㄤ〕葬時所穿。"}]},{"no":"07","title":"苛〔ㄎㄜ〕政猛於虎","story":"孔子和學生途經泰山時，看到一位婦人趴在墳前哭得撕心裂肺。孔子停下車，讓子路上前詢問。子路問：「您怎麼哭得這麼傷心，好像遭遇了不只一次的不幸？」婦人哭著說：「是啊！我公公、丈夫、兒子都被老虎吃了！」孔子驚訝地問：「這裡這麼危險，為什麼不搬走呢？」婦人回答：「因為這裡沒有苛政啊！」孔子聽完，感慨〔ㄎㄞˇ〕地對子路說：「記住，苛政比老虎還可怕啊！」","note":null,"def":"意為煩苛酷虐的政令比老虎還凶猛可怕。","def_note":null,"ex":"比起天災，有時苛政猛於虎，更讓人難以承受。","rel":[{"tag":"延伸","w":"民不聊生","d":"形容百姓生活非常困苦。（「聊」：依賴）"},{"tag":"延伸","w":"生靈塗炭","d":"形容人民生活於極端艱苦的困境。"}]},{"no":"08","title":"路不拾遺","story":"商鞅〔ㄧㄤ〕是名厲害的政治家，他從魏國跳槽到秦國當宰相後，開始大刀闊斧地改革。商鞅制定了嚴格的法律，無論身分高低，犯法必受懲罰，連太子犯錯，他的老師也要跟著受罰！新法律實施後，秦國的社會風氣有了驚人的變化。路上即使有人掉了東西，也不會被撿走。人人誠實守法，達到「路不拾遺，夜不閉戶」的程度。秦國軍力也日益壯大，其他國家對秦國敬畏不已。","note":"（「大刀闊斧」：處事興革果斷有魄力）","def":"路人看見道路上的失物而不會據為己有。形容社會風氣良好。（「遺」：亡失的東西）","def_note":null,"ex":"堯〔ㄧㄠˊ〕舜時代，社會安寧、路不拾遺，百姓生活富足。","rel":[{"tag":"相似","w":"門不夜關","d":"比喻社會安寧，盜賊絕跡。"}]},{"no":"09","title":"三令五申","story":"春秋時期，軍事天才孫武帶著孫子兵法去找吳王求職。吳王看了覺得不錯，但又不放心，便說：「你這兵法寫得很好，可以用宮女來演練嗎？」孫武自信答應。吳王召來一百八十名宮女，分成兩隊，由吳王寵妃當隊長。孫武反覆叮〔ㄉㄧㄥ〕囑〔ㄓㄨˇ〕要服從軍令，但一聲令下，宮女們哈哈大笑。孫武不生氣，說：「沒有把命令講清楚，我再說一遍。」再下令，宮女們仍然大笑，沒有依令行動。孫武臉色一沉：「命令已解釋清楚，但妳們卻不服從，就是隊長的過錯。」下令斬了兩名寵妃！吳王趕忙喊停：「我已經知道先生很會帶兵，請不要斬首我的寵妃！」但孫武堅持：「軍中無戲言，將〔ㄐㄧㄤˋ〕在外，君命有所不受。」寵妃被斬後，宮女們嚇得服從指揮，演練井然有序。這便是「三令五申」的由來，說明軍令如山，將領在軍中有絕對權威。","note":null,"def":"再三命令告誡。","def_note":null,"ex":"政府三令五申禁止酒駕，違者將受到嚴厲的懲罰。","rel":[{"tag":"相反","w":"草草了事","d":"指匆忙隨便地解決事情。"}]},{"no":"10","title":"成也蕭何，敗也蕭何","story":"漢朝初年，軍事天才韓信在蕭何的推薦下，成為劉邦的大將軍。韓信果真不負眾望，立下赫赫戰功，為劉邦打天下立下了汗馬功勞。可以說，沒有蕭何，就沒有韓信的輝煌。然而，天下安定後，韓信功高震主，讓劉邦和呂后感到忌憚〔ㄉㄢˋ〕。於是蕭何與呂后設下計謀，將韓信騙進宮中處死。韓信的成功與失敗都和蕭何有關，這就是「成也蕭何，敗也蕭何」的由來。","note":null,"def":"比喻事情的好壞或成敗都由同一人造成的。亦比喻為做事出爾反爾，反覆無常。","def_note":null,"ex":"他憑藉出色的口才在競選中占盡優勢，卻因為辯論時的一句失言而落選，真是成也蕭何，敗也蕭何。","rel":[]}]},{"lesson":"第壹篇 第3單元 心機手段","items":[{"no":"01","title":"掣〔ㄔㄜˋ〕肘〔ㄓㄡˇ〕","story":"宓〔ㄈㄨˊ〕子賤被派往亶〔ㄉㄢˇ〕父（魯國地名）當官，魯國國君派了兩名小書僮跟隨他。到了亶父，當地官員來拜見，宓子賤讓書僮負責記錄。結果，他一直故意去拉書僮的胳〔ㄍㄜ〕膊〔ㄅㄛˊ〕肘，導致他們字都寫歪了，還假裝生氣：「怎麼寫得這麼差！」兩個小書僮無奈地跑回魯國向國君告狀：「宓大人不要我們了！他一直干擾我們，害我們寫不好字，還不停罵我們，大家都在笑我們！」國君聽後恍然大悟：「原來如此！宓子賤是在提醒我啊！我總是對他指手畫腳，就像他拉扯書僮的胳膊肘一樣，害他沒法好好做事！」","note":null,"def":"比喻為難、牽制。（「掣」：牽引、牽動）","def_note":null,"ex":"同事雖然說此次方案由我全權主導，但暗地裡卻處處掣肘，簡直說一套做一套。","rel":[{"tag":"延伸","w":"風馳電掣","d":"比喻快速。（「掣」：疾速）"}]},{"no":"02","title":"終南捷徑","story":"唐朝首都長安附近，有個地方叫終南山，許多官員來此修身養性。為了得到皇帝注意，一些想當官的人就跑到終南山假裝隱居。有一位叫盧藏用的人，雖然考中公職，但一直沒有得到好職位，他便跑到終南山「隱居」。後來果然被皇上召入宮，從此平步青雲。然而，真正的隱士司馬承禎卻住在天臺山，皇帝三次邀請他，他都拒絕。有一次，盧藏用向司馬承禎說：「您要隱居，終南山更近，為何去那麼遠？」司馬承禎一眼就看穿盧藏用的小心思，回應道：「我看終南山根本就是當官的捷徑吧！」盧藏用聽後，面紅耳赤，羞愧萬分。","note":"（「平步青雲」：比喻順利無阻，迅速晉升高位）","def":"比喻求官或求名利的便捷途徑。","def_note":null,"ex":"不要老是幻想終南捷徑，踏實努力才最可靠。","rel":[{"tag":"相似","w":"一步登天","d":"比喻突然達到極高的地位或境界。"}]},{"no":"03","title":"請君入甕〔ㄨㄥˋ〕","story":"武則天時代，酷吏周興和來俊臣殘忍的酷刑讓人聞風喪膽。一天，周興被控謀反，武則天派來俊臣審問他。來俊臣請周興吃飯，笑咪咪地問：「如果犯人不招供怎麼辦？」周興得意地回答：「很簡單，搬一個大甕，把它燒熱，把犯人丟進去，保證他立刻全招！」來俊臣立刻叫人搬來大甕生火，甕紅得發燙。他慢悠悠地說：「皇上讓我來審你謀反，請進甕吧！」周興嚇得魂飛魄散，撲通跪地，慌忙地說：「我招！我全招！」最終，他的惡行反噬〔ㄕˋ〕自身，被自己發明的酷刑所制伏。","note":null,"def":"比喻用某人整治別人的方法來懲〔ㄔㄥˊ〕治他自己。","def_note":null,"ex":"你說過遲到要罰錢，現在你遲到了，就請君入甕吧！","rel":[{"tag":"延伸","w":"甕中捉鱉〔ㄅㄧㄝ〕","d":"比喻舉手可得、確有把握。"}]},{"no":"04","title":"尸〔ㄕ〕位素餐","story":"「尸位」的故事源於夏朝的君主太康，他完全不理朝政，每天只知道吃喝玩樂，百姓們都不喜歡他。有一次，他外出打獵，竟然玩了整整一百天，結果被另一個部落的首領后羿〔ㄧˋ〕將他阻絕在黃河，使他無法回國。\n「素餐」則來自一首古詩，諷刺那些既不種田也不打獵，卻有吃不完的糧食和穿不完的皮草的人。後來，這兩個詞合在一起，變成了「尸位素餐」。","note":null,"def":"指空居職位享受俸祿而不盡職守。（「尸位」：空居職位而無所作為。「素餐」：無功勞而空享俸祿）","def_note":null,"ex":"尸位素餐的官員，最終一定會被人民所唾棄。","rel":[{"tag":"延伸","w":"行尸走肉","d":"比喻一個人徒具形骸〔ㄏㄞˊ〕，缺乏生氣，庸碌無為。"}]},{"no":"05","title":"一手遮天","story":"李斯是楚國人，後來到秦國當宰相，輔佐秦始皇建立大一統的帝國。然而，秦始皇一死，李斯和宦〔ㄏㄨㄢˋ〕官趙高聯手作惡，偽〔ㄨㄟˋ〕造聖旨，逼死優秀的皇子扶蘇和忠臣蒙恬，將皇位推給昏庸的胡亥，好讓自己能掌權。最終，秦朝迅速滅亡，李斯也被趙高害死。唐朝詩人曹鄴〔ㄧㄝˋ〕讀到這段歷史，寫了一首詩，裡面有句話叫「難將一人手，掩得天下目」，諷刺李斯想一手遮天，隱瞞真相的行徑。","note":null,"def":"比喻玩弄權術、瞞上欺下的行徑。","def_note":null,"ex":"他的權力再大，也無法一手遮天，掩蓋真相。","rel":[{"tag":"相似","w":"瞞天過海","d":"比喻欺騙的手法很高明。"}]},{"no":"06","title":"望梅止渴","story":"三國時代，曹操帶著大軍去打仗，天氣熱得像烤箱一樣，士兵們又渴又累、精疲力竭。曹操突然靈機一動，大聲說：「兄弟們，聽說前方有片梅子樹林，梅子酸甜多汁，想想都解渴！」士兵們一聽，腦中浮現出可口的大梅子，嘴裡也不由自主地開始分泌〔ㄇㄧˋ〕口水，士兵們瞬間感覺不那麼渴了，士氣頓時提升。他們繼續往前走，最終成功找到水源，徹底解決了口渴之苦。","note":null,"def":"比喻以空想來安慰自己。","def_note":null,"ex":"你提出的這個想法無疑只是望梅止渴，根本解決不了實際問題。","rel":[{"tag":"相似","w":"畫餅充饑","d":"比喻聊以空想安慰自己。"}]},{"no":"07","title":"杯酒釋兵權","story":"宋太祖趙匡胤當上皇帝後，心想：「以前那些地方勢力太囂張，我要想辦法把兵權收回來。」於是，他邀請石守信等大將軍喝酒。酒過三巡，趙匡胤開始暗示：「各位打仗辛苦，不如早日退休，享受榮華富貴，免得哪天被逼著當皇帝，那多麻煩！」將軍們聽懂了趙匡胤的弦〔ㄒㄧㄢˊ〕外之音，心中惶恐，紛紛以身體欠佳為由請辭，主動交出兵權。就這樣，趙匡胤不費一兵一卒便解決了兵權問題，手段著〔ㄓㄨㄛˊ〕實高明。","note":"（「弦外之音」：言外之意）","def":"本指在酒宴上解除將領的兵權。泛指輕而易舉地解除將領的兵權。","def_note":null,"ex":"老闆表面上請大家吃飯，實際上是想杯酒釋兵權，架空老員工。（「架空」：比喻暗中受到排擠而失去實權）","rel":[]},{"no":"08","title":"三寸之舌","story":"戰國時期，秦國攻打趙國的首都邯〔ㄏㄢˊ〕鄲〔ㄉㄢ〕，情況十分危急。趙王派平原君去楚國搬救兵，平原君選了十九名隨從〔ㄗㄨㄥˋ〕，準備一同前往，這時，一個叫毛遂的人自告奮勇：「老大，算我一個！」平原君勉強同意了。到了楚國，平原君多番請求，但楚王始終猶豫不決，不肯出兵相助。眼看情況不妙，毛遂站出來，對楚王慷慨陳詞，氣勢十足，竟說〔ㄕㄨㄟˋ〕服楚王答應出兵救趙。平原君回到趙國後，對毛遂讚嘆不已，說：「你這三寸不爛之舌，比百萬大軍還厲害啊！」從此，毛遂的才華受到重用，並成了平原君的座上賓。","note":null,"def":"形容能言善道，長於言辭的口才。","def_note":null,"ex":"他憑著三寸之舌，在辯論大會上一鳴驚人，贏得滿堂喝彩。","rel":[{"tag":"延伸","w":"口若懸河","d":"形容能言善辯。"},{"tag":"延伸","w":"毛遂自薦","d":"比喻自告奮勇，自我推荐。"}]},{"no":"09","title":"割雞焉用牛刀","story":"孔子有個學生叫子游，擅長文學。他在魯國一個叫武城的小地方當官，用音樂教化百姓。有一天，孔子到武城，聽見四處飄著音樂聲，笑著說：「殺雞哪需要用宰牛刀啊？」意思是說，治理這麼個小地方，需要這麼隆重嗎？子游一本正經地回應：「老師，您曾說過，當官的人懂了道理就會愛護百姓，百姓學了道理就容易遵守規範。我這是按照您的教誨在做。」孔子聽了，立刻對其他學生說：「剛才只是開玩笑，子游做得很對！」","note":null,"def":"比喻處理小事，毋需大才。","def_note":null,"ex":"叫專業人士來幫你換燈泡，簡直是割雞焉用牛刀。","rel":[{"tag":"相似","w":"大材小用","d":"比喻才能的浪費或人事安排不當。"},{"tag":"延伸","w":"弦歌不輟〔ㄔㄨㄛˋ〕","d":"比喻政治清明，禮樂教化普及。"}]},{"no":"10","title":"不入虎穴，焉得虎子","story":"東漢有個大英雄叫班超，年輕時在與匈奴的戰爭中立下赫赫戰功，後來被派往西域當外交官。班超到達鄯〔ㄕㄢˋ〕善國時，國君一開始對他很客氣，但沒多久態度突然冷淡了。原來，匈奴也派人來拉攏鄯善國王。班超察覺不妙，當即召集三十六位兄弟，對他們說：「不進去老虎的窩，怎麼能抓得到小老虎？我們今晚就去燒了匈奴的帳篷！」眾人聽後都覺得十分刺激，立刻舉雙手贊成。當晚，班超帶著兄弟們襲擊匈奴營帳，大獲全勝，將匈奴使者全部殲〔ㄐㄧㄢ〕滅。鄯善國王嚇得臉都綠了，只得乖乖地投降。","note":null,"def":"不深入險境，就不能達到目標。","def_note":null,"ex":"記者為了獲得第一手資料，不入虎穴，焉得虎子，前往危險地區進行採訪。","rel":[{"tag":"相反","w":"知難而退","d":"指行事遇到困難退縮不前或應伺機退卻。"}]}]},{"lesson":"第壹篇 第4單元 當前局勢","items":[{"no":"01","title":"窮途末路","story":"「窮途末路」這個成語源於兩個故事。首先，南北朝時期有一位文人王褒〔ㄅㄠ〕，他描述自己因遠離家鄉的痛苦時，引用了三國時期的名士阮籍的故事。阮籍常因心情鬱〔ㄩˋ〕悶〔ㄇㄣˋ〕而跑到沒有路的地方，表達自己無法回家的絕望心情。王褒以此表達自己想家卻回不去的痛苦，稱之為「窮途」。另一位文人鄒陽在勸說西漢吳王的信中，提到秦朝雖然曾經很強大，最終卻走到了衰敗的「末路」。「末路」是用來形容國家衰敗的最後階段，就像一棵大樹枯萎〔ㄨㄟ〕，走到了生命的盡頭。","note":null,"def":"形容走投無路，處於十分窮困的境況。","def_note":null,"ex":"許多人認為破產的他已是窮途末路，沒想到多年後他卻能憑藉自己的努力，東山再起。","rel":[{"tag":"延伸","w":"坐困愁城","d":"形容處境艱困、沒有出路，且無力擺脫。"}]},{"no":"02","title":"旗鼓相當","story":"新莽末年，東漢人隗〔ㄨㄟˇ〕囂〔ㄒㄧㄠ〕在隴〔ㄌㄨㄥˇ〕西自立為王，自稱「西州上將軍」，公孫述則在四川稱帝，為「蜀中皇帝」。尚未取得政權的漢光武帝劉秀的兵力多集中在東邊，他在西部的兵力打不過隗囂和公孫述。劉秀不想讓這兩方人馬合作，決定先拉攏隗囂，孤立公孫述。他寫信給隗囂說：「如果公孫述來攻打我，希望你能幫我，這樣我們才能與他旗鼓相當，一起打敗他！」古代打仗時，軍隊的氣勢與鼓聲、旗幟〔ㄓˋ〕有關，鼓聲愈大和旗幟愈氣派，就代表軍隊愈厲害。","note":null,"def":"比喻雙方勢均力敵。","def_note":null,"ex":"這次參賽隊伍實力旗鼓相當，比賽一定十分精彩。","rel":[{"tag":"相似","w":"勢均力敵","d":null},{"tag":"相似","w":"平分秋色","d":null},{"tag":"相似","w":"各有千秋","d":null},{"tag":"相似","w":"工力悉敵","d":null},{"tag":"相反","w":"天淵之別","d":"天與地相距極遠。比喻相差極大。"},{"tag":"相反","w":"判若雲泥","d":null},{"tag":"相反","w":"寸木岑〔ㄘㄣˊ〕樓","d":null},{"tag":"相反","w":"霄壤之別","d":null}]},{"no":"03","title":"杯弓蛇影","story":"東漢有位官員應〔ㄧㄥ〕郴〔ㄔㄣ〕請下屬杜宣喝酒。杜宣突然看到酒杯裡有一條「蛇」，嚇得頭皮發麻，但還是硬著頭皮喝下去。回家後，杜宣開始肚子痛、食不下咽〔ㄧㄢˋ〕，身體愈來愈虛弱，醫生也無法治療。應郴聽說後前去探望，問他發生什麼事。杜宣說：「那天我喝了杯有蛇的酒，就病了！」應郴回到家查看，發現牆上的弓影映在酒杯裡，像條蛇。應郴再次邀請杜宣來喝酒，解釋了真相。杜宣這才恍〔ㄏㄨㄤˇ〕然大悟，心結解開後，他的病馬上好了！","note":null,"def":"比喻為不存在的事情枉〔ㄨㄤˇ〕自驚惶〔ㄏㄨㄤˊ〕。","def_note":null,"ex":"那不過是風吹樹葉之聲！別杯弓蛇影，自己嚇自己。","rel":[{"tag":"相似","w":"疑神疑鬼","d":"形容內心多疑。"}]},{"no":"04","title":"草木皆兵","story":"東晉時，前秦苻〔ㄈㄨˊ〕堅帶著八十萬大軍攻打東晉，企圖一舉消滅對方。面對如此強敵，東晉派謝玄、謝石兩位將軍，僅以八萬士兵抵抗。苻堅自以為能速戰速決，沒想到晉軍靠著奇襲，卻把他們打得節節敗退。苻堅登上城牆觀察敵情，看見晉軍訓練有素、士氣高昂，非常吃驚。他望向八公山，看到山上長滿了像人一樣的草木，竟誤以為是晉軍的伏兵，嚇得回頭跟弟弟說：「你看，山上還有那麼多士兵！誰說晉軍人少？」他心裡開始慌了，最終全軍覆沒。此戰稱為「淝〔ㄈㄟˊ〕水之戰」，而「草木皆兵」一詞由此而來，用來形容人害怕到極點，疑神疑鬼的情況。","note":null,"def":"見到風吹草動，都以為是敵兵。比喻緊張、恐懼，疑神疑鬼。","def_note":null,"ex":"看完恐怖電影，我走在路上，只覺草木皆兵，稍有風吹草動都讓我心驚膽戰。","rel":[{"tag":"相似","w":"杯弓蛇影、疑神疑鬼、風聲鶴唳。","d":null},{"tag":"相反","w":"處變不驚","d":"處於詭〔ㄍㄨㄟˇ〕譎〔ㄐㄩㄝˊ〕多變的情勢中，仍不驚惶失措。","note":"（「詭譎」：(1)變化無窮。(2)奇特、怪誕）"}]},{"no":"05","title":"噤〔ㄐㄧㄣˋ〕若寒蟬","story":"東漢官員杜密退休後，依然很關心國家大事，常向太守王昱〔ㄩˋ〕推荐賢人、揭發惡行。與他同鄉的劉勝也退休了，但他卻選擇明哲保身，對國事漠不關心。太守稱讚劉勝清高，其實是嫌杜密多管閒事。杜密便跟太守說：「劉勝雖然退休，還是有很多人去找他，他應該更關心國家大事，可他卻不推荐賢人，也不舉報壞事，像寒蟬一樣不吭〔ㄎㄥ〕聲，這是國家的罪人啊！我推荐賢人、舉報壞事，是為了讓您獎罰分明，名聲更好，實在不是想找碴〔ㄔㄚˊ〕。」太守聽了，深感慚愧，更加敬重杜密。","note":null,"def":"指像寒冷季節時的蟬，一聲不響。形容不敢作聲。","def_note":"（「噤」：閉口不作聲。「寒蟬」：比喻不說話）","ex":"老闆正在氣頭上，大家都噤若寒蟬，沒有人敢出聲。","rel":[{"tag":"相似","w":"緘〔ㄐㄧㄢ〕口結舌","d":"緊閉嘴巴，舌頭像打結一般，不敢發言。"},{"tag":"相反","w":"直言不諱〔ㄏㄨㄟˋ〕","d":"直述其事，無所避諱。","note":"（「諱」：隱瞞，有所保留）"},{"tag":"延伸","w":"明哲保身","d":"明達事理、洞見時勢的人，不參與會帶給自己危險的事。後亦指為了個人得失而喪失原則的庸俗處世態度。"}]},{"no":"06","title":"新亭對泣","story":"五胡亂華導致西晉王室及中原士族逃到江南，建立了東晉，每逢天氣晴朗，這些來到江南的士大夫們就相約在新亭聚會，邊吃喝邊懷念故鄉。有一次，武城侯周顗〔ㄧˇ〕感嘆道：「這裡的風景雖然和中原一樣美，但山河已易主，真是物是人非啊！」眾人聽了，心情沉重，不禁落淚。這時，丞相王導臉色一沉，嚴肅說道：「我們應該齊心協力，幫助朝廷收復失地！怎麼能像亡國奴一樣，只會坐在這裡哭泣呢？」王導的一番話，讓眾人十分羞愧，立刻振作精神，不再悲傷。","note":null,"def":"比喻懷念故國或感時憂國的悲憤心情。","def_note":null,"ex":"想到家鄉被戰火吞噬〔ㄕˋ〕，大家忍不住新亭對泣。","rel":[{"tag":"延伸","w":"新亭淚","d":"比喻感時憂國。"}]},{"no":"07","title":"東窗事發","story":"宋朝秦檜〔ㄎㄨㄞˋ〕為了賣國求榮，設計害死了忠臣岳飛。當時岳飛打敗敵人，壞了秦檜想與敵人和議的好事。秦檜一日內連發十二道金牌，把岳飛騙回京城，關進大牢。秦檜怕直接殺岳飛會為天下人所罵，於是和妻子在東窗下密謀。他的妻子冷冷地說：「捉老虎容易，放老虎難！殺了吧！」秦檜聽從了，當晚便害死岳飛。不久後，秦檜父子也接連而死。他的妻子找道士來做法事，道士卻看到秦檜父子正在地獄受罰。秦檜懊悔地說：「我們在東窗下密謀害岳飛的事，已經被揭發了！」","note":null,"def":"在東窗下的密謀已經被揭發。比喻陰謀敗露〔ㄌㄨˋ〕，將被懲〔ㄔㄥˊ〕治。","def_note":null,"ex":"他的貪汙行為終於東窗事發，被檢舉後迅速遭到調查和處罰。","rel":[{"tag":"相似","w":"露出馬腳","d":"比喻隱蔽的真相洩漏出來。"},{"tag":"相反","w":"瞞天過海","d":"比喻欺騙的手法很高明。"}]},{"no":"08","title":"四面楚歌","story":"秦朝滅亡後，項羽和劉邦爭奪天下，都想當皇帝，但一直無法打敗對方。他們約定以鴻溝為界，畫分勢力範圍：河東是項羽的地盤，河西是劉邦的地盤。本以為戰爭就此結束，沒想到狡〔ㄐㄧㄠˇ〕猾〔ㄏㄨㄚˊ〕的劉邦並未遵守協議，趁項羽撤退時，聽從軍師的計策發動了偷襲，他還聯合其他勢力將項羽的軍隊團團圍困在垓〔ㄍㄞ〕下。這時，項羽的軍隊又累又餓，士兵們都沒有力氣打仗了。更慘的是，晚上竟然聽見從劉邦的軍營裡傳來楚國的歌謠。士兵們一聽就想起了家鄉和親人，心情頓時低落，失去了鬥志。項羽看到軍心動搖，知道大勢已去，便帶領少數親信突圍而出，最後在烏江邊自刎〔ㄨㄣˇ〕，結束了這場爭霸戰。","note":null,"def":"比喻所處環境艱難困頓，孤立無援。","def_note":null,"ex":"他當初不聽勸又執迷不悟的錯誤決策，最終落入四面楚歌的境地。","rel":[{"tag":"相反","w":"歌舞昇平","d":"形容一片熱鬧繁榮的太平景象。"},{"tag":"延伸","w":"腹背受敵","d":"前、後都受到敵人的攻擊。"}]},{"no":"09","title":"五日京兆","story":"漢宣帝時，首都長安治安很差，皇帝聽說張敞〔ㄔㄤˇ〕很有才能，就讓他來當京兆尹（最高的行政長官）。張敞果然厲害，把長安治理得井井有條。然而，張敞的好友楊惲〔ㄩㄣˋ〕得罪了皇帝被處死，跟楊惲關係好的官員都被炒魷魚，只有張敞因為皇帝信任才沒事。有一次，張敞派手下絮〔ㄒㄩˋ〕舜〔ㄕㄨㄣˋ〕辦案，結果他覺得張敞的官位也快不保了，乾脆偷懶回家睡覺。有人勸他別這樣，他卻說：「我幫張大人夠多了，他也只剩五日京兆可當了，我還忙什麼？」這話被張敞聽到了，他立刻把絮舜抓起來處死。絮舜所說的「五日京兆」是指他認為張敞不久後會被免官。","note":"（「炒魷魚」：辭退、解僱）","def":"比喻任職不能長久或沒有長遠的打算。","def_note":"（「京兆」：指古代京師地區的行政長官）","ex":"你當代理主管不過只是五日京兆，又何必那麼認真？","rel":[{"tag":"相似","w":"五日尹〔ㄧㄣˇ〕京。","d":null}]},{"no":"10","title":"化險為夷","story":"吐〔ㄊㄨˇ〕蕃〔ㄈㄢ〕是中國西部的一個古老民族，和中原早有來往，唐朝時還與皇室聯姻。但安史之亂後，唐朝國力衰弱，吐蕃就開始伺〔ㄙˋ〕機而動，甚至一度攻占了首都長安，逼得皇帝逃離京城。雖然後來唐朝奮力反擊，把吐蕃趕走，但他仍然時常來騷擾。有一年，吐蕃再次進犯，唐朝派將軍崔寧出戰，結果大勝，還俘虜了不少敵軍。當時有位文人韓雲卿寫了一篇文章，讚揚唐朝對戰敗部族處理得很好，讓原本的災禍變成了祥和的陽光，崎〔ㄑㄧˊ〕嶇〔ㄑㄩ〕可怕的道路也變得平坦無阻。","note":null,"def":"轉化危險為平安。","def_note":"（「夷」：平安）","ex":"幸虧消防員及時趕到，終於化險為夷，撲滅了大火。","rel":[{"tag":"相似","w":"轉危為安","d":"將危急的情況轉化為安全。"}]}]},{"lesson":"第壹篇 第5單元 戰爭情勢","items":[{"no":"01","title":"敗北","story":"甲骨文中的「北」字，是兩個人背對背的圖案。東漢時期，許慎在說文解字中解釋：「北，乖也，二人相背。」（這裡的「乖」指的是背離、相反的意思。）古代戰場上，士兵若抵擋不住敵軍勢力，只能轉身逃跑，背對敵人逃，正如「北」字的樣子。因此，「敗北」就是打敗仗、背對敵人逃跑的意思。歷史上，像項羽這樣驍〔ㄒㄧㄠ〕勇善戰的猛將，曾經「未嘗敗北，遂霸有天下」（史記），所向披靡〔ㄇㄧˇ〕，但在垓〔ㄍㄞ〕下之戰，最終還是逃不過敗北的命運。","note":null,"def":"打敗仗。","def_note":null,"ex":"面對強勁對手，球隊毫不畏懼，即使敗北也雖敗猶榮。","rel":[{"tag":"相反","w":"凱旋","d":"獲勝歸來。"},{"tag":"延伸","w":"追亡逐北","d":"追擊戰敗而逃走的敵軍。"}]},{"no":"02","title":"退避三舍","story":"春秋時期，晉獻公的寵妃驪〔ㄌㄧˊ〕姬為了讓兒子奚齊當太子，設計逼太子申生自殺，並下令捉拿兩位公子重耳和夷吾，兩人因此逃亡國外。後來晉獻公去世，奚齊被殺，夷吾成為晉惠公，但重耳仍在外流浪。晉惠公害怕重耳回來搶王位，便派人追殺他。重耳逃到楚國，受到楚成王的熱情款待。楚成王問重耳：「你要是當了晉國國君，會怎麼報答我呢？」重耳說：「楚國有貂〔ㄉㄧㄠ〕皮、珍寶等，我不知道該送什麼。」楚成王繼續追問，重耳最後說：「如果晉楚交戰，我會讓軍隊後退九十里（三舍），以此報答。」","note":null,"def":"比喻遇到實力很強的對手，為避免正面衝突折損太多，於是主動讓步，不與人爭。","def_note":"（「舍」：三十里）","ex":"面對無理取鬧的顧客，服務人員選擇退避三舍，避免更大的衝突。","rel":[{"tag":"相反","w":"當仁不讓","d":"遇到應該做的事，主動承擔起來而不推辭。"}]},{"no":"03","title":"背〔ㄅㄟˋ〕水一戰","story":"天官書中提到「背靠著水布陣，等於送死；面對山坡擺陣，等於自廢武功」，這聽起來有道理，誰想打仗時背後是條逃不了的河呢？然而，周武王不信邪。他帶領兩萬多人討伐紂王時，背靠濟〔ㄐㄧˇ〕水，面對牧野山排陣，這樣的布陣應是死路一條。且紂王的軍隊還比周武王多十幾倍，照理說紂王必勝無疑。結果，武王竟然贏了，還滅了商朝！武王故意把軍隊置於死地，就是要激勵士兵：沒有退路，只有拚命向前，才能取得勝利。","note":null,"def":"比喻抱著必死的決心，奮戰取勝。","def_note":null,"ex":"為了守護家園，士兵們背水一戰，英勇抗敵。","rel":[{"tag":"相似","w":"孤注一擲〔ㄓˋ〕","d":"比喻危急時投入全部力量，作最後的冒險行動。","note":"（「孤注」：賭博時將所有資本下注）"}]},{"no":"04","title":"空城計","story":"街亭失守，司馬懿〔ㄧˋ〕大軍壓境，西城兵力薄弱，情勢危急。一般人早已六神無主，但這位羽扇綸〔ㄍㄨㄢ〕巾的智多星諸葛〔ㄍㄜˊ〕亮卻不慌不忙，反而想到一計——空城計。他命士兵打開城門，自己悠閒地坐在城樓上，燒香彈琴，還喝著小酒，一副「我等你們很久啦」的模樣。司馬懿看到城門大開，諸葛亮獨自彈琴、喝酒，心生疑慮：「諸葛亮一向謹慎，從不冒險，這次如此反常，城內必有重兵埋伏！」於是下令撤退。就這樣，諸葛亮憑藉一把琴、一壺酒，成功嚇退了司馬懿的千軍萬馬。","note":"（「羽扇綸巾」：態度從容不迫，瀟灑閒適）","def":"今多比喻毫無實力、虛張聲勢嚇人。","def_note":null,"ex":"你提的辦法只是權宜之下的空城計罷了，無法解決根本問題。","rel":[]},{"no":"05","title":"一鼓作氣","story":"春秋時期，齊國違背盟約，出兵攻打魯國。魯莊公親自上陣，與曹劌〔ㄍㄨㄟˋ〕同乘〔ㄔㄥˊ〕戰車迎戰齊軍。魯莊公一看敵人來了，就想擂〔ㄌㄟˊ〕鼓進攻，曹劌讓他先等一等。直到齊軍敲了三次鼓後，曹劌才說：「現在可以打了！」魯軍的戰鼓一響，士氣大振，像猛虎下山，迅速擊敗齊軍。隨後，魯莊公想乘〔ㄔㄥˊ〕勝追擊，曹劌卻再度阻止，說要等一等。他察看齊軍的車輪印，發現他們的車行軌跡亂糟糟的，旗幟也東倒西歪，才確信齊軍潰〔ㄎㄨㄟˋ〕敗。曹劌解釋說：「我們等齊軍士氣消耗殆盡再出擊，這樣才能保證勝利。」最終，魯軍追趕落敗的齊軍，把齊軍趕出魯國。","note":null,"def":"古代作戰，第一道鼓最能激起戰士們的勇氣。比喻做事時要趁著初起時的勇氣去做才容易成功。","def_note":null,"ex":"他一鼓作氣跑完了全程馬拉松，締造個人最佳紀錄。","rel":[{"tag":"相反","w":"再衰三竭","d":"形容力量衰竭耗盡，士氣低落，不能再振作。"}]},{"no":"06","title":"直搗黃龍","story":"南宋時期，岳飛英勇善戰，把金兵打得落花流水，收復了不少失地。當時金人的都城黃龍府位於現今的中國吉林，岳飛帶領大軍一路猛進，士氣高昂。他激動地對士兵們說：「兄弟們，再加把勁！咱們直接打到黃龍府，慶功宴上不醉不歸！」這句話就是「直搗黃龍」的由來，指的是直接攻擊敵人最重要的據點。","note":null,"def":"指直接攻入敵人都〔ㄉㄨ〕城要地。","def_note":null,"ex":"警方經過周密的部署〔ㄕㄨˋ〕與數月的跟監，終於直搗黃龍，抓獲了頭號詐騙要犯。","rel":[{"tag":"相似","w":"長驅直入","d":"長距離一路挺進，銳不可當〔ㄉㄤˇ〕。"},{"tag":"延伸","w":"所向披靡〔ㄇㄧˇ〕","d":"比喻力量所到之處，敵人紛紛潰退。"}]},{"no":"07","title":"投鞭〔ㄅㄧㄢ〕斷流","story":"南北朝時期，前秦苻〔ㄈㄨˊ〕堅統一北方，決心發動百萬大軍南征東晉。大臣石越勸他說：「皇上，今年星象不好，不宜南征，且東晉有長江天險，又得民心，應先養精蓄銳，等待時機再戰。」但苻堅不以為然地說：「以前吳王夫〔ㄈㄨ〕差〔ㄔㄞ〕、三國吳王孫皓，不是也靠長江天險，最後還不是滅亡了？更何況我帶百萬大軍，一人丟一根馬鞭都能把江水截斷，還怕什麼天險？」這便是「投鞭斷流」的由來。苻堅過於自大，最終在淝〔ㄈㄟˊ〕水之戰中，被東晉八萬精兵擊敗，前秦也因此衰敗。","note":null,"def":"比喻軍隊人數眾多，兵力強大。","def_note":null,"ex":"匈奴大軍來勢洶洶，宛如投鞭斷流之勢，邊境守軍壓力倍增。","rel":[{"tag":"相似","w":"旌〔ㄐㄧㄥ〕旗蔽空","d":"軍容壯盛的樣子。","note":"（「旌旗」：旗子，借指軍隊」）"},{"tag":"相似","w":"舳〔ㄓㄡˊ〕艫〔ㄌㄨˊ〕千里","d":"船首、船尾相連，綿延千里。形容船隻眾多。","note":"（「舳」：船尾。「艫」：船頭）"}]},{"no":"08","title":"勢如破竹","story":"西晉時期，有位學識淵博、人稱「移動圖書館」的大將軍——杜預。蜀漢滅亡後，晉武帝派他攻打東吳。杜預迅速攻下多個城池，讓吳國陷入恐慌。正當杜預準備乘〔ㄔㄥˊ〕勝追擊時，一些官員卻跳出來反對說：「南方正值梅雨季，行軍困難，且天氣炎熱易有傳染病，不如等冬天再戰。」杜預聽了不以為然地說：「你們太膽小了！想當年樂〔ㄩㄝˋ〕毅的濟西之戰，就是以速度取勝，我們現在士氣正旺，打吳國就像用力劈開竹子，只要劈開幾節，後面的也會順著刀勢輕易地劈開了。」","note":null,"def":"比喻事情進展順利，毫無阻礙。","def_note":null,"ex":"公司新產品剛上市就勢如破竹，銷售量節節攀升。","rel":[{"tag":"相似","w":"勢不可當〔ㄉㄤˇ〕","d":"形容來勢迅速、猛烈，無法抵擋〔ㄉㄤˇ〕。"}]},{"no":"09","title":"馬革裹〔ㄍㄨㄛˇ〕屍","story":"東漢時期，有個英勇的將軍叫馬援，大家都稱他「馬伏波」。年輕時他當過小官，因為同情犯人而放走他們，結果自己卻丟了工作，轉行務農。沒想到他很有經商頭腦，幾年成了小富翁，但他並不愛財，反而將財富都分給親朋好友。後來他投奔光武帝，立下赫〔ㄏㄜˋ〕赫戰功，被封為伏波將軍。五十多歲時，有人勸他退休享福，馬援卻豪邁地說：「男子漢應該戰死沙場，用馬皮裹屍，怎麼能躺在床上，在兒女的包圍下死去呢？」最終，他在征戰中英勇捐軀，實現了畢生的願望。","note":null,"def":"指死於戰場後，用馬皮把屍體包裹起來。比喻英勇作戰，效命沙場。","def_note":null,"ex":"古代英勇的將士們為了保家衛國，常常以馬革裹屍為榮，視死如歸。","rel":[{"tag":"相似","w":"捐軀報國","d":"犧〔ㄒㄧ〕牲〔ㄕㄥ〕生命，報效國家。"}]},{"no":"10","title":"破釜〔ㄈㄨˇ〕沉舟","story":"秦朝末年，天下大亂，英雄起義反抗暴政。秦將章邯〔ㄏㄢˊ〕攻打趙國鉅鹿城，楚懷王派宋義和項羽去救援。但宋義卻猶〔ㄧㄡˊ〕豫不決，性急的項羽忍無可忍，決定自己帶領兩萬精兵渡河救援。為了激勵士氣，項羽下令鑿〔ㄗㄠˊ〕沉船隻、砸〔ㄗㄚˊ〕碎鍋碗、燒掉營帳，只帶三天的乾糧。士兵們驚恐不已，以為這是死戰的信號。但項羽的舉動就是要告訴士兵們：已經沒有退路了，只能拚死一戰。結果，楚軍果然士氣高漲，經過九場激戰，最終大敗秦軍。這就是歷史上著名的「鉅鹿之戰」。","note":null,"def":"比喻不惜切斷自己的退路，以求努力獲得最好的成果。","def_note":"（「釜」：古代的一種烹飪器具，即今之鐵鍋）","ex":"為了考上理想的研究所，她抱持著破釜沉舟的決心，放棄了所有的娛樂活動。","rel":[{"tag":"相似","w":"濟〔ㄐㄧˋ〕河焚舟","d":"過了河，就把所乘坐的船燒掉。比喻不留後路，抱著必死的決心，勇往直前。"},{"tag":"相似","w":"背水一戰、孤注一擲〔ㄓˋ〕。","d":null}]}]},{"lesson":"第壹篇 第6單元 謀略計策","items":[{"no":"01","title":"鴻門宴","story":"楚漢相爭時，劉邦捷足先登，率先進入咸〔ㄒㄧㄢˊ〕陽，惹得項羽大怒。項羽的軍師范增也搧〔ㄕㄢ〕風點火，說劉邦野心勃勃，必須除掉。於是，項羽設宴於鴻門，表面上請劉邦吃飯，實際上則準備動手。劉邦雖知項羽的用意，仍硬著頭皮赴約。宴席間，范增安排項莊舞劍助興，想趁機刺殺劉邦。就在關鍵時刻，項羽的叔父項伯拔劍相救，屢次以身體阻擋了項莊。同時，劉邦的軍師張良找來大將樊〔ㄈㄢˊ〕噲〔ㄎㄨㄞˋ〕，他力大聲威，一吼震懾〔ㄓㄜˊ〕全場，連項羽也忌憚〔ㄉㄢˋ〕三分。樊噲向項羽說明劉邦沒有稱王的打算，請項羽不要殺劉邦。劉邦就趁著亂哄哄的場面，找機會偷溜，成功逃過一劫。","note":"（「登」：疾足先得）","def":"指不懷好意、居心不良的邀宴。","def_note":null,"ex":"明知這是場鴻門宴，他依然決定赴約，毫無畏懼。","rel":[]},{"no":"02","title":"七擒七縱","story":"三國時期，蜀漢諸葛亮南征南蠻，遇上了頑強的南蠻王孟獲。孟獲武藝高強，不服輸得很，諸葛亮決定智取。第一次抓住孟獲時，孟獲不服氣地說：「你用詭計，勝之不武！」諸葛亮笑了笑，放了他。接下來，孟獲接連被打敗，每次又被釋放。部下勸諸葛亮：「丞相，這人屢教不改，不如把他關起來！」諸葛亮搖頭說：「要讓南蠻真心臣服，就得讓他們輸得心服口服。」就這樣反覆七次，孟獲終於澈底服氣。從此，南蠻地區安定，成為蜀漢堅強的後盾〔ㄉㄨㄣˋ〕。","note":null,"def":"比喻善用策略，使對方誠服。","def_note":null,"ex":"教育不應只靠懲罰，應學諸葛亮七擒七縱般，用智慧與耐心去引導孩子。","rel":[{"tag":"相似","w":"心服口服","d":"形容非常服氣。"}]},{"no":"03","title":"紙上談兵","story":"戰國時期，趙國有個從小熟讀兵書的趙括〔ㄎㄨㄛˋ〕，說起打仗頭頭是道，連他的父親，名將趙奢都說不過他。然而，趙奢卻擔憂地對妻子說：「打仗是玩命的事，趙括把它看得太簡單了！若他當將軍，趙國恐怕要吃大虧！」後來，秦國攻趙，趙王聽信謠言，讓趙括取代老將廉頗，儘管廉頗和趙括的母親都極力反對，但趙王就是不聽。趙括上任後自信滿滿，推翻廉頗的策略。秦國大將白起得知後暗自竊喜，並設下埋伏切斷了趙軍糧道。最終，趙軍被困斷糧，趙括陣亡，四十萬大軍全軍覆沒。","note":null,"def":"在紙上談論用兵的策略。比喻不合實際的空談、議論。","def_note":null,"ex":"創業可不是紙上談兵那麼簡單，需要將理論付諸實踐，才能獲得真正的成功。","rel":[{"tag":"相似","w":"光說不練","d":"空談而無實際行動。"}]},{"no":"04","title":"項莊舞劍","story":"楚漢相爭，劉邦搶先進入咸陽，讓項羽非常生氣。為了試探劉邦的野心，項羽於鴻門設宴邀請劉邦。宴會表面和樂，實則暗藏殺機。宴席上，項羽的軍師范增頻頻使眼色，項羽卻猶豫不決。這時，項莊登場，說要舞劍助興，劍鋒愈舞愈靠近劉邦，殺氣騰騰。劉邦的軍師張良迅速察覺危險，立刻找來猛將樊噲求救，並說：「情況緊急！項莊舞劍，意在沛公啊！」樊噲聽後，帶著劍和盾牌立刻衝進帳內，瞪著項羽，氣勢逼人。項羽被樊噲的氣勢震懾〔ㄓㄜˊ〕，只好賞他酒喝。而劉邦則是藉口上廁所趁亂開溜，逃過一劫。","note":null,"def":"指在表面事物之下隱藏了另外的意圖。","def_note":null,"ex":"他看似熱心幫忙，其實項莊舞劍、別有所圖。","rel":[]},{"no":"05","title":"以逸待勞","story":"孫子兵法是一本很厲害的兵書，教人怎麼打仗，其中有一招叫做「以逸待勞」。試想，敵人經過長途跋涉，又累又餓；而你卻精神飽滿、體力充沛。此時再出擊，無疑能輕易取勝，這就是「以逸待勞」的精髓〔ㄙㄨㄟˇ〕。就像玩遊戲一樣，等敵人快沒血了，再釋放大招，便能一擊必殺！","note":null,"def":"採取守勢，養精蓄銳，待敵方疲倦、實力削弱時，予以痛擊。","def_note":null,"ex":"面對來勢洶洶的對手，我們應以逸待勞，保存實力，等待最佳
