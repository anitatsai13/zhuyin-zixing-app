時機再出擊。","rel":[{"tag":"相似","w":"養精蓄銳","d":"培養精力，以待時機。"}]},{"no":"06","title":"運籌帷〔ㄨㄟˊ〕幄〔ㄨㄛˋ〕","story":"楚漢相爭，劉邦最終打敗項羽，建立漢朝。有一次，劉邦請大臣吃飯，得意地問：「我為什麼能贏得天下？」大臣們說：「因為您慷〔ㄎㄤ〕慨〔ㄎㄞˇ〕大方，與大家分享勝利的果實。」劉邦笑著說：「你們只說對一半。要說軍事謀略，我不如張良；管理國家、保障後勤，我不如蕭何；帶兵打仗，我不如韓信。他們三個都是頂尖人才，我能重用他們，才是成功的關鍵！項羽雖然有范增這樣的人才，卻不好好利用，最終敗給了我。」因此史記說張良能夠「運籌帷幄之中，制勝於無形。」意思是說：張良身在軍營便能掌握局勢，策畫謀略，為劉邦奠定勝利的基礎。","note":null,"def":"比喻謀畫策略。","def_note":"（「籌」：計數的器具。「帷幄」：軍旅中的帳幕）","ex":"身為團隊的領導者，他運籌帷幄，為團隊指明方向。","rel":[]},{"no":"07","title":"狡〔ㄐㄧㄠˇ〕兔三窟〔ㄎㄨ〕","story":"戰國時期，孟嘗君養了三千門客，其中有位名叫馮諼〔ㄒㄩㄢ〕，看似不認真，常抱怨伙食不好。某次，孟嘗君派他去薛地收債，馮諼不但沒有收錢，還把借據燒掉，說是孟嘗君的命令，免除大家的債務，薛地人民因此非常感激孟嘗君。後來孟嘗君回到薛地，受到英雄式的歡迎，這時他才明白馮諼是在收買人心。馮諼說：「聰明的兔子有三個窩，您只有一個，太不安全。」於是，他又幫孟嘗君找了兩個「窩」：一是讓其他國家爭取他；二是在薛地建立齊國的宗廟。這樣，孟嘗君的地位穩固，不用再擔心失業。","note":null,"def":"狡猾的兔子有三處藏身的洞穴。比喻有多處藏身的地方或多種避禍的準備。","def_note":null,"ex":"成功的企業家都深知狡兔三窟之道，才能在瞬息萬變的市場中立於不敗之地。","rel":[{"tag":"相反","w":"走投無路","d":"人無路可走。形容處境窘困。"},{"tag":"延伸","w":"市義","d":"指通過施恩惠、收買人心，以博取正義名聲，也寓意有遠見的政治策略，讓百姓心悅誠服。"},{"tag":"延伸","w":"馮諼燒券","d":"收買民心，博取民望。"}]},{"no":"08","title":"暗度陳倉","story":"劉邦被項羽封到偏遠的漢中，大家都覺得他沒戲唱了。為了讓項羽放心，劉邦聽從軍師張良的建議，燒毀通往漢中的棧〔ㄓㄢˋ〕道，表示自己沒有爭奪天下的野心，只想安度晚年。然而，這一切都是假象，劉邦暗中修復棧道，並聽從大將軍韓信的計策——「明修棧道，暗度陳倉」。表面上，他裝作從棧道出征，實際上悄悄地從陳倉發動進軍，出其不意地攻打項羽的部隊。項羽完全沒料到劉邦會有如此巧妙的計策，結果措手不及，迅速敗北，從此奠定了劉邦日後建立漢朝的基礎。","note":null,"def":"比喻出其不意、從旁突擊的戰略。","def_note":null,"ex":"他表面上按兵不動，實際上卻暗度陳倉，悄悄地展開了新的計畫。","rel":[{"tag":"相反","w":"明目張膽","d":"形容有膽識，無所畏懼。後比喻肆無忌憚〔ㄉㄢˋ〕地公然做壞事。"}],"ex_note":"（「按」：止兵）"},{"no":"09","title":"萬事俱備，只欠東風","story":"赤壁之戰，周瑜準備用火攻擊曹操的百萬大軍，所有準備工作都做好了，唯獨缺少能把火吹向曹軍的東風。周瑜焦急萬分，擔心精心策畫的火攻計失敗。此時，諸葛亮卻自告奮勇要向上天「借東風」。原來，諸葛亮早已預見這一刻，他在山上建了祭壇，並以祭祀的方式，祈求東風的來臨。果然，真的刮起了東風，熊熊大火燒向了曹操的戰船，曹操大敗而逃，這場戰役就是「赤壁之戰」，成為三國歷史中的經典戰役，為孫劉聯軍贏得勝利。","note":null,"def":"比喻辦一件事，一切都準備好了，就缺最後的關鍵條件。","def_note":null,"ex":"他的創業計畫非常完善，萬事俱備，只欠東風，現在只等投資方的資金批准。","rel":[{"tag":"延伸","w":"馬耳東風","d":"東風吹過馬耳邊，瞬間消逝。比喻對事情漠〔ㄇㄛˋ〕不關心。"}]},{"no":"10","title":"特洛伊木馬","story":"古希臘時代，希臘人和特洛伊人打了十年仗，一直攻不下特洛伊城。希臘軍師奧德賽想出一個妙計：建造一隻巨大的木馬，假裝是獻給女神的禮物，然後偷偷把士兵藏在木馬的肚子裡。希臘人假裝撤退，留下木馬在城門口，特洛伊人看到希臘人走了，以為戰爭結束，高高興興地把木馬拉進城裡，慶祝勝利。當天晚上，特洛伊人大肆慶祝，無不喝得醉醺〔ㄒㄩㄣ〕醺〔ㄒㄩㄣ〕的。這時，藏在木馬裡的希臘士兵偷偷溜出來，打開城門，讓在外面接應的希臘大軍，一舉衝進特洛伊城，燒殺搶掠，特洛伊城就此淪陷。","note":null,"def":"比喻潛入敵國做破壞工作的人或物。","def_note":null,"ex":"看似誘人的投資機會，實則可能隱藏著陷阱，就像特洛伊木馬一樣，投資者需謹慎判斷。","rel":[{"tag":"延伸","w":"特洛伊遺址","d":"十九世紀時，業餘考古學家海因里希‧施利曼證實遺址的存在。該遺址對理解歐洲早期發展的關鍵時期有重大意義。"}],"title_en":"(Trojan horse)","badge":"西洋"}]}],"evals":[{"title":"第1單元 帝王故事 現學現練","qs":[{"n":1,"sec":"一、根據解釋，填入缺空處語詞代號","q":"（　　）：丹麥王子為父報仇，最終卻走向毀滅的悲劇故事。","opts":["問鼎","黃袍加身","作壁上觀","九五之尊","牝雞司晨","烽火戲諸侯","三過家門而不入","挾天子以令諸侯","何不食肉糜","哈姆雷特"],"ans":"J","derived":1},{"n":2,"sec":"一、根據解釋，填入缺空處語詞代號","q":"（　　）：比喻公而忘私，勤於職守。","opts":["問鼎","黃袍加身","作壁上觀","九五之尊","牝雞司晨","烽火戲諸侯","三過家門而不入","挾天子以令諸侯","何不食肉糜","哈姆雷特"],"ans":"G","derived":1},{"n":3,"sec":"一、根據解釋，填入缺空處語詞代號","q":"（　　）：指覬覦王位，謀取政權；或指謀取最高榮譽、地位。","opts":["問鼎","黃袍加身","作壁上觀","九五之尊","牝雞司晨","烽火戲諸侯","三過家門而不入","挾天子以令諸侯","何不食肉糜","哈姆雷特"],"ans":"A","derived":1},{"n":4,"sec":"一、根據解釋，填入缺空處語詞代號","q":"（　　）：比喻不了解民間疾苦，脫離現實。","opts":["問鼎","黃袍加身","作壁上觀","九五之尊","牝雞司晨","烽火戲諸侯","三過家門而不入","挾天子以令諸侯","何不食肉糜","哈姆雷特"],"ans":"I","derived":1},{"n":5,"sec":"一、根據解釋，填入缺空處語詞代號","q":"（　　）：比喻君位。","opts":["問鼎","黃袍加身","作壁上觀","九五之尊","牝雞司晨","烽火戲諸侯","三過家門而不入","挾天子以令諸侯","何不食肉糜","哈姆雷特"],"ans":"D","derived":1},{"n":6,"sec":"一、根據解釋，填入缺空處語詞代號","q":"（　　）：比喻婦人專權。","opts":["問鼎","黃袍加身","作壁上觀","九五之尊","牝雞司晨","烽火戲諸侯","三過家門而不入","挾天子以令諸侯","何不食肉糜","哈姆雷特"],"ans":"E","derived":1},{"n":7,"sec":"二、根據文句涵義填入缺空處語詞代號，使文意順暢完整","q":"周幽王為博紅顏一笑，（　　），開了玩笑，導致喪命，為後人所恥笑。","opts":["問鼎","黃袍加身","作壁上觀","九五之尊","牝雞司晨","烽火戲諸侯","三過家門而不入","挾天子以令諸侯","何不食肉糜","哈姆雷特"],"ans":"F","derived":1},{"n":8,"sec":"二、根據文句涵義填入缺空處語詞代號，使文意順暢完整","q":"班上兩個同學吵架，其他人不敢勸架，都躲在一旁（　　），還偷偷打賭誰會先哭。","opts":["問鼎","黃袍加身","作壁上觀","九五之尊","牝雞司晨","烽火戲諸侯","三過家門而不入","挾天子以令諸侯","何不食肉糜","哈姆雷特"],"ans":"C","derived":1},{"n":9,"sec":"二、根據文句涵義填入缺空處語詞代號，使文意順暢完整","q":"小明在電玩遊戲中打敗魔王，獲得傳說中的金色盔〔ㄎㄨㄟ〕甲，感覺像是（　　）一樣，成為遊戲世界的強者。","opts":["問鼎","黃袍加身","作壁上觀","九五之尊","牝雞司晨","烽火戲諸侯","三過家門而不入","挾天子以令諸侯","何不食肉糜","哈姆雷特"],"ans":"B","derived":1},{"n":10,"sec":"二、根據文句涵義填入缺空處 function renderLearn(el,ds){
  let cat='全部',list=[],idx=0,flipped=false;
  el.innerHTML=`<div class="seg" id="lseg"><button data-c="全部" class="on">全部</button><button data-c="成語">成語</button><button data-c="詞語">詞語</button><button data-c="單字">單字</button></div>
    <div class="progress"><span id="lcount"></span><div class="bar"><i id="lbar"></i></div><span id="ltip">點卡片翻面</span></div>
    <div class="card" id="lcard"><div class="badge" id="lbadge"></div><div class="face-front" id="lbody"></div><div class="hint" id="lhint"></div></div>
    <div class="nav"><button class="btn btn-ghost" id="lprev">← 上一個</button><button class="btn btn-main" id="lnext">下一個 →</button></div>`;
  const q=s=>el.querySelector(s);
  function build(){list=cat==='全部'?ds.data:ds.data.filter(d=>d.type===cat);idx=0;flipped=false;draw();}
  function draw(){
    if(!list.length){q('#lbody').innerHTML='<div class="word" style="font-size:18px;color:var(--ink-soft)">（此類別無資料）</div>';q('#lcount').textContent='0 / 0';return;}
    const d=list[idx];
    q('#lcount').textContent=`${idx+1} / ${list.length}`;q('#lbar').style.width=((idx+1)/list.length*100)+'%';
    const bd=q('#lbadge');bd.textContent=d.type;bd.className='badge '+d.type;
    const body=q('#lbody'),hint=q('#lhint');
    if(!flipped){body.innerHTML=`<div class="word" style="font-size:${fit(d.word)}px">${d.word}</div>`;hint.textContent='👆 點一下看注音與釋義';q('#ltip').textContent='點卡片翻面';}
    else{let s=rubyHTML(d.word,d.zhuyin,fitFlip(d.word));s+=`<div class="pinyin">${d.pinyin}</div><div class="meaning-center">`;d.senses.forEach((se,i)=>s+=`<div class="sense">`+(d.senses.length>1?`<span class="n">${i+1}</span>`:'')+se.m+egHTML(d.word,se.e)+`</div>`);s+=`</div>`;let tags='';if(d.poly)tags+=`<span class="pill poly">⚠ 多音 ${d.poly}</span>`;if(d.sim)tags+=`<span class="pill sim">似 ${d.sim}</span>`;if(d.opp)tags+=`<span class="pill opp">反 ${d.opp}</span>`;if(tags)s+=`<div class="tags">${tags}</div>`;body.innerHTML=s;hint.textContent='👆 點一下翻回正面';q('#ltip').textContent='已翻面';}
  }
  el.querySelectorAll('#lseg button').forEach(b=>b.onclick=()=>{el.querySelectorAll('#lseg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.c;build();});
  q('#lcard').onclick=()=>{flipped=!flipped;draw();};
  q('#lprev').onclick=()=>{if(list.length){idx=(idx-1+list.length)%list.length;flipped=false;draw();}};
  q('#lnext').onclick=()=>{if(list.length){idx=(idx+1)%list.length;flipped=false;draw();}};
  build();
}

function dgEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* 書上小字注音寫成「字〔ㄓㄨˋ〕」→ ruby */
function dgTxt(s){return dgEsc(s).replace(/([\u3400-\u9fff\uf900-\ufaff])〔([ㄅ-ㄩ˙ˊˇˋ ]+)〕/g,(m,c,z)=>'<span class="dgr">'+c+vzhuyin(z.trim())+'</span>');}
function dgPlain(s){return String(s||'').replace(/〔[ㄅ-ㄩ˙ˊˇˋ ]+〕/g,'');}
function dgHi(s,w){const t=dgTxt(s);return w?t.split(dgEsc(w)).join('<span class="dg-w">'+dgEsc(w)+'</span>'):t;}
function dgParen(s){s=String(s).trim();return /^（/.test(s)?s:'（'+s+'）';}

  if(it.def)s+='<div class="dg-row"><span class="dg-lb 解釋">解釋</span><div>'+dgTxt(it.def)+(it.def_note?' <span class="dg-sn">'+dgTxt(dgParen(it.def_note))+'</span>':'')+'</div></div>';
  if(it.ex)s+='<div class="dg-row"><span class="dg-lb 例句">例句</span><div>'+dgHi(it.ex,dgPlain(it.title))+(it.ex_note?' <span class="dg-sn">'+dgTxt(dgParen(it.ex_note))+'</span>':'')+'</div></div>';
  const tags=[];(it.rel||[]).forEach(r=>{if(tags.indexOf(r.tag)<0)tags.push(r.tag);});

  fileEl.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const arr=JSON.parse(rd.result);if(!Array.isArray(arr))throw 0;const cur=loadMist();const sig=r=>[r.round,r.t,r.head,r.you].join('|');const seen=new Set(cur.map(sig));const fresh=arr.filter(r=>r&&r.head&&!seen.has(sig(r)));if(isLoggedIn()){for(const r of fresh){await cloudInsert(r);MEM.push(r);}}else{fresh.forEach(r=>cur.push(r));cur.sort((a,b)=>(''+(a.t||'')).localeCompare(''+(b.t||'')));persistLocal(cur);}alert('已匯入 '+fresh.length+' 題（檔案 '+arr.length+' 題，重複略過）');renderWrong(root);}catch(err){alert('匯入失敗：檔案格式不正確');}};rd.readAsText(f);};
}

/* ===== 學習進度：記錄每一題的作答，依「冊別／課（單元）」顯示完成度與錯題 =====
   涵蓋：字音字形題庫測驗、成語擂臺測驗、讀典故（看解釋選典故／例句填空、現學現練／階段評量，含「只做錯的」）。
   群組：字音字形 1上…3下、成語擂臺 1上…3下（依課名開頭的冊別，單元＝課）、讀典故 第壹篇（單元＝課本單元、項目＝典故，
         一則典故的任一題答過就算答過）、讀典故 評量（單元＝每份現學現練／階段評量、項目＝題號）。
   PROG 結構：{ "群組|單元": { q:{項目:[作答次數,答對次數,最近作答,最近答對]} } }
   雲端：mistakes 表（user_id, app, data），app=zixing_progress（本 App 自己的錯題仍存 mistakes_zixing，不變）。 */
const PROGKEY='zixing_progress_v1', PROG_APP='zixing_progress';
let PROG_MEM=null, _progT=null, PG_PRESET=null, progGroup=null, _misIdx=null;
function progLoad(){if(!CANPERSIST)return PROG_MEM||(PROG_MEM={});try{return JSON.parse(localStorage.getItem(PROGKEY)||'{}')||{}}catch(e){return {}}}
function progSave(p){if(!CANPERSIST){PROG_MEM=p;return;}try{localStorage.setItem(PROGKEY,JSON.stringify(p))}catch(e){}}
function progLog(group,unit,key,ok){
  if(!group||!unit||key==null||key==='')return;
  const p=progLoad(),k=group+'|'+unit,now=new Date().toISOString();
  const u=p[k]||(p[k]={q:{}}),m=u.q||(u.q={});
  const r=m[key]||(m[key]=[0,0,'','']);
  r[0]++;if(ok){r[1]++;r[3]=now;}r[2]=now;
  progSave(p);
  if(isLoggedIn()){clearTimeout(_progT);_progT=setTimeout(()=>progCloudSave(progLoad()).catch(()=>{}),1500);}
}
function progMerge(a,b){
  const o=JSON.parse(JSON.stringify(a||{}));
  Object.keys(b||{}).forEach(k=>{const mb=(b[k]&&b[k].q)||{},ua=o[k]||(o[k]={q:{}}),ma=ua.q||(ua.q={});
    Object.keys(mb).forEach(en=>{const x=ma[en],y=mb[en];
      ma[en]=x?[Math.max(x[0],y[0]),Math.max(x[1],y[1]),(x[2]||'')>(y[2]||'')?x[2]:y[2],(x[3]||'')>(y[3]||'')?x[3]:y[3]]:y.slice();});});
  return o;
}
function progUid(){return SESSION&&SESSION.user&&SESSION.user.id;}
async function progCloudLoad(){const uid=progUid();if(!isLoggedIn()||!uid)return null;const r=await sbFetch(SB_URL+'/rest/v1/mistakes?select=data&user_id=eq.'+uid+'&app=eq.'+PROG_APP);if(!r.ok)throw r.status;const j=await r.json();return (j&&j[0]&&j[0].data)||{};}
async function progCloudSave(d){const uid=progUid();if(!isLoggedIn()||!uid)return;const r=await sbFetch(SB_URL+'/rest/v1/mistakes?on_conflict=user_id,app',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:uid,app:PROG_APP,data:d,updated_at:new Date().toISOString()})});if(!r.ok)throw r.status;}
async function progSyncDown(){if(!isLoggedIn())return;try{const c=await progCloudLoad();if(c===null)return;const m=progMerge(progLoad(),c);progSave(m);await progCloudSave(m);if(CUR&&CUR.kind==='progress')renderStage();}catch(e){console.warn('prog sync',e)}}

/* ---- 群組與單元（依資料、照課本順序） ---- */
function pgDs(k){return DATASETS.find(d=>d.kind===k);}
function pgVol(s){return String(s).split(' ')[0];}
let _pgG=null;const _pgU={};
function pgGroups(){
  if(_pgG)return _pgG;const out=[];
  [['fill','字音字形'],['idiom','成語擂臺'],['diangu','讀典故']].forEach(([k,nm])=>{const ds=pgDs(k);if(!ds||!ds.lessons)return;const vols=[];
    ds.lessons.forEach(L=>{const v=pgVol(L.lesson);if(vols.indexOf(v)<0)vols.push(v);});
    vols.forEach(v=>out.push({id:k+':'+v,kind:k,vol:v,name:nm+' '+v,sec:ds.name}));});
  const dg=pgDs('diangu');if(dg&&dg.evals&&dg.evals.length)out.push({id:'dgeval',kind:'deval',name:'讀典故 評量',sec:dg.name});
  return _pgG=out.filter(g=>pgUnits(g.id,g).length);
}
function pgItems(kind,L){
  if(kind==='fill'){const c={};L.items.forEach(it=>c[it.word]=(c[it.word]||0)+1);
    return L.items.map(it=>{const d=c[it.word]>1;return {k:d?it.word+'·'+it.char:it.word,t:it.word,s:(d?'「'+it.char+'」':'')+it.yin,it};});}
  if(kind==='idiom'){const seen={},o=[];L.themes.forEach(t=>t.items.forEach(it=>{if(it.def&&!seen[it.w]){seen[it.w]=1;o.push({k:it.w,t:it.w,s:it.def,it});}}));return o;}
  if(kind==='diangu')return L.items.filter(it=>{const w=dgPlain(it.title);return it.def||(it.ex&&dgPlain(it.ex).indexOf(w)>=0);}).map(it=>({k:dgPlain(it.title),t:dgPlain(it.title),s:dgPlain(it.def),it}));
  return [];
}
/* 單元清單：[{id, label, items:[{k,t,s}]}] */
function pgUnits(gid,g){
  if(_pgU[gid])return _pgU[gid];
  g=g||pgGroups().find(x=>x.id===gid);if(!g)return [];
  let U=[];
  if(g.kind==='deval')U=pgDs('diangu').evals.map((e,i)=>({id:e.title,label:e.title,ei:i,items:e.qs.map(q=>({k:String(q.n),t:'第 '+q.n+' 題',s:dgPlain(q.q).replace(/⟦[^⟧]+⟧/g,'（附圖）')}))}));
  else U=pgDs(g.kind).lessons.filter(L=>pgVol(L.lesson)===g.vol).map(L=>({id:L.lesson,label:L.lesson.split(' ').slice(1).join(' ')||L.lesson,items:pgItems(g.kind,L)}));
  return _pgU[gid]=U.filter(u=>u.items.length);
}
function pgName(gid){const g=pgGroups().find(x=>x.id===gid);return g?g.name:gid;}
/* 測驗作答時記錄：依題目物件找回所在的課（同一詞出現在兩課時，以實際出題的那一課為準） */
function pgLogIt(ds,it,ok){try{
  const L=ds.lessons.find(L=>ds.kind==='idiom'?L.themes.some(t=>t.items.indexOf(it)>=0):L.items.indexOf(it)>=0);if(!L)return;
  const gid=ds.kind+':'+pgVol(L.lesson);let key;
  if(ds.kind==='fill'){const u=pgUnits(gid).find(x=>x.id===L.lesson),o=u&&u.items.find(x=>x.it===it);key=o?o.k:it.word;}
  else if(ds.kind==='idiom')key=it.w;else key=dgPlain(it.title);
  progLog(gid,L.lesson,key,ok);}catch(e){console.warn('progLog',e)}}

/* 錯題本的每一筆歸到「群組｜單元｜項目」：同一詞出現在多課時，歸到最前面的那一課 */
let _pgLook=null;
function pgLook(){
  if(_pgLook)return _pgLook;const L={};
  pgGroups().forEach(g=>pgUnits(g.id).forEach(u=>u.items.forEach(o=>{const loc={g:g.id,l:u.id,k:o.k,t:o.t,s:o.s};
    const ks=g.kind==='fill'?[o.it.word,o.it.word+'\u0001'+o.it.char]:g.kind==='deval'?[u.id+'\u0001'+o.k]:[o.k];
    ks.forEach(k=>{const kk=g.kind+'\u0002'+k;if(!L[kk])L[kk]=loc;});})));
  return _pgLook=L;
}
function progLoc(r){
  const ds=DATASETS.find(d=>d.name===r.ds);if(!ds||!ds.lessons)return null;
  const head=String(r.head||''),ty=String(r.type||''),M=pgLook();
  if(ds.kind==='fill'){let ch='';if(/填國字/.test(ty))ch=String(r.correct||'');else{const m=/「(.+?)」/.exec(r.prompt||'');if(m)ch=m[1];}
    return (ch&&M['fill\u0002'+head+'\u0001'+ch])||M['fill\u0002'+head]||null;}
  if(ds.kind==='idiom')return M['idiom\u0002'+(r.correct||head)]||M['idiom\u0002'+head]||null;
  if(ds.kind==='diangu'){
    if(ty==='看解釋選典故'||ty==='例句填空')return M['diangu\u0002'+head]||null;
    const m=/(\d+)/.exec(head);return m?(M['deval\u0002'+ty+'\u0001'+m[1]]||null):null;}
  return null;
}
function progMisIndex(P){
  const idx={},stat={all:0,placed:0,lost:0};
  loadMist().forEach(r=>{stat.all++;const loc=progLoc(r);if(!loc){stat.lost++;return;}stat.placed++;
    const key=loc.g+'|'+loc.l,m=idx[key]||(idx[key]={});
    const o=m[loc.k]||(m[loc.k]={k:loc.k,t:loc.t,s:loc.s,n:0,last:''});
    o.n++;const t=r.t||'';if(t>o.last)o.last=t;});
  Object.keys(idx).forEach(key=>{const q=(P[key]&&P[key].q)||{};
    Object.values(idx[key]).forEach(o=>{const a=q[o.k];o.fixed=!!(a&&a[3])&&a[3]>o.last;});});
  return {idx,stat};
}
function progMistakes(gid,les,P){
  const m=((_misIdx||progMisIndex(P)).idx[gid+'|'+les])||{};
  return Object.values(m).sort((x,y)=>(x.fixed-y.fixed)||(y.n-x.n));
}
function progLessonStat(gid,unit,P){
  const q=((P[gid+'|'+unit.id]||{}).q)||{};
  let seen=0,tries=0,right=0,last='';
  unit.items.forEach(v=>{const r=q[v.k];if(r&&r[0]){seen++;tries+=r[0];right+=r[1];if(r[2]>last)last=r[2];}});
  const mis=progMistakes(gid,unit.id,P);mis.forEach(m=>{if(m.last>last)last=m.last;});
  const pending=mis.filter(m=>!m.fixed).length;
  let st='todo';if(seen>=unit.items.length&&unit.items.length)st='done';else if(seen||mis.length)st='doing';
  return {n:unit.items.length,seen,tries,right,last,mis,pending,st};
}
function progFmt(iso){if(!iso)return '';const d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate();}
function pgShort(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s;}
/* 預設群組：最近作答的那一組，沒有紀錄就第一組 */
function pgLatestGroup(P){let best='',g=null;Object.keys(P).forEach(k=>{const q=(P[k]&&P[k].q)||{};Object.values(q).forEach(r=>{if((r[2]||'')>best){best=r[2];g=k.split('|')[0];}});});return g;}
const PG_UW={fill:'題',idiom:'句',diangu:'則',deval:'題'};
const PG_TAB={fill:'fquiz',idiom:'themeq',diangu:'dquiz'};
function renderProgress(el){
  if(isLoggedIn()&&!CLOUD_READY){el.innerHTML='<div class="result"><p>☁ 載入雲端紀錄中…</p></div>';syncCloud().then(()=>{if(CUR.kind==='progress')renderStage();});return;}
  const P=progLoad(),G=pgGroups();
  _misIdx=progMisIndex(P);const MS=_misIdx.stat;
  if(!progGroup||!G.some(g=>g.id===progGroup)){const lg=pgLatestGroup(P);progGroup=G.some(g=>g.id===lg)?lg:G[0].id;}
  let h='<div class="pgnote">每答一題就會記錄。<b>完成</b>＝這個單元每一題都答過至少一次；<b>練習中</b>＝已開始但還沒全部答過；錯題「已訂正」＝錯了之後又答對過。<br>讀典故：一則典故的「看解釋／例句填空」任一題答過就算答過。</div>';
  if(MS.all)h+='<div class="pgnote">📕 已讀入錯題本 '+MS.all+' 筆，'+MS.placed+' 筆已歸到各單元'+(MS.lost?'（'+MS.lost+' 筆對應不到目前題庫，略過）':'')+'。</div>';
  const card=g=>{const U=pgUnits(g.id);let d=0,i=0,pend=0;
    U.forEach(u=>{const s=progLessonStat(g.id,u,P);if(s.st==='done')d++;else if(s.st==='doing')i++;pend+=s.pending;});
    const tot=U.length;
    return `<button class="pgcard${g.id===progGroup?' on':''}" data-g="${dgEsc(g.id)}"><b>${dgEsc(g.name)}</b>
      <span class="pgbar"><i style="width:${tot?Math.round(d/tot*100):0}%"></i><i class="half" style="width:${tot?Math.round(i/tot*100):0}%"></i></span>
      <span class="pgsum">✅ ${d}　🟡 ${i}　⬜ ${tot-d-i}${pend?`　❌ 待訂正 ${pend}`:''}</span></button>`;};
  const secs=[];G.forEach(g=>{if(secs.indexOf(g.sec)<0)secs.push(g.sec);});
  secs.forEach(sc=>{h+='<div class="pgsec">'+dgEsc(sc)+'</div><div class="pgcards">'+G.filter(g=>g.sec===sc).map(card).join('')+'</div>';});
  const g=G.find(x=>x.id===progGroup),U=pgUnits(g.id),uw=PG_UW[g.kind]||'題';
  h+=`<div class="pgh">${dgEsc(g.name)}</div><div class="pglist">`;
  U.forEach((unit,ui)=>{const s=progLessonStat(g.id,unit,P);
    const badge=s.st==='done'?'<span class="pgst done">✅ 完成</span>':s.st==='doing'?'<span class="pgst doing">🟡 練習中</span>':'<span class="pgst todo">⬜ 未開始</span>';
    const info=[`已答 ${s.seen}／${s.n} ${uw}`,`答對率 ${s.tries?Math.round(s.right/s.tries*100)+'%':'—'}`];
    if(s.last)info.push('最近 '+progFmt(s.last));
    h+=`<details class="pgles"${s.pending?' open':''}><summary><span class="pgl">${dgEsc(unit.label)}</span>${badge}
      <span class="pgbar sm"><i style="width:${s.n?Math.round(s.seen/s.n*100):0}%"></i></span>
      <span class="pginfo">${info.join('　')}</span>
      <span class="pgmis${s.mis.length?'':' none'}">${s.mis.length?`❌ 錯題 ${s.mis.length}${s.pending?`（待訂正 ${s.pending}）`:'（都已訂正）'}`:'沒有錯題'}</span></summary>
      <div class="pgbody"><div class="pgrow"><button class="btn btn-main" data-pq="${ui}">📝 練習這個單元</button>${s.mis.length?'<button class="btn btn-ghost" data-pw="1">📕 到錯題本</button>':''}</div>
      ${s.mis.length?'<div class="pgmw">'+s.mis.map(m=>`<div class="pgw${m.fixed?' fixed':''}"><b>${dgEsc(m.t)}</b><span>${dgEsc(pgShort(m.s,g.kind==='fill'?20:34))}</span><span class="pgc">錯 ${m.n} 次・${progFmt(m.last)}　${m.fixed?'✔ 已訂正':'✘ 待訂正'}</span></div>`).join('')+'</div>':''}
      </div></details>`;});
  h+='</div>';
  el.innerHTML=h;
  el.querySelectorAll('.pgcard').forEach(b=>b.onclick=()=>{progGroup=b.dataset.g;renderProgress(el);});
  const go=ds=>{CUR=ds;renderDsSeg();renderTabs();renderStage();window.scrollTo(0,0);};
  el.querySelectorAll('[data-pq]').forEach(b=>b.onclick=()=>{const u=U[+b.dataset.pq];
    if(g.kind==='deval'){TAB='deval';PG_PRESET={ei:u.ei};go(pgDs('diangu'));}
    else{TAB=PG_TAB[g.kind];PG_PRESET={vf:g.vol,lf:u.id};go(pgDs(g.kind));}});
  el.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>{TAB=null;go(pgDs('wrong'));});
}

renderDsSeg();renderTabs();renderStage();
if(isLoggedIn())progSyncDown();
</script>
</body>
